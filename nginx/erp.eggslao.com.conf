# Operational hold marker is outside Git and contains no secrets.
# This ingress fence alone never certifies pre-floor API rollback (Web/direct paths exist).
map "$request_method:$uri" $phoenix_chanjet_hold_exempt {
    default 0;
    "GET:/api/chanjet/integration/alignment/status" 1;
    "GET:/api/chanjet/integration/sync-jobs" 1;
    "GET:/api/chanjet/ar-snapshot" 1;
}
map "$phoenix_chanjet_hold:$phoenix_chanjet_hold_exempt" $phoenix_chanjet_hold_denied {
    default 0;
    "1:0" 1;
}
# Phoenix ERP V3 — Nginx 反向代理配置
# HTTP → 301 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name erp.eggslao.com;
    return 301 https://$host$request_uri;
}

# HTTPS 主服务
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name erp.eggslao.com;

    ssl_certificate     /etc/letsencrypt/live/erp.eggslao.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.eggslao.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           SAMEORIGIN                            always;

    # G132 上传大小限制：nginx 默认 1m 会让合同/单据扫描件(常 2-5MB)上传返 413（前端预检 15MB、
    #   后端 FileInterceptor 限 15MB），故此处设 20m > 应用限，由应用层做精确把关。
    #   注：CI/CD(deploy.yml) 部署的是本文件 nginx/，而非 deploy/nginx/——后者仅一次性 server-setup 用。
    #   两份须保持一致，否则像本次：deploy/ 有 20m 但实际部署的本文件漏了 → 生产仍是默认 1m → 上传失败。
    client_max_body_size 20m;

    # G89 性能：gzip（gzip_proxied any 关键——本站所有响应都由上游 Next/API 反代回流，
    #   不设此项则代理响应不压缩。API JSON / 未被上游压缩的内容在此最后一跳压缩，
    #   已带 Content-Encoding 的不会被重复压。)
    gzip              on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        application/json application/javascript text/javascript
                      text/css text/plain text/xml application/xml image/svg+xml;

    # G167：审批通知 SSE 实时流 —— 直连 API 容器(127.0.0.1:3100，绕开 Next 双代理)，
    #   必须关缓冲(proxy_buffering off)、关 gzip、长超时(否则流被攒着不下发 / 默认 60s 被切)。
    #   后端 25s 心跳保活；@Public + ?token= 自验签(EventSource 带不了 Bearer)。
    location = /api/notifications/stream {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # G172：上传附件静态资源——直连 API 容器（uploads/ 由 NestJS useStaticAssets 提供，
    #   跳过 Next.js 中转；浏览器 <img src="/uploads/contracts/xxx.jpg"> 直达）。
    location /uploads/ {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires            30d;
        add_header         Cache-Control     "public, immutable";
    }

    # ── runtime-design-system.css — UI 样式热更新通道（fast-css 部署模式）──
    #   见 docs/deployment-tiers.md / apps/web/public/runtime-design-system.css
    #   优先用 host /opt/phoenix/static-overrides/ 下的覆盖文件（fast-css scp 落点），
    #   缺失时回退 web 容器内的镜像版（next public/）。
    #   强制 no-cache 让浏览器每次 If-Modified-Since 重验证（mtime 变 → 200，未变 → 304）。
    location = /runtime-design-system.css {
        root /opt/phoenix/static-overrides;
        # 文件实际路径 /opt/phoenix/static-overrides/runtime-design-system.css
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header X-RDS-Source "host-override" always;
        try_files $uri @runtime_css_fallback;
    }

    location @runtime_css_fallback {
        # host 文件不存在 → 走 web 容器 public/（next static file server）
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 同样强制 no-cache(否则会被 Next 的默认 immutable 头覆盖)
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header         X-RDS-Source  "web-fallback" always;
    }

    set $phoenix_chanjet_hold 0;
    if (-f /etc/phoenix/runtime-control/chanjet-sync-hold) {
        set $phoenix_chanjet_hold 1;
    }
    # 畅捷通回调——直连 API 容器（绕过 Next.js 代理，确保 POST body 原样透传）
    location /api/chanjet/ {
        if ($phoenix_chanjet_hold_denied) { return 503; }
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 所有流量代理到 Next.js Web 容器
    # Web 容器内部通过 rewrites 将 /api/* 转发给 API 容器
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
