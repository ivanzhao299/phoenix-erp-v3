# Phoenix ERP V3 — Nginx 反向代理配置
# HTTP → 301 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name erp.eggslao.com;
    return 301 https://$host$request_uri;
}

# HTTPS 主服务
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name erp.eggslao.com;

    ssl_certificate     /etc/letsencrypt/live/erp.eggslao.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.eggslao.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           SAMEORIGIN                            always;

    # G89 性能：gzip（gzip_proxied any 关键——本站所有响应都由上游 Next/API 反代回流，
    #   不设此项则代理响应不压缩。API JSON / 未被上游压缩的内容在此最后一跳压缩，
    #   已带 Content-Encoding 的不会被重复压。)
    gzip              on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        application/json application/javascript text/javascript
                      text/css text/plain text/xml application/xml image/svg+xml;

    # 所有流量代理到 Next.js Web 容器
    # Web 容器内部通过 rewrites 将 /api/* 转发给 API 容器
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
