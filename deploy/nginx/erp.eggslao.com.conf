# ═══════════════════════════════════════════════════════════════
#  erp.eggslao.com — Nginx vhost
#  上游：Phoenix ERP Next.js 前端（127.0.0.1:3000）
#  API 通过 Next.js rewrites 透明代理，Nginx 无需感知 :3100
# ═══════════════════════════════════════════════════════════════

# HTTP → HTTPS 强跳转
server {
    listen 80;
    listen [::]:80;
    server_name erp.eggslao.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.eggslao.com;

    # ── SSL（由 certbot 自动填写）──────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/erp.eggslao.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.eggslao.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── 安全响应头 ─────────────────────────────────────────────
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── 上传大小限制 ───────────────────────────────────────────
    client_max_body_size 20m;

    # ── Next.js 静态资源（长缓存）─────────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    # ── 所有请求代理到 Next.js ─────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
