# ═══════════════════════════════════════════════════════════════
#  Phoenix ERP V3 — Docker Compose stack
#  架构：Nginx（宿主机）→ 127.0.0.1:3000（web）→ 127.0.0.1:3100（api）
#  安全原则：只有 Nginx 对外，3000/3100/5432 均绑定 127.0.0.1
#
#  镜像来源（CI/CD 自动推送）：
#    ghcr.io/ivanzhao299/phoenix-erp-v3/api:latest
#    ghcr.io/ivanzhao299/phoenix-erp-v3/web:latest
#  本地构建覆盖：在 api/web 段取消注释 build: 块即可
# ═══════════════════════════════════════════════════════════════
services:
  db:
    image: postgres:16-alpine
    container_name: phoenix-v3-db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-phoenix_v3}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-phoenix_v3_pass}
      POSTGRES_DB: ${DB_NAME:-phoenix_erp}
    volumes:
      - ${PHOENIX_PG_DATA_DIR:-phoenix_pg_data}:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-phoenix_v3} -d ${DB_NAME:-phoenix_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512m"

  api:
    image: ${API_IMAGE:-ghcr.io/ivanzhao299/phoenix-erp-v3/api:latest}
    # build:          # 本地构建时取消注释
    #   context: .
    #   dockerfile: apps/api/Dockerfile
    container_name: phoenix-v3-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # 512m 容器内为只读全量财务对齐保留受控堆空间，同时给 native/RSS 留余量。
      NODE_OPTIONS: ${API_NODE_OPTIONS:---max-old-space-size=320}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-phoenix_v3}
      DB_PASSWORD: ${DB_PASSWORD:-phoenix_v3_pass}
      DB_NAME: ${DB_NAME:-phoenix_erp}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置，长度≥32}
      JWT_SECRET_PREV: ${JWT_SECRET_PREV:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://erp.eggslao.com}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      PORT: 3100
      CHANJET_APP_KEY: ${CHANJET_APP_KEY:-}
      CHANJET_APP_SECRET: ${CHANJET_APP_SECRET:-}
      CHANJET_ORG_ID: ${CHANJET_ORG_ID:-}
      CHANJET_CERT: ${CHANJET_CERT:-}
      CHANJET_MSG_SECRET: ${CHANJET_MSG_SECRET:-}
      CHANJET_READONLY_SYNC_ENABLED: ${CHANJET_READONLY_SYNC_ENABLED:-false}
      CHANJET_ERP_INBOUND_SYNC_ENABLED: ${CHANJET_ERP_INBOUND_SYNC_ENABLED:-false}
    volumes:
      - ${PHOENIX_UPLOADS_DIR:-phoenix_uploads}:/app/uploads   # 合同/单据文件持久化
    ports:
      - "127.0.0.1:${API_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3100/api/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512m"

  web:
    image: ${WEB_IMAGE:-ghcr.io/ivanzhao299/phoenix-erp-v3/web:latest}
    # build:          # 本地构建时取消注释
    #   context: .
    #   dockerfile: apps/web/Dockerfile
    container_name: phoenix-v3-web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # 容器内必须用 docker 服务名，不能用 127.0.0.1
      API_TARGET: http://api:3100
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512m"

volumes:
  phoenix_pg_data:
    name: phoenix_pg_data
  phoenix_uploads:
    name: phoenix_uploads
