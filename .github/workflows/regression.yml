name: V3 Regression Suite

on:
  push:
    branches: [v3-admin]        # main push 由 deploy.yml 统一处理
  pull_request:
    branches: [v3-admin, main]  # PR 仍跑回归，保护 merge 质量
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_USER: phoenix_v3
  DB_PASSWORD: phoenix_v3_pass
  DB_NAME: phoenix_erp
  # P3(评分补强)：全局导出 PG*，让所有步骤里的裸 psql 连到 phoenix_v3，
  #   而非解析到 CI runner 的 OS 用户 root（致 role "root" does not exist）。
  PGHOST: 127.0.0.1
  PGPORT: 5432
  PGUSER: phoenix_v3
  PGPASSWORD: phoenix_v3_pass
  PGDATABASE: phoenix_erp
  JWT_SECRET: ci_test_secret_minlen_32_characters_xx
  JWT_SECRET_PREV: ""
  NODE_ENV: test
  # P3(评分补强)：镜像 deploy.yml 的 test job —— 回归套件用 admin/admin123 dev 快捷登录拿 token。
  #   缺此变量时 auth.service 走真实密码校验 → admin 登录 "密码错误" → system 回归第一步即挂。
  #   main.ts 仅在 NODE_ENV=production 时禁止本变量（fail-closed），CI(NODE_ENV=test)安全。
  ENABLE_DEV_LOGIN: "true"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: phoenix_v3
          POSTGRES_PASSWORD: phoenix_v3_pass
          POSTGRES_DB: phoenix_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Install psql client + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq
          # 让脚本里的硬编码 psql 路径在 CI 上也能找到
          sudo mkdir -p /Applications/Postgres.app/Contents/Versions/18/bin
          sudo ln -sf $(which psql) /Applications/Postgres.app/Contents/Versions/18/bin/psql

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Type-check API
        working-directory: apps/api
        run: pnpm exec tsc --noEmit

      - name: Build API
        working-directory: apps/api
        run: pnpm build

      # P3(评分补强)：此前直接起 API 打空库 → sys_user/sys_dict 等基线表不存在，9 套回归全挂。
      #   补播种：镜像 deploy.yml 的 ci 模式（ddl/*.sql + v3_schema_complete + 基线 SQL + TS 迁移）。
      - name: Seed DB schema (ddl + baseline + TS migrations)
        working-directory: apps/api
        run: MIG_MODE=ci MIG_DIR=. bash ../../scripts/db-migrate.sh

      - name: Assert WMS migration end state
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF to_regclass('public.wms_inbound') IS NULL
               OR NOT EXISTS (
                 SELECT 1 FROM information_schema.columns
                 WHERE table_schema = 'public' AND table_name = 'wms_inbound' AND column_name = 'date'
               ) THEN
              RAISE EXCEPTION 'migration end state missing public.wms_inbound.date';
            END IF;
            IF to_regclass('public.inv_batches') IS NULL
               OR NOT EXISTS (
                 SELECT 1 FROM information_schema.columns
                 WHERE table_schema = 'public' AND table_name = 'inv_batches' AND column_name = 'inbound_date'
               ) THEN
              RAISE EXCEPTION 'migration end state missing public.inv_batches.inbound_date';
            END IF;
          END
          $check$;
          SQL

      - name: SALES_ORDER approval — Nest + PostgreSQL integration
        working-directory: apps/api
        env:
          RUN_PG_INTEGRATION: "1"
        run: pnpm exec jest src/modules/approval-engine/sales-order-approval.pg.integration.spec.ts --runInBand

      - name: Start API (background)
        working-directory: apps/api
        env:
          PORT: 3100
        run: |
          nohup node dist/main > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3100/api/health >/dev/null; then
              echo "API ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start" >&2
          tail -100 /tmp/api.log >&2
          exit 1

      - name: Packaging VOID and test isolation — PostgreSQL concurrency
        working-directory: apps/api
        env:
          PACKAGING_TEST_DATABASE_URL: postgres://phoenix_v3:phoenix_v3_pass@127.0.0.1:5432/phoenix_erp
        run: pnpm exec jest --runInBand src/modules/bff/packaging-protection.spec.ts

      - name: Module regression — system
        working-directory: apps/api
        run: pnpm test:regr:system

      - name: Module regression — breeding
        working-directory: apps/api
        run: pnpm test:regr:breeding

      - name: Module regression — packaging
        working-directory: apps/api
        run: pnpm test:regr:packaging

      - name: Module regression — wms
        working-directory: apps/api
        run: pnpm test:regr:wms

      - name: Module regression — pos-store
        working-directory: apps/api
        run: pnpm test:regr:pos-store

      - name: Module regression — finance
        working-directory: apps/api
        run: pnpm test:regr:finance

      - name: Module regression — quality
        working-directory: apps/api
        run: pnpm test:regr:quality

      - name: Module regression — pda
        working-directory: apps/api
        run: pnpm test:regr:pda

      - name: Module regression — bi
        working-directory: apps/api
        run: pnpm test:regr:bi

      # G5-C 自动化 RBAC 巡检：admin/老角色访问关键 endpoint 应 200
      # 失败原因常见：lookup endpoint 路由缺失 / RBAC 守卫与 sys_role_menu_permission 不同步
      - name: G5-C RBAC audit (admin + key endpoints)
        env:
          API_BASE: http://localhost:3100
          # g5c-rbac-audit.sh 第 80 行 ${ADMIN_PASS:?} 强制要求该变量，缺则 set -u 秒退。
          #   配合全局 ENABLE_DEV_LOGIN=true，admin/admin123 走 dev 快捷登录拿 token。
          #   songmingguang 段未设 SONG_PASS 时脚本自跳过（line 130-132）。
          ADMIN_PASS: admin123
        run: bash scripts/g5c-rbac-audit.sh "$API_BASE"

      - name: Dump API log on failure
        if: failure()
        run: |
          echo "=== API log (last 200 lines) ==="
          tail -200 /tmp/api.log || true

      # ── 失败告警 ──────────────────────────────────────────────────
      # 在 repo Settings → Secrets 配置：
      #   ALERT_WEBHOOK_URL   — 飞书/钉钉/Slack incoming webhook
      #   ALERT_WEBHOOK_TYPE  — feishu / dingtalk / slack（默认 slack）
      # 若都未配置，本步骤静默跳过
      - name: Send failure alert to webhook
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_TYPE: ${{ secrets.ALERT_WEBHOOK_TYPE || 'slack' }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_BRANCH: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          TITLE="🚨 Phoenix ERP V3 CI Regression FAILED"
          MSG="branch=\`$GH_BRANCH\` sha=\`${GH_SHA:0:8}\` actor=\`$GH_ACTOR\`\n查看：$GH_RUN_URL"

          case "$ALERT_WEBHOOK_TYPE" in
            feishu)
              curl -sS -X POST "$ALERT_WEBHOOK_URL" \
                -H 'Content-Type: application/json' \
                -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"$TITLE\n$MSG\"}}" || true
              ;;
            dingtalk)
              curl -sS -X POST "$ALERT_WEBHOOK_URL" \
                -H 'Content-Type: application/json' \
                -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$TITLE\n$MSG\"}}" || true
              ;;
            slack|*)
              curl -sS -X POST "$ALERT_WEBHOOK_URL" \
                -H 'Content-Type: application/json' \
                -d "{\"text\":\"*$TITLE*\n$MSG\"}" || true
              ;;
          esac

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/api.pid ]; then
            kill -9 $(cat /tmp/api.pid) 2>/dev/null || true
          fi
