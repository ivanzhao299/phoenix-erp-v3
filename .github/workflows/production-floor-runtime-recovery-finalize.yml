name: Finalize Production Floor Runtime Recovery

on:
  workflow_dispatch:
    inputs:
      confirm_finalize:
        description: 'Type FINALIZE_PRODUCTION_FLOOR_RUNTIME_RECOVERY'
        required: true
        type: string
      expected_main_sha:
        description: 'Exact reviewed main SHA'
        required: true
        type: string
      expected_runtime_sha:
        description: 'Verified current API/Web runtime SHA'
        required: true
        type: string
      recovery_run_id:
        description: 'Original recovery workflow run id'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-floor-runtime-recovery
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Validate finalize binding
        env:
          CONFIRM: ${{ inputs.confirm_finalize }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_RUNTIME_SHA: ${{ inputs.expected_runtime_sha }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = FINALIZE_PRODUCTION_FLOOR_RUNTIME_RECOVERY
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$EXPECTED_RUNTIME_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RECOVERY_RUN_ID" =~ ^[0-9]+$ ]]
      - name: Prepare reviewed guard helpers
        run: |
          set -euo pipefail
          echo "PRODUCTION_CONTRACT_B64=$(base64 -w0 scripts/ops/production-config-contract.json)" >> "$GITHUB_ENV"
          echo "PRODUCTION_PATH_HELPER_B64=$(base64 -w0 scripts/ops/production-trusted-paths.mjs)" >> "$GITHUB_ENV"
          echo "PRODUCTION_ATOMIC_STATE_B64=$(base64 -w0 scripts/ops/production-atomic-state.mjs)" >> "$GITHUB_ENV"
          echo "PRODUCTION_GUARD_B64=$(base64 -w0 scripts/ops/production-config-guard.mjs)" >> "$GITHUB_ENV"
          echo "CAPTURE_RUNTIME_B64=$(base64 -w0 scripts/ops/capture-production-runtime.mjs)" >> "$GITHUB_ENV"
          echo "CHANJET_POLICY_B64=$(base64 -w0 scripts/ops/chanjet-readonly-policy.mjs)" >> "$GITHUB_ENV"
          echo "MANAGED_ENV_B64=$(base64 -w0 scripts/ops/update-managed-chanjet-env.mjs)" >> "$GITHUB_ENV"
      - name: Verify and finalize recovery receipt over controlled SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: /data/phoenix-erp
          TARGET_SHA: ${{ github.sha }}
          EXPECTED_RUNTIME_SHA: ${{ inputs.expected_runtime_sha }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          PRODUCTION_CONTRACT_B64: ${{ env.PRODUCTION_CONTRACT_B64 }}
          PRODUCTION_PATH_HELPER_B64: ${{ env.PRODUCTION_PATH_HELPER_B64 }}
          PRODUCTION_ATOMIC_STATE_B64: ${{ env.PRODUCTION_ATOMIC_STATE_B64 }}
          PRODUCTION_GUARD_B64: ${{ env.PRODUCTION_GUARD_B64 }}
          CAPTURE_RUNTIME_B64: ${{ env.CAPTURE_RUNTIME_B64 }}
          CHANJET_POLICY_B64: ${{ env.CHANJET_POLICY_B64 }}
          MANAGED_ENV_B64: ${{ env.MANAGED_ENV_B64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH,TARGET_SHA,EXPECTED_RUNTIME_SHA,RECOVERY_RUN_ID,PRODUCTION_CONTRACT_B64,PRODUCTION_PATH_HELPER_B64,PRODUCTION_ATOMIC_STATE_B64,PRODUCTION_GUARD_B64,CAPTURE_RUNTIME_B64,CHANJET_POLICY_B64,MANAGED_ENV_B64
          command_timeout: 5m
          script: |
            set -Eeuo pipefail
            set +x
            cd "$DEPLOY_PATH"
            git_safe() { git -c "safe.directory=$DEPLOY_PATH" -c core.hooksPath=/dev/null "$@"; }
            test "$(git_safe branch --show-current)" = main
            test -z "$(git_safe status --porcelain --untracked-files=all)"
            test "$(git_safe rev-parse HEAD)" = "$TARGET_SHA"
            STATE_DIR=/var/lib/phoenix-erp/production-deployment-state
            STAGE="$STATE_DIR/floor-runtime-recovery-finalize-${RECOVERY_RUN_ID}"
            test ! -e "$STAGE"
            mkdir -m 700 "$STAGE"
            printf '%s' "$PRODUCTION_CONTRACT_B64" | base64 -d > "$STAGE/production-config-contract.json"
            printf '%s' "$PRODUCTION_PATH_HELPER_B64" | base64 -d > "$STAGE/production-trusted-paths.mjs"
            printf '%s' "$PRODUCTION_ATOMIC_STATE_B64" | base64 -d > "$STAGE/production-atomic-state.mjs"
            printf '%s' "$PRODUCTION_GUARD_B64" | base64 -d > "$STAGE/production-config-guard.mjs"
            printf '%s' "$CAPTURE_RUNTIME_B64" | base64 -d > "$STAGE/capture-production-runtime.mjs"
            printf '%s' "$CHANJET_POLICY_B64" | base64 -d > "$STAGE/chanjet-readonly-policy.mjs"
            printf '%s' "$MANAGED_ENV_B64" | base64 -d > "$STAGE/update-managed-chanjet-env.mjs"
            chmod 600 "$STAGE"/*
            exec 9<> "$STATE_DIR/mutation.lock"
            flock -n 9
            STATE_DIR="$STATE_DIR" EXPECTED_RUNTIME_SHA="$EXPECTED_RUNTIME_SHA" RECOVERY_RUN_ID="$RECOVERY_RUN_ID" STAGE="$STAGE" \
            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            import path from 'node:path';
            import { pathToFileURL } from 'node:url';
            import { execFileSync } from 'node:child_process';
            const guardModule = await import(pathToFileURL(process.env.STAGE + '/production-config-guard.mjs'));
            const atomicModule = await import(pathToFileURL(process.env.STAGE + '/production-atomic-state.mjs'));
            const runtimeModule = await import(pathToFileURL(process.env.STAGE + '/capture-production-runtime.mjs'));
            const { secureJson, guardProduction } = guardModule;
            const { atomicState } = atomicModule;
            const { captureRuntime, executionEnv } = runtimeModule;
            const stateDir = process.env.STATE_DIR;
            const floor = secureJson(path.join(stateDir, 'floor.json'));
            const active = secureJson(path.join(stateDir, 'active.json'));
            if (floor.floorSha !== process.env.EXPECTED_RUNTIME_SHA || active.floorSha !== process.env.EXPECTED_RUNTIME_SHA) throw new Error('RECOVERY_FINALIZE_HOLD=STATE_BINDING');
            if (fs.existsSync(path.join(stateDir, 'transaction.json')) || fs.existsSync(path.join(stateDir, 'policy-transition.json'))) throw new Error('RECOVERY_FINALIZE_HOLD=ACTIVE_TRANSACTION');
            const health = service => execFileSync('docker', ['inspect', `phoenix-v3-${service}`, '--format', '{{.State.Health.Status}}'], { env: executionEnv(), encoding: 'utf8' }).trim();
            if (health('api') !== 'healthy' || health('web') !== 'healthy') throw new Error('RECOVERY_FINALIZE_HOLD=UNHEALTHY_RUNTIME');
            const actual = captureRuntime();
            if (actual.api.revision !== process.env.EXPECTED_RUNTIME_SHA || actual.web.revision !== process.env.EXPECTED_RUNTIME_SHA) throw new Error('RECOVERY_FINALIZE_HOLD=RUNTIME_REVISION');
            guardProduction(process.cwd(), stateDir, actual);
            const receiptPath = path.join(stateDir, `floor-runtime-recovery-${process.env.RECOVERY_RUN_ID}.json`);
            if (!fs.existsSync(receiptPath)) throw new Error('RECOVERY_FINALIZE_HOLD=RECEIPT_MISSING');
            const receipt = secureJson(receiptPath);
            if (receipt.schema !== 'phoenix.production-floor-runtime-recovery/1' || receipt.targetFloorSha !== process.env.EXPECTED_RUNTIME_SHA) throw new Error('RECOVERY_FINALIZE_HOLD=RECEIPT_BINDING');
            atomicState(path.join(stateDir, `floor-runtime-recovery-${process.env.RECOVERY_RUN_ID}-complete.json`), { ...receipt, completedAt: new Date().toISOString(), floorSha: floor.floorSha, activeSha: active.floorSha, guard: 'PASS', runtime: actual });
            console.log(`FLOOR_RUNTIME_RECOVERY_FINALIZE=PASS;RUN=${process.env.RECOVERY_RUN_ID};SHA=${process.env.EXPECTED_RUNTIME_SHA}`);
            NODE
