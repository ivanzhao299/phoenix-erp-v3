name: Production State Materialization

on:
  workflow_dispatch:
    inputs:
      confirm_readonly:
        description: 'Type COLLECT_PRODUCTION_STATE_READONLY to authorize read-only state collection'
        required: true
        type: string
      expected_main_sha:
        description: 'Exact current main SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-state-materialization
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-readonly
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Validate read-only binding
        env:
          CONFIRM: ${{ inputs.confirm_readonly }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = COLLECT_PRODUCTION_STATE_READONLY
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Collect production state over read-only SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PROXY_HOST: ${{ secrets.DEPLOY_PROXY_HOST }}
          PROXY_USER: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          PROXY_KEY: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          key="$RUNNER_TEMP/deploy-key"; proxy_key="$RUNNER_TEMP/proxy-key"
          printf '%s' "$DEPLOY_KEY" > "$key"; chmod 600 "$key"
          printf '%s' "$PROXY_KEY" > "$proxy_key"; chmod 600 "$proxy_key"
          ssh_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$key" -p "$DEPLOY_PORT")
          scp_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$key" -P "$DEPLOY_PORT")
          if [ -n "$PROXY_HOST" ]; then
            ssh_opts+=( -o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $proxy_key -W %h:%p -p 22 $PROXY_USER@$PROXY_HOST" )
            scp_opts+=( -o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $proxy_key -W %h:%p -p 22 $PROXY_USER@$PROXY_HOST" )
          fi
          remote_archive="/tmp/phoenix-production-state-${GITHUB_RUN_ID}.tgz"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -Eeuo pipefail; tmp=\$(mktemp -d); trap 'rm -rf "\$tmp" "$remote_archive"' EXIT; for name in floor.json active.json transaction.json policy-transition.json background-control.json; do [ -f /var/lib/phoenix-erp/production-deployment-state/\$name ] && cp -p /var/lib/phoenix-erp/production-deployment-state/\$name "\$tmp/" || true; done; find /var/lib/phoenix-erp/production-deployment-state -maxdepth 1 -type f \( -name 'deploy-*.json' -o -name 'recovery-*.json' \) -exec cp -p {} "\$tmp/" \;; printf '%s\n' COLLECTED_AT=\$(date -u +%Y-%m-%dT%H:%M:%SZ) > "\$tmp/collection-metadata.txt"; printf '%s\n' PRODUCTION_HEAD=\$(git -C /data/phoenix-erp rev-parse HEAD) >> "\$tmp/collection-metadata.txt"; tar -czf $remote_archive -C "\$tmp" ."
          scp "${scp_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST:$remote_archive" production-state-materialization.tgz
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -f $remote_archive"
          tar -tzf production-state-materialization.tgz
      - name: Upload state archive
        uses: actions/upload-artifact@v4
        with:
          name: production-state-materialization-${{ github.run_id }}
          path: production-state-materialization.tgz
          if-no-files-found: error
