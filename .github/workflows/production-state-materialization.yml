name: Production State Materialization

on:
  workflow_dispatch:
    inputs:
      confirm_readonly:
        description: 'Type COLLECT_PRODUCTION_STATE_READONLY to authorize read-only state collection'
        required: true
        type: string
      expected_main_sha:
        description: 'Exact current main SHA'
        required: true
        type: string
      record_name:
        description: 'Optional recovery/deploy record to inspect read-only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: production-state-materialization
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-readonly
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Validate read-only binding
        env:
          CONFIRM: ${{ inputs.confirm_readonly }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = COLLECT_PRODUCTION_STATE_READONLY
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Collect production state over read-only SSH
        id: collect_state
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: /data/phoenix-erp
          STATE_DIR: /var/lib/phoenix-erp/production-deployment-state
          RECORD_NAME: ${{ inputs.record_name }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH,STATE_DIR,RECORD_NAME
          capture_stdout: true
          command_timeout: 5m
          script: |
            set -Eeuo pipefail
            umask 077
            test "$(git -C "$DEPLOY_PATH" branch --show-current)" = main
            test "$(git -C "$DEPLOY_PATH" status --porcelain --untracked-files=all)" = ''
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            redacted_json() {
              node --input-type=module -e '
                import fs from "node:fs";
                try {
                const keys=["protocolVersion","phase","owner","generation","previousFloorSha","targetSha","purpose","holdReason","updatedAt"];
                const scrub=value=>{
                  if(Array.isArray(value))return value.map(scrub);
                  if(!value||typeof value!=="object")return value;
                  if(Object.hasOwn(value,"schemaRelease")||value.purpose==="MODERN_SCHEMA_RELEASE"||String(value.schema||"").startsWith("phoenix.modern-schema-")){
                    const projected={schemaReleaseRedacted:true};
                    for(const key of keys)if(value[key]===null||["string","number","boolean"].includes(typeof value[key]))projected[key]=value[key];
                    return projected;
                  }
                  if(Object.hasOwn(value,"cutover")||value.purpose==="PRODUCTION_CUTOVER"||value.schema==="phoenix.production-cutover-pending/1"){
                    const projected={cutoverRedacted:true};
                    for(const key of keys)if(value[key]===null||["string","number","boolean"].includes(typeof value[key]))projected[key]=value[key];
                    return projected;
                  }
                  return Object.fromEntries(Object.entries(value).map(([key,child])=>[key,scrub(child)]));
                };
                process.stdout.write(JSON.stringify(scrub(JSON.parse(fs.readFileSync(process.argv[1],"utf8"))))+"\n");
                } catch { process.stderr.write("STATE_EXPORT=HOLD_INVALID_JSON\n");process.exitCode=1; }
              ' "$1"
            }
            for name in floor.json active.json transaction.json policy-transition.json background-control.json; do
              if [ -f "$STATE_DIR/$name" ]; then cp -p "$STATE_DIR/$name" "$tmp/$name"; fi
            done
            find "$STATE_DIR" -maxdepth 1 -type f \( -name 'deploy-*.json' -o -name 'recovery-*.json' \) -exec cp -p {} "$tmp/" \;
            printf '%s\n' "COLLECTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$tmp/collection-metadata.txt"
            printf '%s\n' "PRODUCTION_HEAD=$(git -C "$DEPLOY_PATH" rev-parse HEAD)" >> "$tmp/collection-metadata.txt"
            for name in floor.json active.json transaction.json policy-transition.json background-control.json; do
              printf 'STATE_FILE=%s\n' "$name"
              if [ ! -f "$STATE_DIR/$name" ]; then printf 'MISSING\n'; continue; fi
              case "$name" in
                floor.json) jq -c '{version,phase,floorSha,chanjetPolicy,readonlyApproval}' "$STATE_DIR/$name" ;;
                active.json) jq -c '{version,floorSha,outcome,active:{api:{revision,imageId},web:{revision,imageId}}}' "$STATE_DIR/$name" ;;
                *) redacted_json "$STATE_DIR/$name" ;;
              esac
            done
            # Presence is meaningful even if registration crashed before FENCE.
            # Project metadata only; never archive preparation/audit/token files.
            if [ -e "$STATE_DIR/schema-release-pending.json" ] || [ -L "$STATE_DIR/schema-release-pending.json" ]; then
              node --input-type=module -e '
                import fs from "node:fs";import {createHash} from "node:crypto";
                let fd;
                try {
                  const file=process.argv[1],before=fs.lstatSync(file);
                  const regular=s=>s.isFile()&&!s.isSymbolicLink()&&s.uid===0&&(s.mode&0o7777)===0o600&&s.nlink===1&&s.size<=65536;
                  const pin=s=>JSON.stringify([s.dev,s.ino,s.uid,s.mode,s.nlink,s.size,s.mtimeMs,s.ctimeMs]);
                  if(!regular(before))throw Error();fd=fs.openSync(file,fs.constants.O_RDONLY|fs.constants.O_NOFOLLOW);
                  const opened=fs.fstatSync(fd);if(!regular(opened)||pin(opened)!==pin(before))throw Error();
                  const bytes=fs.readFileSync(fd),after=fs.fstatSync(fd),named=fs.lstatSync(file);
                  if(!regular(after)||!regular(named)||pin(opened)!==pin(after)||pin(after)!==pin(named))throw Error();
                  const value=JSON.parse(bytes),phases=["REGISTERED","DRAINED","INGRESS_FENCED","R_STOP_INTENT","R_STOPPED","FRESH_RECHECKED","BACKUP_VERIFIED","DDL_STARTED","SCHEMA_RECEIPTED","API_BODY","API_VERIFIED","OPEN_INTENT","OPEN_PUBLISHED","INGRESS_RELEASED","COMPLETED_OPEN"];
                  if(value.schema!=="phoenix.modern-schema-release-pending/v1"||value.purpose!=="MODERN_SCHEMA_RELEASE"||!phases.includes(value.phase)||!["RUNNING","HOLD"].includes(value.status)||!/^\d+-\d+$/.test(value.owner))throw Error();
                  console.log(JSON.stringify({schemaReleasePending:true,metadataReadable:true,phase:value.phase,status:value.status,owner:value.owner,recordSha256:createHash("sha256").update(bytes).digest("hex"),projectionOnly:true,releaseAuthorized:false}));
                }catch{console.log("SCHEMA_RELEASE_PENDING=PRESENT_HOLD_METADATA");}finally{if(fd!==undefined)fs.closeSync(fd);}
              ' "$STATE_DIR/schema-release-pending.json"
            else
              echo 'SCHEMA_RELEASE_PENDING=ABSENT'
            fi
            # Only counts and digests leave the production host. Shape never grants release.
            node --input-type=module - "$STATE_DIR/maintenance-host-ownership-registry.json" <<'OWNERSHIP_PROJECTION'
            import fs from 'node:fs';
            import { createHash } from 'node:crypto';

            const file = process.argv[2];
            const digest = /^[a-f0-9]{64}$/;
            const valid = stat => stat.isFile() && stat.uid === 0n && (stat.mode & 0o7777n) === 0o600n &&
              stat.nlink === 1n && stat.size > 0n && stat.size <= 1024n * 1024n;
            const pin = stat => [stat.dev, stat.ino, stat.uid, stat.mode, stat.nlink, stat.size, stat.mtimeNs, stat.ctimeNs];
            const same = (one, two) => one.every((value, index) => value === two[index]);
            const stat = filename => fs.lstatSync(filename, { bigint: true });
            const fstat = fd => fs.fstatSync(fd, { bigint: true });
            let fd;
            try {
              let before;
              try {
                before = stat(file);
              } catch (error) {
                if (error.code !== 'ENOENT') throw error;
                console.log('MAINTENANCE_HOST_OWNERSHIP_REGISTRY=ABSENT');
                process.exit(0);
              }

              if (!valid(before)) throw Error();
              fd = fs.openSync(file, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK);
              const opened = fstat(fd);
              if (!valid(opened) || !same(pin(before), pin(opened))) throw Error();

              const bytes = Buffer.alloc(Number(opened.size) + 1);
              let read = 0;
              while (read < bytes.length) {
                const size = fs.readSync(fd, bytes, read, bytes.length - read, read);
                if (size === 0) break;
                read += size;
              }
              const after = fstat(fd);
              const named = stat(file);
              if (read !== Number(opened.size) || !valid(after) || !valid(named) ||
                  !same(pin(opened), pin(after)) || !same(pin(after), pin(named))) throw Error();

              const content = bytes.subarray(0, read);
              const value = JSON.parse(content.toString('utf8'));
              if (value?.schema !== 'phoenix.maintenance-reviewed-host-ownership/v1' ||
                  typeof value.evidenceSha256 !== 'string' || !digest.test(value.evidenceSha256) ||
                  !Array.isArray(value.hostProcesses) || !Array.isArray(value.containers)) throw Error();

              console.log(JSON.stringify({
                maintenanceHostOwnershipRegistry: 'PRESENT_REVIEWED_SHAPE',
                hostProcessPins: value.hostProcesses.length,
                containerPins: value.containers.length,
                evidenceSha256: value.evidenceSha256,
                recordSha256: createHash('sha256').update(content).digest('hex'),
                projectionOnly: true,
                releaseAuthorized: false,
              }));
            } catch {
              console.log('MAINTENANCE_HOST_OWNERSHIP_REGISTRY=HOLD_UNVERIFIED');
            } finally {
              if (fd !== undefined) fs.closeSync(fd);
            }
            OWNERSHIP_PROJECTION
            find "$STATE_DIR" -maxdepth 1 -type f \( -name 'deploy-*.json' -o -name 'recovery-*.json' \) -print0 | sort -z | while IFS= read -r -d '' file; do
              printf 'STATE_RECORD=%s size=%s sha256=%s\n' "${file##*/}" "$(stat -c '%s' "$file")" "$(sha256sum "$file" | cut -d' ' -f1)"
            done
            if [ -n "$RECORD_NAME" ]; then
              case "$RECORD_NAME" in recovery-*.json|deploy-*.json|background-body-output.log|run-*/background-body-output.log|tmp-*.log) ;; *) echo INVALID_RECORD_NAME; exit 2 ;; esac
              printf 'SELECTED_RECORD=%s\n' "$RECORD_NAME"
              if [[ "$RECORD_NAME" == *.json ]]; then redacted_json "$STATE_DIR/$RECORD_NAME"; else
                selected_path="$STATE_DIR/$RECORD_NAME"
                case "$RECORD_NAME" in tmp-*.log) selected_path="/tmp/${RECORD_NAME#tmp-}" ;; esac
                tail -200 "$selected_path" | sed 's/^/BODY_LOG: /'
              fi
            fi
      - name: Write state materialization
        env:
          STATE_DUMP: ${{ steps.collect_state.outputs.stdout }}
        run: |
          set -euo pipefail
          test -n "$STATE_DUMP"
          printf '%s\n' "$STATE_DUMP" > production-state-materialization.txt
          grep -q 'STATE_FILE=' production-state-materialization.txt
      - name: Upload state materialization
        uses: actions/upload-artifact@v4
        with:
          name: production-state-materialization-${{ github.run_id }}
          path: production-state-materialization.txt
          if-no-files-found: error
