name: Chanjet User Organization Binding Read-only Audit

on:
  workflow_dispatch:

concurrency:
  group: chanjet-user-org-binding-readonly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate read-only audit
        run: |
          node --check scripts/ops/chanjet-user-org-binding-policy.mjs
          node --check scripts/ops/chanjet-user-org-binding-audit.mjs
          node --test scripts/ops/chanjet-user-org-binding-policy.test.mjs

      - name: Audit production user organization boundary
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          DEPLOY_PROXY_HOST: ${{ secrets.DEPLOY_PROXY_HOST }}
          DEPLOY_PROXY_USER: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          DEPLOY_PROXY_SSH_KEY: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          TOKEN="$(node scripts/ops/mint-production-admin-token-over-ssh.mjs)"
          test -n "$TOKEN"
          PHOENIX_ADMIN_TOKEN="$TOKEN" node scripts/ops/chanjet-user-org-binding-audit.mjs \
            --execute \
            --api-base=https://erp.eggslao.com \
            --output-dir=docs/ops/runs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chanjet-user-org-binding-audit-${{ github.run_id }}
          path: docs/ops/runs/chanjet-user-org-binding-audit-latest.json
          if-no-files-found: error
          retention-days: 30
