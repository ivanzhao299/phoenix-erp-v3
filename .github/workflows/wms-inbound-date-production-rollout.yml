name: WMS Inbound Date Production Rollout

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Approved rollout phase
        required: true
        type: choice
        options: [preflight, apply, verify]
      expected_revision:
        description: Full deployed checkout/API/Web revision
        required: true
        type: string
      approve_production:
        description: Type APPROVE-WMS-INBOUND-DATE-20260909
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wms-inbound-date-production-rollout
  cancel-in-progress: false

jobs:
  execute:
    if: inputs.approve_production == 'APPROVE-WMS-INBOUND-DATE-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Execute fixed approved manifest
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          MANIFEST_SHA: ${{ github.sha }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH,MANIFEST_SHA,EXPECTED_REVISION
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            git fetch --quiet origin "$MANIFEST_SHA"
            git cat-file -e "$MANIFEST_SHA^{commit}"
            checkout_revision="$(git rev-parse HEAD)"
            api_container="$(docker compose ps -q api)"
            web_container="$(docker compose ps -q web)"
            test -n "$api_container"
            test -n "$web_container"
            api_revision="$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_container")"
            web_revision="$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_container")"
            test "$checkout_revision" = "$EXPECTED_REVISION"
            test "$api_revision" = "$EXPECTED_REVISION"
            test "$web_revision" = "$EXPECTED_REVISION"
            if [[ "${{ inputs.phase }}" == preflight ]]; then
              git show "$MANIFEST_SHA:scripts/ops/wms-inbound-date-backfill-preflight.sql" | docker compose exec -T -e PGOPTIONS='-c default_transaction_read_only=on' db sh -c 'psql -X -v ON_ERROR_STOP=1 -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            elif [[ "${{ inputs.phase }}" == apply ]]; then
              git show "$MANIFEST_SHA:scripts/ops/wms-inbound-date-backfill-preflight.sql" | docker compose exec -T -e PGOPTIONS='-c default_transaction_read_only=on' db sh -c 'psql -X -v ON_ERROR_STOP=1 -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
              git show "$MANIFEST_SHA:scripts/ops/wms-inbound-date-backfill-apply.sql" | docker compose exec -T db sh -c 'psql -X -v ON_ERROR_STOP=1 -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
              git show "$MANIFEST_SHA:scripts/ops/wms-inbound-date-backfill-verify.sql" | docker compose exec -T -e PGOPTIONS='-c default_transaction_read_only=on' db sh -c 'psql -X -v ON_ERROR_STOP=1 -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            else
              git show "$MANIFEST_SHA:scripts/ops/wms-inbound-date-backfill-verify.sql" | docker compose exec -T -e PGOPTIONS='-c default_transaction_read_only=on' db sh -c 'psql -X -v ON_ERROR_STOP=1 -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            fi
