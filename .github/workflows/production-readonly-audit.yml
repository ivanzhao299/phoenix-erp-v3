name: Production Readonly Audit

on:
  workflow_dispatch:
    inputs:
      audit_mode:
        description: Reviewed audit mode (metadata never invokes legacy SQL/HTTP runner)
        type: choice
        options: [legacy, packaging-metadata]
        default: legacy
      expected_deploy_sha:
        description: Exact reviewed production baseline
        type: string
        default: a53d91f33ff733bf28e19ca11d7491f1bfd46922
      backup_directory:
        description: Fixed logical backup location
        type: choice
        options: [deploy-backups]
        default: deploy-backups
      approve_production:
        description: Type APPROVE-PRODUCTION-READONLY-AUDIT
        required: true
        type: string
      assertion_sql_path:
        description: SQL file under scripts/ops/readonly-audits (blank to skip)
        required: false
        default: scripts/ops/readonly-audits/sales-order-lifecycle.sql
        type: string
      http_assertions_path:
        description: HTTP assertion JSON under scripts/ops/readonly-audits (blank to skip)
        required: false
        default: scripts/ops/readonly-audits/sales-order-lifecycle.http.json
        type: string

permissions:
  contents: read

concurrency:
  group: production-readonly-audit
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate audit inputs without production access
        env:
          AUDIT_MODE: ${{ inputs.audit_mode }}
          EXPECTED_DEPLOY_SHA: ${{ inputs.expected_deploy_sha }}
          BACKUP_DIRECTORY: ${{ inputs.backup_directory }}
          BUNDLE_SOURCE_COMMIT: ${{ github.sha }}
          BUNDLE_HELPER_SHA256: 51d3e0c9efc3e2b0d6687c41523111b5ac2891e722958f185157150b8ab05d9b
          BUNDLE_SQL_SHA256: 8c0167efaa5b04e2018b950bfd38a7e179b87e3847e27b60cd5637528c3f729a
          BUNDLE_MANIFEST_SHA256: ba3fc5d21d62c37c09205b3421f7bf04a44f6cb5185e3da8fa09840e86c505ce
          ASSERTION_SQL_PATH: ${{ inputs.audit_mode == 'packaging-metadata' && '' || inputs.assertion_sql_path }}
          HTTP_ASSERTIONS_PATH: ${{ inputs.audit_mode == 'packaging-metadata' && '' || inputs.http_assertions_path }}
        run: |
          if [ "$AUDIT_MODE" = packaging-metadata ]; then
            unset ASSERTION_SQL_PATH HTTP_ASSERTIONS_PATH
            node scripts/ops/readonly-audits/packaging-metadata.cjs --validate
          elif [ "$AUDIT_MODE" = legacy ]; then
            bash scripts/ops/run-production-readonly-audit.sh --validate
          else
            echo 'FAIL AUDIT_STAGE=INPUT class=UNKNOWN_MODE exit=2'
            exit 2
          fi

  audit:
    needs: validate
    if: inputs.approve_production == 'APPROVE-PRODUCTION-READONLY-AUDIT'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Stage reviewed audit bundle on the controlled runner
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          source: ${{ inputs.audit_mode == 'packaging-metadata' && 'scripts/ops/readonly-audits/packaging-metadata.cjs,scripts/ops/readonly-audits/packaging-metadata.sql,scripts/ops/readonly-audits/packaging-metadata-manifest.json' || 'scripts/ops/run-production-readonly-audit.sh,scripts/ops/readonly-audits' }}
          target: /tmp/phoenix-production-readonly-audit-${{ github.run_id }}/bundle
      - name: Execute protected production readonly assertions
        id: execute
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          AUDIT_MODE: ${{ inputs.audit_mode }}
          EXPECTED_DEPLOY_SHA: ${{ inputs.expected_deploy_sha }}
          BACKUP_DIRECTORY: ${{ inputs.backup_directory }}
          BUNDLE_SOURCE_COMMIT: ${{ github.sha }}
          BUNDLE_HELPER_SHA256: 51d3e0c9efc3e2b0d6687c41523111b5ac2891e722958f185157150b8ab05d9b
          BUNDLE_SQL_SHA256: 8c0167efaa5b04e2018b950bfd38a7e179b87e3847e27b60cd5637528c3f729a
          BUNDLE_MANIFEST_SHA256: ba3fc5d21d62c37c09205b3421f7bf04a44f6cb5185e3da8fa09840e86c505ce
          ASSERTION_SQL_PATH: ${{ inputs.audit_mode == 'packaging-metadata' && '' || inputs.assertion_sql_path }}
          HTTP_ASSERTIONS_PATH: ${{ inputs.audit_mode == 'packaging-metadata' && '' || inputs.http_assertions_path }}
          AUDIT_RUN_ID: ${{ github.run_id }}
          AUDIT_BUNDLE_DIR: /tmp/phoenix-production-readonly-audit-${{ github.run_id }}/bundle
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          capture_stdout: true
          envs: AUDIT_MODE,EXPECTED_DEPLOY_SHA,BACKUP_DIRECTORY,BUNDLE_SOURCE_COMMIT,BUNDLE_HELPER_SHA256,BUNDLE_SQL_SHA256,BUNDLE_MANIFEST_SHA256,DEPLOY_PATH,ASSERTION_SQL_PATH,HTTP_ASSERTIONS_PATH,AUDIT_RUN_ID,AUDIT_BUNDLE_DIR
          script: |
            set -euo pipefail
            # Metadata is isolated before legacy stderr merging/logging/bootstrap.
            if [ "${AUDIT_MODE:-legacy}" = packaging-metadata ]; then
              unset ASSERTION_SQL_PATH HTTP_ASSERTIONS_PATH
              exec 2>/dev/null
              metadata_deploy_path="$DEPLOY_PATH"
              case "$metadata_deploy_path" in
                '~/'*) metadata_deploy_path="$HOME/${metadata_deploy_path#\~/}" ;;
              esac
              if ! cd "$metadata_deploy_path"; then
                echo 'FAIL AUDIT_STAGE=DEPLOY_DIRECTORY class=UNAVAILABLE exit=2'
                exit 2
              fi
              set +e
              metadata_output=$(node "$AUDIT_BUNDLE_DIR/scripts/ops/readonly-audits/packaging-metadata.cjs" 2>/dev/null)
              metadata_exit=$?
              set -e
              printf '%s\n' "$metadata_output"
              if [ "$metadata_exit" -eq 0 ]; then
                echo 'AUDIT_METADATA_RESULT=PASS'
              else
                echo "AUDIT_METADATA_RESULT=FAIL stage=METADATA_RUNNER exit=$metadata_exit"
              fi
              # Keep the SSH action itself successful so capture_stdout does not
              # emit its broken output delimiter on a controlled helper failure.
              exit 0
            fi
            if [ "${AUDIT_MODE:-legacy}" != legacy ]; then
              echo 'FAIL AUDIT_STAGE=INPUT class=UNKNOWN_MODE exit=2'
              exit 2
            fi
            exec 2>&1
            echo 'AUDIT_STAGE=DEPLOY_DIRECTORY'
            audit_deploy_path="$DEPLOY_PATH"
            case "$audit_deploy_path" in
              '~/'*) audit_deploy_path="$HOME/${audit_deploy_path#\~/}" ;;
            esac
            if ! cd "$audit_deploy_path" 2>/dev/null; then
              echo 'FAIL AUDIT_STAGE=DEPLOY_DIRECTORY exit=2'
              exit 2
            fi
            if [ ! -r "$AUDIT_BUNDLE_DIR/scripts/ops/run-production-readonly-audit.sh" ]; then
              echo 'FAIL AUDIT_STAGE=BUNDLE_RUNNER exit=2'
              exit 2
            fi
            bash "$AUDIT_BUNDLE_DIR/scripts/ops/run-production-readonly-audit.sh"
      - name: Enforce metadata helper result
        if: always() && inputs.audit_mode == 'packaging-metadata'
        env:
          AUDIT_OUTPUT: ${{ steps.execute.outputs.stdout }}
          SSH_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          if [ "$SSH_OUTCOME" != success ]; then
            echo 'FAIL AUDIT_STAGE=SSH class=COMMAND_FAILED exit=2'
            exit 2
          fi
          case "$AUDIT_OUTPUT" in
            *'AUDIT_METADATA_RESULT=PASS'*) exit 0 ;;
            *'AUDIT_METADATA_RESULT=FAIL '* ) echo 'FAIL AUDIT_STAGE=METADATA_RESULT class=HELPER_FAILED exit=2'; exit 2 ;;
            *) echo 'FAIL AUDIT_STAGE=METADATA_RESULT class=MISSING_MARKER exit=2'; exit 2 ;;
          esac

      - name: Persist sanitized audit output
        if: always()
        env:
          AUDIT_OUTPUT: ${{ steps.execute.outputs.stdout }}
        run: |
          install -d -m 700 docs/ops/runs
          printf '%s\n' "$AUDIT_OUTPUT" > "docs/ops/runs/production-readonly-audit-${GITHUB_RUN_ID}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-readonly-audit-${{ github.run_id }}
          path: docs/ops/runs/production-readonly-audit-${{ github.run_id }}.log
          if-no-files-found: warn
          retention-days: 30
