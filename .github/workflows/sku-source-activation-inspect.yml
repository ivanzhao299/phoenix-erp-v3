name: SKU Source Activation Inspect

# Schema 95 is applied separately via controlled-pending-migration-apply with receipts.
# This workflow never applies activation, changes checkout/floor, or writes DB state.
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact reviewed merged main SHA (source, manifest and transport)'
        required: true
        type: string
      sku_source_effective_date:
        description: 'Confirmed source business date: 2026-11-10 (not the execution date)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sku-source-activation-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Bind reviewed main and bootstrap payload
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          {
            echo "PRODUCTION_CONTRACT_B64=$(base64 -w0 scripts/ops/production-config-contract.json)"
            echo "PRODUCTION_PATH_HELPER_B64=$(base64 -w0 scripts/ops/production-trusted-paths.mjs)"
            echo "PRODUCTION_CONTROL_BOOTSTRAP_B64=$(base64 -w0 scripts/ops/production-control-bootstrap.sh)"
          } >> "$GITHUB_ENV"
      - name: Read-only plan on existing API container
        id: source_inspect
        uses: appleboy/ssh-action@v1
        env:
          TARGET_SHA: ${{ inputs.expected_main_sha }}
          SKU_SOURCE_EFFECTIVE_DATE: ${{ inputs.sku_source_effective_date }}
          SKU_ACTIVATION_MODE: inspect
          INSPECT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PRODUCTION_CONTRACT_B64: ${{ env.PRODUCTION_CONTRACT_B64 }}
          PRODUCTION_PATH_HELPER_B64: ${{ env.PRODUCTION_PATH_HELPER_B64 }}
          PRODUCTION_CONTROL_BOOTSTRAP_B64: ${{ env.PRODUCTION_CONTROL_BOOTSTRAP_B64 }}
        with:
          host: '47.236.122.224'
          fingerprint: 'SHA256:Y4WEXMJ24a4r1KxOw0det4qcCFNxj65mZeIG9oQOJcI'
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 5m
          capture_stdout: true
          envs: TARGET_SHA,SKU_SOURCE_EFFECTIVE_DATE,SKU_ACTIVATION_MODE,INSPECT_RUN_ID,PRODUCTION_CONTRACT_B64,PRODUCTION_PATH_HELPER_B64,PRODUCTION_CONTROL_BOOTSTRAP_B64
          script: |
            set -Eeuo pipefail
            umask 077
            cd /data/phoenix-erp
            export DEPLOY_REPO_ROOT="$(pwd -P)"
            eval "$(printf '%s' "$PRODUCTION_CONTROL_BOOTSTRAP_B64" | base64 -d)"
            export STATE_DIR
            git_safe() { command git -c "safe.directory=$DEPLOY_REPO_ROOT" -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
            [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$INSPECT_RUN_ID" =~ ^[0-9]+-[0-9]+$ ]]
            test "$(git_safe branch --show-current)" = main
            test -z "$(git_safe status --porcelain --untracked-files=all)"
            git_safe fetch --no-tags origin main
            test "$(git_safe rev-parse FETCH_HEAD)" = "$TARGET_SHA"
            STAGE="$STATE_DIR/sku-inspect-$INSPECT_RUN_ID"
            test ! -e "$STAGE"
            mkdir -m 700 "$STAGE"
            # Stage only reviewed target blobs outside the checkout. No floor assertion
            # here: the pre-reanchor floor is valid and inspection must not mutate it.
            for helper in sku-source-activation-transport.mjs production-config-guard.mjs production-config-contract.json production-trusted-paths.mjs capture-production-runtime.mjs update-managed-chanjet-env.mjs chanjet-readonly-policy.mjs; do
              git_safe show "$TARGET_SHA:scripts/ops/$helper" > "$STAGE/$helper"
              chmod 600 "$STAGE/$helper"
            done
            RECEIPT="$(node "$STAGE/sku-source-activation-transport.mjs")"
            printf 'SKU_SOURCE_INSPECT_RECEIPT=%s\n' "$RECEIPT"
      - name: Preserve exact unmasked read-only plan receipt
        env:
          INSPECT_STDOUT: ${{ steps.source_inspect.outputs.stdout }}
          EXPECTED_TARGET_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_EFFECTIVE_DATE: ${{ inputs.sku_source_effective_date }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const digest=value=>createHash('sha256').update(JSON.stringify(value,function(key,v){
            return v && typeof v==='object' && !Array.isArray(v) ? Object.fromEntries(Object.keys(v).sort().map(k=>[k,v[k]])) : v;
          })).digest('hex');
          const marker='SKU_SOURCE_INSPECT_RECEIPT=';
          const rows=(process.env.INSPECT_STDOUT||'').split(/\r?\n/).filter(line=>line.startsWith(marker));
          if(rows.length!==1) throw Error('SKU_INSPECT_RECEIPT_COUNT');
          const receipt=JSON.parse(rows[0].slice(marker.length));
          if(receipt.mode!=='inspect' || receipt.target_sha!==process.env.EXPECTED_TARGET_SHA
            || receipt.effective_date!==process.env.EXPECTED_EFFECTIVE_DATE
            || !/^[a-f0-9]{64}$/.test(receipt.manifest_sha256||'')
            || !/^[a-f0-9]{64}$/.test(receipt.db_state_sha256||'')) throw Error('SKU_INSPECT_RECEIPT_BINDING');
          if(receipt.plan_ready===true) {
            if(!/^[a-f0-9]{64}$/.test(receipt.plan_sha256||'')
              || !/^[a-f0-9]{64}$/.test(receipt.legacy_identity_map_sha256||'')
              || !Array.isArray(receipt.legacy_identity_map) || receipt.legacy_identity_map.length!==35
              || digest(receipt.legacy_identity_map)!==receipt.legacy_identity_map_sha256
              || !Array.isArray(receipt.approved_parent_restorations) || receipt.approved_parent_restorations.length>5
              || receipt.approved_parent_restoration_count!==receipt.approved_parent_restorations.length
              || !/^[a-f0-9]{64}$/.test(receipt.approved_parent_restorations_sha256||'')
              || digest(receipt.approved_parent_restorations)!==receipt.approved_parent_restorations_sha256
              || Object.hasOwn(receipt,'catalog_report')) throw Error('SKU_INSPECT_PLAN_BINDING');
            const restoreKeys=['product_code','product_name','unit_zh','variety_code','status','category_code','reason'];
            if(new Set(receipt.approved_parent_restorations.map(r=>r.product_code)).size!==receipt.approved_parent_restorations.length
              || receipt.approved_parent_restorations.some(r=>!r || Object.keys(r).length!==restoreKeys.length
                || restoreKeys.some(k=>!Object.hasOwn(r,k)) || !/^PRD-EGG-[1-5]$/.test(r.product_code)
                || r.product_name!==`${r.product_code.slice(-1)}号普通鸡蛋` || r.unit_zh!=='枚' || r.variety_code!==null
                || r.status!=='ACTIVE' || r.category_code!=='EGG' || r.reason!=='MISSING_APPROVED_STANDARD_PARENT'))
              throw Error('SKU_INSPECT_RESTORATION_BINDING');
          } else if(receipt.plan_ready===false) {
            if(Object.hasOwn(receipt,'plan_sha256') || Object.hasOwn(receipt,'legacy_identity_map')
              || !/^[a-f0-9]{64}$/.test(receipt.catalog_report_sha256||'')
              || receipt.catalog_report?.plan_ready!==false
              || !Array.isArray(receipt.catalog_report.candidates) || receipt.catalog_report.candidates.length>140
              || digest(receipt.catalog_report)!==receipt.catalog_report_sha256)
              throw Error('SKU_INSPECT_REPORT_BINDING');
            const report=receipt.catalog_report;
            const reportKeys=['report_version','plan_ready','reason','candidate_count','truncated','candidates'];
            const fields=['sku_code','product_code','grade_code','spec_code','status','variety_code','parent_status',
              'parent_variety_code','org_context_required','base_unit','category_code','effective_date','expire_date',
              'parent_effective_date','parent_expire_date'];
            const coded=v=>typeof v==='string' && /^[A-Za-z0-9_.:/-]{1,128}$/.test(v);
            const date=v=>v===null || (typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !v.startsWith('0000-')
              && Number.isFinite(Date.parse(`${v}T00:00:00Z`)) && new Date(`${v}T00:00:00Z`).toISOString().slice(0,10)===v);
            if(Object.keys(report).length!==reportKeys.length || reportKeys.some(k=>!Object.hasOwn(report,k))
              || report.report_version!=='1' || !/^[A-Z][A-Z0-9_]{0,63}$/.test(report.reason)
              || !Number.isSafeInteger(report.candidate_count) || report.candidate_count<0
              || report.truncated!==(report.candidate_count>140) || report.candidates.length!==Math.min(report.candidate_count,140)
              || report.candidates.some(r=>!r || Object.keys(r).length!==fields.length || fields.some(k=>!Object.hasOwn(r,k))
                || !coded(r.sku_code) || !coded(r.product_code) || !/^GRADE_[1-5]$/.test(r.grade_code)
                || !['LOOSE','TRAY30','TRAY36','BOX360','BOX720','GIFT12','GIFT24'].includes(r.spec_code)
                || !coded(r.status) || r.status.length>32 || !(r.parent_status===null || (coded(r.parent_status) && r.parent_status.length<=32))
                || ![r.variety_code,r.parent_variety_code].every(v=>v===null || coded(v))
                || ![true,false,null].includes(r.org_context_required)
                || !(r.base_unit===null || (typeof r.base_unit==='string' && r.base_unit.length<=16 && !/[\x00-\x1f]/.test(r.base_unit)))
                || !(r.category_code===null || (coded(r.category_code) && r.category_code.length<=64))
                || !['effective_date','expire_date','parent_effective_date','parent_expire_date'].every(k=>date(r[k]))))
              throw Error('SKU_INSPECT_REPORT_FIELDS');
            console.log('SKU_SOURCE_ACTIVATION_HOLD=READONLY_CATALOG_REPORT_NOT_EXECUTABLE');
          } else throw Error('SKU_INSPECT_READINESS_REQUIRED');
          fs.writeFileSync('sku-source-inspect.json',JSON.stringify(receipt,null,2)+'\n',{mode:0o600});
          NODE
      - name: Upload read-only plan receipt
        uses: actions/upload-artifact@v4
        with:
          name: sku-source-inspect-${{ github.run_id }}
          path: sku-source-inspect.json
          if-no-files-found: error
