name: Legacy Maintenance Transition Fixtures

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: legacy-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-kernel-ingress:
    name: Owned Kernel Ingress PG${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 18]
    # Exclusive synthetic VM experiment. No production secrets/environment,
    # SSH, deployment dispatch, floor state or production network operations.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Pure bounded rules and kernel projection counterexamples
        run: node --test scripts/ci/maintenance-kernel-ingress-policy.test.mjs scripts/ci/maintenance-kernel-ingress-probes.test.mjs
      - name: Require actual isolated kernel tools and immutable image IDs
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -x /usr/sbin/nft
          test -x /usr/sbin/ip
          test -x /usr/bin/docker
          docker pull node:20-alpine
          docker pull postgres:${{ matrix.pg }}-alpine
      - name: Actual host and peer packets across pre-existing replacement fence
        env:
          NATIVE_PG_MAJOR: ${{ matrix.pg }}
        run: |
          set -uo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted || exit 64
          kernel_output="$RUNNER_TEMP/phoenix-kernel-$NATIVE_PG_MAJOR"
          kernel_export="$GITHUB_WORKSPACE/artifacts/maintenance-kernel-ingress-$NATIVE_PG_MAJOR"
          test ! -e "$kernel_output" || exit 65
          mkdir -m 0700 -p "$kernel_export"
          kernel_node="$(command -v node)"
          set +e
          sudo /usr/bin/env -i PATH="$(dirname "$kernel_node"):/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            RUNNER_ENVIRONMENT=github-hosted NATIVE_KERNEL_INGRESS=EXCLUSIVE_GITHUB_VM_ONLY \
            NATIVE_PG_MAJOR="$NATIVE_PG_MAJOR" NATIVE_KERNEL_OUTPUT="$kernel_output" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_SHA="$GITHUB_SHA" \
            "$kernel_node" "$GITHUB_WORKSPACE/scripts/ci/maintenance-kernel-ingress.fixture.mjs"
          kernel_result=$?
          set -e
          if sudo test -f "$kernel_output/result.json"; then
            sudo install -m 0600 -o "$(id -u)" -g "$(id -g)" "$kernel_output/result.json" "$kernel_export/result.json" || exit 66
          fi
          exit "$kernel_result"
      - name: Retain only scoped kernel experiment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-kernel-ingress-pg${{ matrix.pg }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/maintenance-kernel-ingress-${{ matrix.pg }}/*.json
  native-host-candidate:
    name: Native Default Candidate Collector PG${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 18]
    # No environment, production secrets, SSH, deployment approval or dispatch.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare immutable isolated bases
        run: |
          docker pull node:20-bookworm-slim
          docker pull postgres:${{ matrix.pg }}-alpine
      - name: Actual default guards, fixed paths, FD9 and candidate collector
        env:
          NATIVE_PG_MAJOR: ${{ matrix.pg }}
        run: |
          set -uo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted || exit 64
          native_root="$RUNNER_TEMP/phoenix-native-candidate-$NATIVE_PG_MAJOR"
          native_export="$GITHUB_WORKSPACE/artifacts/maintenance-native-candidate-host-$NATIVE_PG_MAJOR"
          test ! -e "$native_root" || exit 65
          sudo install -d -m 0700 "$native_root"
          mkdir -m 0700 -p "$native_export"
          native_node="$(command -v node)"
          set +e
          sudo /usr/bin/env -i PATH="$(dirname "$native_node"):/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            NATIVE_FIXTURE_HOSTED=github-hosted-exclusive-vm NATIVE_FIXTURE_MAJOR="$NATIVE_PG_MAJOR" \
            NATIVE_FIXTURE_SHA="$GITHUB_SHA" NATIVE_FIXTURE_NODE="$native_node" \
            NATIVE_FIXTURE_SOURCE="$GITHUB_WORKSPACE" NATIVE_FIXTURE_OUTPUT="$native_root" \
            /bin/bash "$GITHUB_WORKSPACE/scripts/ci/maintenance-native-candidate-host.sh"
          native_result=$?
          set -e
          # Only fixed non-secret JSON receipts are exported. The ext4 image,
          # source, runtime logs and any failed private state remain in this VM.
          for native_name in host-intent.json setup-result.json host-resources.json process-result.json result.json candidate-binding.json root-release.json guard-counterexamples.json protocol-file-manifest.json; do
            if sudo test -f "$native_root/$native_name"; then
              sudo install -m 0600 -o "$(id -u)" -g "$(id -g)" "$native_root/$native_name" "$native_export/$native_name" || exit 66
            fi
          done
          exit "$native_result"
      - name: Retain native allowlisted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-native-candidate-host-pg${{ matrix.pg }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/maintenance-native-candidate-host-${{ matrix.pg }}/*.json
  isolated-maintenance:
    name: Legacy Maintenance PG16 PG18 And Real ERP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pure protocol, authority, failure and entrypoint contracts
        run: >-
          node --test scripts/ops/production-maintenance-*.test.mjs
          scripts/ci/maintenance-erp-candidate.test.mjs
          scripts/ci/maintenance-erp-root-binding.test.mjs
          scripts/ci/maintenance-legacy-erp.test.mjs
          scripts/ci/maintenance-native-candidate-host.test.mjs
          scripts/ci/maintenance-fixture-authority.test.mjs
          scripts/ci/maintenance-isolated-authority-participant.test.mjs
          scripts/ci/maintenance-isolated-business-recorder.test.mjs
      - name: Actual registered Git and inherited FD9 in an owned isolated image
        run: |
          set -euo pipefail
          native_git_image="phoenix-maintenance-native-git:${GITHUB_SHA}"
          git archive --format=tar HEAD | docker build --label "phoenix.test.kind=maintenance-native-git" --label "org.opencontainers.image.revision=${GITHUB_SHA}" -f scripts/ci/maintenance-native-git.Dockerfile -t "$native_git_image" -
          docker run --rm --read-only --network none --pids-limit 256 --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=512m --env MAINTENANCE_NATIVE_GIT_FIXTURE=1 "$native_git_image"
      - name: Prepare isolated Docker bases
        run: |
          docker pull node:20-alpine
          docker pull node:20-bookworm-slim
          docker pull postgres:16-alpine
          docker pull postgres:16.14-alpine
          docker pull postgres:18-alpine
          docker pull alpine:3.23
          mkdir -p artifacts/maintenance-ci
      # Keep Docker lifecycle tests serial: replacement observes daemon events
      # and must reject unrelated lifecycle activity during its own interval.
      - name: Independent sealed local business recorder on owned PG16 and PG18
        env:
          MAINTENANCE_BUSINESS_PG_FIXTURE: '1'
          MAINTENANCE_BUSINESS_OUTPUT: ${{ github.workspace }}/artifacts/maintenance-ci/business-recorder
        run: node --test scripts/ci/maintenance-isolated-business-recorder.test.mjs
      - name: Actual PG16 PG18 ingress and legacy reconciliation mechanisms
        env:
          MAINTENANCE_DOCKER_FIXTURE: '1'
          MAINTENANCE_FIXTURE_MANIFEST: ${{ github.workspace }}/artifacts/maintenance-ci/runtime-resources.json
        run: node --test scripts/ops/production-maintenance-runtime.docker.test.mjs
      - name: Actual Compose replacement and revival denial
        env:
          MAINTENANCE_REPLACEMENT_DOCKER_FIXTURE: '1'
          MAINTENANCE_REPLACEMENT_MANIFEST: ${{ github.workspace }}/artifacts/maintenance-ci/replacement-resources.json
        run: node --test scripts/ops/production-maintenance-replacement.docker.test.mjs
      - name: Synthetic local declared TERM and timeout termination event observations
        env:
          MAINTENANCE_TERMINATION_DOCKER_FIXTURE: '1'
          MAINTENANCE_TERMINATION_MANIFEST: ${{ github.workspace }}/artifacts/maintenance-ci/termination-observations.json
        run: node --test scripts/ops/production-maintenance-termination-policy.docker.test.mjs
      - name: Actual fixed readonly database observations on PG16 and PG18
        env:
          MAINTENANCE_DATABASE_PG_FIXTURE: '1'
        run: node --test scripts/ops/production-maintenance-database-observer.pg.test.mjs
      - name: Actual candidate root backend and lease lock observations on PG16 and PG18
        env:
          MAINTENANCE_CANDIDATE_PG_FIXTURE: '1'
        run: node --test scripts/ops/production-maintenance-candidate-database.pg.test.mjs
      - name: Actual root control lease acquisition and partial failure cleanup on PG16 and PG18
        env:
          MAINTENANCE_ROOT_PG_FIXTURE: '1'
        run: node --test scripts/ops/production-maintenance-root-lease.pg.test.mjs
      - name: Actual original-root observer scoped close on PG16 and PG18
        env:
          MAINTENANCE_OWNED_OBSERVER_PG_FIXTURE: '1'
        run: node --test scripts/ops/production-maintenance-owned-candidate-observer.pg.test.mjs
      - name: Candidate correlation with actual PG and root transport; synthetic candidate API
        env:
          MAINTENANCE_BINDING_PG_FIXTURE: '1'
        run: node --test scripts/ops/production-maintenance-candidate-binding.pg.test.mjs
      - name: Actual owned recovery core files and local image identity
        env:
          RECOVERY_MATERIAL_LOCAL_IMAGE_FIXTURE: '1'
        run: node --test scripts/ops/production-maintenance-recovery-materials.test.mjs
      - name: Actual ERP startup, mutation canaries and original root lease catalog binding
        run: node scripts/ci/maintenance-erp-candidate.fixture.mjs
      - name: Retain allowlisted isolated evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-maintenance-fixture-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/maintenance-db-observer/*.json
            artifacts/maintenance-candidate-database/*.json
            artifacts/maintenance-root-control/*.json
            artifacts/maintenance-candidate-binding/*.json
            artifacts/maintenance-owned-candidate-observer/*.json
            artifacts/maintenance-recovery-core-materials/*.json
            artifacts/maintenance-ci/runtime-resources.json
            artifacts/maintenance-ci/business-recorder/*.json
            artifacts/maintenance-ci/termination-observations.json
            artifacts/maintenance-ci/replacement-resources.json
            artifacts/maintenance-ci/replacement-resources.json.result.json
            artifacts/maintenance-ci/replacement-resources.json.reviver.json
            artifacts/maintenance-ci/replacement-resources.json.reviver.json.result.json
            artifacts/maintenance-erp-candidate/*/summary.json
            artifacts/maintenance-erp-candidate/*/resources.json
            artifacts/maintenance-erp-candidate/*/capsule-build.json
            artifacts/maintenance-erp-candidate/*/pg*-detector-canary.json
            artifacts/maintenance-erp-candidate/*/pg*-actual-erp-root-binding.json
            artifacts/maintenance-erp-candidate/*/pg*-actual-erp-phase-correlation.json
            artifacts/maintenance-erp-candidate/*/pg*-actual-readiness-probe.json
            artifacts/maintenance-erp-candidate/*/pg*-phase-chain/*.json
