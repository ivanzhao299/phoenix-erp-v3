name: Production Schema Object Diff Audit

on:
  workflow_dispatch:
    inputs:
      confirm_readonly:
        description: Type RUN_PRODUCTION_SCHEMA_OBJECT_DIFF_AUDIT to authorize read-only production evidence collection
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-schema-object-diff-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_readonly == 'RUN_PRODUCTION_SCHEMA_OBJECT_DIFF_AUDIT'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production-readonly
    services:
      postgres16:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: phoenix_v3
          POSTGRES_PASSWORD: phoenix_v3_pass
          POSTGRES_DB: phoenix_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phoenix_v3 -d phoenix_erp"
          --health-interval 10s --health-timeout 5s --health-retries 12
      postgres18:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: phoenix_v3
          POSTGRES_PASSWORD: phoenix_v3_pass
          POSTGRES_DB: phoenix_erp
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U phoenix_v3 -d phoenix_erp"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_USER: phoenix_v3
      DB_PASSWORD: phoenix_v3_pass
      DB_NAME: phoenix_erp
      PGHOST: 127.0.0.1
      PGUSER: phoenix_v3
      PGPASSWORD: phoenix_v3_pass
      PGDATABASE: phoenix_erp
      FINGERPRINT_SQL_FILE: scripts/ci/production-schema-fingerprint.sql

    steps:
      - name: Checkout exact audit revision
        uses: actions/checkout@v5

      - name: Validate manual read-only invocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM_READONLY" = RUN_PRODUCTION_SCHEMA_OBJECT_DIFF_AUDIT
        env:
          CONFIRM_READONLY: ${{ inputs.confirm_readonly }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        working-directory: apps/api
        run: pnpm build

      - name: Prepare object diff helper
        id: helper
        shell: bash
        run: |
          set -euo pipefail
          helper_b64="$(base64 -w0 scripts/ci/schema-object-diff.mjs)"
          echo "SCHEMA_OBJECT_DIFF_HELPER_B64=$helper_b64" >> "$GITHUB_OUTPUT"
          schema_sql_b64="$(base64 -w0 "$FINGERPRINT_SQL_FILE")"
          echo "SCHEMA_SQL_B64=$schema_sql_b64" >> "$GITHUB_OUTPUT"

      - name: Construct canonical PostgreSQL 16.14 and manifest
        id: pg16
        env:
          PGPORT: 5432
          DB_PORT: 5432
          FINGERPRINT_PREFIX: PG16
        shell: bash
        run: |
          set -Eeuo pipefail
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"
          MIG_MODE=ci MIG_DIR=apps/api bash scripts/db-migrate.sh
          bash scripts/ci/run-schema-fingerprint-runtime.sh
          test "$(psql -X -At -c 'SHOW server_version;')" = 16.14
          test "$(psql -X -At -c "SELECT current_setting('server_version_num');")" = 160014
          schema_sql="$(cat "$FINGERPRINT_SQL_FILE")"
          psql -X -v ON_ERROR_STOP=1 -At -F $'\t' -c "$schema_sql" > "$RUNNER_TEMP/canonical-pg16.tsv"
          test -s "$RUNNER_TEMP/canonical-pg16.tsv"
          canonical_b64="$(gzip -c "$RUNNER_TEMP/canonical-pg16.tsv" | base64 -w0)"
          echo "CANONICAL_MANIFEST_B64=$canonical_b64" >> "$GITHUB_OUTPUT"

      - name: Construct canonical PostgreSQL 18
        id: pg18
        env:
          PGPORT: 5433
          DB_PORT: 5433
          FINGERPRINT_PREFIX: PG18
        shell: bash
        run: |
          set -Eeuo pipefail
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"
          MIG_MODE=ci MIG_DIR=apps/api bash scripts/db-migrate.sh
          bash scripts/ci/run-schema-fingerprint-runtime.sh
          test "$(psql -X -At -c 'SHOW server_version;')" = 18.6

      - name: Audit production schema over read-only SSH
        if: steps.pg16.outcome == 'success' && steps.pg18.outcome == 'success'
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          AUDIT_SHA: ${{ github.sha }}
          CANONICAL_MANIFEST_B64: ${{ steps.pg16.outputs.CANONICAL_MANIFEST_B64 }}
          SCHEMA_SQL_B64: ${{ steps.helper.outputs.SCHEMA_SQL_B64 }}
          SCHEMA_OBJECT_DIFF_HELPER_B64: ${{ steps.helper.outputs.SCHEMA_OBJECT_DIFF_HELPER_B64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH,AUDIT_SHA,CANONICAL_MANIFEST_B64,SCHEMA_SQL_B64,SCHEMA_OBJECT_DIFF_HELPER_B64
          timeout: 30s
          proxy_timeout: 30s
          command_timeout: 8m
          script: |
            set -Eeuo pipefail
            set +x
            echo "AUDIT_STAGE=SSH_CONNECTED"
            test -d "$DEPLOY_PATH" || { echo "AUDIT_FAILURE=DEPLOY_PATH_MISSING"; exit 31; }
            cd "$DEPLOY_PATH" || { echo "AUDIT_FAILURE=DEPLOY_PATH_NOT_ACCESSIBLE"; exit 32; }
            echo "AUDIT_STAGE=DEPLOY_PATH_OK"
            test "$(git rev-parse --is-inside-work-tree 2>/dev/null || true)" = true || { echo "AUDIT_FAILURE=NOT_GIT_REPOSITORY"; exit 33; }
            echo "AUDIT_STAGE=GIT_REPOSITORY_OK"
            echo "AUDIT_SHA=$AUDIT_SHA"
            echo "PRODUCTION_SHA=$(git rev-parse HEAD)"
            echo "WORKTREE_CLEAN=$([ -z "$(git status --porcelain --untracked-files=all)" ] && echo true || echo false)"
            dbq_ro() {
              local query="$1"
              docker compose exec -T -e PGOPTIONS='-c default_transaction_read_only=on' db sh -c 'psql -X -v ON_ERROR_STOP=1 -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "$1"' sh "$query"
            }
            DB_READ_ONLY="$(dbq_ro 'SHOW transaction_read_only;' | tr -d '\r\n[:space:]')"
            echo "DB_READ_ONLY=$DB_READ_ONLY"
            test "$DB_READ_ONLY" = on || { echo "AUDIT_FAILURE=DB_SESSION_NOT_READ_ONLY"; exit 40; }
            VERSION_NUM="$(dbq_ro "SELECT current_setting('server_version_num');" | tr -d '\r\n[:space:]')"
            VERSION="$(dbq_ro 'SHOW server_version;' | tr -d '\r\n')"
            echo "PRODUCTION_SERVER_VERSION=$VERSION"
            echo "PRODUCTION_SERVER_VERSION_NUM=$VERSION_NUM"
            test "$VERSION_NUM" = 160014 || { echo "AUDIT_FAILURE=PRODUCTION_VERSION_CHANGED"; exit 41; }
            tmp_dir="$(mktemp -d /tmp/phoenix-schema-object-audit.XXXXXX)"
            trap 'rm -rf "$tmp_dir"' EXIT
            printf '%s' "$CANONICAL_MANIFEST_B64" | base64 -d | gzip -d > "$tmp_dir/canonical.tsv"
            printf '%s' "$SCHEMA_OBJECT_DIFF_HELPER_B64" | base64 -d > "$tmp_dir/schema-object-diff.mjs"
            SQL="$(printf '%s' "$SCHEMA_SQL_B64" | base64 -d)"
            dbq_ro "$SQL" > "$tmp_dir/production.tsv"
            test -s "$tmp_dir/production.tsv"
            node "$tmp_dir/schema-object-diff.mjs" --production "$tmp_dir/production.tsv" --canonical "$tmp_dir/canonical.tsv" --max-diff 200
