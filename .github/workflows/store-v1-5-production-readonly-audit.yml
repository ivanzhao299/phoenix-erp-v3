name: Store V1-5 Production Readonly Audit

on:
  workflow_dispatch:
    inputs:
      approve_production:
        description: Type APPROVE-STORE-V1-5-READONLY-20260901
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: store-v1-5-production-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    if: inputs.approve_production == 'APPROVE-STORE-V1-5-READONLY-20260901'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Audit legacy Store writes and POS activity query without mutation
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            checkout_revision="$(git rev-parse HEAD)"
            api_revision="$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$(docker compose ps -q api)")"
            web_revision="$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$(docker compose ps -q web)")"
            echo "CHECKOUT_REVISION=$checkout_revision"
            echo "API_REVISION=$api_revision"
            echo "WEB_REVISION=$web_revision"

            docker compose exec -T -e PGOPTIONS='-c default_transaction_read_only=on' db \
              sh -c 'psql -X -v ON_ERROR_STOP=1 -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
            BEGIN TRANSACTION READ ONLY;
            SET LOCAL statement_timeout='30s';
            SET LOCAL lock_timeout='5s';
            SELECT current_database(),current_user,current_setting('transaction_read_only') AS read_only,
                   current_setting('server_version') AS server_version,pg_postmaster_start_time();

            SELECT 'LEGACY_TABLE_COLUMNS' AS section,table_name,column_name,data_type
              FROM information_schema.columns
             WHERE table_schema='public'
               AND table_name IN ('pos_sales','pos_sale_items','daily_close','biz_store_daily_close','store_inventory','acc_ledger','fin_transactions')
               AND column_name IN ('created_at','updated_at','submitted_at','operator','created_by','updated_by','store_code','sale_no','close_no')
             ORDER BY table_name,ordinal_position;

            SELECT 'LEGACY_TABLE_RECENT_ROWS' AS section,'pos_sales' AS table_name,count(*)::bigint AS rows_30d,
                   min(NULLIF(to_jsonb(p)->>'created_at','')::timestamptz)::text AS first_seen,
                   max(NULLIF(to_jsonb(p)->>'created_at','')::timestamptz)::text AS last_seen,
                   COALESCE(string_agg(DISTINCT NULLIF(to_jsonb(p)->>'operator',''),','),'') AS actors
              FROM pos_sales p WHERE NULLIF(to_jsonb(p)->>'created_at','')::timestamptz >= now()-interval '30 days'
            UNION ALL
            SELECT 'LEGACY_TABLE_RECENT_ROWS','pos_sale_items',count(*)::bigint,
                   min(NULLIF(to_jsonb(p)->>'created_at','')::timestamptz)::text,
                   max(NULLIF(to_jsonb(p)->>'created_at','')::timestamptz)::text,''
              FROM pos_sale_items p WHERE NULLIF(to_jsonb(p)->>'created_at','')::timestamptz >= now()-interval '30 days'
            UNION ALL
            SELECT 'LEGACY_TABLE_RECENT_ROWS','daily_close',count(*)::bigint,
                   min(NULLIF(to_jsonb(p)->>'created_at','')::timestamptz)::text,
                   max(NULLIF(to_jsonb(p)->>'created_at','')::timestamptz)::text,
                   COALESCE(string_agg(DISTINCT NULLIF(to_jsonb(p)->>'operator',''),','),'')
              FROM daily_close p WHERE NULLIF(to_jsonb(p)->>'created_at','')::timestamptz >= now()-interval '30 days'
            UNION ALL
            SELECT 'LEGACY_TABLE_RECENT_ROWS','store_inventory',count(*)::bigint,
                   min(NULLIF(to_jsonb(p)->>'created_at','')::timestamptz)::text,
                   max(NULLIF(to_jsonb(p)->>'created_at','')::timestamptz)::text,''
              FROM store_inventory p WHERE NULLIF(to_jsonb(p)->>'created_at','')::timestamptz >= now()-interval '30 days';

            SELECT 'LEGACY_DAILY_CLOSE_DETAIL' AS section,close_no,store_code,close_date,status,operator,created_at,submitted_at
              FROM daily_close
             WHERE created_at::timestamptz >= now()-interval '30 days'
             ORDER BY created_at DESC LIMIT 100;

            SELECT 'PG_STAT_STATEMENTS_STATUS' AS section,
                   EXISTS(SELECT 1 FROM pg_extension WHERE extname='pg_stat_statements') AS installed,
                   current_setting('shared_preload_libraries',true) AS shared_preload_libraries;

            SELECT 'POS_ACTIVITY_INDEXES' AS section,indexname,indexdef
              FROM pg_indexes WHERE schemaname='public' AND tablename='sal_store_sales' ORDER BY indexname;

            EXPLAIN (ANALYZE,BUFFERS,VERBOSE,FORMAT JSON)
            SELECT id::text
              FROM sal_store_sales
             WHERE store_code=ANY(ARRAY['STORE-HS-001']::text[])
             ORDER BY COALESCE(completed_at,created_at) DESC,id::text ASC
             LIMIT 21;
            ROLLBACK;
            SQL

            TOKEN_RAW="$(docker compose exec -T api node - <<'NODE'
            const { NestFactory } = require('@nestjs/core');
            const { AppModule } = require('./dist/app.module');
            const { AuthService } = require('./dist/auth/auth.service');
            (async () => {
              const app = await NestFactory.createApplicationContext(AppModule, { logger: false });
              try {
                const session = await app.get(AuthService).login('amei', '', '127.0.0.1', { bypassPassword: true });
                process.stdout.write(session.token);
              } finally { await app.close(); }
            })().catch(error => { console.error(error?.message || error); process.exit(1); });
            NODE
            )"
            TOKEN="$(printf '%s' "$TOKEN_RAW" | grep -Eo 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' | tail -1)"
            unset TOKEN_RAW
            test -n "$TOKEN"

            assert_code() {
              expected="$1"; method="$2"; path="$3"
              actual="$(curl -sS -o /tmp/store-v15-response.json -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' \
                "http://127.0.0.1:3100$path")"
              echo "LEGACY_ENDPOINT_ASSERTION path=$path expected=$expected actual=$actual body=$(tr '\n' ' ' </tmp/store-v15-response.json)"
              case "$expected" in
                410_OR_403) test "$actual" = 410 || test "$actual" = 403 ;;
                *) test "$actual" = "$expected" ;;
              esac
            }
            assert_code 410 POST /api/v3/pos/sales
            assert_code 410_OR_403 POST /api/v3/store/daily-close
            assert_code 410_OR_403 POST /api/v3/store/daily-close-v2/submit
            assert_code 410 POST /api/crud/pos_sales
            assert_code 410 POST /api/crud/pos_sale_items
            assert_code 410 POST /api/crud/daily_close
            assert_code 410 POST /api/crud/store_inventory

            STORE_ERROR_COUNT="$(docker logs --since 30m phoenix-v3-api 2>&1 \
              | grep -Ei '(ERROR|exception).*(store-pos|store-sales|store-settlement|daily-close|pos_sales)' \
              | grep -Ev 'GoneException|旧门店.*已退役' | wc -l | tr -d ' ')"
            echo "STORE_ERROR_WINDOW_30M=$STORE_ERROR_COUNT"
            test "$STORE_ERROR_COUNT" = 0

            echo '=== API LEGACY WRITE ROUTE LOG WINDOW (available retention only) ==='
            docker logs --since 720h phoenix-v3-api 2>&1 \
              | grep -E '(/api/v3/store/daily-close|/api/crud/(pos_sales|pos_sale_items|daily_close|store_inventory))' \
              | tail -n 500 || true
