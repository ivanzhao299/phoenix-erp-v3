name: Production stopped original API recovery

on:
  workflow_dispatch:
    inputs:
      original_release_owner:
        description: 'Original API release run and attempt'
        required: true
        type: string
      original_attempted_sha:
        description: 'Exact failed API release revision'
        required: true
        type: string
      committed_recovery_owner:
        description: 'Recovery run and attempt with a verified original OPEN intent'
        required: false
        type: string
      approve_held_takeover:
        description: 'Recover the exact interrupted boot under the public maintenance guard'
        required: false
        type: boolean
        default: false
      rehearse_held_takeover:
        description: 'Rehearse the exact held takeover through the last verification before state changes'
        required: false
        type: boolean
        default: false
      held_rehearsal_owner:
        description: 'Same-revision completed held takeover rehearsal required for apply'
        required: false
        type: string
      held_inspection_owner:
        description: 'Successful fenced full-facts diagnostic run and attempt'
        required: false
        type: string
      inspect_held_facts:
        description: 'Compare the 1123 fenced database to its frozen baseline'
        required: false
        type: boolean
        default: false
      approve_forward_api:
        description: 'Complete the exact verified API handoff after DDL'
        required: false
        type: boolean
        default: false
      approve_stopped_original:
        description: 'Approve recovery of the verified original API before DDL'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: production-modern-original-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Verify and recover the approved API
    if: github.ref == 'refs/heads/main' && ((((inputs.inspect_held_facts && !inputs.approve_held_takeover && !inputs.rehearse_held_takeover) || (!inputs.inspect_held_facts && inputs.approve_held_takeover != inputs.rehearse_held_takeover)) && !inputs.approve_stopped_original && !inputs.approve_forward_api) || (!inputs.inspect_held_facts && !inputs.approve_held_takeover && !inputs.rehearse_held_takeover && inputs.approve_stopped_original != inputs.approve_forward_api))
    runs-on: ubuntu-latest
    timeout-minutes: 36
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Execute owned original recovery
        env:
          ORIGINAL_RELEASE_OWNER: ${{ inputs.original_release_owner }}
          ORIGINAL_ATTEMPTED_SHA: ${{ inputs.original_attempted_sha }}
          OPERATOR_COMMITTED_OWNER: ${{ inputs.committed_recovery_owner }}
          APPROVE_STOPPED_ORIGINAL: ${{ inputs.approve_stopped_original }}
          REHEARSE_HELD_TAKEOVER: ${{ inputs.rehearse_held_takeover }}
          OPERATOR_HELD_REHEARSAL: ${{ inputs.held_rehearsal_owner }}
          APPROVE_HELD_TAKEOVER: ${{ inputs.approve_held_takeover }}
          OPERATOR_HELD_INSPECTION: ${{ inputs.held_inspection_owner }}
          INSPECT_HELD_FACTS: ${{ inputs.inspect_held_facts }}
          APPROVE_FORWARD_API: ${{ inputs.approve_forward_api }}
          MODERN_SCHEMA_WEB_READ_TOKEN: ${{ github.token }}
          MODERN_SCHEMA_SSH_USER: ${{ secrets.DEPLOY_USER }}
          MODERN_SCHEMA_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/ops/production-modern-schema-operator-workflow.mjs
