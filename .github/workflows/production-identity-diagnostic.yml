name: Production Identity Diagnostic

on:
  workflow_dispatch:
    inputs:
      confirm_readonly:
        description: 'Type RUN_PRODUCTION_IDENTITY_DIAGNOSTIC to authorize the read-only check'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-identity-diagnostic
  cancel-in-progress: false

jobs:
  production-identity-diagnostic:
    name: Production identity diagnostic
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-readonly
    env:
      EXPECTED_SHA: ${{ github.sha }}
      CONFIRM_READONLY: ${{ inputs.confirm_readonly }}

    steps:
      - name: Validate manual read-only invocation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM_READONLY" = RUN_PRODUCTION_IDENTITY_DIAGNOSTIC

      - name: Validate deployment credential presence
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PROXY_HOST: ${{ secrets.DEPLOY_PROXY_HOST }}
          DEPLOY_PROXY_USER: ${{ secrets.DEPLOY_PROXY_USER }}
          DEPLOY_PROXY_KEY: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          present() { [ -n "$1" ] && echo true || echo false; }
          echo "DEPLOY_HOST_PRESENT=$(present "$DEPLOY_HOST")"
          echo "DEPLOY_USER_PRESENT=$(present "$DEPLOY_USER")"
          echo "DEPLOY_PORT_PRESENT=$(present "$DEPLOY_PORT")"
          echo "DEPLOY_SSH_KEY_PRESENT=$(present "$DEPLOY_SSH_KEY")"
          echo "DEPLOY_PATH_PRESENT=$(present "$DEPLOY_PATH")"
          echo "DEPLOY_PROXY_HOST_PRESENT=$(present "$DEPLOY_PROXY_HOST")"
          echo "DEPLOY_PROXY_USER_PRESENT=$(present "$DEPLOY_PROXY_USER")"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_PROXY_HOST"
          test -n "$DEPLOY_PROXY_USER"
          test -n "$DEPLOY_PROXY_KEY"

      - name: Run production identity diagnostic over read-only SSH
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: EXPECTED_SHA,DEPLOY_PATH
          timeout: 30s
          proxy_timeout: 30s
          command_timeout: 2m
          capture_stdout: true
          script: |
            set -u
            set +x
            echo "DIAG_STAGE=SSH_CONNECTED"

            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "DIAG_FAILURE=DEPLOY_PATH_MISSING"
              exit 31
            fi
            if ! cd "$DEPLOY_PATH"; then
              echo "DIAG_FAILURE=DEPLOY_PATH_NOT_ACCESSIBLE"
              exit 32
            fi
            echo "DIAG_STAGE=DEPLOY_PATH_OK"

            if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              echo "DIAG_FAILURE=NOT_GIT_REPOSITORY"
              exit 33
            fi
            echo "DIAG_STAGE=GIT_REPOSITORY_OK"

            CURRENT_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
            echo "PRODUCTION_SHA=$CURRENT_SHA"
            echo "EXPECTED_SHA=$EXPECTED_SHA"
            if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
              echo "HEAD_MATCH=false"
              echo "DIAG_FAILURE=HEAD_MISMATCH"
              exit 34
            fi
            echo "HEAD_MATCH=true"
            echo "DIAG_STAGE=HEAD_OK"

            BRANCH="$(git branch --show-current 2>/dev/null || true)"
            echo "PRODUCTION_BRANCH=${BRANCH:-detached}"

            ORIGIN_URL="$(git config --get remote.origin.url 2>/dev/null || true)"
            if [ -z "$ORIGIN_URL" ]; then
              echo "ORIGIN_PRESENT=false"
              echo "ORIGIN_MATCHES_UPSTREAM=false"
              echo "DIAG_FAILURE=ORIGIN_MISMATCH"
              exit 35
            fi
            echo "ORIGIN_PRESENT=true"
            case "$ORIGIN_URL" in
              git@github.com:ivanzhao299/phoenix-erp-v3.git|\
              https://github.com/ivanzhao299/phoenix-erp-v3.git|\
              https://github.com/ivanzhao299/phoenix-erp-v3)
                echo "ORIGIN_IDENTITY=ivanzhao299/phoenix-erp-v3"
                echo "ORIGIN_MATCHES_UPSTREAM=true" ;;
              *)
                echo "ORIGIN_MATCHES_UPSTREAM=false"
                echo "DIAG_FAILURE=ORIGIN_MISMATCH"
                exit 35 ;;
            esac

            if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
              echo "WORKTREE_CLEAN=false"
              echo "DIAG_FAILURE=WORKTREE_DIRTY"
              exit 36
            fi
            echo "WORKTREE_CLEAN=true"
            echo "DIAG_STAGE=WORKTREE_OK"

            if [ ! -f scripts/ledger-preflight.mjs ]; then
              echo "LEDGER_PREFLIGHT_PRESENT=false"
              echo "DIAG_FAILURE=LEDGER_SCRIPT_MISSING"
              exit 37
            fi
            echo "LEDGER_PREFLIGHT_PRESENT=true"
            echo "DIAG_STAGE=LEDGER_SCRIPT_OK"

            if ! command -v node >/dev/null 2>&1; then
              echo "NODE_PRESENT=false"
              echo "DIAG_FAILURE=NODE_MISSING"
              exit 38
            fi
            echo "NODE_PRESENT=true"
            node --version
            echo "DIAG_STAGE=NODE_OK"
            echo "DIAG_RESULT=PASS"
