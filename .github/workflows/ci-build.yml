name: AI Delivery CI Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'w5/**']
  workflow_dispatch: {}

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Typecheck, Build, Basic Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API typecheck
        run: pnpm --filter phoenix-erp-v3-nest exec tsc --noEmit

      - name: Web typecheck
        run: pnpm --filter web run typecheck

      - name: API build
        run: pnpm --filter phoenix-erp-v3-nest build

      - name: Web build
        run: pnpm --filter web build

      # P4(评分补强)：原 arity 不匹配已不复现，本地 5 suites / 52 cases 全过。
      #   把"deferred echo"换成真跑 jest，作为硬门禁恢复单测保护。
      - name: API unit tests (jest)
        run: pnpm --filter phoenix-erp-v3-nest test -- --runInBand
