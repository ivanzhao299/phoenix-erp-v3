name: AI Delivery CI Smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Smoke target: documented-only, production, product-pages, browser-visual-production, alert-human-production, authenticated-production, role-business-production, store-pos-amei-readonly, chanjet-readonly-production, chanjet-readonly-adapter-production, chanjet-house-alignment-readonly'
        required: false
        default: documented-only
  pull_request:
    branches: [main]

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    name: Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Validate runtime smoke checker
        run: |
          node --check scripts/ops/runtime-smoke-check.mjs
          node --check scripts/ops/product-page-smoke.mjs
          node --check scripts/ops/browser-visual-smoke.mjs
          node --check scripts/ops/alert-human-reachability-smoke.mjs
          node --check scripts/ops/authenticated-business-smoke.mjs
          node --check scripts/ops/role-business-smoke.mjs
          node --check scripts/ops/chanjet-readonly-mirror-sync.mjs
          node --check scripts/ops/chanjet-readonly-field-adapter-audit.mjs
          node --check scripts/ops/chanjet-p0-production-readonly-gate-audit.mjs
          node --check scripts/ops/mint-production-admin-token-over-ssh.mjs

      - name: Document smoke entrypoints
        run: |
          echo "Pull requests validate the smoke checker without touching production."
          echo "Existing command: bash scripts/smoke-test.sh"
          echo "Runtime smoke command: node scripts/ops/runtime-smoke-check.mjs --base-url=https://erp.eggslao.com --api-url=https://erp.eggslao.com --strict"
          echo "Product page smoke command: node scripts/ops/product-page-smoke.mjs --base-url=https://erp.eggslao.com --strict"
          echo "Browser visual smoke command: node scripts/ops/browser-visual-smoke.mjs --base-url=https://erp.eggslao.com --strict"
          echo "Alert human reachability command: PHOENIX_SMOKE_TOKEN=... node scripts/ops/alert-human-reachability-smoke.mjs --base-url=https://erp.eggslao.com --strict"
          echo "Authenticated smoke command: SMOKE_USER=... SMOKE_PASS=... node scripts/ops/authenticated-business-smoke.mjs --base-url=https://erp.eggslao.com --api-url=https://erp.eggslao.com --strict"
          echo "Role business smoke command: ROLE_SMOKE_CREDENTIALS_JSON=... node scripts/ops/role-business-smoke.mjs --base-url=https://erp.eggslao.com --api-url=https://erp.eggslao.com --strict"
          echo "Chanjet readonly sync command: workflow target chanjet-readonly-production mints a short-lived token inside the production API container and runs the protected readonly sync API."
          echo "Chanjet readonly adapter audit command: workflow target chanjet-readonly-adapter-production mints a short-lived token inside the production API container and audits readonly field adapters."
          echo "API package command: pnpm --filter phoenix-erp-v3-nest test:smoke"

      - name: Validate legacy smoke script exists
        run: test -f scripts/smoke-test.sh

      - name: Run production runtime smoke
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
        run: |
          node scripts/ops/runtime-smoke-check.mjs \
            --base-url=https://erp.eggslao.com \
            --api-url=https://erp.eggslao.com \
            --output-dir=docs/ops/runs \
            --strict

      - name: Run production product page smoke
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'product-pages'
        run: |
          node scripts/ops/product-page-smoke.mjs \
            --base-url=https://erp.eggslao.com \
            --output-dir=docs/ops/runs \
            --strict

      - name: Run production browser visual smoke
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'browser-visual-production'
        run: |
          node scripts/ops/browser-visual-smoke.mjs \
            --base-url=https://erp.eggslao.com \
            --output-dir=docs/ops/runs \
            --screenshots-dir=output/playwright/product-pages \
            --strict

      - name: Run production alert human reachability smoke
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'alert-human-production'
        env:
          PHOENIX_SMOKE_TOKEN: ${{ secrets.PHOENIX_SMOKE_TOKEN }}
        run: |
          node scripts/ops/alert-human-reachability-smoke.mjs \
            --base-url=https://erp.eggslao.com \
            --output-dir=docs/ops/runs \
            --strict

      - name: Run authenticated production smoke
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'authenticated-production'
        env:
          SMOKE_USER: ${{ secrets.PHOENIX_SMOKE_USER }}
          SMOKE_PASS: ${{ secrets.PHOENIX_SMOKE_PASS }}
        run: |
          node scripts/ops/authenticated-business-smoke.mjs \
            --base-url=https://erp.eggslao.com \
            --api-url=https://erp.eggslao.com \
            --output-dir=docs/ops/runs \
            --strict

      - name: Run role business production smoke
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'role-business-production'
        env:
          ROLE_SMOKE_CREDENTIALS_JSON: ${{ secrets.PHOENIX_ROLE_SMOKE_CREDENTIALS_JSON }}
        run: |
          node scripts/ops/role-business-smoke.mjs \
            --base-url=https://erp.eggslao.com \
            --api-url=https://erp.eggslao.com \
            --output-dir=docs/ops/runs \
            --strict

      - name: Run amei Store POS readonly acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'store-pos-amei-readonly'
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            CHECKOUT_REVISION="$(git rev-parse HEAD)"
            EXPECTED_REVISION="$CHECKOUT_REVISION"
            API_REVISION="$(docker inspect "$(docker compose ps -q api)" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            WEB_REVISION="$(docker inspect "$(docker compose ps -q web)" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            test "$CHECKOUT_REVISION" = "$EXPECTED_REVISION"
            test "$API_REVISION" = "$EXPECTED_REVISION"
            test "$WEB_REVISION" = "$EXPECTED_REVISION"
            echo "REVISION_ASSERTIONS=PASS checkout=$CHECKOUT_REVISION api=$API_REVISION web=$WEB_REVISION"

            TOKEN_RAW="$(docker compose exec -T api node - <<'NODE'
            const { NestFactory } = require('@nestjs/core');
            const { AppModule } = require('./dist/app.module');
            const { AuthService } = require('./dist/auth/auth.service');
            (async () => {
              const app = await NestFactory.createApplicationContext(AppModule, { logger: false });
              try {
                const session = await app.get(AuthService).login('amei', '', '127.0.0.1', { bypassPassword: true });
                process.stdout.write(session.token);
              } finally {
                await app.close();
              }
            })().catch(error => { console.error(error?.message || error); process.exit(1); });
            NODE
            )"
            TOKEN="$(printf '%s' "$TOKEN_RAW" | grep -Eo 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' | tail -1)"
            unset TOKEN_RAW
            test -n "$TOKEN"

            PAGE_META="$(curl -sSL --cookie "phoenix_access_token=$TOKEN" -o /tmp/store-replenish-page.html -w '%{http_code} %{url_effective}' 'https://erp.eggslao.com/store/replenish')"
            PAGE_HTML="$(cat /tmp/store-replenish-page.html)"
            PAGE_TITLE=false; PAGE_SHELL=false
            grep -Fq '门店补货编排' <<<"$PAGE_HTML" && PAGE_TITLE=true
            grep -Fq 'padding:24px' <<<"$PAGE_HTML" && PAGE_SHELL=true
            echo "REPLENISH_PAGE_DIAGNOSTIC status_url=$PAGE_META title=$PAGE_TITLE page_shell=$PAGE_SHELL bytes=${#PAGE_HTML}"
            test "$PAGE_META" = '200 https://erp.eggslao.com/store/replenish'
            test "${#PAGE_HTML}" -gt 1000
            echo "REPLENISH_AUTHENTICATED_HTML_ASSERTION=PASS status=200 client_shell_bytes=${#PAGE_HTML}"

            for COPY in '门店补货编排' 'Store replenishment orchestration' 'ການຈັດການເຕີມສິນຄ້າຮ້ານ'; do
              docker compose exec -T -e EXPECTED_COPY="$COPY" web sh -c \
                'grep -R -Fq "$EXPECTED_COPY" /app/apps/web/.next/server /app/apps/web/.next/static'
            done
            echo "REPLENISH_I18N_BUNDLE_ASSERTION=PASS locales=zh,en,lo"

            docker compose exec -T api node - <<'NODE'
            const { NestFactory } = require('@nestjs/core');
            const { AppModule } = require('./dist/app.module');
            const { AuthService } = require('./dist/auth/auth.service');
            const { DataScopeService } = require('./dist/modules/org/services/data-scope.service');
            (async () => {
              const app = await NestFactory.createApplicationContext(AppModule, { logger: false });
              try {
                for (const [username, expected] of [['amei', 'ST_LAO_XINGCHI_HS_001_SALES'], ['cashier', 'ST_LAO_AGRI_VTE_001_SALES']]) {
                  const session = await app.get(AuthService).login(username, '', '127.0.0.1', { bypassPassword: true });
                  const payload = JSON.parse(Buffer.from(session.token.split('.')[1], 'base64url').toString('utf8'));
                  const scope = await app.get(DataScopeService).resolve(String(payload.userId), payload.roles || [], 'MENU_STORE_POS', payload.permsVersion);
                  const codes = [...scope.allowedWarehouseCodes].sort();
                  if (!codes.includes(expected)) throw new Error(`${username} WarehouseScope missing ${expected}: ${codes.join(',')}`);
                  console.log(`WAREHOUSE_SCOPE_ASSERTION=PASS username=${username} count=${codes.length} codes=${codes.join(',')}`);
                }
              } finally {
                await app.close();
              }
            })().catch(error => { console.error(error?.message || error); process.exit(1); });
            NODE

            CONTEXTS_JSON="$(curl -fsS -H "Authorization: Bearer $TOKEN" https://erp.eggslao.com/api/v2/store-sales/contexts)"
            CONTEXTS_JSON="$CONTEXTS_JSON" node - <<'NODE'
            const body = JSON.parse(process.env.CONTEXTS_JSON || 'null');
            const rows = Array.isArray(body) ? body : body?.data;
            if (!Array.isArray(rows) || rows.length !== 1) throw new Error(`contexts length=${rows?.length}`);
            const row = rows[0];
            if (row.storeCode !== 'STORE-HS-001') throw new Error(`storeCode=${row.storeCode}`);
            if (row.role !== 'STORE_MANAGER') throw new Error(`role=${row.role}`);
            if (JSON.stringify(row.roles) !== JSON.stringify(['CASHIER', 'STORE_MANAGER'])) throw new Error(`roles=${JSON.stringify(row.roles)}`);
            if (row.hasSalesWarehouse !== true) throw new Error(`hasSalesWarehouse=${row.hasSalesWarehouse}`);
            if (row.hasWarehouseScopeIntersection !== true) throw new Error(`hasWarehouseScopeIntersection=${row.hasWarehouseScopeIntersection}`);
            console.log(`CONTEXT_ASSERTIONS=PASS count=${rows.length} store=${row.storeCode} role=${row.role} roles=${row.roles.join(',')} salesWarehouse=true warehouseScopeIntersection=true`);
            NODE

            INVENTORY_PAGE_META="$(curl -sSL --cookie "phoenix_access_token=$TOKEN" -o /tmp/store-inventory-page.html -w '%{http_code} %{url_effective}' 'https://erp.eggslao.com/store/inventory')"
            test "$INVENTORY_PAGE_META" = '200 https://erp.eggslao.com/store/inventory'
            test "$(wc -c </tmp/store-inventory-page.html | tr -d ' ')" -gt 1000
            echo "STORE_INVENTORY_PAGE_SMOKE=PASS status=200"

            INVENTORY_ALL_JSON="$(curl -fsS -H "Authorization: Bearer $TOKEN" 'https://erp.eggslao.com/api/v2/store-sales/inventory?storeCode=STORE-HS-001&limit=200')"
            INVENTORY_AVAILABLE_JSON="$(curl -fsS -H "Authorization: Bearer $TOKEN" 'https://erp.eggslao.com/api/v2/store-sales/inventory?storeCode=STORE-HS-001&status=AVAILABLE&limit=200')"
            INVENTORY_QUARANTINE_JSON="$(curl -fsS -H "Authorization: Bearer $TOKEN" 'https://erp.eggslao.com/api/v2/store-sales/inventory?storeCode=STORE-HS-001&status=QUARANTINE&limit=200')"
            INVENTORY_ALL_JSON="$INVENTORY_ALL_JSON" INVENTORY_AVAILABLE_JSON="$INVENTORY_AVAILABLE_JSON" INVENTORY_QUARANTINE_JSON="$INVENTORY_QUARANTINE_JSON" node - <<'NODE'
            const unwrap = raw => {
              const body = JSON.parse(raw || 'null');
              return body?.data && !body?.rows ? body.data : body;
            };
            const all = unwrap(process.env.INVENTORY_ALL_JSON);
            const available = unwrap(process.env.INVENTORY_AVAILABLE_JSON);
            const quarantine = unwrap(process.env.INVENTORY_QUARANTINE_JSON);
            for (const [name, body] of Object.entries({ all, available, quarantine })) {
              if (!Array.isArray(body?.rows) || !body?.summary || !body?.pagination) throw new Error(`${name} response contract invalid`);
              if (body.store?.code !== 'STORE-HS-001') throw new Error(`${name} store=${body.store?.code}`);
            }
            if (all.rows.some(row => Number(row.qty) <= 0)) throw new Error('ALL returned non-positive inventory');
            if (available.rows.some(row => row.status !== 'AVAILABLE')) throw new Error('AVAILABLE tab leaked non-AVAILABLE inventory');
            if (quarantine.rows.some(row => row.status !== 'QUARANTINE')) throw new Error('QUARANTINE tab leaked non-QUARANTINE inventory');
            if (JSON.stringify(all.summary) !== JSON.stringify(available.summary) || JSON.stringify(all.summary) !== JSON.stringify(quarantine.summary)) {
              throw new Error('three-tab summary semantics diverged');
            }
            const quarantineLegacyAvailable = quarantine.rows.filter(row => Number(row.qty_available) !== 0).length;
            console.log(`STORE_INVENTORY_THREE_TAB_ASSERTIONS=PASS all=${all.pagination.total} available=${available.pagination.total} quarantine=${quarantine.pagination.total} onHand=${all.summary.onHand} sellable=${all.summary.available} quarantine_legacy_qty_available_rows=${quarantineLegacyAvailable} sellable_filter=status_AVAILABLE`);
            NODE

            RET_ROW="$(docker compose exec -T db sh -c 'PGOPTIONS="-c default_transaction_read_only=on" psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -AtF "|" -c "SELECT b.batch_no,b.warehouse_code,b.status,b.source_no,b.qty,il.change_type FROM inv_batches b JOIN store_warehouse_bindings swb ON swb.warehouse_code=b.warehouse_code JOIN store_master s ON s.id=swb.store_id LEFT JOIN LATERAL (SELECT l.change_type FROM inv_ledger l WHERE l.batch_no=b.batch_no AND l.warehouse_code=b.warehouse_code ORDER BY l.created_at DESC,l.id DESC LIMIT 1) il ON TRUE WHERE s.store_code='\''STORE-HS-001'\'' AND swb.purpose='\''RETURNS'\'' AND swb.status='\''ACTIVE'\'' AND b.batch_no LIKE '\''RET-%'\'' AND b.source_type='\''STORE_RETURN'\'' AND b.status='\''QUARANTINE'\'' AND COALESCE(b.qty,0)>0 AND il.change_type='\''SALE_RETURN'\'' ORDER BY b.created_at DESC,b.batch_no DESC LIMIT 1;"' | tr -d '\r\n')"
            test -n "$RET_ROW"
            IFS='|' read -r RET_BATCH RET_WAREHOUSE RET_STATUS RET_SALE RET_QTY RET_LEDGER_TYPE <<<"$RET_ROW"
            RET_API_JSON="$(curl -fsS -G -H "Authorization: Bearer $TOKEN" --data-urlencode 'storeCode=STORE-HS-001' --data-urlencode "sku=$RET_BATCH" --data-urlencode 'limit=10' 'https://erp.eggslao.com/api/v2/store-sales/inventory')"
            RET_AVAILABLE_API_JSON="$(curl -fsS -G -H "Authorization: Bearer $TOKEN" --data-urlencode 'storeCode=STORE-HS-001' --data-urlencode 'status=AVAILABLE' --data-urlencode "sku=$RET_BATCH" --data-urlencode 'limit=10' 'https://erp.eggslao.com/api/v2/store-sales/inventory')"
            RET_API_JSON="$RET_API_JSON" RET_AVAILABLE_API_JSON="$RET_AVAILABLE_API_JSON" RET_BATCH="$RET_BATCH" RET_WAREHOUSE="$RET_WAREHOUSE" RET_SALE="$RET_SALE" node - <<'NODE'
            const raw = JSON.parse(process.env.RET_API_JSON || 'null');
            const body = raw?.data && !raw?.rows ? raw.data : raw;
            const row = body?.rows?.find(item => item.batch_no === process.env.RET_BATCH && item.warehouse_code === process.env.RET_WAREHOUSE);
            if (!row) throw new Error(`RET batch not visible through inventory API: ${process.env.RET_BATCH}`);
            if (row.status !== 'QUARANTINE') throw new Error(`RET status semantics relaxed: status=${row.status}`);
            if (row.source_no !== process.env.RET_SALE || row.ledger_change_type !== 'SALE_RETURN') throw new Error(`RET provenance mismatch: source=${row.source_no} ledger=${row.ledger_change_type}`);
            const availableRaw = JSON.parse(process.env.RET_AVAILABLE_API_JSON || 'null');
            const available = availableRaw?.data && !availableRaw?.rows ? availableRaw.data : availableRaw;
            if (available?.rows?.some(item => item.batch_no === process.env.RET_BATCH)) throw new Error(`QUARANTINE RET batch leaked into AVAILABLE tab: ${process.env.RET_BATCH}`);
            console.log(`STORE_INVENTORY_D0_RET_VISIBILITY=PASS batch=${row.batch_no} sale=${row.source_no} warehouse=${row.warehouse_code} status=${row.status} ledger=${row.ledger_change_type} qty_available_diagnostic=${row.qty_available} available_tab_visible=false`);
            NODE
            echo "STORE_INVENTORY_SQL_EQUIVALENT=PASS batch=$RET_BATCH sale=$RET_SALE warehouse=$RET_WAREHOUSE status=$RET_STATUS qty=$RET_QTY ledger=$RET_LEDGER_TYPE readonly=true"

            REPLENISH_STATUS="$(curl -sS -o /tmp/store-pos-amei-replenishments.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" 'https://erp.eggslao.com/api/v2/store-replenishments')"
            test "$REPLENISH_STATUS" = "200"
            echo "REPLENISH_GET_ASSERTION=PASS status=$REPLENISH_STATUS"

            SOURCE_WAREHOUSE_STATUS="$(curl -sS -o /tmp/store-pos-amei-source-warehouses.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" 'https://erp.eggslao.com/api/v2/store-replenishments/source-warehouses?storeCode=STORE-HS-001')"
            test "$SOURCE_WAREHOUSE_STATUS" = "200"
            echo "REPLENISH_SOURCE_WAREHOUSE_ASSERTION=PASS status=$SOURCE_WAREHOUSE_STATUS target_scope_intersection=true"

            WMS_TOKEN_RAW="$(docker compose exec -T api node - <<'NODE'
            const { NestFactory } = require('@nestjs/core');
            const { AppModule } = require('./dist/app.module');
            const { AuthService } = require('./dist/auth/auth.service');
            (async () => {
              const app = await NestFactory.createApplicationContext(AppModule, { logger: false });
              try {
                const session = await app.get(AuthService).login('liushanjun', '', '127.0.0.1', { bypassPassword: true });
                process.stdout.write(session.token);
              } finally { await app.close(); }
            })().catch(error => { console.error(error?.message || error); process.exit(1); });
            NODE
            )"
            WMS_TOKEN="$(printf '%s' "$WMS_TOKEN_RAW" | grep -Eo 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' | tail -1)"
            unset WMS_TOKEN_RAW
            test -n "$WMS_TOKEN"
            WMS_SOURCE_STATUS="$(curl -sS -o /tmp/store-pos-wms-source-warehouses.json -w '%{http_code}' -H "Authorization: Bearer $WMS_TOKEN" 'https://erp.eggslao.com/api/v2/store-replenishments/source-warehouses?storeCode=STORE-HS-001')"
            test "$WMS_SOURCE_STATUS" = "200"
            WMS_SOURCE_JSON="$(cat /tmp/store-pos-wms-source-warehouses.json)" docker compose exec -T -e WMS_SOURCE_JSON api node - <<'NODE'
            const body = JSON.parse(process.env.WMS_SOURCE_JSON || 'null');
            const rows = Array.isArray(body) ? body : body?.data;
            if (!Array.isArray(rows) || rows.length !== 4) throw new Error(`liushanjun source warehouses length=${rows?.length}`);
            if (rows.some(row => row.warehouseCode === 'ST_LAO_XINGCHI_HS_001_SALES')) throw new Error('target store SALES warehouse leaked into source options');
            console.log(`REPLENISH_WMS_APPROVER_SOURCE_ASSERTION=PASS username=liushanjun membership=none count=${rows.length} codes=${rows.map(row => row.warehouseCode).join(',')}`);
            NODE
            WMS_MEMBERSHIP_COUNT="$(docker compose exec -T db sh -c 'PGOPTIONS="-c default_transaction_read_only=on" psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM store_memberships m JOIN sys_user u ON u.user_id=m.user_id JOIN store_master s ON s.id=m.store_id WHERE u.username='\''liushanjun'\'' AND s.store_code='\''STORE-HS-001'\'' AND m.status='\''ACTIVE'\'' AND (m.effective_from IS NULL OR m.effective_from<=NOW()) AND (m.effective_to IS NULL OR m.effective_to>=NOW());"' | tr -d '\r\n')"
            test "$WMS_MEMBERSHIP_COUNT" = "0"

            TOKEN="$TOKEN" node - <<'NODE'
            const payload = JSON.parse(Buffer.from(process.env.TOKEN.split('.')[1], 'base64url').toString('utf8'));
            const permissions = Array.isArray(payload.permissions) ? payload.permissions : [];
            const entry = permissions.find(value => value.startsWith('MENU_STORE_REPLENISH:'));
            const granted = new Set(entry?.split(':')[1]?.split(',').map(value => value.trim()) || []);
            if (!(permissions.includes('*') || granted.has('C'))) throw new Error(`MENU_STORE_REPLENISH check('C')=false entry=${entry || 'NONE'}`);
            console.log(`REPLENISH_CREATE_UI_PERMISSION=PASS check_C=true entry=${entry}`);
            NODE

            SHIFT_STATUS="$(curl -sS -o /tmp/store-pos-amei-shift.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" 'https://erp.eggslao.com/api/v2/store-sales/shift?storeCode=STORE-HS-001')"
            test "$SHIFT_STATUS" = "200"
            echo "SHIFT_GET_ASSERTION=PASS status=$SHIFT_STATUS"

            ZERO_USER="$(docker compose exec -T db sh -c 'PGOPTIONS="-c default_transaction_read_only=on" psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atf -' <<'SQL' | tr -d '\r\n'
            SELECT u.username
            FROM sys_user u
            JOIN sys_user_role ur ON ur.user_id=u.user_id AND COALESCE(ur.is_visible,true)=true
            JOIN sys_role cashier ON cashier.role_id=ur.role_id AND cashier.role_code='ROLE_CASHIER'
            WHERE u.status=1 AND u.username <> 'amei'
              AND NOT EXISTS (
                SELECT 1 FROM sys_user_role ur2
                JOIN sys_role_menu_permission rmp ON rmp.role_id=ur2.role_id
                JOIN sys_menu m ON m.menu_id=rmp.menu_id
                WHERE ur2.user_id=u.user_id AND COALESCE(ur2.is_visible,true)=true
                  AND m.menu_code='MENU_STORE_REPLENISH' AND 'V'=ANY(string_to_array(rmp.perm_codes,','))
              )
              AND NOT EXISTS (
                SELECT 1 FROM sys_user_role ur3
                JOIN sys_role_permission_set rps ON rps.role_id=ur3.role_id
                JOIN sys_permission_set_item psi ON psi.set_id=rps.set_id
                JOIN sys_menu m ON m.menu_id=psi.menu_id
                WHERE ur3.user_id=u.user_id AND COALESCE(ur3.is_visible,true)=true
                  AND m.menu_code='MENU_STORE_REPLENISH' AND 'V'=ANY(string_to_array(psi.perm_codes,','))
              )
              AND NOT EXISTS (
                SELECT 1 FROM sys_user_permission_set ups
                JOIN sys_permission_set_item psi ON psi.set_id=ups.set_id
                JOIN sys_menu m ON m.menu_id=psi.menu_id
                WHERE ups.user_id=u.user_id AND m.menu_code='MENU_STORE_REPLENISH'
                  AND 'V'=ANY(string_to_array(psi.perm_codes,','))
              )
            ORDER BY u.username LIMIT 1;
            SQL
            )"
            test -n "$ZERO_USER"
            ZERO_TOKEN_RAW="$(docker compose exec -T -e PHOENIX_PROBE_USERNAME="$ZERO_USER" api node - <<'NODE'
            const { NestFactory } = require('@nestjs/core');
            const { AppModule } = require('./dist/app.module');
            const { AuthService } = require('./dist/auth/auth.service');
            (async () => {
              const app = await NestFactory.createApplicationContext(AppModule, { logger: false });
              try {
                const session = await app.get(AuthService).login(process.env.PHOENIX_PROBE_USERNAME, '', '127.0.0.1', { bypassPassword: true });
                process.stdout.write(session.token);
              } finally { await app.close(); }
            })().catch(error => { console.error(error?.message || error); process.exit(1); });
            NODE
            )"
            ZERO_TOKEN="$(printf '%s' "$ZERO_TOKEN_RAW" | grep -Eo 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' | tail -1)"
            unset ZERO_TOKEN_RAW
            test -n "$ZERO_TOKEN"
            ZERO_STATUS="$(curl -sS -o /tmp/store-pos-zero-replenishments.json -w '%{http_code}' -H "Authorization: Bearer $ZERO_TOKEN" 'https://erp.eggslao.com/api/v2/store-replenishments')"
            test "$ZERO_STATUS" = "403"
            ZERO_SOURCE_STATUS="$(curl -sS -o /tmp/store-pos-zero-source-warehouses.json -w '%{http_code}' -H "Authorization: Bearer $ZERO_TOKEN" 'https://erp.eggslao.com/api/v2/store-replenishments/source-warehouses?storeCode=STORE-HS-001')"
            test "$ZERO_SOURCE_STATUS" = "403"
            echo "REPLENISH_ZERO_PERMISSION_ASSERTION=PASS username=$ZERO_USER list_status=$ZERO_STATUS source_status=$ZERO_SOURCE_STATUS"

            docker compose exec -T -e PGOPTIONS='-c default_transaction_read_only=on' db \
              sh -c 'psql -X -v ON_ERROR_STOP=1 -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
            BEGIN TRANSACTION READ ONLY;
            SELECT current_setting('transaction_read_only') AS readonly_guard;
            WITH expected(role_code,expected_perm) AS (VALUES
              ('ROLE_STORE_MGR','V,C,E'),('ROLE_WMS_OP','V,A,E'),
              ('ROLE_WMS_MGR','V,A,E'),('ROLE_CASHIER',NULL::text)
            )
            SELECT e.role_code,e.expected_perm,r.status AS role_status,p.perm_codes AS actual_perm,
                   COALESCE(p.deny_codes,'') AS deny_codes,
                   CASE WHEN e.expected_perm IS NULL THEN p.role_id IS NULL
                        ELSE string_to_array(p.perm_codes,',') @> string_to_array(e.expected_perm,',')
                          AND string_to_array(e.expected_perm,',') @> string_to_array(p.perm_codes,',')
                          AND COALESCE(p.deny_codes,'')='' END AS assertion_pass
            FROM expected e LEFT JOIN sys_role r ON r.role_code=e.role_code
            LEFT JOIN (sys_role_menu_permission p JOIN sys_menu m ON m.menu_id=p.menu_id AND m.menu_code='MENU_STORE_REPLENISH') ON p.role_id=r.role_id
            ORDER BY e.role_code;
            DO $$ BEGIN
              IF EXISTS (
                WITH expected(role_code,expected_perm) AS (VALUES
                  ('ROLE_STORE_MGR','V,C,E'),('ROLE_WMS_OP','V,A,E'),
                  ('ROLE_WMS_MGR','V,A,E'),('ROLE_CASHIER',NULL::text)
                )
                SELECT 1 FROM expected e LEFT JOIN sys_role r ON r.role_code=e.role_code
                LEFT JOIN (sys_role_menu_permission p JOIN sys_menu m ON m.menu_id=p.menu_id AND m.menu_code='MENU_STORE_REPLENISH') ON p.role_id=r.role_id
                WHERE r.role_id IS NULL OR (e.expected_perm IS NULL AND p.role_id IS NOT NULL)
                   OR (e.expected_perm IS NOT NULL AND (p.role_id IS NULL OR COALESCE(p.deny_codes,'')<>''
                     OR NOT (string_to_array(p.perm_codes,',') @> string_to_array(e.expected_perm,',')
                       AND string_to_array(e.expected_perm,',') @> string_to_array(p.perm_codes,','))))
              ) THEN RAISE EXCEPTION 'ROLE_SEED_FINAL_ASSERTIONS_FAILED'; END IF;
            END $$;
            SELECT 'ROLE_SEED_FINAL_ASSERTIONS=PASS' AS result;
            SELECT wanted.role_code,r.status AS role_status,u.user_id,u.username,u.real_name,
                   u.status AS user_status,COALESCE(ur.is_visible,true) AS is_visible,u.perms_version
            FROM (VALUES ('ROLE_WMS_OP'),('ROLE_WMS_MGR')) wanted(role_code)
            LEFT JOIN sys_role r ON r.role_code=wanted.role_code
            LEFT JOIN sys_user_role ur ON ur.role_id=r.role_id
            LEFT JOIN sys_user u ON u.user_id=ur.user_id
            ORDER BY wanted.role_code,u.username;
            WITH wms_users AS (
              SELECT DISTINCT u.user_id,u.username FROM sys_user u
              JOIN sys_user_role ur ON ur.user_id=u.user_id AND COALESCE(ur.is_visible,true)=true
              JOIN sys_role r ON r.role_id=ur.role_id
              WHERE r.role_code IN ('ROLE_WMS_OP','ROLE_WMS_MGR') AND u.status=1
            ), target_warehouses AS (
              SELECT warehouse_code,company_code,site_code FROM wms_warehouses
              WHERE status='ACTIVE' AND domain='OPERATIONAL'
                AND (warehouse_code LIKE 'LPH_MS_%' OR warehouse_code LIKE 'LPH_DP_%')
            ), org_scope AS (
              SELECT wu.user_id,tw.warehouse_code,
                     bool_or(o.org_type='SITE') FILTER (WHERE o.id IS NOT NULL) AS has_site,
                     bool_or(o.org_type='SITE' AND o.site_code=tw.site_code) AS site_match,
                     bool_or(o.company_code=tw.company_code AND o.org_type<>'SITE') AS company_match,
                     bool_or(o.warehouse_code=tw.warehouse_code) AS org_warehouse_match
              FROM wms_users wu CROSS JOIN target_warehouses tw
              LEFT JOIN sys_user_orgs uo ON uo.user_id=wu.user_id
              LEFT JOIN sys_organizations o ON o.id=uo.org_id
              GROUP BY wu.user_id,tw.warehouse_code
            )
            SELECT wu.username,tw.warehouse_code,tw.site_code,
                   EXISTS (SELECT 1 FROM sys_user_warehouse_scopes s WHERE s.user_id=wu.user_id AND s.warehouse_code=tw.warehouse_code) AS explicit_scope,
                   CASE WHEN COALESCE(os.has_site,false)
                     THEN COALESCE(os.site_match,false) AND EXISTS (SELECT 1 FROM sys_user_warehouse_scopes s WHERE s.user_id=wu.user_id AND s.warehouse_code=tw.warehouse_code)
                     ELSE COALESCE(os.company_match,false) OR COALESCE(os.org_warehouse_match,false)
                       OR EXISTS (SELECT 1 FROM sys_user_warehouse_scopes s WHERE s.user_id=wu.user_id AND s.warehouse_code=tw.warehouse_code)
                   END AS allowed_warehouse_code
            FROM wms_users wu CROSS JOIN target_warehouses tw
            JOIN org_scope os ON os.user_id=wu.user_id AND os.warehouse_code=tw.warehouse_code
            ORDER BY wu.username,tw.warehouse_code;
            SELECT DISTINCT r.role_code,u.user_id,u.username,u.status,u.perms_version,
                   EXISTS (SELECT 1 FROM pg_trigger t WHERE NOT t.tgisinternal
                     AND t.tgrelid='sys_role_menu_permission'::regclass
                     AND pg_get_triggerdef(t.oid) ILIKE '%fn_bump_user_perms_version%') AS permission_bump_trigger_present
            FROM sys_role r LEFT JOIN sys_user_role ur ON ur.role_id=r.role_id AND COALESCE(ur.is_visible,true)=true
            LEFT JOIN sys_user u ON u.user_id=ur.user_id
            WHERE r.role_code IN ('ROLE_STORE_MGR','ROLE_WMS_OP','ROLE_WMS_MGR')
            ORDER BY r.role_code,u.username;
            COMMIT;
            SQL
            echo "RBAC_WMS_PERMS_VERSION_READONLY_ASSERTIONS=PASS"

            ERROR_COUNT="$(docker compose exec -T db sh -c 'PGOPTIONS="-c default_transaction_read_only=on" psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM sys_error_logs WHERE created_at >= NOW() - INTERVAL '\''30 minutes'\'' AND (request_path ILIKE '\''%store-sales%'\'' OR error_message ILIKE '\''%store_membership%'\'');"' | tr -d '\r\n')"
            test "$ERROR_COUNT" = "0"
            echo "STORE_POS_ERROR_WINDOW=PASS count=$ERROR_COUNT window=30m"
            echo "PRODUCTION_BUSINESS_WRITES=0"

      - name: Run Chanjet readonly production sync
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'chanjet-readonly-production'
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          REMOTE_OUTPUT_DIR: /tmp/phoenix-chanjet-readonly-${{ github.run_id }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH,REMOTE_OUTPUT_DIR
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            git pull --ff-only origin main
            if [[ ! "$REMOTE_OUTPUT_DIR" =~ ^/tmp/phoenix-chanjet-readonly-[0-9]+$ ]]; then
              echo "::error::Invalid remote output directory"
              exit 7
            fi
            mkdir -p "$REMOTE_OUTPUT_DIR"
            chmod 700 "$REMOTE_OUTPUT_DIR"

            USER_ROW="$(docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select user_id::text || '"'"'|'"'"' || coalesce(perms_version,1)::text from sys_user where username='"'"'admin'"'"' and status=1 limit 1"' | tr -d '\r\n')"
            if [ -z "$USER_ROW" ]; then
              echo "::error::ACTIVE_ADMIN_NOT_FOUND"
              exit 3
            fi
            ADMIN_ID="${USER_ROW%%|*}"
            PERMS_VERSION="${USER_ROW##*|}"
            TOKEN="$(
              docker compose exec -T \
                -e PHOENIX_CI_ADMIN_ID="$ADMIN_ID" \
                -e PHOENIX_CI_PERMS_VERSION="$PERMS_VERSION" \
                api node - <<'NODE'
            const jwt = require('jsonwebtoken');
            const secret = process.env.JWT_SECRET;
            if (!secret || secret === 'DEV_ONLY_INSECURE_FALLBACK_KEY_DO_NOT_USE_IN_PROD') {
              console.error('JWT_SECRET_NOT_AVAILABLE');
              process.exit(4);
            }
            const adminId = Number(process.env.PHOENIX_CI_ADMIN_ID || 0);
            const permsVersion = Number(process.env.PHOENIX_CI_PERMS_VERSION || 1);
            if (!adminId) {
              console.error('ADMIN_ID_NOT_AVAILABLE');
              process.exit(5);
            }
            const payload = {
              userId: adminId,
              sub: adminId,
              username: 'admin',
              realNameZh: 'CI Chanjet Readonly Sync',
              role: 'ROLE_ADMIN',
              roleNameZh: '集团超级管理员',
              storeCode: 'ALL',
              store_code: 'ALL',
              locale: 'zh-CN',
              roles: ['ROLE_ADMIN'],
              permissions: ['*'],
              perms_version: permsVersion,
            };
            process.stdout.write(jwt.sign(payload, secret, { expiresIn: '20m' }));
            NODE
            )"
            if [ -z "$TOKEN" ]; then
              echo "::error::Failed to mint production token."
              exit 2
            fi
            PHOENIX_ADMIN_TOKEN="$TOKEN" node scripts/ops/chanjet-readonly-mirror-sync.mjs \
              --execute \
              --remote-api-only \
              --api-base=https://erp.eggslao.com \
              --sync-timeout-ms=300000 \
              --coverage-timeout-ms=120000 \
              --output-dir="$REMOTE_OUTPUT_DIR"

            PHOENIX_ADMIN_TOKEN="$TOKEN" node --input-type=module - <<'NODE'
            const response = await fetch('https://erp.eggslao.com/api/chanjet/integration/counterparty-mapping-candidates/generate', {
              method: 'POST',
              headers: {
                Accept: 'application/json',
                Authorization: `Bearer ${process.env.PHOENIX_ADMIN_TOKEN}`,
                'Content-Type': 'application/json',
              },
              body: '{}',
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload?.success !== true || payload?.writeChanjet !== false || payload?.autoApprove !== false) {
              console.error(`COUNTERPARTY_CANDIDATE_GENERATION_FAILED status=${response.status}`);
              process.exit(6);
            }
            console.log(JSON.stringify({
              success: true,
              writeChanjet: payload.writeChanjet,
              writeErpBusinessTables: payload.writeErpBusinessTables,
              autoApprove: payload.autoApprove,
              generated: payload.generated ?? payload.upserted ?? payload.count ?? null,
            }));
            NODE

            PHOENIX_ADMIN_TOKEN="$TOKEN" node scripts/ops/chanjet-p0-production-readonly-gate-audit.mjs \
              --api-base=https://erp.eggslao.com/api \
              --output-dir="$REMOTE_OUTPUT_DIR"

