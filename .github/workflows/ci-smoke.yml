        run: |
          set -euo pipefail
          TOKEN="$(node scripts/ops/mint-production-admin-token-over-ssh.mjs)"
          test -n "$TOKEN"
          PHOENIX_ADMIN_TOKEN="$TOKEN" node scripts/ops/chanjet-house-alignment-readonly.mjs \
            --execute \
            --skip-refresh \
            --api-base=https://erp.eggslao.com \
            --output-dir=docs/ops/runs

      - name: Upload runtime smoke artifacts
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-${{ inputs.target }}-${{ github.run_id }}
          path: docs/ops/runs/
          if-no-files-found: ignore
