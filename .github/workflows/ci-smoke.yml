name: Read-only runner process and mount diagnostic

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Read-only process metadata; never fixture admission or production'
        required: true
        type: choice
        options:
          - runner-proc-diagnostic
        default: runner-proc-diagnostic

permissions: {}

jobs:
  runner-proc-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'runner-proc-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Observe fixed process metadata only
        shell: bash --noprofile --norc -e {0}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          // Observation only. These four scalar fields never grant fixture admission.
          const seen = new Set();
          let pid = process.pid;
          let incomplete = false;
          let depth = 0;
          for (; depth < 32 && pid > 1; depth++) {
            if (!Number.isSafeInteger(pid) || seen.has(pid)) { incomplete = true; break; }
            seen.add(pid);
            const row = { pid, ppid: null, uid: null, exe: null };
            try {
              const stat = fs.readFileSync(`/proc/${pid}/stat`, 'utf8');
              const end = stat.lastIndexOf(')');
              if (end < 0) throw new Error();
              const fields = stat.slice(end + 2).trim().split(/\s+/);
              const parent = Number(fields[1]);
              if (!Number.isSafeInteger(parent) || parent < 0) throw new Error();
              row.ppid = parent;
            } catch { incomplete = true; }
            try {
              const text = fs.readFileSync(`/proc/${pid}/status`, 'utf8');
              const value = text.match(/^Uid:\s+(\d+)/m)?.[1];
              if (value === undefined) throw new Error();
              row.uid = Number(value);
              if (!Number.isSafeInteger(row.uid) || row.uid < 0) throw new Error();
            } catch { row.uid = null; incomplete = true; }
            try {
              const executable = fs.readlinkSync(`/proc/${pid}/exe`);
              if (!executable.startsWith('/') || executable.length > 4096) throw new Error();
              row.exe = executable;
            } catch { incomplete = true; }
            process.stdout.write(JSON.stringify(row) + '\n');
            if (row.ppid === null) break;
            pid = row.ppid;
          }
          if (depth === 32 && pid > 1) incomplete = true;
          if (incomplete) {
            process.stderr.write('RUNNER_PROC_DIAGNOSTIC=INCOMPLETE\n');
            process.exitCode = 1;
          }
          NODE
      - name: Observe audit source and destination device identity only
        shell: bash --noprofile --norc -e {0}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.statSync(process.env.RUNNER_TEMP);
          const destination = fs.statSync('/run');
          process.stdout.write(JSON.stringify({
            diagnostic: 'AUDIT_RENAME_DEVICE_IDENTITY',
            sourceDevice: source.dev,
            destinationDevice: destination.dev,
            sameDevice: source.dev === destination.dev,
            sourceDirectory: source.isDirectory(),
            destinationDirectory: destination.isDirectory(),
            sourceUid: source.uid,
            destinationUid: destination.uid,
            productionReceipt: false,
            writesExecuted: false
          }) + '\n');
          NODE
