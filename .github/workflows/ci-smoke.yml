name: AI Delivery CI Smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Smoke target: documented-only, production, product-pages, browser-visual-production, alert-human-production, authenticated-production, role-business-production, chanjet-readonly-production'
        required: false
        default: documented-only
  pull_request:
    branches: [main]

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    name: Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Validate runtime smoke checker
        run: |
          node --check scripts/ops/runtime-smoke-check.mjs
          node --check scripts/ops/product-page-smoke.mjs
          node --check scripts/ops/browser-visual-smoke.mjs
          node --check scripts/ops/alert-human-reachability-smoke.mjs
          node --check scripts/ops/authenticated-business-smoke.mjs
          node --check scripts/ops/role-business-smoke.mjs
          node --check scripts/ops/chanjet-readonly-mirror-sync.mjs
          node --check scripts/ops/mint-production-admin-token-over-ssh.mjs

      - name: Document smoke entrypoints
        run: |
          echo "Pull requests validate the smoke checker without touching production."
          echo "Existing command: bash scripts/smoke-test.sh"
          echo "Runtime smoke command: node scripts/ops/runtime-smoke-check.mjs --base-url=https://erp.eggslao.com --api-url=https://erp.eggslao.com --strict"
          echo "Product page smoke command: node scripts/ops/product-page-smoke.mjs --base-url=https://erp.eggslao.com --strict"
          echo "Browser visual smoke command: node scripts/ops/browser-visual-smoke.mjs --base-url=https://erp.eggslao.com --strict"
          echo "Alert human reachability command: PHOENIX_SMOKE_TOKEN=... node scripts/ops/alert-human-reachability-smoke.mjs --base-url=https://erp.eggslao.com --strict"
          echo "Authenticated smoke command: SMOKE_USER=... SMOKE_PASS=... node scripts/ops/authenticated-business-smoke.mjs --base-url=https://erp.eggslao.com --api-url=https://erp.eggslao.com --strict"
          echo "Role business smoke command: ROLE_SMOKE_CREDENTIALS_JSON=... node scripts/ops/role-business-smoke.mjs --base-url=https://erp.eggslao.com --api-url=https://erp.eggslao.com --strict"
          echo "Chanjet readonly sync command: workflow target chanjet-readonly-production mints a short-lived token inside the production API container and runs the protected readonly sync API."
          echo "API package command: pnpm --filter phoenix-erp-v3-nest test:smoke"

      - name: Validate legacy smoke script exists
        run: test -f scripts/smoke-test.sh

      - name: Run production runtime smoke
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
        run: |
          node scripts/ops/runtime-smoke-check.mjs \
            --base-url=https://erp.eggslao.com \
            --api-url=https://erp.eggslao.com \
            --output-dir=docs/ops/runs \
            --strict

      - name: Run production product page smoke
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'product-pages'
        run: |
          node scripts/ops/product-page-smoke.mjs \
            --base-url=https://erp.eggslao.com \
            --output-dir=docs/ops/runs \
            --strict

      - name: Run production browser visual smoke
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'browser-visual-production'
        run: |
          node scripts/ops/browser-visual-smoke.mjs \
            --base-url=https://erp.eggslao.com \
            --output-dir=docs/ops/runs \
            --screenshots-dir=output/playwright/product-pages \
            --strict

      - name: Run production alert human reachability smoke
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'alert-human-production'
        env:
          PHOENIX_SMOKE_TOKEN: ${{ secrets.PHOENIX_SMOKE_TOKEN }}
        run: |
          node scripts/ops/alert-human-reachability-smoke.mjs \
            --base-url=https://erp.eggslao.com \
            --output-dir=docs/ops/runs \
            --strict

      - name: Run authenticated production smoke
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'authenticated-production'
        env:
          SMOKE_USER: ${{ secrets.PHOENIX_SMOKE_USER }}
          SMOKE_PASS: ${{ secrets.PHOENIX_SMOKE_PASS }}
        run: |
          node scripts/ops/authenticated-business-smoke.mjs \
            --base-url=https://erp.eggslao.com \
            --api-url=https://erp.eggslao.com \
            --output-dir=docs/ops/runs \
            --strict

      - name: Run role business production smoke
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'role-business-production'
        env:
          ROLE_SMOKE_CREDENTIALS_JSON: ${{ secrets.PHOENIX_ROLE_SMOKE_CREDENTIALS_JSON }}
        run: |
          node scripts/ops/role-business-smoke.mjs \
            --base-url=https://erp.eggslao.com \
            --api-url=https://erp.eggslao.com \
            --output-dir=docs/ops/runs \
            --strict

      - name: Run Chanjet readonly production sync
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'chanjet-readonly-production'
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            git pull --ff-only origin main

            USER_ROW="$(docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select user_id::text || '"'"'|'"'"' || coalesce(perms_version,1)::text from sys_user where username='"'"'admin'"'"' and status=1 limit 1"' | tr -d '\r\n')"
            if [ -z "$USER_ROW" ]; then
              echo "::error::ACTIVE_ADMIN_NOT_FOUND"
              exit 3
            fi
            ADMIN_ID="${USER_ROW%%|*}"
            PERMS_VERSION="${USER_ROW##*|}"
            TOKEN="$(
              docker compose exec -T \
                -e PHOENIX_CI_ADMIN_ID="$ADMIN_ID" \
                -e PHOENIX_CI_PERMS_VERSION="$PERMS_VERSION" \
                api node - <<'NODE'
            const jwt = require('jsonwebtoken');
            const secret = process.env.JWT_SECRET;
            if (!secret || secret === 'DEV_ONLY_INSECURE_FALLBACK_KEY_DO_NOT_USE_IN_PROD') {
              console.error('JWT_SECRET_NOT_AVAILABLE');
              process.exit(4);
            }
            const adminId = Number(process.env.PHOENIX_CI_ADMIN_ID || 0);
            const permsVersion = Number(process.env.PHOENIX_CI_PERMS_VERSION || 1);
            if (!adminId) {
              console.error('ADMIN_ID_NOT_AVAILABLE');
              process.exit(5);
            }
            const payload = {
              userId: adminId,
              sub: adminId,
              username: 'admin',
              realNameZh: 'CI Chanjet Readonly Sync',
              role: 'ROLE_ADMIN',
              roleNameZh: '集团超级管理员',
              storeCode: 'ALL',
              store_code: 'ALL',
              locale: 'zh-CN',
              roles: ['ROLE_ADMIN'],
              permissions: ['*'],
              perms_version: permsVersion,
            };
            process.stdout.write(jwt.sign(payload, secret, { expiresIn: '20m' }));
            NODE
            )"
            if [ -z "$TOKEN" ]; then
              echo "::error::Failed to mint production token."
              exit 2
            fi
            PHOENIX_ADMIN_TOKEN="$TOKEN" node scripts/ops/chanjet-readonly-mirror-sync.mjs \
              --execute \
              --remote-api-only \
              --api-base=https://erp.eggslao.com \
              --sync-timeout-ms=300000 \
              --coverage-timeout-ms=120000 \
              --output-dir=docs/ops/runs

      - name: Pull Chanjet readonly sync artifacts from production
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'chanjet-readonly-production'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          DEPLOY_PROXY_HOST: ${{ secrets.DEPLOY_PROXY_HOST }}
          DEPLOY_PROXY_USER: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          DEPLOY_PROXY_SSH_KEY: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p docs/ops/runs "$RUNNER_TEMP/phoenix-ssh"
          KEY="$RUNNER_TEMP/phoenix-ssh/deploy_key"
          PROXY_KEY="$RUNNER_TEMP/phoenix-ssh/proxy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"

          SSH_OPTS=(
            -i "$KEY"
            -p "${DEPLOY_PORT:-22}"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=30
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=6
          )

          if [ -n "${DEPLOY_PROXY_HOST:-}" ]; then
            printf '%s\n' "$DEPLOY_PROXY_SSH_KEY" > "$PROXY_KEY"
            chmod 600 "$PROXY_KEY"
            SSH_OPTS+=(
              -o "ProxyCommand=ssh -i $PROXY_KEY -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ${DEPLOY_PROXY_USER:-$DEPLOY_USER}@${DEPLOY_PROXY_HOST}"
            )
          fi

          scp "${SSH_OPTS[@]}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/docs/ops/runs/chanjet-readonly-mirror-sync-latest.json" \
            docs/ops/runs/chanjet-readonly-mirror-sync-latest.json
          scp "${SSH_OPTS[@]}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/docs/ops/runs/chanjet-readonly-mirror-sync-latest.md" \
            docs/ops/runs/chanjet-readonly-mirror-sync-latest.md

      - name: Upload runtime smoke artifacts
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-${{ inputs.target }}-${{ github.run_id }}
          path: docs/ops/runs/
          if-no-files-found: ignore
