name: Chanjet restoration read-only evidence (temporary entrance)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'audit is read-only; configuration and first sync require exact merged SHA approval'
        type: choice
        options: [audit]
        default: audit
      approved_main_sha:
        description: 'Separately approved exact merged main and v3 floor SHA (audit: expected checkout SHA)'
        required: true
        type: string
      approval_json:
        description: 'Reviewed non-secret book/company/scope/first-period approval; no credentials or payloads'
        type: string
        default: ''
      confirmation:
        description: 'AUDIT_CHANJET_READONLY or APPROVE_EXACT_CHANJET_READONLY_CONFIG'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cicd-refs/heads/main
  cancel-in-progress: false
jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bind reviewed runner and operation
        env:
          OPERATION: ${{ inputs.operation }}
          APPROVED_SHA: ${{ inputs.approved_main_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$OPERATION" = audit ]; then
            test "$CONFIRMATION" = AUDIT_CHANJET_READONLY
          else
            test "$GITHUB_REF" = refs/heads/main
            test "$APPROVED_SHA" = "$GITHUB_SHA"
            test "$CONFIRMATION" = APPROVE_EXACT_CHANJET_READONLY_CONFIG
          fi
          {
            echo "PRODUCTION_CONTRACT_B64=$(base64 -w0 scripts/ops/production-config-contract.json)"
            echo "PRODUCTION_PATH_HELPER_B64=$(base64 -w0 scripts/ops/production-trusted-paths.mjs)"
            echo "PRODUCTION_CONTROL_BOOTSTRAP_B64=$(base64 -w0 scripts/ops/production-control-bootstrap.sh)"
            echo "AUDIT_PROGRAM_B64=$(base64 -w0 scripts/ops/chanjet-readonly-production-audit.mjs)"
            echo "AUDIT_PROGRAM_SHA256=$(sha256sum scripts/ops/chanjet-readonly-production-audit.mjs | cut -d' ' -f1)"
            echo "AUDIT_SQL_B64=$(base64 -w0 scripts/ops/readonly-audits/chanjet-restoration-preflight.sql)"
            echo "AUDIT_SQL_SHA256=$(sha256sum scripts/ops/readonly-audits/chanjet-restoration-preflight.sql | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"
      - name: Formal production configuration transaction or read-only audit
        uses: appleboy/ssh-action@v1
        env:
          PRODUCTION_CONTRACT_B64: ${{ env.PRODUCTION_CONTRACT_B64 }}
          PRODUCTION_PATH_HELPER_B64: ${{ env.PRODUCTION_PATH_HELPER_B64 }}
          PRODUCTION_CONTROL_BOOTSTRAP_B64: ${{ env.PRODUCTION_CONTROL_BOOTSTRAP_B64 }}
          AUDIT_PROGRAM_B64: ${{ env.AUDIT_PROGRAM_B64 }}
          AUDIT_PROGRAM_SHA256: ${{ env.AUDIT_PROGRAM_SHA256 }}
          AUDIT_SQL_B64: ${{ env.AUDIT_SQL_B64 }}
          AUDIT_SQL_SHA256: ${{ env.AUDIT_SQL_SHA256 }}
          CHANJET_CONFIG_OPERATION: ${{ inputs.operation }}
          CHANJET_APPROVAL_JSON: ${{ inputs.approval_json }}
          APPROVED_CONFIG_FLOOR_SHA: ${{ inputs.approved_main_sha }}
          TARGET_SHA: ${{ inputs.approved_main_sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: PRODUCTION_CONTRACT_B64,PRODUCTION_PATH_HELPER_B64,PRODUCTION_CONTROL_BOOTSTRAP_B64,AUDIT_PROGRAM_B64,AUDIT_PROGRAM_SHA256,AUDIT_SQL_B64,AUDIT_SQL_SHA256,CHANJET_CONFIG_OPERATION,CHANJET_APPROVAL_JSON,APPROVED_CONFIG_FLOOR_SHA,TARGET_SHA,DEPLOY_RUN_ID
          command_timeout: 12m
          script: |
            set -Eeuo pipefail
            set +x
            umask 077
            cd ${{ secrets.DEPLOY_PATH || '/data/phoenix-erp' }}
            DEPLOY_REPO_ROOT="$(pwd -P)"
            eval "$(printf '%s' "$PRODUCTION_CONTROL_BOOTSTRAP_B64" | base64 -d)"
            export GIT_OPTIONAL_LOCKS=0 GIT_CONFIG_COUNT=4
            export GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null
            export GIT_CONFIG_KEY_1=core.fsmonitor GIT_CONFIG_VALUE_1=false
            export GIT_CONFIG_KEY_2=gc.auto GIT_CONFIG_VALUE_2=0
            export GIT_CONFIG_KEY_3=maintenance.auto GIT_CONFIG_VALUE_3=false
            git() { command git -c "safe.directory=$DEPLOY_REPO_ROOT" -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
            test "$(git branch --show-current)" = main
            test -z "$(git status --porcelain --untracked-files=all)"
            test "$(git rev-parse HEAD)" = "$TARGET_SHA"
            test "$CHANJET_CONFIG_OPERATION" = audit
            if [ "$CHANJET_CONFIG_OPERATION" = audit ]; then
              # Uses installed guard/identity; the reviewed audit bundle is never deployed.
              AUDIT_STAGE="$STATE_DIR/readonly-audit-${DEPLOY_RUN_ID}"
              test ! -e "$AUDIT_STAGE"
              mkdir -m 700 "$AUDIT_STAGE"
              printf '%s' "$AUDIT_PROGRAM_B64" | base64 -d > "$AUDIT_STAGE/audit.mjs"
              printf '%s' "$AUDIT_SQL_B64" | base64 -d > "$AUDIT_STAGE/preflight.sql"
              chmod 600 "$AUDIT_STAGE/audit.mjs" "$AUDIT_STAGE/preflight.sql"
              test "$(sha256sum "$AUDIT_STAGE/audit.mjs" | cut -d' ' -f1)" = "$AUDIT_PROGRAM_SHA256"
              test "$(sha256sum "$AUDIT_STAGE/preflight.sql" | cut -d' ' -f1)" = "$AUDIT_SQL_SHA256"
              node "$AUDIT_STAGE/audit.mjs" "$AUDIT_STAGE/preflight.sql"
            fi
