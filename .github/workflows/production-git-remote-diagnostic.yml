name: Actions Deploy Identity Precheck (read only)

on:
  workflow_dispatch:
    inputs:
      confirm_readonly:
        description: Type RUN_ACTIONS_DEPLOY_IDENTITY_PRECHECK
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: actions-deploy-identity-precheck
  cancel-in-progress: false

jobs:
  precheck:
    if: github.ref == 'refs/heads/codex/actions-deploy-identity-precheck'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Freeze target and invocation
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_READONLY: ${{ inputs.confirm_readonly }}
        run: |
          set -euo pipefail
          test "$CONFIRM_READONLY" = RUN_ACTIONS_DEPLOY_IDENTITY_PRECHECK
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$actual" = 8d76b551fccae60ebadfec5c85896007e1e0ce51
          echo "AUTHORIZED_TARGET_SHA=$actual"

      - name: Inspect through formal deployment SSH channel
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH
          timeout: 30s
          proxy_timeout: 30s
          command_timeout: 2m
          script: |
            set -uo pipefail
            set +x
            export GIT_OPTIONAL_LOCKS=0
            echo "ACTIONS_SSH_USER=$(id -un)"
            echo "ACTIONS_SSH_UID=$(id -u)"
            echo "ACTIONS_SSH_HOME=$HOME"
            case "$DEPLOY_PATH" in '~/'*) DEPLOY_PATH="$HOME/${DEPLOY_PATH#\~/}" ;; esac
            cd "$DEPLOY_PATH" || exit 31
            DEPLOY_REPO_ROOT="$(pwd -P)"
            test "$DEPLOY_REPO_ROOT" = /data/phoenix-erp || exit 32
            git() { command git -c "safe.directory=$DEPLOY_REPO_ROOT" "$@"; }
            before=$(git status --porcelain --untracked-files=all)
            head_before=$(git rev-parse HEAD)
            echo "PRODUCTION_HEAD=$head_before"
            remote=$(git remote get-url origin)
            test "$remote" = git@github.com:ivanzhao299/phoenix-erp-v3.git || exit 33
            echo "ORIGIN_REPOSITORY=ivanzhao299/phoenix-erp-v3"
            state=/home/phoenix-codex-deploy/production-deployment-state
            if test -d "$state" && test ! -L "$state"; then
              owner=$(stat -c %u "$state")
              echo "STATE_OWNER_UID=$owner"
              echo "STATE_MODE=$(stat -c %a "$state")"
              test "$owner" = "$(id -u)" && echo STATE_OWNER_MATCH=YES || echo STATE_OWNER_MATCH=NO
            else
              echo STATE_OWNER_MATCH=NOT_INITIALIZED
            fi
            echo "CHECKOUT_OWNER_UID=$(stat -c %u .)"
            echo "ENV_OWNER_UID=$(stat -c %u .env)"
            effective=$(ssh -G git@github.com 2>/dev/null)
            printf '%s\n' "$effective" | awk '$1 ~ /^(hostname|port|user|identityfile|identitiesonly|identityagent|stricthostkeychecking|userknownhostsfile)$/ {print "SSH_CONFIG " $0}'
            test "$(printf '%s\n' "$effective" | awk '$1=="hostname" {print $2}')" = github.com || exit 36
            test "$(printf '%s\n' "$effective" | awk '$1=="port" {print $2}')" = 22 || exit 36
            test "$(printf '%s\n' "$effective" | awk '$1=="user" {print $2}')" = git || exit 36
            for key in "$HOME"/.ssh/*.pub; do
              test -f "$key" || continue
              ssh-keygen -lf "$key" -E sha256 2>/dev/null | awk '{print "PUBLIC_KEY_FINGERPRINT=" $2}'
            done
            for name in id_rsa id_ecdsa id_ecdsa_sk id_ed25519 id_ed25519_sk id_xmss id_dsa; do
              key="$HOME/.ssh/$name"
              if test -e "$key"; then
                stat -c 'IDENTITY_METADATA=%n uid=%u mode=%a type=%F' "$key"
              fi
            done
            if test -n "${SSH_AUTH_SOCK:-}"; then
              ssh-add -l -E sha256 2>/dev/null | awk '{print "AGENT_PUBLIC_FINGERPRINT=" $2}'
            else
              echo SSH_AGENT=UNSET
            fi
            precheck_result=0
            custom=false
            git config --get core.sshCommand >/dev/null && custom=true
            test -n "${GIT_SSH_COMMAND:-}${GIT_SSH:-}" && custom=true
            if test "$custom" = true; then
              echo GITHUB_OUTBOUND_AUTH=HOLD_CUSTOM_SSH_COMMAND_REVIEW
              precheck_result=1
            else
              export GIT_SSH_COMMAND='ssh -oBatchMode=yes -oStrictHostKeyChecking=yes -oUpdateHostKeys=no -oControlMaster=no -oControlPath=none -oConnectTimeout=10'
              echo SSH_TEST_STRICT_HOST_KEY_CHECKING=yes
              diagnostic=$(timeout 25 ssh -vT -oBatchMode=yes -oStrictHostKeyChecking=yes -oUpdateHostKeys=no -oControlMaster=no -oControlPath=none -oConnectTimeout=10 git@github.com 2>&1)
              printf '%s\n' "$diagnostic" | awk '/identity file |Offering public key:|Server accepts key:|signing failed|No more authentication methods|is known and matches/ {print "SSH_DIAGNOSTIC " $0}'
              case "$diagnostic" in
                *'successfully authenticated'*) echo GITHUB_OUTBOUND_AUTH=PASS ;;
                *'Host key verification failed'*) echo GITHUB_OUTBOUND_AUTH=FAIL_HOST_TRUST ;;
                *'Permission denied (publickey)'*) echo GITHUB_OUTBOUND_AUTH=FAIL_PUBLICKEY ;;
                *) echo GITHUB_OUTBOUND_AUTH=UNKNOWN ;;
              esac
              refs=$(timeout 25 git ls-remote origin refs/heads/main 2>/dev/null)
              rc=$?
              if test "$rc" = 0; then
                sha=$(printf '%s\n' "$refs" | awk '$2=="refs/heads/main" {print $1}')
                echo "REMOTE_MAIN_SHA=$sha"
                echo GIT_LS_REMOTE=PASS
                test "$sha" = 8d76b551fccae60ebadfec5c85896007e1e0ce51 && echo TARGET_SHA_MATCH=YES || { echo TARGET_SHA_MATCH=NO; precheck_result=1; }
              else
                echo GIT_LS_REMOTE=FAIL
                echo TARGET_SHA_MATCH=UNVERIFIED
                precheck_result=1
              fi
            fi
            test "$(git rev-parse HEAD)" = "$head_before" || exit 34
            test "$(git status --porcelain --untracked-files=all)" = "$before" || exit 35
            echo PRODUCTION_CHECKOUT_MUTATION=NO
            echo CONTAINER_DATABASE_CHANJET_ACTIONS=NONE
            exit "$precheck_result"
