name: Exact authorized C3 initialization (temporary reviewed entrance)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Authorized stage (post-deploy is read-only)'
        required: true
        type: choice
        default: readonly_closeout
        options: [c3, readonly_closeout]
      confirm_c3:
        description: 'Exact authorization: EXECUTE_EXACT_23C7_C3'
        required: true
        type: string
      reviewed_entrypoint_commit:
        description: 'Independently reviewed temporary workflow commit (full SHA)'
        required: true
        type: string
      reviewed_program_sha256:
        description: 'Independently reviewed orchestration program SHA256'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cicd-refs/heads/main
  cancel-in-progress: false
jobs:
  c3:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/c3-transition-23c7af86'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      C3_OPERATION: ${{ inputs.operation }}
      C3_APPROVAL: ${{ inputs.confirm_c3 }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_entrypoint_commit }}
      C3_PROGRAM_SHA256: ${{ inputs.reviewed_program_sha256 }}
      TARGET_SHA: 23c7af86dd122379d01248a3b9542b8165f31498
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Bind reviewed entrypoint and merged authority
        run: |
          set -Eeuo pipefail
          test "$C3_APPROVAL" = EXECUTE_EXACT_23C7_C3
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
          test "$(sha256sum scripts/ops/c3-authorized-transition.mjs | cut -d' ' -f1)" = "$C3_PROGRAM_SHA256"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" "$REVIEWED_COMMIT"
          python3 - <<'PYBUILD'
          import base64,gzip,hashlib,json,os,subprocess
          target=os.environ['TARGET_SHA']
          files=['docker-compose.yml','scripts/ops/production-config-contract.json','scripts/ops/production-trusted-paths.mjs','scripts/ops/capture-production-runtime.mjs','scripts/ops/update-managed-chanjet-env.mjs','scripts/ops/production-config-guard.mjs','scripts/ops/production-deployment-state.mjs','scripts/ops/verify-config-floor-transition.mjs','scripts/ops/require-phoenix-data-mount.sh']
          contents={}
          for file in files:
              data=subprocess.check_output(['git','show',target+':'+file])
              contents[file]={'base64':base64.b64encode(data).decode(),'sha256':hashlib.sha256(data).hexdigest()}
          package=gzip.compress(json.dumps({'sourceSha':target,'files':contents},separators=(',',':')).encode(),mtime=0)
          program=open('scripts/ops/c3-authorized-transition.mjs','rb').read()
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('C3_PACKAGE_B64='+base64.b64encode(package).decode()+'\n')
              out.write('C3_PACKAGE_SHA256='+hashlib.sha256(package).hexdigest()+'\n')
              out.write('C3_PROGRAM_B64='+base64.b64encode(program).decode()+'\n')
          PYBUILD
      - name: Approved C3 using formal production identity
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          C3_PROGRAM_B64: ${{ env.C3_PROGRAM_B64 }}
          C3_PACKAGE_B64: ${{ env.C3_PACKAGE_B64 }}
          C3_PACKAGE_SHA256: ${{ env.C3_PACKAGE_SHA256 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH,DEPLOY_RUN_ID,C3_OPERATION,C3_APPROVAL,C3_PROGRAM_SHA256,C3_PROGRAM_B64,C3_PACKAGE_B64,C3_PACKAGE_SHA256
          timeout: 30s
          proxy_timeout: 30s
          command_timeout: 5m
          script: |
            set -Eeuo pipefail
            set +x
            umask 077
            export GIT_OPTIONAL_LOCKS=0
            test "$(id -u)" = 0
            test "$DEPLOY_PATH" = /data/phoenix-erp
            cd -- "$DEPLOY_PATH"
            test "$(pwd -P)" = /data/phoenix-erp
            run_c3() {
              node --input-type=module -e '
                import {createHash} from "node:crypto";
                const b=Buffer.from(process.env.C3_PROGRAM_B64,"base64");
                if(createHash("sha256").update(b).digest("hex")!==process.env.C3_PROGRAM_SHA256) process.exit(90);
                try { const m=await import("data:text/javascript;base64,"+b.toString("base64")); await m.execute(process.argv[1]); }
                catch(e) { console.error(/^C3_HOLD=[A-Z_]+$/.test(e.message)?e.message:"C3_HOLD=VALIDATION_OR_OPERATION_FAILED"); process.exit(1); }
              ' "$1"
            }
            case "$C3_OPERATION" in
              c3) run_c3 initialize ;;
              readonly_closeout) run_c3 post-preflight ;;
              *) exit 91 ;;
            esac
            # Merged v2 initializer has authenticated/validated this root-owned 0600 file and all ancestors.
            exec 9<>/var/lib/phoenix-erp/production-deployment-state/mutation.lock
            flock -n 9
            case "$C3_OPERATION" in
              c3) run_c3 transition ;;
              readonly_closeout) run_c3 post-deploy ;;
            esac
