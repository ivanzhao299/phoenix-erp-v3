name: Actions Deploy Identity Precheck (read only)

on:
  workflow_dispatch:
    inputs:
      confirm_readonly:
        description: Type RUN_ACTIONS_DEPLOY_IDENTITY_PRECHECK
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: actions-deploy-identity-precheck
  cancel-in-progress: false

jobs:
  precheck:
    if: github.ref == 'refs/heads/codex/actions-deploy-identity-precheck'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Freeze target and invocation
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_READONLY: ${{ inputs.confirm_readonly }}
        run: |
          set -euo pipefail
          test "$CONFIRM_READONLY" = RUN_ACTIONS_DEPLOY_IDENTITY_PRECHECK
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$actual" = 8d76b551fccae60ebadfec5c85896007e1e0ce51
          echo "AUTHORIZED_TARGET_SHA=$actual"

      - name: Inspect through formal deployment SSH channel
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH
          timeout: 30s
          proxy_timeout: 30s
          command_timeout: 2m
          script: |
            set -Eeuo pipefail
            set +x
            export GIT_OPTIONAL_LOCKS=0
            test "$(id -u)" = 0
            echo "ACTIONS_DEPLOY_UID=$(id -u)"
            echo "ACTIONS_DEPLOY_USER=$(id -un)"
            for p in / /var /var/lib /var/lib/phoenix-erp /var/lib/phoenix-erp/production-deployment-state /var/lib/phoenix-erp/production-checkout-recovery; do
              if test -e "$p" || test -L "$p"; then
                stat -c 'CANDIDATE_PATH=%n uid=%u mode=%a type=%F' "$p"
                echo "CANDIDATE_REAL=$(realpath -e "$p")"
              else
                echo "CANDIDATE_ABSENT=$p"
              fi
            done
            findmnt -n -T /var/lib -o TARGET,SOURCE,FSTYPE,FSROOT
            python3 - <<'PYACL'
            import os,errno,json
            for p in ['/', '/var', '/var/lib']:
                result={'path':p}
                for attr in ['system.posix_acl_access','system.posix_acl_default']:
                    try:
                        os.getxattr(p,attr,follow_symlinks=False)
                        result[attr]='PRESENT'
                    except OSError as e:
                        result[attr]='ABSENT' if e.errno==errno.ENODATA else 'HOLD_ERRNO_'+str(e.errno)
                print('CANDIDATE_ACL='+json.dumps(result))
            PYACL
            case "$DEPLOY_PATH" in '~/'*) DEPLOY_PATH="$HOME/${DEPLOY_PATH#\~/}" ;; esac
            cd "$DEPLOY_PATH"
            repo=$(pwd -P)
            test "$repo" = /data/phoenix-erp
            git() { command git -c "safe.directory=$repo" "$@"; }
            before=$(git status --porcelain --untracked-files=all)
            head_before=$(git rev-parse HEAD)
            echo "PRODUCTION_HEAD=$head_before"
            state=/home/phoenix-codex-deploy/production-deployment-state
            archive=/home/phoenix-codex-deploy/production-checkout-recovery/20261008T063137+0800
            for p in / /home /home/phoenix-codex-deploy /home/phoenix-codex-deploy/production-checkout-recovery "$archive" "$state"; do
              if test -e "$p" || test -L "$p"; then
                stat -c 'PATH_METADATA=%n uid=%u gid=%g mode=%a type=%F' "$p"
                echo "PATH_REAL=$(realpath -e "$p")"
              else
                echo "PATH_ABSENT=$p"
              fi
            done
            for n in floor.json active.json transition-proof.json mutation.lock transaction.json; do
              p="$state/$n"
              if test -e "$p" || test -L "$p"; then
                stat -c 'STATE_FILE_METADATA=%n uid=%u mode=%a type=%F' "$p"
              else
                echo "STATE_FILE_ABSENT=$n"
              fi
            done
            source="$repo/.env.pre-verification-20261005T114700+08:00"
            stat -c 'SOURCE_BACKUP_METADATA=%n uid=%u mode=%a size=%s inode=%i type=%F' "$source"
            sha256sum "$source"
            test -d "$archive"
            for p in "$archive"/* "$archive"/.[!.]*; do
              test -e "$p" || continue
              stat -c 'ARCHIVE_ENTRY_METADATA=%n uid=%u mode=%a size=%s type=%F' "$p"
              if test -f "$p" && test ! -L "$p"; then sha256sum "$p"; fi
            done
            for p in "$HOME/.ssh" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"; do
              if test -e "$p"; then stat -c 'SSH_PATH_METADATA=%n uid=%u mode=%a type=%F' "$p"; else echo "SSH_PATH_ABSENT=$p"; fi
            done
            if test -f "$HOME/.ssh/config"; then
              awk 'tolower($1) ~ /^(host|hostname|user|identityfile|identitiesonly|identityagent|userknownhostsfile|stricthostkeychecking)$/ {print "SSH_ALLOWED_CONFIG " $0}' "$HOME/.ssh/config"
            fi
            ssh -G git@github.com 2>/dev/null | awk '$1 ~ /^(hostname|port|user|identityfile|identitiesonly|identityagent|stricthostkeychecking|userknownhostsfile)$/ {print "SSH_EFFECTIVE " $0}'
            refs=$(timeout 25 git -c "safe.directory=$repo" -c 'core.sshCommand=ssh -oBatchMode=yes -oStrictHostKeyChecking=yes -oUpdateHostKeys=no -oControlMaster=no -oControlPath=none -oConnectTimeout=10' ls-remote origin refs/heads/main)
            sha=$(printf '%s\n' "$refs" | awk '$2=="refs/heads/main" {print $1}')
            echo "REMOTE_MAIN_SHA=$sha"
            test "$sha" = 8d76b551fccae60ebadfec5c85896007e1e0ce51
            echo STRICT_GITHUB_HOST_CHECK=PASS
            echo FORMAL_ACTIONS_IDENTITY=PASS
            test "$(git rev-parse HEAD)" = "$head_before"
            test "$(git status --porcelain --untracked-files=all)" = "$before"
            echo PRODUCTION_FILE_MUTATION=NO
            echo FETCH_MERGE_CONTAINER_DATABASE_CHANJET_ACTIONS=NONE
