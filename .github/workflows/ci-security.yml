name: AI Delivery CI Security

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/ops/**'
  push:
    branches: [main, 'w5/**']
    paths-ignore:
      - 'docs/ops/**'
  workflow_dispatch: {}

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  security:
    name: Static Security And Freeze Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 冻结边界探针(by-design：任何 apps/api|web 改动都会红，提示需治理签字)。
      # 它是首步且硬退，历史上会“遮蔽”后续真门禁(nullable/i18n/安全回归)使其根本不执行。
      # 评分补强 P10：给后续真门禁加 if: always()，确保每个功能 PR 上它们都真正运行并独立判定，
      #   不再被冻结探针的红遮蔽。冻结探针自身语义不变(仍硬红，团队评审后过)。
      - name: Check frozen boundaries
        env:
          FREEZE_BASE_REF: ${{ github.base_ref || 'main' }}
          # A merged main push is the reviewed release boundary. Keep PRs
          # strict, while allowing post-merge verification to run all gates.
          ALLOW_FREEZE_TOUCH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: node scripts/ci/check-freeze-boundaries.mjs

      - name: Check security regression signals
        if: always()
        env:
          SECURITY_BASE_REF: ${{ github.base_ref || 'main' }}
        run: node scripts/ci/check-security-regression.mjs

      - name: Check nullable-in-unique constraints
        if: always()
        run: node scripts/check-nullable-in-unique.js

      - name: Check i18n key parity & coverage (g-i18n)
        if: always()
        run: node scripts/check-i18n-keys.js

      - name: Install TypeScript for i18n AST gate
        if: always()
        run: npm install --no-save --ignore-scripts typescript@5

      - name: Check i18n hardcoded UI literal coverage
        if: always()
        run: node scripts/ci/check-i18n-hardcoded-literals.mjs --fail-on-uncovered

      - name: Check user role assignment atomicity
        if: always()
        run: node scripts/ci/check-user-role-assignment-atomicity.mjs

      - name: W5 closeout static gate
        if: always()
        env:
          FREEZE_BASE_REF: ${{ github.base_ref || 'main' }}
          SECURITY_BASE_REF: ${{ github.base_ref || 'main' }}
          ALLOW_FREEZE_TOUCH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: node scripts/ci/check-w5-closeout-gate.mjs
