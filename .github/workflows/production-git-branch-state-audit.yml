name: Production Git Branch State Audit

on:
  workflow_dispatch:
    inputs:
      confirm_readonly:
        description: 'Type RUN_PRODUCTION_GIT_BRANCH_STATE_AUDIT to authorize the read-only check'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-git-branch-state-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-readonly
    env:
      CONFIRM_READONLY: ${{ inputs.confirm_readonly }}
    steps:
      - name: Checkout approved target
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Validate manual invocation and runner binding
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM_READONLY" = RUN_PRODUCTION_GIT_BRANCH_STATE_AUDIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "AUDIT_TARGET_SHA=$GITHUB_SHA"

      - name: Capture detached rollback evidence
        run: |
          set -euo pipefail
          if grep -Fq 'git switch --detach "$PREV_SHA"' .github/workflows/deploy.yml; then
            echo 'DETACHED_ROLLBACK_PATH_PRESENT=true'
          else
            echo 'DETACHED_ROLLBACK_PATH_PRESENT=false'
          fi

      - name: Inspect production Git refs over read-only SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH
          timeout: 30s
          proxy_timeout: 30s
          command_timeout: 2m
          script: |
            set -Eeuo pipefail
            set +x
            cd "$DEPLOY_PATH"
            test "$(git rev-parse --is-inside-work-tree)" = true
            HEAD_SHA="$(git rev-parse HEAD)"
            BRANCH="$(git branch --show-current 2>/dev/null || true)"
            if [ -z "$BRANCH" ]; then HEAD_DETACHED=true; BRANCH=detached; else HEAD_DETACHED=false; fi
            if [ -n "$(git status --porcelain --untracked-files=all)" ]; then WORKTREE_CLEAN=false; else WORKTREE_CLEAN=true; fi
            echo "PRODUCTION_SHA=$HEAD_SHA"
            echo "PRODUCTION_BRANCH=$BRANCH"
            echo "HEAD_DETACHED=$HEAD_DETACHED"
            echo "WORKTREE_CLEAN=$WORKTREE_CLEAN"
            if git show-ref --verify --quiet refs/heads/main; then
              LOCAL_MAIN_EXISTS=true
              LOCAL_MAIN_SHA="$(git rev-parse refs/heads/main)"
            else
              LOCAL_MAIN_EXISTS=false
              LOCAL_MAIN_SHA=
            fi
            echo "LOCAL_MAIN_EXISTS=$LOCAL_MAIN_EXISTS"
            echo "LOCAL_MAIN_SHA=$LOCAL_MAIN_SHA"
            if [ "$LOCAL_MAIN_EXISTS" = true ]; then
              [ "$HEAD_SHA" = "$LOCAL_MAIN_SHA" ] && HEAD_EQUALS_LOCAL_MAIN=true || HEAD_EQUALS_LOCAL_MAIN=false
              git merge-base --is-ancestor "$HEAD_SHA" "$LOCAL_MAIN_SHA" && HEAD_IS_ANCESTOR_OF_LOCAL_MAIN=true || HEAD_IS_ANCESTOR_OF_LOCAL_MAIN=false
              git merge-base --is-ancestor "$LOCAL_MAIN_SHA" "$HEAD_SHA" && LOCAL_MAIN_IS_ANCESTOR_OF_HEAD=true || LOCAL_MAIN_IS_ANCESTOR_OF_HEAD=false
              HEAD_TREE="$(git rev-parse "$HEAD_SHA^{tree}")"
              LOCAL_MAIN_TREE="$(git rev-parse "$LOCAL_MAIN_SHA^{tree}")"
              [ "$HEAD_TREE" = "$LOCAL_MAIN_TREE" ] && HEAD_TREE_EQUALS_LOCAL_MAIN=true || HEAD_TREE_EQUALS_LOCAL_MAIN=false
            else
              HEAD_EQUALS_LOCAL_MAIN=false
              HEAD_IS_ANCESTOR_OF_LOCAL_MAIN=false
              LOCAL_MAIN_IS_ANCESTOR_OF_HEAD=false
              HEAD_TREE="$(git rev-parse "$HEAD_SHA^{tree}")"
              LOCAL_MAIN_TREE=
              HEAD_TREE_EQUALS_LOCAL_MAIN=false
            fi
            echo "HEAD_EQUALS_LOCAL_MAIN=$HEAD_EQUALS_LOCAL_MAIN"
            echo "HEAD_IS_ANCESTOR_OF_LOCAL_MAIN=$HEAD_IS_ANCESTOR_OF_LOCAL_MAIN"
            echo "LOCAL_MAIN_IS_ANCESTOR_OF_HEAD=$LOCAL_MAIN_IS_ANCESTOR_OF_HEAD"
            echo "HEAD_TREE=$HEAD_TREE"
            echo "LOCAL_MAIN_TREE=$LOCAL_MAIN_TREE"
            echo "HEAD_TREE_EQUALS_LOCAL_MAIN=$HEAD_TREE_EQUALS_LOCAL_MAIN"
            if git show-ref --verify --quiet refs/remotes/origin/main; then
              echo 'LOCAL_ORIGIN_MAIN_EXISTS=true'
              echo "LOCAL_ORIGIN_MAIN_SHA=$(git rev-parse refs/remotes/origin/main)"
            else
              echo 'LOCAL_ORIGIN_MAIN_EXISTS=false'
              echo 'LOCAL_ORIGIN_MAIN_SHA='
            fi
            REMOTE_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            test -n "$REMOTE_MAIN_SHA"
            echo "REMOTE_MAIN_SHA=$REMOTE_MAIN_SHA"
            # Keep repository identity parsing aligned with the proven remote diagnostic.
            # Only the normalized owner/repository is emitted; the raw URL is never printed.
            fingerprint_remote() {
              raw="$1"
              url_type=unknown
              host_class=unknown
              alias_github=false
              repository=UNKNOWN_REMOTE_FORMAT
              remote_host=
              remote_path=
              case "$raw" in
                ssh://*)
                  url_type=ssh_url
                  authority_path="${raw#ssh://}"
                  authority="${authority_path%%/*}"
                  remote_path="${authority_path#*/}"
                  remote_host="${authority##*@}"
                  remote_host="${remote_host%%:*}"
                  ;;
                https://*)
                  url_type=https_url
                  authority_path="${raw#https://}"
                  authority="${authority_path%%/*}"
                  remote_path="${authority_path#*/}"
                  remote_host="${authority##*@}"
                  remote_host="${remote_host%%:*}"
                  ;;
                http://*)
                  url_type=http_url
                  authority_path="${raw#http://}"
                  authority="${authority_path%%/*}"
                  remote_path="${authority_path#*/}"
                  remote_host="${authority##*@}"
                  remote_host="${remote_host%%:*}"
                  ;;
                git://*)
                  url_type=git_url
                  authority_path="${raw#git://}"
                  authority="${authority_path%%/*}"
                  remote_path="${authority_path#*/}"
                  remote_host="${authority##*@}"
                  remote_host="${remote_host%%:*}"
                  ;;
                git@*:*|*@*:*|[A-Za-z0-9._-]*:*)
                  url_type=scp_ssh
                  remote_host="${raw%%:*}"
                  remote_host="${remote_host##*@}"
                  remote_path="${raw#*:}"
                  ;;
                file://*) url_type=file_url ;;
                /*|./*|../*|~/*) url_type=local_path ;;
              esac
              case "$raw" in
                file://*|/*|./*|../*|~/*)
                  ORIGIN_URL_TYPE="$url_type"
                  ORIGIN_HOST_CLASS=none
                  ORIGIN_ALIAS_GITHUB=false
                  ORIGIN_REPOSITORY=NON_GITHUB_REMOTE
                  return
                  ;;
              esac
              if [ "$remote_host" = github.com ]; then
                host_class=github.com
              elif [ "$url_type" = scp_ssh ] || [ "$url_type" = ssh_url ]; then
                if command -v ssh >/dev/null 2>&1; then
                  resolved_host="$(ssh -G "$remote_host" 2>/dev/null | awk 'tolower($1)=="hostname" {print $2; exit}')"
                else
                  resolved_host=
                fi
                if [ "$resolved_host" = github.com ]; then
                  host_class=github_alias
                  alias_github=true
                else
                  host_class=other_host
                fi
              elif [ -n "$remote_host" ]; then
                host_class=other_host
              else
                host_class=none
              fi
              case "$remote_path" in
                ""|/*|*/|*//*|*\?*|*\#*|*/*/*|*..*|*[!A-Za-z0-9._/-]*) repository=UNKNOWN_REMOTE_FORMAT ;;
                *)
                  repository="${remote_path%.git}"
                  case "$repository" in */*) ;; *) repository=UNKNOWN_REMOTE_FORMAT ;; esac
                  ;;
              esac
              ORIGIN_URL_TYPE="$url_type"
              ORIGIN_HOST_CLASS="$host_class"
              ORIGIN_ALIAS_GITHUB="$alias_github"
              if [ "$host_class" = github.com ] || [ "$host_class" = github_alias ]; then
                ORIGIN_REPOSITORY="$repository"
              elif [ "$host_class" = other_host ]; then
                ORIGIN_REPOSITORY=NON_GITHUB_REMOTE
              else
                ORIGIN_REPOSITORY=UNKNOWN_REMOTE_FORMAT
              fi
            }
            ORIGIN_URL="$(git config --get remote.origin.url || true)"
            if [ -n "$ORIGIN_URL" ]; then
              ORIGIN_PRESENT=true
              fingerprint_remote "$ORIGIN_URL"
            else
              ORIGIN_PRESENT=false
              ORIGIN_URL_TYPE=unknown
              ORIGIN_HOST_CLASS=none
              ORIGIN_ALIAS_GITHUB=false
              ORIGIN_REPOSITORY=UNKNOWN_REMOTE_FORMAT
            fi
            [ "$ORIGIN_REPOSITORY" = "ivanzhao299/phoenix-erp-v3" ] && ORIGIN_MATCH=true || ORIGIN_MATCH=false
            ORIGIN_MATCHES_RELEASE_REPOSITORY="$ORIGIN_MATCH"
            echo "ORIGIN_PRESENT=$ORIGIN_PRESENT"
            echo "ORIGIN_URL_TYPE=$ORIGIN_URL_TYPE"
            echo "ORIGIN_HOST_CLASS=$ORIGIN_HOST_CLASS"
            echo "ORIGIN_REPOSITORY=$ORIGIN_REPOSITORY"
            echo "ORIGIN_MATCH=$ORIGIN_MATCH"
            echo "ORIGIN_MATCHES_RELEASE_REPOSITORY=$ORIGIN_MATCHES_RELEASE_REPOSITORY"
            MAIN_TRACKING_REMOTE="$(git config --get branch.main.remote || true)"
            MAIN_TRACKING_MERGE="$(git config --get branch.main.merge || true)"
            echo "MAIN_TRACKING_REMOTE=$MAIN_TRACKING_REMOTE"
            echo "MAIN_TRACKING_MERGE=$MAIN_TRACKING_MERGE"
            FETCH_VALID=false
            while IFS= read -r refspec; do
              [ "$refspec" = '+refs/heads/*:refs/remotes/origin/*' ] && FETCH_VALID=true
            done < <(git config --get-all remote.origin.fetch || true)
            echo "ORIGIN_FETCH_REFSPEC_VALID=$FETCH_VALID"
            if [ "$LOCAL_MAIN_SHA" = fb70fbad9a163d9e3cbb02a76506766babe89db2 ]; then
              echo 'LOCAL_MAIN_MATCHES_KNOWN_FAILED_DEPLOY_TARGET=true'
            else
              echo 'LOCAL_MAIN_MATCHES_KNOWN_FAILED_DEPLOY_TARGET=false'
            fi
