name: Chanjet House Alignment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to run'
        required: true
        default: readonly
        type: choice
        options:
          - readonly
          - pilot
      approve_readonly:
        description: 'Confirm production read-only audit (no Chanjet writes)'
        required: true
        default: false
        type: boolean
      approve_pilot:
        description: 'Approve one guarded production project canary'
        required: true
        default: false
        type: boolean
      pilot_confirmation:
        description: 'For pilot only: type CREATE_HOUSE_PROJECT_CANARY'
        required: false
        default: ''
      house_code:
        description: 'One exact reviewed ERP house target'
        required: true
        default: HOUSE_MS_01
        type: choice
        options:
          - HOUSE_MS_01
          - HOUSE_MS_02
          - HOUSE_MS_03
          - HOUSE_MS_04
          - HOUSE_MS_05
          - HOUSE_MS_06
          - HOUSE_DP_01
          - HOUSE_DP_02
          - HOUSE_DP_03
          - HOUSE_DP_04
          - HOUSE_DP_05
          - HOUSE_DP_06

concurrency:
  group: chanjet-house-alignment
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      (inputs.operation == 'readonly' && inputs.approve_readonly) ||
      (inputs.operation == 'pilot' && inputs.approve_pilot && inputs.pilot_confirmation == 'CREATE_HOUSE_PROJECT_CANARY')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate readonly audit scripts
        run: |
          node --check scripts/ops/mint-production-admin-token-over-ssh.mjs
          node --check scripts/ops/chanjet-house-alignment-readonly.mjs
          node --check scripts/ops/chanjet-house-project-pilot.mjs
          node --check scripts/ops/chanjet-house-project-rollout-policy.mjs
          node --test scripts/ops/chanjet-house-project-rollout-policy.test.mjs

      - name: Run targeted production readonly audit
        if: inputs.operation == 'readonly'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          DEPLOY_PROXY_HOST: ${{ secrets.DEPLOY_PROXY_HOST }}
          DEPLOY_PROXY_USER: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          DEPLOY_PROXY_SSH_KEY: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          TOKEN="$(node scripts/ops/mint-production-admin-token-over-ssh.mjs)"
          test -n "$TOKEN"
          PHOENIX_ADMIN_TOKEN="$TOKEN" node scripts/ops/chanjet-house-alignment-readonly.mjs \
            --execute \
            --api-base=https://erp.eggslao.com \
            --output-dir=docs/ops/runs

      - name: Run one guarded production project pilot
        if: inputs.operation == 'pilot'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          DEPLOY_PROXY_HOST: ${{ secrets.DEPLOY_PROXY_HOST }}
          DEPLOY_PROXY_USER: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          DEPLOY_PROXY_SSH_KEY: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          TOKEN="$(node scripts/ops/mint-production-admin-token-over-ssh.mjs)"
          test -n "$TOKEN"
          PHOENIX_ADMIN_TOKEN="$TOKEN" node scripts/ops/chanjet-house-project-pilot.mjs \
            --execute \
            --confirmation=CREATE_HOUSE_PROJECT_CANARY \
            --api-base=https://erp.eggslao.com \
            --house-code="${{ inputs.house_code }}" \
            --output-dir=docs/ops/runs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chanjet-house-alignment-${{ inputs.operation }}-${{ github.run_id }}
          path: |
            docs/ops/runs/chanjet-house-alignment-readonly-latest.json
            docs/ops/runs/chanjet-house-alignment-readonly-latest.md
            docs/ops/runs/chanjet-house-project-pilot-latest.json
          if-no-files-found: warn
          retention-days: 14
