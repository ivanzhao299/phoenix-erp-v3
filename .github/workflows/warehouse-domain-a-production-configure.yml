name: Warehouse Domain A Production Configure

on:
  workflow_dispatch:
    inputs:
      approve_production:
        description: Type APPROVE-WAREHOUSE-A-20260826
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: warehouse-domain-a-production-configure
  cancel-in-progress: false

jobs:
  configure:
    if: inputs.approve_production == 'APPROVE-WAREHOUSE-A-20260826'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Preflight, insert with RETURNING, and read-only verify
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "DEPLOY_CHECKOUT_SHA=$(git rev-parse HEAD)"

            echo '=== PHASE 1: READ-ONLY PREFLIGHT ==='
            docker compose exec -T -e PGOPTIONS='-c default_transaction_read_only=on' db \
              sh -c 'psql -X -v ON_ERROR_STOP=1 -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
            BEGIN TRANSACTION READ ONLY;
            DO $$ BEGIN
              IF (SELECT count(*) FROM wms_warehouses WHERE warehouse_code = ANY(ARRAY['LPH_DP_EGG_FARM','LPH_DP_EGG_SALES','LPH_DP_FEED','LPH_DP_MEDICINE'])) <> 0 THEN
                RAISE EXCEPTION 'target warehouse code already exists'; END IF;
              IF (SELECT count(*) FROM sys_user_warehouse_scopes) <> 0 THEN
                RAISE EXCEPTION 'explicit scope baseline changed from approved zero-row evidence'; END IF;
              IF (SELECT count(*) FROM sys_user WHERE status=1 AND username=ANY(ARRAY['fuqiang','linhong','liushanjun','zhuhuiran','songshoujiang','xuefeng','tangzhiwen','songmingguang'])) <> 8 THEN
                RAISE EXCEPTION 'approved ACTIVE user manifest mismatch'; END IF;
              IF (SELECT count(*) FROM wms_warehouses WHERE warehouse_code LIKE 'LPH_MS_%' AND domain='OPERATIONAL' AND status='ACTIVE') <> 7 THEN
                RAISE EXCEPTION 'Mengsai seven-warehouse baseline mismatch'; END IF;
              IF (SELECT count(*) FROM wms_warehouses WHERE warehouse_code='WH-0001' AND domain='TEST') <> 1 THEN
                RAISE EXCEPTION 'WH-0001 TEST baseline mismatch'; END IF;
            END $$;
            SELECT 'PREFLIGHT_COLUMNS' section,table_name,column_name,data_type,is_nullable,column_default
              FROM information_schema.columns WHERE table_schema='public' AND table_name IN
              ('wms_warehouses','wms_zones','wms_locations','sys_user_warehouse_scopes') ORDER BY table_name,ordinal_position;
            SELECT 'PREFLIGHT_USERS' section,user_id,username,status FROM sys_user
              WHERE username=ANY(ARRAY['fuqiang','linhong','liushanjun','zhuhuiran','songshoujiang','xuefeng','tangzhiwen','songmingguang']) ORDER BY username;
            ROLLBACK;
            SQL

            echo '=== PHASE 2: TRANSACTIONAL INSERT RETURNING ==='
            docker compose exec -T db \
              sh -c 'psql -X -v ON_ERROR_STOP=1 -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
            BEGIN;
            SET LOCAL lock_timeout='5s';
            SET LOCAL statement_timeout='60s';

            INSERT INTO wms_warehouses
              (warehouse_code,warehouse_name,warehouse_name_zh,warehouse_name_en,warehouse_name_lo,
               type,domain,status,company_code,site_code,remark)
            VALUES
              ('LPH_DP_EGG_FARM','Dongpeng Egg Farm Storage','东鹏农场鸡蛋暂存仓','Dongpeng Egg Farm Storage','ສາງເກັບໄຂ່ຊົ່ວຄາວຂອງຟາມ ຕົງເພັງ','EGG_FARM','OPERATIONAL','ACTIVE','COMP-LAO-XINGCHI','SITE-DONGPENG-LAYER','Warehouse A phase 2026-08-26; Lao full phrase pending local review'),
              ('LPH_DP_EGG_SALES','Dongpeng Egg Sales Inventory','东鹏鸡蛋销售成品仓','Dongpeng Egg Sales Inventory','ສາງສິນຄ້າສຳເລັດຮູບຂາຍໄຂ່ ຕົງເພັງ','EGG_SALES','OPERATIONAL','ACTIVE','COMP-LAO-XINGCHI','SITE-DONGPENG-LAYER','Warehouse A phase 2026-08-26; Lao full phrase pending local review'),
              ('LPH_DP_FEED','Dongpeng Feed Warehouse','东鹏饲料仓','Dongpeng Feed Warehouse','ສາງອາຫານສັດ ຕົງເພັງ','FEED','OPERATIONAL','ACTIVE','COMP-LAO-XINGCHI','SITE-DONGPENG-LAYER','Warehouse A phase 2026-08-26; Lao full phrase pending local review'),
              ('LPH_DP_MEDICINE','Dongpeng Medicine and Vaccine Warehouse','东鹏药品/疫苗仓','Dongpeng Medicine and Vaccine Warehouse','ສາງຢາ/ວັກຊີນ ຕົງເພັງ','MEDICINE','OPERATIONAL','ACTIVE','COMP-LAO-XINGCHI','SITE-DONGPENG-LAYER','Warehouse A phase 2026-08-26; Lao full phrase pending local review')
            RETURNING id,warehouse_code,warehouse_name_zh,warehouse_name_en,warehouse_name_lo,type,domain,status,company_code,site_code;

            INSERT INTO wms_zones (zone_code,zone_name,warehouse,warehouse_code,zone_type,status,store_code)
            VALUES
              ('DP-EF-Z01','东鹏蛋品暂存默认库区','LPH_DP_EGG_FARM','LPH_DP_EGG_FARM','NORMAL','ACTIVE','ALL'),
              ('DP-ES-Z01','东鹏销售成品默认库区','LPH_DP_EGG_SALES','LPH_DP_EGG_SALES','NORMAL','ACTIVE','ALL'),
              ('DP-FD-Z01','东鹏饲料默认库区','LPH_DP_FEED','LPH_DP_FEED','NORMAL','ACTIVE','ALL'),
              ('DP-MD-Z01','东鹏药品疫苗默认库区','LPH_DP_MEDICINE','LPH_DP_MEDICINE','NORMAL','ACTIVE','ALL')
            RETURNING id,zone_code,zone_name,warehouse_code,zone_type,status;

            INSERT INTO wms_locations (location_code,location_name,warehouse_code,zone_code,capacity_qty,status,store_code)
            VALUES
              ('DP-EF-L01','东鹏蛋品暂存默认库位','LPH_DP_EGG_FARM','DP-EF-Z01',0,'NORMAL','ALL'),
              ('DP-ES-L01','东鹏销售成品默认库位','LPH_DP_EGG_SALES','DP-ES-Z01',0,'NORMAL','ALL'),
              ('DP-FD-L01','东鹏饲料默认库位','LPH_DP_FEED','DP-FD-Z01',0,'NORMAL','ALL'),
              ('DP-MD-L01','东鹏药品疫苗默认库位','LPH_DP_MEDICINE','DP-MD-Z01',0,'NORMAL','ALL')
            RETURNING location_code,location_name,warehouse_code,zone_code,status;

            WITH approved(username,warehouse_code) AS (
              SELECT u, w FROM unnest(ARRAY['fuqiang','linhong','liushanjun','zhuhuiran']) u
                CROSS JOIN unnest(ARRAY['LPH_DP_EGG_FARM','LPH_DP_EGG_SALES','LPH_DP_FEED','LPH_DP_MEDICINE']) w
              UNION ALL
              SELECT u, w FROM unnest(ARRAY['songshoujiang','xuefeng','tangzhiwen','songmingguang']) u
                CROSS JOIN unnest(ARRAY['LPH_MS_EGG_FARM','LPH_MS_EGG_SALES','LPH_MS_FEED','LPH_MS_FINISHED','LPH_MS_MEDICINE','LPH_MS_PURCHASE','LPH_MS_RAW']) w
            )
            INSERT INTO sys_user_warehouse_scopes(user_id,warehouse_code)
            SELECT su.user_id,a.warehouse_code FROM approved a JOIN sys_user su ON su.username=a.username AND su.status=1
            RETURNING id,user_id,warehouse_code,created_at;

            DO $$ BEGIN
              IF (SELECT count(*) FROM wms_warehouses WHERE warehouse_code LIKE 'LPH_DP_%' AND domain='OPERATIONAL' AND status='ACTIVE' AND company_code='COMP-LAO-XINGCHI' AND site_code='SITE-DONGPENG-LAYER') <> 4 THEN RAISE EXCEPTION 'warehouse final assertion failed'; END IF;
              IF (SELECT count(*) FROM wms_zones WHERE warehouse_code LIKE 'LPH_DP_%' AND status='ACTIVE') <> 4 THEN RAISE EXCEPTION 'zone final assertion failed'; END IF;
              IF (SELECT count(*) FROM wms_locations WHERE warehouse_code LIKE 'LPH_DP_%' AND status='NORMAL') <> 4 THEN RAISE EXCEPTION 'location final assertion failed'; END IF;
              IF (SELECT count(*) FROM sys_user_warehouse_scopes) <> 44 THEN RAISE EXCEPTION 'scope final assertion failed'; END IF;
            END $$;
            COMMIT;
            SQL

            echo '=== PHASE 3: READ-ONLY VERIFY ==='
            docker compose exec -T -e PGOPTIONS='-c default_transaction_read_only=on' db \
              sh -c 'psql -X -v ON_ERROR_STOP=1 -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
            BEGIN TRANSACTION READ ONLY;
            SELECT 'WAREHOUSE_VERIFY' section,warehouse_code,warehouse_name_zh,warehouse_name_en,warehouse_name_lo,type,domain,status,company_code,site_code FROM wms_warehouses WHERE warehouse_code LIKE 'LPH_DP_%' ORDER BY warehouse_code;
            SELECT 'ZONE_VERIFY' section,zone_code,zone_name,warehouse_code,zone_type,status FROM wms_zones WHERE warehouse_code LIKE 'LPH_DP_%' ORDER BY warehouse_code;
            SELECT 'LOCATION_VERIFY' section,location_code,location_name,warehouse_code,zone_code,status FROM wms_locations WHERE warehouse_code LIKE 'LPH_DP_%' ORDER BY warehouse_code;
            SELECT 'SCOPE_VERIFY' section,u.username,string_agg(s.warehouse_code,',' ORDER BY s.warehouse_code) warehouses,count(*) rows FROM sys_user u JOIN sys_user_warehouse_scopes s ON s.user_id=u.user_id GROUP BY u.username ORDER BY u.username;
            SELECT 'ROLLBACK_SQL' section,'BEGIN; DELETE FROM sys_user_warehouse_scopes WHERE user_id IN (2,6,7,9,145,147,148,149) AND warehouse_code LIKE ''LPH_%''; DELETE FROM wms_locations WHERE warehouse_code LIKE ''LPH_DP_%''; DELETE FROM wms_zones WHERE warehouse_code LIKE ''LPH_DP_%''; DELETE FROM wms_warehouses WHERE warehouse_code LIKE ''LPH_DP_%''; COMMIT;' sql;
            ROLLBACK;
            SQL
