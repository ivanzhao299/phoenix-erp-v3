name: Production Disk Maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only audit or guarded cleanup
        type: choice
        options: [audit, cleanup, emergency-recover, incident-verify, repair-generated-worktree]
        default: audit
      approve_production:
        description: Confirm the production maintenance gate
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: phoenix-production-disk-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: inputs.approve_production == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Audit or clean only regenerable production artifacts
        uses: appleboy/ssh-action@v1
        env:
          ACTION: ${{ inputs.action }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          MAINTENANCE_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: ACTION,DEPLOY_PATH,MAINTENANCE_RUN_ID
          script: |
            set -Eeuo pipefail

            case "$DEPLOY_PATH" in
              '~/'*) DEPLOY_PATH="$HOME/${DEPLOY_PATH#\~/}";;
            esac
            cd "$DEPLOY_PATH"
            bash scripts/ops/require-phoenix-data-mount.sh

            report_disk() {
              echo "=== filesystem ==="
              df -hT /
              echo "=== Phoenix deploy, data, backup, and override directories ==="
              du -x -h --max-depth=2 "$DEPLOY_PATH" /data/phoenix-erp-data /opt/phoenix-erp-backups /opt/phoenix 2>/dev/null | sort -h | tail -n 80 || true
              echo "=== Docker usage ==="
              docker system df || true
              echo "=== Phoenix container log files ==="
              for container in phoenix-v3-db phoenix-v3-api phoenix-v3-web; do
                log_path="$(docker inspect --format '{{.LogPath}}' "$container" 2>/dev/null || true)"
                if [ -n "$log_path" ] && [ -f "$log_path" ]; then
                  du -h "$log_path"
                else
                  echo "$container: no json log file"
                fi
              done
              echo "=== journal usage ==="
              journalctl --disk-usage || true
              echo "=== migration backup inventory ==="
              find /opt/phoenix-erp-backups -mindepth 1 -maxdepth 1 -type d \
                -name 'deploy-pre-migration-*' -printf '%TY-%Tm-%Td %TH:%TM %s %p\n' 2>/dev/null | sort || true
            }

            echo "action=$ACTION"
            report_disk
            if [ "$ACTION" = incident-verify ]; then
              cd "$DEPLOY_PATH"
              echo "=== incident container state ==="
              docker ps -a --filter 'name=phoenix-v3-' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
              docker inspect --format '{{.Name}} restart={{.RestartCount}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' phoenix-v3-db phoenix-v3-api
              echo "=== recent database log ==="
              docker logs --since 10m --tail 120 phoenix-v3-db 2>&1 || true
              echo "=== recent API errors ==="
              docker logs --since 10m --tail 200 phoenix-v3-api 2>&1 | grep -E 'ERROR|FATAL|ECONN|Internal Server Error' || true
              echo "=== migration state (read only) ==="
              docker compose exec -T db sh -lc \
                'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "BEGIN TRANSACTION READ ONLY; SELECT timestamp || chr(9) || name FROM migrations WHERE timestamp = 1788337017420; COMMIT;"'
              echo "=== health ==="
              curl -fsS --max-time 20 http://127.0.0.1:3100/api/health
              echo
              exit 0
            fi
            if [ "$ACTION" = emergency-recover ]; then
              echo "=== incident container state before recovery ==="
              docker ps -a --filter 'name=phoenix-v3-' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
              for container in phoenix-v3-db phoenix-v3-api; do
                docker inspect --format '{{.Name}} restart={{.RestartCount}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container" || true
                docker logs --tail 120 "$container" 2>&1 || true
              done

              # Incident policy: deployment backups are immutable individually;
              # retain the newest three complete directories and remove older ones.
              mapfile -t obsolete_backups < <(
                find /opt/phoenix-erp-backups -mindepth 1 -maxdepth 1 -type d \
                  -name 'deploy-pre-migration-*' -printf '%T@ %p\n' 2>/dev/null \
                  | sort -nr | awk 'NR > 3 { sub(/^[^ ]+ /, ""); print }'
              )
              for backup_dir in "${obsolete_backups[@]}"; do
                case "$backup_dir" in
                  /opt/phoenix-erp-backups/deploy-pre-migration-*) ;;
                  *) echo "::error::Refusing unexpected backup path: $backup_dir"; exit 40 ;;
                esac
                rm -rf --one-file-system -- "$backup_dir"
                echo "removed old deploy backup: $backup_dir"
              done
              docker image prune -a -f || true
              docker buildx prune -a -f --keep-storage=1GB 2>/dev/null \
                || docker builder prune -a -f 2>/dev/null \
                || true
              journalctl --vacuum-size=256M || true

              echo "=== restart database and API ==="
              cd "$DEPLOY_PATH"
              docker compose restart db
              docker compose up -d --wait db
              docker compose restart api
              docker compose up -d --wait api

              echo "=== migration state (read only) ==="
              docker compose exec -T db sh -lc \
                'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT timestamp || chr(9) || name FROM migrations WHERE timestamp = 1788337017420;"'
              echo "=== recovery verification ==="
              docker ps -a --filter 'name=phoenix-v3-' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
              docker inspect --format '{{.Name}} restart={{.RestartCount}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' phoenix-v3-db phoenix-v3-api
              curl -fsS --max-time 20 http://127.0.0.1:3100/api/health
              echo
              report_disk
              exit 0
            fi
            if [ "$ACTION" = repair-generated-worktree ]; then
              cd "$DEPLOY_PATH"
              allowed_files=(
                docs/ops/runs/chanjet-readonly-mirror-sync-latest.json
                docs/ops/runs/chanjet-readonly-mirror-sync-latest.md
              )
              mapfile -t dirty_lines < <(git status --porcelain --untracked-files=all)
              if [ "${#dirty_lines[@]}" -eq 0 ]; then
                echo "✅ Production worktree already clean"
                exit 0
              fi
              for line in "${dirty_lines[@]}"; do
                status="${line:0:2}"
                path="${line:3}"
                if [ "$status" != ' M' ] && [ "$status" != 'M ' ]; then
                  echo "::error::Refusing worktree repair; unsupported git status '$status' for: $path"
                  exit 30
                fi
                allowed=false
                for candidate in "${allowed_files[@]}"; do
                  if [ "$path" = "$candidate" ]; then allowed=true; break; fi
                done
                if [ "$allowed" != true ]; then
                  echo "::error::Refusing worktree repair; unexpected dirty path: $path"
                  exit 31
                fi
              done

              archive_dir="/opt/phoenix-erp-backups/generated-worktree-${MAINTENANCE_RUN_ID}"
              mkdir -p "$archive_dir"
              chmod 700 "$archive_dir"
              for file in "${allowed_files[@]}"; do
                git ls-files --error-unmatch "$file" >/dev/null
                if ! git diff --quiet -- "$file"; then
                  if [ ! -f "$file" ]; then
                    echo "::error::Refusing worktree repair; generated report is not a regular file: $file"
                    exit 33
                  fi
                  cp -- "$file" "$archive_dir/$(basename "$file")"
                fi
              done
              find "$archive_dir" -maxdepth 1 -type f -exec sha256sum {} + > "$archive_dir/SHA256SUMS"
              chmod 600 "$archive_dir"/*

              git restore --source=HEAD --worktree -- "${allowed_files[@]}"
              if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
                echo "::error::Worktree remains dirty after exact generated-artifact repair"
                git status --short
                exit 32
              fi
              echo "✅ Archived generated reports to $archive_dir and restored clean worktree"
              exit 0
            fi
            [ "$ACTION" = cleanup ] || exit 0

            # Never prune volumes or running containers. Unused images and old
            # build cache are reproducible from GHCR/source.
            docker image prune -a -f || true
            docker buildx prune -f --filter 'until=168h' --keep-storage=2GB 2>/dev/null \
              || docker builder prune -f --filter 'until=168h' 2>/dev/null \
              || true

            # Keep the newest five migration backups regardless of age. Only
            # older deploy-generated backup directories past 30 days qualify.
            mapfile -t migration_backups < <(
              find /opt/phoenix-erp-backups -mindepth 1 -maxdepth 1 -type d \
                -name 'deploy-pre-migration-*' -printf '%T@ %p\n' 2>/dev/null \
                | sort -nr | awk 'NR > 5 { sub(/^[^ ]+ /, ""); print }'
            )
            for backup_dir in "${migration_backups[@]}"; do
              [ -n "$backup_dir" ] || continue
              [ "$(find "$backup_dir" -maxdepth 0 -type d -mtime +30 -print)" = "$backup_dir" ] || continue
              rm -rf --one-file-system "$backup_dir"
              echo "removed expired deploy backup: $backup_dir"
            done

            find /root -maxdepth 1 -type f -name 'nginx-erp.eggslao.com.pre-*.conf' -mtime +30 -delete 2>/dev/null || true
            journalctl --vacuum-size=256M || true

            echo "=== after cleanup ==="
            report_disk
