name: Production Ledger Preflight

on:
  workflow_dispatch:
    inputs:
      confirm_readonly:
        description: 'Type RUN_PRODUCTION_LEDGER_PREFLIGHT to authorize the read-only check'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-ledger-preflight
  cancel-in-progress: false

jobs:
  production-ledger-preflight:
    name: Production ledger preflight
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-readonly
    env:
      EXPECTED_SHA: ${{ github.sha }}
      CONFIRM_READONLY: ${{ inputs.confirm_readonly }}

    steps:
      - name: Checkout approved main commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate manual read-only invocation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM_READONLY" = RUN_PRODUCTION_LEDGER_PREFLIGHT
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --check scripts/ledger-preflight.mjs
          node --test scripts/ledger-preflight.test.mjs

      - name: Build candidate ledger inventory
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter phoenix-erp-v3-nest build
          node - <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const inventory = JSON.parse(execFileSync(process.execPath, ['scripts/ci/typeorm-migration-inventory.mjs', 'apps/api/dist/database/migrations'], { encoding: 'utf8' }));
          const canonicalLegacy = fs.readdirSync('apps/api/migrations').filter((name) => /^2026.*\.sql$/.test(name)).sort();
          const retiredTypeorm = JSON.parse(fs.readFileSync('scripts/ci/retired-typeorm-migrations.json', 'utf8'));
          fs.writeFileSync('/tmp/ledger-inventory.json', JSON.stringify({ canonicalTypeorm: inventory, canonicalLegacy, retiredTypeorm }));
          NODE
          echo "LEDGER_INVENTORY_B64=$(base64 -w0 /tmp/ledger-inventory.json)" >> "$GITHUB_ENV"
          echo "PREFLIGHT_SCRIPT_B64=$(base64 -w0 scripts/ledger-preflight.mjs)" >> "$GITHUB_ENV"

      - name: Run production ledger preflight over read-only SSH
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.sha }}
          LEDGER_INVENTORY_B64: ${{ env.LEDGER_INVENTORY_B64 }}
          PREFLIGHT_SCRIPT_B64: ${{ env.PREFLIGHT_SCRIPT_B64 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: EXPECTED_SHA,LEDGER_INVENTORY_B64,PREFLIGHT_SCRIPT_B64,DEPLOY_PATH
          command_timeout: 8m
          script: |
            set -Eeuo pipefail
            set +x
            cd "$DEPLOY_PATH"
            test -z "$(git status --porcelain --untracked-files=all)"
            test -n "$LEDGER_INVENTORY_B64"
            test -n "$PREFLIGHT_SCRIPT_B64"
            INVENTORY_FILE=$(mktemp)
            SCRIPT_FILE=$(mktemp)
            trap 'rm -f "$INVENTORY_FILE" "$SCRIPT_FILE"' EXIT
            printf '%s' "$LEDGER_INVENTORY_B64" | base64 -d > "$INVENTORY_FILE"
            printf '%s' "$PREFLIGHT_SCRIPT_B64" | base64 -d > "$SCRIPT_FILE"
            command -v node >/dev/null
            echo "target=production mode=pre-migration writes=disabled audit_sha=$EXPECTED_SHA production_sha=$(git rev-parse HEAD)"
            MIG_MODE=prod MIG_DIR=apps/api node "$SCRIPT_FILE" --mode pre-migration --inventory "$INVENTORY_FILE"
