name: Schema Object Manifest Runtime

on:
  pull_request:
    branches: [main, v3-admin]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres16-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: phoenix_v3
          POSTGRES_PASSWORD: phoenix_v3_pass
          POSTGRES_DB: phoenix_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phoenix_v3 -d phoenix_erp"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: phoenix_v3
      PGPASSWORD: phoenix_v3_pass
      PGDATABASE: phoenix_erp
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: phoenix_v3
      DB_PASSWORD: phoenix_v3_pass
      DB_NAME: phoenix_erp

    steps:
      - uses: actions/checkout@v5

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        working-directory: apps/api
        run: pnpm build

      - name: Construct canonical PG16 schema
        run: MIG_MODE=ci MIG_DIR=apps/api bash scripts/db-migrate.sh

      - name: Run NUL manifest framing probe
        run: |
          set -Eeuo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE ci_manifest_multiline_probe (id integer PRIMARY KEY, event_type text NOT NULL);
          ALTER TABLE ci_manifest_multiline_probe
            ADD CONSTRAINT ci_manifest_multiline_probe_check CHECK (
              CASE event_type
                WHEN 'A' THEN true
                WHEN 'B' THEN true
                ELSE false
              END
            );
          SQL
          schema_sql="$(cat scripts/ci/production-schema-fingerprint.sql)"
          psql -X -v ON_ERROR_STOP=1 -At -0 -c "$schema_sql" > "$RUNNER_TEMP/object-manifest.bin"
          test -s "$RUNNER_TEMP/object-manifest.bin"
          python3 - "$RUNNER_TEMP/object-manifest.bin" <<'PY'
          import pathlib, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          if b'\0' not in data:
              raise SystemExit('NUL manifest framing not detected')
          if b'CASE event_type' not in data:
              raise SystemExit('multiline CHECK probe missing from manifest')
          print('NUL_MANIFEST_FRAMING=PASS')
          PY
          node scripts/ci/schema-object-diff.mjs \
            --production "$RUNNER_TEMP/object-manifest.bin" \
            --canonical "$RUNNER_TEMP/object-manifest.bin" \
            --max-diff 200 | grep -F '"verdict": "NO_OBJECT_DRIFT"'
          echo "MULTILINE_CHECK_RUNTIME_PROBE=PASS"
