name: Daily Egg Inbound Duplicate Repair

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Approved repair phase
        required: true
        type: choice
        options: [preflight, apply, verify]
      repair_kind:
        description: Reviewed repair scope
        required: true
        type: choice
        options: [duplicate, overpost]
        default: duplicate
      approve_production:
        description: Type DAILY-EGG-REPAIR-20261103 to authorize
        required: true
        type: string
      expected_main_sha:
        description: Exact merged main SHA carrying this reviewed workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: daily-egg-inbound-repair
  cancel-in-progress: false

jobs:
  execute:
    if: (inputs.repair_kind == 'duplicate' && inputs.approve_production == 'DAILY-EGG-REPAIR-20261103') || (inputs.repair_kind == 'overpost' && inputs.approve_production == 'DAILY-EGG-OVERPOST-REPAIR-20261109')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - name: Validate reviewed binding
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"

      - name: Run ${{ inputs.phase }} over controlled SSH
        uses: appleboy/ssh-action@v1
        env:
          TARGET_SHA: ${{ github.sha }}
          PHASE: ${{ inputs.phase }}
          REPAIR_KIND: ${{ inputs.repair_kind }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: TARGET_SHA,PHASE,REPAIR_KIND
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            umask 077
            # The production contract pins the repository to /data/phoenix-erp;
            # never follow a stale DEPLOY_PATH secret into a generated checkout.
            REPO=/data/phoenix-erp
            STAGE="$(mktemp -d /tmp/daily-egg-repair-XXXXXX)"
            trap 'rm -rf "$STAGE"' EXIT
            cd "$REPO"
            git_safe() { command git -c safe.directory=$REPO -c core.hooksPath=/dev/null "$@"; }
            # The production object store only has fetched refs; stage the
            # reviewed target without moving the checked-out worktree.
            git_safe fetch --no-tags origin main
            test "$(git_safe rev-parse FETCH_HEAD)" = "$TARGET_SHA"
            git_safe cat-file -e "$TARGET_SHA^{commit}"
            # Everything the workflow executes is staged from the reviewed SHA,
            # never from the mutable production worktree.
            git_safe show "$TARGET_SHA:scripts/ops/audit-daily-egg-inbound.mjs" > "$STAGE/audit.mjs"

            if [ "$PHASE" = preflight ] || [ "$PHASE" = verify ]; then
              # The session is forced read-only server-side, so both phases can
              # share one audit body without any write risk.
              export DAILY_EGG_PSQL_CMD="docker exec -i -e PGOPTIONS='-c default_transaction_read_only=on' phoenix-v3-db sh -c 'exec psql -X -v ON_ERROR_STOP=1 -tA -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\"'"
              node "$STAGE/audit.mjs" --output-dir "$STAGE/out" --report "$STAGE/out/REPORT.md" || test $? -eq 2
              PHASE="$PHASE" node -e '
                const fs = require("fs");
                const env = require("node:process").env;
                const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                console.log(`conclusion=${result.conclusion} duplicate_source_groups=${result.duplicate_source_groups} overposted_grade_groups=${result.overposted_grade_groups} retired_duplicate_batches=${result.retired_duplicate_batches} unbalanced_production_batches=${result.unbalanced_production_batches} legacy_daily_farm_in_rows=${result.legacy_daily_farm_in_rows}`);
                if (env.PHASE === "preflight") {
                  if (result.duplicate_source_groups === 0 && result.overposted_grade_groups === 0 && result.daily_duplicate_groups === 0) { console.error("PREFLIGHT=NOTHING_TO_REPAIR"); process.exit(2); }
                  if (result.unbalanced_production_batches > 0) { console.error("PREFLIGHT=LEDGER_UNBALANCED_HOLD"); process.exit(2); }
                  for (const group of result.duplicate_sources) console.log(`REPAIR_CANDIDATE source=${group.source_no} company=${group.company_code} batches=${group.batch_count} qty=${group.total_qty}`);
                  for (const group of result.overposted_grades || []) console.log(`OVERPOSTED ${JSON.stringify(group)}`);
                  for (const group of result.daily_duplicates || []) console.log(`DAILY_DUPLICATE ${JSON.stringify(group)}`);
                  console.log("PREFLIGHT=REPAIR_ELIGIBLE");
                } else if (result.conclusion !== "GO") {
                  console.error("VERIFY=HOLD"); process.exit(2);
                } else {
                  console.log("VERIFY=GO");
                }
              ' "$STAGE/out/daily-egg-inbound-audit-latest.json"
              echo "--- report ---"
              cat "$STAGE/out/REPORT.md"
              exit 0
            fi

            # apply: replay the reviewed, transactional, self-asserting repair.
            REPAIR_SQL="scripts/ops/repair-daily-egg-inbound-duplicates.sql"
            if [ "$REPAIR_KIND" = "overpost" ]; then REPAIR_SQL="scripts/ops/repair-daily-egg-inbound-overpost.sql"; fi
            git_safe show "$TARGET_SHA:$REPAIR_SQL" \
              | docker exec -i phoenix-v3-db sh -c 'exec psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            echo "APPLY=COMMITTED"
