name: Chanjet controlled readonly restoration
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'audit/evidence are read-only; configuration and first sync require exact merged SHA approval'
        type: choice
        options: [audit, evidence, recovery, READONLY_VERIFY, first-sync, READONLY_ACTIVE, HOLD]
        default: audit
      approved_main_sha:
        description: 'Separately approved exact merged main and v3 floor SHA; audit records it as candidate metadata'
        required: true
        type: string
      expected_production_sha:
        description: 'Audit/evidence only: expected deployed API OCI revision; never used to update the production checkout'
        required: false
        type: string
        default: ''
      bound_run_id:
        description: 'Evidence only: original deploy transaction run id this collection is bound to (e.g. 38031441639-1)'
        required: false
        type: string
        default: ''
      approval_json:
        description: 'Reviewed non-secret book/company/scope/first-period approval; no credentials or payloads'
        type: string
        default: ''
      confirmation:
        description: 'AUDIT_CHANJET_READONLY or APPROVE_EXACT_CHANJET_READONLY_CONFIG'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cicd-refs/heads/main
  cancel-in-progress: false
jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'audit' || inputs.operation == 'evidence' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bind reviewed runner and operation
        env:
          OPERATION: ${{ inputs.operation }}
          APPROVED_SHA: ${{ inputs.approved_main_sha }}
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
          BOUND_RUN_ID: ${{ inputs.bound_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          APPROVAL_JSON: ${{ inputs.approval_json }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
          case "$OPERATION" in audit|evidence|recovery|READONLY_VERIFY|first-sync|READONLY_ACTIVE|HOLD) ;; *) exit 1 ;; esac
          if [ "$OPERATION" = audit ]; then
            test "$CONFIRMATION" = AUDIT_CHANJET_READONLY
            [[ "$APPROVED_SHA" = "$GITHUB_SHA" ]]
            [[ "$EXPECTED_PRODUCTION_SHA" =~ ^[a-f0-9]{40}$ ]]
          elif [ "$OPERATION" = evidence ]; then
            # R0 read-only evidence: bound to an approved ancestor SHA and the
            # original failed transaction run. Never updates production.
            test "$CONFIRMATION" = R0_EVIDENCE_CHANJET_READONLY
            [[ "$EXPECTED_PRODUCTION_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$BOUND_RUN_ID" =~ ^[0-9]+-[0-9]+$ ]]
            git merge-base --is-ancestor "$APPROVED_SHA" HEAD
          elif [ "$OPERATION" = recovery ]; then
            # One-time Case A transaction recovery. Requires merged main, the
            # original failed transaction's approved target SHA (deliberately
            # NOT this runner's GITHUB_SHA) and its run id. Production approval
            # stays behind the job's `environment: production` gate — configure
            # required reviewers there before first use.
            test "$GITHUB_REF" = refs/heads/main
            test "$CONFIRMATION" = APPROVE_EXACT_RECOVERY_TRANSACTION
            [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$BOUND_RUN_ID" =~ ^[0-9]+-[0-9]+$ ]]
          else
            test "$GITHUB_REF" = refs/heads/main
            test "$APPROVED_SHA" = "$GITHUB_SHA"
            test "$CONFIRMATION" = APPROVE_EXACT_CHANJET_READONLY_CONFIG
          fi
          {
            echo "CHANJET_APPROVAL_B64=$(printf '%s' "$APPROVAL_JSON" | base64 -w0)"
            echo "PRODUCTION_CONTRACT_B64=$(base64 -w0 scripts/ops/production-config-contract.json)"
            echo "PRODUCTION_PATH_HELPER_B64=$(base64 -w0 scripts/ops/production-trusted-paths.mjs)"
            echo "PRODUCTION_CONTROL_BOOTSTRAP_B64=$(base64 -w0 scripts/ops/production-control-bootstrap.sh)"
            echo "AUDIT_PROGRAM_B64=$(base64 -w0 scripts/ops/chanjet-readonly-production-audit.mjs)"
            echo "AUDIT_PROGRAM_SHA256=$(sha256sum scripts/ops/chanjet-readonly-production-audit.mjs | cut -d' ' -f1)"
            echo "AUDIT_SQL_B64=$(base64 -w0 scripts/ops/readonly-audits/chanjet-restoration-preflight.sql)"
            echo "AUDIT_SQL_SHA256=$(sha256sum scripts/ops/readonly-audits/chanjet-restoration-preflight.sql | cut -d' ' -f1)"
            echo "CANDIDATE_MAIN_SHA=$APPROVED_SHA"
            echo "EXPECTED_PRODUCTION_SHA=$EXPECTED_PRODUCTION_SHA"
          } >> "$GITHUB_ENV"
          if [ "$OPERATION" = evidence ]; then
            echo "PRODUCTION_EVIDENCE_PROGRAM_B64=$(base64 -w0 scripts/ops/readonly-production-evidence.mjs)" >> "$GITHUB_ENV"
            echo "PRODUCTION_EVIDENCE_PROGRAM_SHA256=$(sha256sum scripts/ops/readonly-production-evidence.mjs | cut -d' ' -f1)" >> "$GITHUB_ENV"
          fi
          if [ "$OPERATION" = recovery ]; then
            RECOVERY_TAR="$(mktemp)"
            tar -czf "$RECOVERY_TAR" -C scripts/ops production-deployment-recovery.mjs production-deployment-evidence.mjs production-config-guard.mjs production-deployment-state.mjs production-trusted-paths.mjs capture-production-runtime.mjs update-managed-chanjet-env.mjs chanjet-readonly-policy.mjs production-config-contract.json
            echo "RECOVERY_BUNDLE_B64=$(base64 -w0 "$RECOVERY_TAR")" >> "$GITHUB_ENV"
            echo "RECOVERY_BUNDLE_SHA256=$(sha256sum "$RECOVERY_TAR" | cut -d' ' -f1)" >> "$GITHUB_ENV"
            rm -f "$RECOVERY_TAR"
          fi
      - name: Formal production configuration transaction or read-only audit
        uses: appleboy/ssh-action@v1
        env:
          PRODUCTION_CONTRACT_B64: ${{ env.PRODUCTION_CONTRACT_B64 }}
          PRODUCTION_PATH_HELPER_B64: ${{ env.PRODUCTION_PATH_HELPER_B64 }}
          PRODUCTION_CONTROL_BOOTSTRAP_B64: ${{ env.PRODUCTION_CONTROL_BOOTSTRAP_B64 }}
          AUDIT_PROGRAM_B64: ${{ env.AUDIT_PROGRAM_B64 }}
          AUDIT_PROGRAM_SHA256: ${{ env.AUDIT_PROGRAM_SHA256 }}
          AUDIT_SQL_B64: ${{ env.AUDIT_SQL_B64 }}
          AUDIT_SQL_SHA256: ${{ env.AUDIT_SQL_SHA256 }}
          PRODUCTION_EVIDENCE_PROGRAM_B64: ${{ env.PRODUCTION_EVIDENCE_PROGRAM_B64 }}
          PRODUCTION_EVIDENCE_PROGRAM_SHA256: ${{ env.PRODUCTION_EVIDENCE_PROGRAM_SHA256 }}
          RECOVERY_BUNDLE_B64: ${{ env.RECOVERY_BUNDLE_B64 }}
          RECOVERY_BUNDLE_SHA256: ${{ env.RECOVERY_BUNDLE_SHA256 }}
          CHANJET_CONFIG_OPERATION: ${{ inputs.operation }}
          CHANJET_APPROVAL_B64: ${{ env.CHANJET_APPROVAL_B64 }}
          APPROVED_CONFIG_FLOOR_SHA: ${{ inputs.approved_main_sha }}
          TARGET_SHA: ${{ inputs.approved_main_sha }}
          CANDIDATE_MAIN_SHA: ${{ inputs.approved_main_sha }}
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
          BOUND_RUN_ID: ${{ inputs.bound_run_id }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          CHANJET_SYNC_OPERATOR_TOKEN: ${{ secrets.CHANJET_SYNC_OPERATOR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: PRODUCTION_CONTRACT_B64,PRODUCTION_PATH_HELPER_B64,PRODUCTION_CONTROL_BOOTSTRAP_B64,AUDIT_PROGRAM_B64,AUDIT_PROGRAM_SHA256,AUDIT_SQL_B64,AUDIT_SQL_SHA256,PRODUCTION_EVIDENCE_PROGRAM_B64,PRODUCTION_EVIDENCE_PROGRAM_SHA256,RECOVERY_BUNDLE_B64,RECOVERY_BUNDLE_SHA256,CHANJET_CONFIG_OPERATION,CHANJET_APPROVAL_B64,APPROVED_CONFIG_FLOOR_SHA,TARGET_SHA,CANDIDATE_MAIN_SHA,EXPECTED_PRODUCTION_SHA,BOUND_RUN_ID,DEPLOY_RUN_ID,CHANJET_SYNC_OPERATOR_TOKEN
          command_timeout: 12m
          script: |
            set -Eeuo pipefail
            set +x
            AUDIT_STAGE=SSH_CONNECTED
            audit_failure() { rc=$?; printf 'AUDIT_STAGE=%s class=COMMAND_FAILED exit=%s\n' "$AUDIT_STAGE" "$rc" >&2; exit "$rc"; }
            trap audit_failure ERR
            CHANJET_APPROVAL_JSON="$(printf '%s' "$CHANJET_APPROVAL_B64" | base64 -d)"
            export CHANJET_APPROVAL_JSON
            umask 077
            cd ${{ secrets.DEPLOY_PATH || '/data/phoenix-erp' }}
            DEPLOY_REPO_ROOT="$(pwd -P)"
            eval "$(printf '%s' "$PRODUCTION_CONTROL_BOOTSTRAP_B64" | base64 -d)"
            AUDIT_STAGE=CONTROL_BOOTSTRAP
            AUDIT_STAGE=LOCK_ACQUIRED
            export GIT_OPTIONAL_LOCKS=0
            git() { command git -c "safe.directory=$DEPLOY_REPO_ROOT" -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
            test "$(git branch --show-current)" = main
            test -z "$(git status --porcelain --untracked-files=all)"
            AUDIT_STAGE=TRUSTED_PATHS
            if [ "$CHANJET_CONFIG_OPERATION" = audit ]; then
              # Uses installed guard/identity; the reviewed audit bundle is never deployed.
              AUDIT_BUNDLE_STAGE="$STATE_DIR/readonly-audit-${DEPLOY_RUN_ID}"
              test ! -e "$AUDIT_BUNDLE_STAGE"
              mkdir -m 700 "$AUDIT_BUNDLE_STAGE"
              printf '%s' "$AUDIT_PROGRAM_B64" | base64 -d > "$AUDIT_BUNDLE_STAGE/audit.mjs"
              printf '%s' "$AUDIT_SQL_B64" | base64 -d > "$AUDIT_BUNDLE_STAGE/preflight.sql"
              chmod 600 "$AUDIT_BUNDLE_STAGE/audit.mjs" "$AUDIT_BUNDLE_STAGE/preflight.sql"
              test "$(sha256sum "$AUDIT_BUNDLE_STAGE/audit.mjs" | cut -d' ' -f1)" = "$AUDIT_PROGRAM_SHA256"
              test "$(sha256sum "$AUDIT_BUNDLE_STAGE/preflight.sql" | cut -d' ' -f1)" = "$AUDIT_SQL_SHA256"
              export EXPECTED_PRODUCTION_SHA CANDIDATE_MAIN_SHA
              node "$AUDIT_BUNDLE_STAGE/audit.mjs" "$AUDIT_BUNDLE_STAGE/preflight.sql"
              AUDIT_STAGE=COMPLETE
            elif [ "$CHANJET_CONFIG_OPERATION" = evidence ]; then
              # R0 read-only evidence: streamed via stdin, zero production disk
              # writes, no guardProduction call, no state mutation, no cleanup.
              test "$(printf '%s' "$PRODUCTION_EVIDENCE_PROGRAM_B64" | base64 -d | sha256sum | cut -d' ' -f1)" = "$PRODUCTION_EVIDENCE_PROGRAM_SHA256"
              printf '%s' "$PRODUCTION_EVIDENCE_PROGRAM_B64" | base64 -d | R0_DEPLOY_RUN_ID="$BOUND_RUN_ID" R0_TARGET_SHA="$APPROVED_CONFIG_FLOOR_SHA" node --input-type=module -
              AUDIT_STAGE=COMPLETE
            elif [ "$CHANJET_CONFIG_OPERATION" = recovery ]; then
              # One-time Case A recovery of the bound failed transaction. The
              # reviewed bundle is staged under the trusted state directory
              # (recovery mutates control state; staging follows the audit
              # precedent). RECOVERY_EXECUTE=true exists only on this path.
              AUDIT_STAGE=RECOVERY_BUNDLE
              RECOVERY_STAGE="$STATE_DIR/recovery-bundle-${DEPLOY_RUN_ID}"
              test ! -e "$RECOVERY_STAGE"
              mkdir -m 700 "$RECOVERY_STAGE"
              printf '%s' "$RECOVERY_BUNDLE_B64" | base64 -d > "$RECOVERY_STAGE/bundle.tgz"
              chmod 600 "$RECOVERY_STAGE/bundle.tgz"
              test "$(sha256sum "$RECOVERY_STAGE/bundle.tgz" | cut -d' ' -f1)" = "$RECOVERY_BUNDLE_SHA256"
              tar -xzf "$RECOVERY_STAGE/bundle.tgz" -C "$RECOVERY_STAGE"
              AUDIT_STAGE=RECOVERY
              RECOVERY_EXECUTE=true RECOVERY_TARGET_RUN_ID="$BOUND_RUN_ID" RECOVERY_APPROVED_SHA="$APPROVED_CONFIG_FLOOR_SHA" RECOVERY_RUN_ID="$DEPLOY_RUN_ID" \
                node "$RECOVERY_STAGE/production-deployment-recovery.mjs"
              AUDIT_STAGE=COMPLETE
            else
              AUDIT_STAGE=CHECKOUT_IDENTITY
              test "$(git rev-parse HEAD)" = "$TARGET_SHA"
              test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TARGET_SHA"
              if [ "$CHANJET_CONFIG_OPERATION" = first-sync ]; then
                node scripts/ops/chanjet-readonly-first-sync.mjs
              else
                node scripts/ops/chanjet-readonly-config-transaction.mjs
              fi
            fi
