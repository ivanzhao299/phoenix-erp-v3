name: Batch 2 protected CONFIG HOLD forensics
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [audit]
        default: audit
      approved_main_sha:
        required: true
        type: string
      approved_runner_sha:
        required: true
        type: string
      approved_program_sha256:
        required: true
        type: string
      approved_topology_sha256:
        required: true
        type: string
      confirmation:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cicd-refs/heads/main
  cancel-in-progress: false
jobs:
  forensic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/batch2-config-hold-forensic-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Validate exact diagnostic runner and target
        env:
          APPROVED_SHA: ${{ inputs.approved_main_sha }}
          APPROVED_RUNNER_SHA: ${{ inputs.approved_runner_sha }}
          APPROVED_PROGRAM_SHA256: ${{ inputs.approved_program_sha256 }}
          APPROVED_TOPOLOGY_SHA256: ${{ inputs.approved_topology_sha256 }}
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$OPERATION" = audit
          test "$CONFIRMATION" = READONLY_BATCH2_CONFIG_FORENSICS
          test "$APPROVED_SHA" = 9155dcccd7578288a2ccedc9f2ec3f0dd0bf1f7e
          [[ "$APPROVED_RUNNER_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APPROVED_PROGRAM_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$APPROVED_TOPOLOGY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$GITHUB_SHA" = "$APPROVED_RUNNER_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_RUNNER_SHA"
          test "$(sha256sum scripts/ops/batch2-config-hold-diagnostic.mjs | cut -d' ' -f1)" = "$APPROVED_PROGRAM_SHA256"
          test "$(sha256sum scripts/ops/maintenance-host-topology-diagnostic.mjs | cut -d' ' -f1)" = "$APPROVED_TOPOLOGY_SHA256"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          git merge-base --is-ancestor "$APPROVED_SHA" HEAD
          pnpm install --frozen-lockfile
          node --test scripts/ops/batch2-config-hold-diagnostic.test.mjs scripts/ops/maintenance-host-topology-diagnostic.test.mjs scripts/ci/pinned-readonly-ssh-transport.test.mjs scripts/ci/pinned-readonly-ssh-execution.test.mjs
          node scripts/ci/ledger-source-inventory.mjs "$APPROVED_SHA" "$RUNNER_TEMP/inventory.json"
          node --input-type=module - "$RUNNER_TEMP/inventory.json" <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const sha='9155dcccd7578288a2ccedc9f2ec3f0dd0bf1f7e';
          const read=p=>execFileSync('git',['show',sha+':'+p]);
          const inv=JSON.parse(fs.readFileSync(process.argv[2]));
          inv.retired=JSON.parse(read('scripts/ci/retired-typeorm-migrations.json'));
          inv.legacy=execFileSync('git',['ls-tree','-r','--name-only',sha,'apps/api/migrations'],{encoding:'utf8'}).trim().split('\n').filter(x=>/\/2026[^/]*\.sql$/.test(x)).map(x=>x.split('/').at(-1));
          const entries={
            PRODUCTION_CONTRACT_B64:read('scripts/ops/production-config-contract.json'),
            PRODUCTION_PATH_HELPER_B64:read('scripts/ops/production-trusted-paths.mjs'),
            PRODUCTION_CONTROL_BOOTSTRAP_B64:read('scripts/ops/production-control-bootstrap.sh'),
            FORENSIC_SCHEMA_CONTRACT_B64:read('apps/api/src/common/database/api-bootstrap-schema-contract.json'),
            FORENSIC_SCHEMA_HELPER_B64:read('scripts/ops/api-bootstrap-schema-preflight.mjs'),
            FORENSIC_INVENTORY_B64:Buffer.from(JSON.stringify(inv)),
            FORENSIC_PROGRAM_B64:fs.readFileSync('scripts/ops/batch2-config-hold-diagnostic.mjs'),
            FORENSIC_TOPOLOGY_B64:fs.readFileSync('scripts/ops/maintenance-host-topology-diagnostic.mjs'),
          };
          fs.writeFileSync(process.argv[2],JSON.stringify(inv));
          for(const [k,v] of Object.entries(entries))fs.appendFileSync(process.env.GITHUB_ENV,k+'='+v.toString('base64')+'\n');
          JS
          echo "FORENSIC_PROGRAM_SHA256=$APPROVED_PROGRAM_SHA256" >> "$GITHUB_ENV"
          echo "FORENSIC_TOPOLOGY_SHA256=$APPROVED_TOPOLOGY_SHA256" >> "$GITHUB_ENV"
      - name: Read production through existing root trusted paths and FD9
        id: production
        env:
          PRODUCTION_CONTRACT_B64: ${{ env.PRODUCTION_CONTRACT_B64 }}
          PRODUCTION_PATH_HELPER_B64: ${{ env.PRODUCTION_PATH_HELPER_B64 }}
          PRODUCTION_CONTROL_BOOTSTRAP_B64: ${{ env.PRODUCTION_CONTROL_BOOTSTRAP_B64 }}
          FORENSIC_SCHEMA_CONTRACT_B64: ${{ env.FORENSIC_SCHEMA_CONTRACT_B64 }}
          FORENSIC_SCHEMA_HELPER_B64: ${{ env.FORENSIC_SCHEMA_HELPER_B64 }}
          FORENSIC_INVENTORY_B64: ${{ env.FORENSIC_INVENTORY_B64 }}
          FORENSIC_PROGRAM_B64: ${{ env.FORENSIC_PROGRAM_B64 }}
          FORENSIC_PROGRAM_SHA256: ${{ env.FORENSIC_PROGRAM_SHA256 }}
          FORENSIC_TOPOLOGY_B64: ${{ env.FORENSIC_TOPOLOGY_B64 }}
          FORENSIC_TOPOLOGY_SHA256: ${{ env.FORENSIC_TOPOLOGY_SHA256 }}
          FORENSIC_TARGET_SHA: ${{ inputs.approved_main_sha }}
          FORENSIC_RUNNER_SHA: ${{ github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_PROXY_HOST: ${{ secrets.DEPLOY_PROXY_HOST }}
          APPROVED_RUNNER_SHA: ${{ inputs.approved_runner_sha }}
          APPROVED_PROGRAM_SHA256: ${{ inputs.approved_program_sha256 }}
          APPROVED_TOPOLOGY_SHA256: ${{ inputs.approved_topology_sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          if [ "$DEPLOY_HOST" != 47.236.122.224 ] || [ "$DEPLOY_PORT" != 22 ] || [ -n "$DEPLOY_PROXY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            # Export only approved booleans; never print protected input values.
            [ "$DEPLOY_HOST" = 47.236.122.224 ] && host_match=true || host_match=false
            [ "$DEPLOY_PORT" = 22 ] && port_match=true || port_match=false
            [ -z "$DEPLOY_PROXY_HOST" ] && proxy_absent=true || proxy_absent=false
            [ -n "$DEPLOY_SSH_KEY" ] && key_present=true || key_present=false
            printf 'READONLY_INPUT_STATUS host_match=%s port_match=%s proxy_absent=%s key_present=%s\n' "$host_match" "$port_match" "$proxy_absent" "$key_present"
            echo 'PINNED_READONLY_EXECUTION_HOLD=PROTECTED_CONNECTION_INPUT'
            exit 2
          fi
          transport_dir=$(mktemp -d "$RUNNER_TEMP/phoenix-readonly-ssh.XXXXXXXX")
          chmod 700 "$transport_dir"
          transport_identity=$(stat -c '%d:%i:%u:%g:%a' "$transport_dir")
          cleanup_transport() {
            if [ ! -L "$transport_dir" ] && [ "$(stat -c '%d:%i:%u:%g:%a' "$transport_dir" 2>/dev/null)" = "$transport_identity" ]; then
              rm -f -- "$transport_dir/identity" "$transport_dir/known_hosts"
              rmdir -- "$transport_dir"
            else
              echo 'PINNED_READONLY_EXECUTION_HOLD=RUNNER_CLEANUP_METADATA'
              return 2
            fi
          }
          trap cleanup_transport EXIT
          set -o noclobber
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$transport_dir/identity"
          set +o noclobber
          unset DEPLOY_SSH_KEY
          export READONLY_SSH_DIRECTORY="$transport_dir"
          export READONLY_SSH_IDENTITY="$transport_dir/identity"
          node scripts/ci/pinned-readonly-ssh-execution.mjs --execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch2-config-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/config-forensics
