name: Batch 2 protected CONFIG HOLD forensics
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [audit]
        default: audit
      approved_main_sha:
        required: true
        type: string
      confirmation:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cicd-refs/heads/main
  cancel-in-progress: false
jobs:
  forensic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/batch2-config-hold-forensic-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Validate exact diagnostic runner and target
        env:
          APPROVED_SHA: ${{ inputs.approved_main_sha }}
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$OPERATION" = audit
          test "$CONFIRMATION" = READONLY_BATCH2_CONFIG_FORENSICS
          test "$APPROVED_SHA" = 9155dcccd7578288a2ccedc9f2ec3f0dd0bf1f7e
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          git merge-base --is-ancestor "$APPROVED_SHA" HEAD
          pnpm install --frozen-lockfile
          node --test scripts/ops/batch2-config-hold-diagnostic.test.mjs
          node scripts/ci/ledger-source-inventory.mjs "$APPROVED_SHA" "$RUNNER_TEMP/inventory.json"
          node --input-type=module - "$RUNNER_TEMP/inventory.json" <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const sha='9155dcccd7578288a2ccedc9f2ec3f0dd0bf1f7e';
          const read=p=>execFileSync('git',['show',sha+':'+p]);
          const inv=JSON.parse(fs.readFileSync(process.argv[2]));
          inv.retired=JSON.parse(read('scripts/ci/retired-typeorm-migrations.json'));
          inv.legacy=execFileSync('git',['ls-tree','-r','--name-only',sha,'apps/api/migrations'],{encoding:'utf8'}).trim().split('\n').filter(x=>/\/2026[^/]*\.sql$/.test(x)).map(x=>x.split('/').at(-1));
          const entries={
            PRODUCTION_CONTRACT_B64:read('scripts/ops/production-config-contract.json'),
            PRODUCTION_PATH_HELPER_B64:read('scripts/ops/production-trusted-paths.mjs'),
            PRODUCTION_CONTROL_BOOTSTRAP_B64:read('scripts/ops/production-control-bootstrap.sh'),
            FORENSIC_SCHEMA_CONTRACT_B64:read('apps/api/src/common/database/api-bootstrap-schema-contract.json'),
            FORENSIC_SCHEMA_HELPER_B64:read('scripts/ops/api-bootstrap-schema-preflight.mjs'),
            FORENSIC_INVENTORY_B64:Buffer.from(JSON.stringify(inv)),
            FORENSIC_PROGRAM_B64:fs.readFileSync('scripts/ops/batch2-config-hold-diagnostic.mjs'),
          };
          for(const [k,v] of Object.entries(entries))fs.appendFileSync(process.env.GITHUB_ENV,k+'='+v.toString('base64')+'\n');
          JS
          echo "FORENSIC_PROGRAM_SHA256=$(sha256sum scripts/ops/batch2-config-hold-diagnostic.mjs | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Read production through existing root trusted paths and FD9
        id: production
        uses: appleboy/ssh-action@v1
        env:
          PRODUCTION_CONTRACT_B64: ${{ env.PRODUCTION_CONTRACT_B64 }}
          PRODUCTION_PATH_HELPER_B64: ${{ env.PRODUCTION_PATH_HELPER_B64 }}
          PRODUCTION_CONTROL_BOOTSTRAP_B64: ${{ env.PRODUCTION_CONTROL_BOOTSTRAP_B64 }}
          FORENSIC_SCHEMA_CONTRACT_B64: ${{ env.FORENSIC_SCHEMA_CONTRACT_B64 }}
          FORENSIC_SCHEMA_HELPER_B64: ${{ env.FORENSIC_SCHEMA_HELPER_B64 }}
          FORENSIC_INVENTORY_B64: ${{ env.FORENSIC_INVENTORY_B64 }}
          FORENSIC_PROGRAM_B64: ${{ env.FORENSIC_PROGRAM_B64 }}
          FORENSIC_PROGRAM_SHA256: ${{ env.FORENSIC_PROGRAM_SHA256 }}
          FORENSIC_TARGET_SHA: ${{ inputs.approved_main_sha }}
          FORENSIC_RUNNER_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          capture_stdout: true
          envs: PRODUCTION_CONTRACT_B64,PRODUCTION_PATH_HELPER_B64,PRODUCTION_CONTROL_BOOTSTRAP_B64,FORENSIC_SCHEMA_CONTRACT_B64,FORENSIC_SCHEMA_HELPER_B64,FORENSIC_INVENTORY_B64,FORENSIC_PROGRAM_B64,FORENSIC_PROGRAM_SHA256,FORENSIC_TARGET_SHA,FORENSIC_RUNNER_SHA
          command_timeout: 5m
          script: |
            set -Eeuo pipefail
            set +x
            cd /data/phoenix-erp
            DEPLOY_REPO_ROOT="$(pwd -P)"
            eval "$(printf '%s' "$PRODUCTION_CONTROL_BOOTSTRAP_B64" | base64 -d)"
            export GIT_OPTIONAL_LOCKS=0
            git() { command git -c "safe.directory=$DEPLOY_REPO_ROOT" -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
            test "$(git branch --show-current)" = main
            test -z "$(git status --porcelain --untracked-files=all)"
            test "$(printf '%s' "$FORENSIC_PROGRAM_B64" | base64 -d | sha256sum | cut -d' ' -f1)" = "$FORENSIC_PROGRAM_SHA256"
            printf '%s' "$FORENSIC_PROGRAM_B64" | base64 -d | node --input-type=module -
            echo FORENSIC_CONTROL_SHELL_COMPLETE=true
      - name: Preserve allowlisted diagnostic result on runner only
        if: always()
        env:
          REMOTE_STDOUT: ${{ steps.production.outputs.stdout }}
        run: |
          mkdir -p "$RUNNER_TEMP/config-forensics"
          node - "$RUNNER_TEMP/config-forensics/result.json" <<'JS'
          const fs=require('fs');
          const line=(process.env.REMOTE_STDOUT||'').split(/\r?\n/).find(x=>x.startsWith('CONFIG_FORENSICS_JSON='));
          if(!line)process.exit(1);
          const data=JSON.parse(line.slice('CONFIG_FORENSICS_JSON='.length));
          fs.writeFileSync(process.argv[2],JSON.stringify(data,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch2-config-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/config-forensics
