name: CI/CD — Build & Deploy

# ════════════════════════════════════════════════════════════════════════════
# 分层部署(2026-06-19 起):
#   mode=fast-css  3-10 s  仅 scp public/runtime-design-system.css(nginx 重载,无重启)
#   mode=web       2-5 min 只构建 web 镜像,只重启 web 容器,跳 db migration
#   mode=api       5-12 min 只构建 api 镜像,跑 migration,重启 api+web
#   mode=full      5-12 min 两镜像都构建,完整流程(部署 nginx 配 + 全测)
#
# 触发:
#   - push to main       自动 detect-changes、测试并构建镜像,不直接部署
#   - workflow_dispatch  管理员显式批准后部署(默认 auto)
#   - pull_request       只跑 test job(不部署)
#
# 自动判定规则(detect-changes job):
#   - 只改 apps/web/public/runtime-design-system.css                          → fast-css
#   - 只改 apps/web/** (无 deps/no api/no docker/no workflow/no nginx)        → web
#   - 只改 apps/api/** + DB / scripts/db-migrate.sh / TS 迁移                 → api
#   - 其余(混合 / deps / docker-compose / workflow / Dockerfile / nginx)      → full
# ════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "部署模式"
        type: choice
        options: [auto, fast-css, web, api, full]
        default: auto
      skip_deploy:
        description: "跳过部署步骤(仅构建)"
        type: boolean
        default: false
      preserve_artifacts:
        description: "保留备份/镜像，失败时只切换只读旧版本而不 reset 历史"
        type: boolean
        default: false
      one_time_config_floor_transition:
        description: "单独获批的首次配置下限过渡；要求已完成C3证据与full API+Web，旧API回滚仍HOLD"
        type: boolean
        default: false
      approved_config_floor_sha:
        description: "单独获批的 v2→v3 或 v3→v3' floor 精确 merged main SHA；只允许 api/HOLD，无 Web/DB 重建"
        type: string
        default: ''
      approved_previous_floor_sha:
        description: "v3→v3' floor 重锚定必填：当前 floor 的精确 SHA（重锚定前后双向绑定）"
        type: string
        default: ''
      rotate_chanjet_credentials:
        description: "显式批准五个受管理 Chanjet 凭据轮换；普通部署保持 .env 不写入"
        type: boolean
        default: false
      approve_production:
        description: "批准部署到生产环境（必选）"
        type: boolean
        default: false

# 最小权限:detect-changes 的 dorny/paths-filter 在 pull_request 上需读 PR 文件列表,
#   否则 listFiles 抛 "Resource not accessible by integration"。仅授只读,不放开写权。
permissions:
  contents: read
  pull-requests: read

# 同一 ref 串行执行部署。不能取消在途流水线：后续 web-only 修复若取消前一条
# api/full 部署，会造成仓库与 Web 已更新、API 仍停留旧 revision 的三端漂移。
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/phoenix-erp-v3

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # Job 0: detect-changes — 决定本次跑哪种 mode
  # 输出:
  #   mode        最终模式 fast-css / web / api / full
  #   build_web   true/false 是否构建 web
  #   build_api   true/false 是否构建 api
  #   run_test    true/false 是否跑 type-check + 回归测试
  #   run_mig     true/false 是否跑 DB 迁移
  # ════════════════════════════════════════════════════════════════════════
  detect-changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode:        ${{ steps.decide.outputs.mode }}
      build_web:   ${{ steps.decide.outputs.build_web }}
      build_api:   ${{ steps.decide.outputs.build_api }}
      run_test:    ${{ steps.decide.outputs.run_test }}
      run_mig:     ${{ steps.decide.outputs.run_mig }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2  # 至少 2 个 commit 才能 diff

      - name: Check chicken-house ownership writes
        run: node scripts/ci/check-house-ownership-writes.mjs

      - name: Detect ops-only audit change
        id: scope
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Baseline lifecycle may append a docs-only audit commit after an
          # application commit. Inspect the complete push range so the audit
          # commit cannot hide API/Web changes from deployment.
          base="$BEFORE_SHA"
          if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$' || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          files="$(git diff --name-only "$base" HEAD)"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Ev '^(docs/ops/|scripts/ops/)' >/dev/null; then
            echo "ops_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "ops_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute changed paths
        id: changes
        # workflow_dispatch 无 before/base_ref → paths-filter 退到字面量 'HEAD~1'
        # 会触发 `git fetch origin HEAD~1` 非法 refspec(exit 128)。手动触发改用
        # MANUAL_MODE 决策,无需 path diff,故此步在 dispatch 时跳过。
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          # base 用 HEAD~1(push) 或 PR base
          base: ${{ github.event.before || github.base_ref || 'HEAD~1' }}
          filters: |
            runtime_css:
              - 'apps/web/public/runtime-design-system.css'
            web_only:
              - 'apps/web/**'
              - '!apps/web/public/runtime-design-system.css'
            web_deps:
              - 'apps/web/package.json'
              - 'pnpm-lock.yaml'
            api_or_db:
              - 'apps/api/**'
              - 'apps/api/src/database/migrations/**'
              - 'scripts/db-migrate.sh'
            migration:
              - 'apps/api/src/database/migrations/**'
              - 'apps/api/migrations/**'
              - 'apps/api/ddl/**'
              - 'migrations/**'
              - 'scripts/db-migrate.sh'
              - 'scripts/deploy-schema-first.sh'
            infra:
              - 'docker-compose.yml'
              - 'apps/web/Dockerfile'
              - 'apps/api/Dockerfile'
              - '.github/workflows/**'
              - 'nginx/**'

      - name: Decide mode
        id: decide
        env:
          MANUAL_MODE: ${{ inputs.mode || 'auto' }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          IS_PUSH:    ${{ github.event_name == 'push' }}
          IS_PR:      ${{ github.event_name == 'pull_request' }}
          RUNTIME_CSS: ${{ steps.changes.outputs.runtime_css }}
          WEB_ONLY:    ${{ steps.changes.outputs.web_only }}
          WEB_DEPS:    ${{ steps.changes.outputs.web_deps }}
          API_OR_DB:   ${{ steps.changes.outputs.api_or_db }}
          MIGRATION_CHANGED: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.migration || 'false' }}
          APPROVED_CONFIG_FLOOR_SHA: ${{ inputs.approved_config_floor_sha || '' }}
          INFRA:       ${{ steps.changes.outputs.infra }}
          OPS_ONLY:    ${{ steps.scope.outputs.ops_only }}
        run: |
          # PR → 只跑测试,不部署
          if [ "$IS_PR" = "true" ]; then
            echo "mode=test-only" >> $GITHUB_OUTPUT
            echo "build_web=false" >> $GITHUB_OUTPUT
            echo "build_api=false" >> $GITHUB_OUTPUT
            echo "run_test=true" >> $GITHUB_OUTPUT
            echo "run_mig=false" >> $GITHUB_OUTPUT
            echo "::notice::PR 模式 → 仅 test"
            exit 0
          fi

          # 手动模式覆盖 auto
          if [ "$IS_DISPATCH" = "true" ] && [ "$MANUAL_MODE" = "auto" ]; then
            # 手动生产审批没有可靠的 push before SHA，auto 必须 fail-safe
            # 为 full，避免漏部署 API 或漏跑迁移。
            MODE="full"
            echo "::notice::手动批准 auto 模式 → full"
          elif [ "$MANUAL_MODE" != "auto" ]; then
            MODE="$MANUAL_MODE"
            echo "::notice::手动模式: $MODE"
          else
            # 自动判定 — 优先级 fast-css < web < api < full
            # Application/infra signals always win over ops-only. This is the
            # second fail-safe for multi-commit pushes ending in audit docs.
            if [ "$INFRA" = "true" ] || [ "$WEB_DEPS" = "true" ]; then
              MODE="full"
            elif [ "$API_OR_DB" = "true" ] && [ "$WEB_ONLY" = "true" ]; then
              MODE="full"  # api + web 同改 → 安全起见走 full
            elif [ "$API_OR_DB" = "true" ]; then
              MODE="api"
            elif [ "$WEB_ONLY" = "true" ]; then
              MODE="web"
            elif [ "$RUNTIME_CSS" = "true" ]; then
              MODE="fast-css"
            elif [ "$OPS_ONLY" = "true" ]; then
              MODE="ops-only"
            else
              MODE="web"  # 默认兜底(docs/scripts 改动) — web 部署最廉价
            fi
            echo "::notice::自动判定: $MODE  (runtime_css=$RUNTIME_CSS web_only=$WEB_ONLY web_deps=$WEB_DEPS api_or_db=$API_OR_DB infra=$INFRA)"
          fi

          if [ -n "$APPROVED_CONFIG_FLOOR_SHA" ] && [ "$MODE" != "api" ]; then
            echo "::error::approved_config_floor_sha 只允许 api 模式"
            exit 23
          fi

          # 输出衍生开关
          case "$MODE" in
            ops-only)
              echo "build_web=false" >> $GITHUB_OUTPUT
              echo "build_api=false" >> $GITHUB_OUTPUT
              echo "run_test=false"  >> $GITHUB_OUTPUT
              echo "run_mig=false"   >> $GITHUB_OUTPUT
              ;;
            fast-css)
              echo "build_web=false" >> $GITHUB_OUTPUT
              echo "build_api=false" >> $GITHUB_OUTPUT
              echo "run_test=false"  >> $GITHUB_OUTPUT  # 仅 CSS,跳测试加速
              echo "run_mig=false"   >> $GITHUB_OUTPUT
              ;;
            web)
              echo "build_web=true"  >> $GITHUB_OUTPUT
              echo "build_api=false" >> $GITHUB_OUTPUT
              echo "run_test=true"   >> $GITHUB_OUTPUT
              echo "run_mig=false"   >> $GITHUB_OUTPUT
              ;;
            api)
              echo "build_web=false" >> $GITHUB_OUTPUT
              echo "build_api=true"  >> $GITHUB_OUTPUT
              echo "run_test=true"   >> $GITHUB_OUTPUT
              # A floor promotion is an API-only code release. Its migration
              # path is independently checked from the running API revision;
              # never derive RUN_MIG=true merely because this is dispatch.
              if [ -n "$APPROVED_CONFIG_FLOOR_SHA" ]; then
                echo "run_mig=false" >> $GITHUB_OUTPUT
              else
                echo "run_mig=$MIGRATION_CHANGED" >> $GITHUB_OUTPUT
              fi
              ;;
            full|*)
              echo "build_web=true"  >> $GITHUB_OUTPUT
              echo "build_api=true"  >> $GITHUB_OUTPUT
              echo "run_test=true"   >> $GITHUB_OUTPUT
              echo "run_mig=$MIGRATION_CHANGED" >> $GITHUB_OUTPUT
              ;;
          esac
          echo "mode=$MODE" >> $GITHUB_OUTPUT

  # ════════════════════════════════════════════════════════════════════════
  # Job 1: Type-check & Regression(fast-css 跳过)
  # ════════════════════════════════════════════════════════════════════════
  test:
    name: Type-check & Regression
    needs: detect-changes
    if: needs.detect-changes.outputs.run_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # 评分补强 P11：16→18 对齐生产(PG18)与回归套件。此前 deploy 门禁跑 PG16，
        #   放过了 now()::text / substr 等 PG18 专属行为差异(曾致生产 500)。
        image: postgres:18-alpine
        env:
          POSTGRES_USER: phoenix_v3
          POSTGRES_PASSWORD: phoenix_v3_pass
          POSTGRES_DB: phoenix_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: phoenix_v3
      DB_PASSWORD: phoenix_v3_pass
      DB_NAME: phoenix_erp
      JWT_SECRET: ci_test_secret_minlen_32_characters_xx
      JWT_SECRET_PREV: ""
      NODE_ENV: test
      APP_ENV: test
      ENABLE_DEV_LOGIN: "true"
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: phoenix_v3
      PGPASSWORD: phoenix_v3_pass
      PGDATABASE: phoenix_erp

    steps:
      - uses: actions/checkout@v5

      - name: Lock top-level migrations/ allowlist (F5-1)
        run: |
          if [ ! -f migrations/.allowlist ]; then
            echo "::error::missing migrations/.allowlist (G36 治理基线缺失)"
            exit 1
          fi
          actual=$(ls migrations/ 2>/dev/null | grep -v '^\.allowlist$' | sort)
          expected=$(sort migrations/.allowlist)
          if ! diff <(echo "$actual") <(echo "$expected") > /tmp/_diff.log 2>&1; then
            echo "::error::❌ 顶级 migrations/ 文件清单与 allowlist 不符。新 SQL 必须放 apps/api/migrations/"
            cat /tmp/_diff.log
            exit 1
          fi
          echo "✅ 顶级 migrations/ 已锁定(46 个历史 SQL)"

      - name: Lock apps/api/migrations/ allowlist (g195-P5)
        run: |
          if [ ! -f apps/api/migrations/.allowlist ]; then
            echo "::error::missing apps/api/migrations/.allowlist (g195-P5 治理基线缺失)"
            exit 1
          fi
          actual=$(ls apps/api/migrations/ 2>/dev/null | grep -E '^2026.*\.sql$' | LC_ALL=C sort)
          expected=$(LC_ALL=C sort apps/api/migrations/.allowlist)
          if ! diff <(echo "$actual") <(echo "$expected") > /tmp/_p5_diff.log 2>&1; then
            echo "::error::❌ apps/api/migrations/ 文件清单与 .allowlist 不符。新 schema/数据迁移必须放 apps/api/src/database/migrations/(TS 迁移)"
            echo "见 apps/api/src/database/migrations/README.md 与 docs/migration-tooling-roadmap.md"
            cat /tmp/_p5_diff.log
            exit 1
          fi
          echo "✅ apps/api/migrations/ 已锁定(169 个 baseline 裸 SQL)"

      - name: Verify TS migrations implement down() (g195-P5)
        run: bash scripts/check-ts-migration-down.sh apps/api/src/database/migrations

      - name: Verify TS migrations no business data DML (g197-H)
        run: bash scripts/check-ts-migration-no-data-dml.sh apps/api/src/database/migrations

      - name: Install system tools (psql + jq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client jq

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Isolated Chanjet PostgreSQL restoration integration
        env:
          CHANJET_READONLY_FIXTURE_URL: postgresql://phoenix_v3:phoenix_v3_pass@127.0.0.1:5432/chanjet_restore_fixture
        run: |
          createdb chanjet_restore_fixture
          cd apps/api
          pnpm exec jest --runInBand --runTestsByPath src/modules/chanjet/chanjet-readonly-restoration.integration.spec.ts src/modules/chanjet/chanjet-readonly-lock-lifecycle.integration.spec.ts

      - name: Production config floor, environment and rollback contracts
        env:
          CHANJET_HASH_FIXTURE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace node:20-alpine node --test --test-name-pattern="real atomic env" scripts/ops/chanjet-readonly-restoration.test.mjs
          node --test scripts/ops/background-control*.test.mjs scripts/ops/background-deployment-session.test.mjs scripts/ops/production-m12-recovery.test.mjs scripts/ops/production-deployment-complete-cli.test.mjs scripts/ops/production-deployment-bundles.test.mjs scripts/ops/production-trusted-paths.test.mjs scripts/ops/production-env-update.test.mjs scripts/ops/production-rollback-state.test.mjs scripts/ops/production-deployment-evidence.test.mjs scripts/ops/production-deployment-recovery.test.mjs scripts/ops/chanjet-readonly-restoration.test.mjs scripts/ci/deploy-production-config.test.mjs scripts/ci/production-evidence-deploy-contract.test.mjs scripts/ci/phoenix-storage-migration.test.mjs
          pnpm --filter phoenix-erp-v3-nest test -- --runInBand src/modules/chanjet

      - name: Test migration ledger preflight (read-only fixtures)
        run: |
          node --check scripts/ledger-preflight.mjs
          node --test scripts/ledger-preflight.test.mjs

      - name: Test production identity diagnostic contract
        run: node --test scripts/ci/production-identity-diagnostic.test.mjs

      - name: Type-check API
        run: pnpm --filter phoenix-erp-v3-nest exec tsc --noEmit

      - name: Type-check Web
        run: pnpm --filter web run typecheck

      - name: Check nullable-in-unique constraints (g198)
        run: node scripts/check-nullable-in-unique.js

      - name: Check constraint drift (g201)
        run: node scripts/check-constraint-drift.js

      - name: Build API
        working-directory: apps/api
        run: pnpm build

      - name: Run DDL migrations
        working-directory: apps/api
        run: |
          export PGHOST="$DB_HOST" PGPORT="$DB_PORT" PGUSER="$DB_USER" PGPASSWORD="$DB_PASSWORD" PGDATABASE="$DB_NAME"
          MIG_MODE=ci MIG_DIR=. bash ../../scripts/db-migrate.sh
          NODE_ENV=test MIG_MODE=ci bash ../../scripts/ci/api-bootstrap-schema-fixture.sh

      - name: Audit full API lifecycle and startup mutation detector
        run: |
          node scripts/ci/check-api-bootstrap-side-effects.cjs
          node --test scripts/ci/api-bootstrap-static.test.mjs scripts/ops/api-bootstrap-schema-preflight.test.mjs

      - name: Production-equivalent isolated API bootstrap SQL proof
        id: bootstrap_sql
        env:
          BOOTSTRAP_FIXTURE_CONTAINER: ${{ job.services.postgres.id }}
          BOOTSTRAP_EVIDENCE_DIR: ${{ runner.temp }}/api-bootstrap-evidence
          BOOTSTRAP_FIXTURE_HTTP_PORT: '35179'
        run: |
          mkdir -m 700 "$BOOTSTRAP_EVIDENCE_DIR"
          bootstrap_setup_failure() {
            node -e 'const fs=require("node:fs");const file=process.env.BOOTSTRAP_EVIDENCE_DIR+"/summary.json";if(!fs.existsSync(file))fs.writeFileSync(file,JSON.stringify({outcome:"FAIL",failureCode:"BOOTSTRAP_FIXTURE_SETUP_FAILED"}),{mode:0o600});'
          }
          trap bootstrap_setup_failure ERR
          createdb --template=phoenix_erp api_bootstrap_fixture
          PGDATABASE=api_bootstrap_fixture node scripts/ci/api-bootstrap-mutations.mjs
          cd apps/api
          API_BOOTSTRAP_FIXTURE_URL=postgresql://phoenix_v3:phoenix_v3_pass@127.0.0.1:5432/api_bootstrap_fixture pnpm exec jest --runInBand --runTestsByPath src/common/database/bootstrap-crud.integration.spec.ts

      - name: Preserve sanitized API bootstrap proof
        if: always() && steps.bootstrap_sql.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: api-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-bootstrap-evidence/summary.json
          if-no-files-found: error

      - name: Check entity ↔ DB schema sync (g195-P6, HARD gate)
        id: entity_schema
        working-directory: apps/api
        run: |
          export PGHOST="$DB_HOST" PGPORT="$DB_PORT" PGUSER="$DB_USER" PGPASSWORD="$DB_PASSWORD" PGDATABASE="$DB_NAME"
          bash ../../scripts/check-entity-schema.sh ../../.github/entity-drift-baseline.txt "$RUNNER_TEMP/phoenix-entity-evidence"

      - name: Preserve current entity gate evidence
        if: always() && steps.entity_schema.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: entity-schema-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phoenix-entity-evidence/
          if-no-files-found: error

      - name: Start API with protected disposable background fixture
        working-directory: apps/api
        env:
          PORT: "3100"
          BACKGROUND_FIXTURE_POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          node --test ../../scripts/ci/background-control-api-fixture.test.mjs
          bash ../../scripts/ci/background-control-api-fixture.sh start

      - name: Regression — system
        working-directory: apps/api
        run: pnpm test:regr:system
      - name: Regression — breeding
        working-directory: apps/api
        run: pnpm test:regr:breeding
      - name: Regression — packaging
        working-directory: apps/api
        run: pnpm test:regr:packaging
      - name: Regression — wms
        working-directory: apps/api
        run: pnpm test:regr:wms
      - name: Regression — finance
        working-directory: apps/api
        run: pnpm test:regr:finance

      # 评分补强 P11 修正：部署阻断门禁只跑稳定核心 5 模块(system/breeding/packaging/wms/finance) + PG18，
      #   保持确定性。完整 9 模块(+pos-store/quality/pda/bi) 与 G5-C RBAC 巡检由 regression.yml
      #   (PR 门禁，权威 V3 回归套件) 覆盖——bi/quality/pos-store 走 probe-skip 自隔离、对 seed 完整度
      #   敏感(缺 farm_device_* / qa_standards.product_type 等漂移列即偶发红，见任务 #35-37)，
      #   放进会阻断生产部署的门禁会因偶发失败卡住上线，故不在此重复。

      - name: Dump API log on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/api.log" || true

      - name: Close owned background API fixture
        if: always()
        env:
          BACKGROUND_FIXTURE_POSTGRES_ID: ${{ job.services.postgres.id }}
        run: bash scripts/ci/background-control-api-fixture.sh cleanup

  # ════════════════════════════════════════════════════════════════════════
  # Job 2: Build & Push 镜像 — matrix 按 detect 输出动态裁剪
  # fast-css 完全跳过(空 matrix)
  # web/api 只构 1 个,full 构 2 个
  # ════════════════════════════════════════════════════════════════════════
  build-push:
    name: Build & Push ${{ matrix.target }}
    needs: [detect-changes, test]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.detect-changes.outputs.build_web == 'true' || needs.detect-changes.outputs.build_api == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        target: [api, web]
        # 用 exclude 跳过不需构建的(GH Actions 不支持 matrix include 的条件,故反向 exclude)
        # 这里写死全 matrix,在 step 里跳过,简单可靠
    permissions:
      contents: read
      packages: write

    steps:
      - name: Skip if this target not needed
        id: skip
        env:
          TARGET: ${{ matrix.target }}
          BUILD_API: ${{ needs.detect-changes.outputs.build_api }}
          BUILD_WEB: ${{ needs.detect-changes.outputs.build_web }}
        run: |
          if [ "$TARGET" = "api" ] && [ "$BUILD_API" != "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::skip api build (mode 不需要)"
          elif [ "$TARGET" = "web" ] && [ "$BUILD_WEB" != "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::skip web build (mode 不需要)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v5
        if: steps.skip.outputs.skip != 'true'

      - name: Log in to GHCR
        if: steps.skip.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        if: steps.skip.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}
          tags: |
            type=raw,value=latest
            # P5(评分补强)：除 latest 外，每次推一个不可变的 per-commit SHA tag 进 ghcr，
            #   作为确定的回滚目标（节点本地被 prune 也无妨，registry 保留）。
            #   回滚：docker compose 用 IMAGE_TAG=sha-<commit> 重拉旧镜像即可。
            type=sha,format=long,prefix=sha-

      - name: Build & push ${{ matrix.target }} image
        id: build
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.target }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_TARGET=http://api:3100
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to:   type=gha,scope=${{ matrix.target }},mode=max

      - name: Verify published API/Web OCI revision contract
        if: steps.skip.outputs.skip != 'true'
        env:
          PUBLISHED_IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}@${{ steps.build.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          docker pull "$PUBLISHED_IMAGE" >/dev/null
          ACTUAL_REVISION="$(docker image inspect "$PUBLISHED_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$ACTUAL_REVISION" = "$EXPECTED_REVISION"
          echo "OCI_REVISION_CONTRACT=PASS"

  # ════════════════════════════════════════════════════════════════════════
  # Job 3a: fast-css deploy — 仅 scp runtime-design-system.css(3-10s)
  # ════════════════════════════════════════════════════════════════════════
  deploy-fast-css:
    name: Deploy · fast-css (CSS hot patch)
    needs: detect-changes
    if: |
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.approve_production == true) &&
      needs.detect-changes.outputs.mode == 'fast-css' &&
      inputs.skip_deploy != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: scp runtime-design-system.css → /opt/phoenix/static-overrides/
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          source: "apps/web/public/runtime-design-system.css"
          target: "/opt/phoenix/static-overrides/"
          strip_components: 3  # 去掉 apps/web/public/ 三级

      - name: Verify(touch mtime + curl nginx)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          script: |
            set -e
            mkdir -p /opt/phoenix/static-overrides
            chmod 644 /opt/phoenix/static-overrides/runtime-design-system.css
            ls -la /opt/phoenix/static-overrides/runtime-design-system.css
            # nginx 不需 reload — alias 文件每次请求重读
            # 重置 mtime 让 Last-Modified 准
            touch /opt/phoenix/static-overrides/runtime-design-system.css
            # 验证 nginx 真返回 host-override
            echo "── curl 验证 ──"
            curl -sI https://erp.eggslao.com/runtime-design-system.css | grep -iE 'HTTP|cache-control|x-rds-source|last-modified|etag' || true
            echo "✅ fast-css deploy 完成"

      - name: Notify
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          WEBHOOK_TYPE: ${{ secrets.ALERT_WEBHOOK_TYPE || 'slack' }}
          STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          EMOJI=$( [ "$STATUS" = "success" ] && echo "🎨" || echo "🚨" )
          MSG="$EMOJI Phoenix ERP fast-css ${STATUS^^}\nsha=\`${SHA:0:8}\` by \`$ACTOR\`\n$RUN_URL"
          case "$WEBHOOK_TYPE" in
            feishu)   curl -sS -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"$MSG\"}}" || true ;;
            dingtalk) curl -sS -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$MSG\"}}" || true ;;
            *)        curl -sS -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' -d "{\"text\":\"$MSG\"}" || true ;;
          esac

  # ════════════════════════════════════════════════════════════════════════
  # Job 3b: web/api/full deploy — 完整 ssh 部署(按 mode 裁剪步骤)
  # ════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy · ${{ needs.detect-changes.outputs.mode }}
    needs: [detect-changes, build-push]
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.approve_production == true &&
      (needs.detect-changes.outputs.mode == 'web' || needs.detect-changes.outputs.mode == 'api' || needs.detect-changes.outputs.mode == 'full') &&
      needs.build-push.result == 'success' &&
      inputs.skip_deploy != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - name: Prepare reviewed production control payload
        run: |
          set -euo pipefail
          {
            echo "PRODUCTION_CONTRACT_B64=$(base64 -w0 scripts/ops/production-config-contract.json)"
            echo "PRODUCTION_PATH_HELPER_B64=$(base64 -w0 scripts/ops/production-trusted-paths.mjs)"
            echo "PRODUCTION_CONTROL_BOOTSTRAP_B64=$(base64 -w0 scripts/ops/production-control-bootstrap.sh)"
          } >> "$GITHUB_ENV"

      - name: Prepare nginx config (full mode only)
        id: nginx
        if: needs.detect-changes.outputs.mode == 'full'
        run: echo "conf=$(base64 -w0 nginx/erp.eggslao.com.conf)" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          PRODUCTION_CONTRACT_B64: ${{ env.PRODUCTION_CONTRACT_B64 }}
          PRODUCTION_PATH_HELPER_B64: ${{ env.PRODUCTION_PATH_HELPER_B64 }}
          PRODUCTION_CONTROL_BOOTSTRAP_B64: ${{ env.PRODUCTION_CONTROL_BOOTSTRAP_B64 }}
          DEPLOY_MODE: ${{ needs.detect-changes.outputs.mode }}
          BUILD_WEB:   ${{ needs.detect-changes.outputs.build_web }}
          BUILD_API:   ${{ needs.detect-changes.outputs.build_api }}
          RUN_MIG:     ${{ needs.detect-changes.outputs.run_mig }}
          NGINX_CONF:  ${{ steps.nginx.outputs.conf }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_SHA: ${{ github.sha }}
          PRESERVE_ARTIFACTS: ${{ inputs.preserve_artifacts }}
          ROTATE_CHANJET_CREDENTIALS: ${{ inputs.rotate_chanjet_credentials }}
          ONE_TIME_CONFIG_FLOOR_TRANSITION: ${{ inputs.one_time_config_floor_transition }}
          APPROVED_CONFIG_FLOOR_SHA: ${{ inputs.approved_config_floor_sha }}
          APPROVED_PREVIOUS_FLOOR_SHA: ${{ inputs.approved_previous_floor_sha }}
          GHCR_LOGIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_LOGIN_USER: ${{ github.repository_owner }}
          CHANJET_APP_KEY: ${{ secrets.CHANJET_APP_KEY }}
          CHANJET_APP_SECRET: ${{ secrets.CHANJET_APP_SECRET }}
          CHANJET_ORG_ID: ${{ secrets.CHANJET_ORG_ID }}
          CHANJET_CERT: ${{ secrets.CHANJET_CERT }}
          CHANJET_MSG_SECRET: ${{ secrets.CHANJET_MSG_SECRET }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: APPROVED_CONFIG_FLOOR_SHA,APPROVED_PREVIOUS_FLOOR_SHA,DEPLOY_MODE,BUILD_WEB,BUILD_API,RUN_MIG,NGINX_CONF,DEPLOY_RUN_ID,DEPLOY_RUN_ATTEMPT,TARGET_SHA,PRESERVE_ARTIFACTS,ROTATE_CHANJET_CREDENTIALS,ONE_TIME_CONFIG_FLOOR_TRANSITION,GHCR_LOGIN_TOKEN,GHCR_LOGIN_USER,CHANJET_APP_KEY,CHANJET_APP_SECRET,CHANJET_ORG_ID,CHANJET_CERT,CHANJET_MSG_SECRET,PRODUCTION_CONTRACT_B64,PRODUCTION_PATH_HELPER_B64,PRODUCTION_CONTROL_BOOTSTRAP_B64
          script: |
            set -Eeuo pipefail
            umask 077
            cd ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
            DEPLOY_REPO_ROOT="$(pwd -P)"
            # Validate all control ancestors before opening FD9; contract/helper come from this reviewed runner revision.
            eval "$(printf '%s' "$PRODUCTION_CONTROL_BOOTSTRAP_B64" | base64 -d)"

            # SSH can run as a different user from the checkout owner. Trust
            # only this approved physical checkout for these Git invocations;
            # keep global Git settings and the main/clean/SHA guards unchanged.
            DEPLOY_REPO_ROOT="$(pwd -P)"
            git() {
              command git -c "safe.directory=$DEPLOY_REPO_ROOT" "$@"
            }

            echo "════════════════════════════════════════════════"
            echo "  Deploy mode: $DEPLOY_MODE"
            echo "  build_web=$BUILD_WEB  build_api=$BUILD_API  run_mig=$RUN_MIG"
            echo "════════════════════════════════════════════════"

            # Floor promotions are API-only and must never inherit the
            # workflow-dispatch migration default. Check this before PRE,
            # floor state changes, or any database operation.
            if [ -n "${APPROVED_CONFIG_FLOOR_SHA:-}" ]; then
              test "$DEPLOY_MODE" = api || { echo "DEPLOY_EVIDENCE_HOLD=FLOOR_SCOPE"; exit 23; }
              test "$BUILD_API" = true || { echo "DEPLOY_EVIDENCE_HOLD=FLOOR_SCOPE"; exit 23; }
              test "$BUILD_WEB" = false || { echo "DEPLOY_EVIDENCE_HOLD=FLOOR_SCOPE"; exit 23; }
              test "$RUN_MIG" = false || { echo "DEPLOY_EVIDENCE_HOLD=MIGRATION_FLAG"; exit 24; }
            fi

            # API schema changes must retain evidence/DB and never clean backups.
            if [ "$BUILD_API" = "true" ]; then export PRESERVE_ARTIFACTS=true; fi
            API_SWITCH_STARTED=false
            WEB_SWITCH_STARTED=false
            CODE_SYNCED=false

            CURRENT_BRANCH="$(git symbolic-ref --short -q HEAD || true)"
            if [ "$CURRENT_BRANCH" != "main" ]; then
              echo "::error::生产服务器 Git 分支必须为 main,拒绝隐式修复分支状态"
              exit 22
            fi

            # Git/configuration stays at safe target even after image rollback.
            PREV_GIT_SHA="$(git rev-parse HEAD)"
            rollback_deploy() {
              rc=$?
              trap - ERR
              set +e
              echo "::error::Deploy failed; safe config retained; 数据库未自动覆盖恢复"
              if [ "${BACKGROUND_DEPLOYMENT_SUPERVISED:-false}" = true ]; then
                echo "ROLLBACK=HOLD_BACKGROUND_FENCE_REQUIRES_OPERATOR_RECOVERY"
                exit "$rc"
              fi
              if [ "$CODE_SYNCED" = true ] && [ -f "$STATE_DIR/deploy-${DEPLOY_RUN_ID}.json" ]; then
                # API below floor is explicitly ineligible. No legacy fence exception is granted here.
                PLAN="$(node scripts/ops/production-deployment-state.mjs rollback-plan)"
                if [ $? -ne 0 ]; then
                  echo "ROLLBACK=HOLD_OPERATOR_CONTROLLED_RECOVERY_REQUIRED"
                  exit "$rc"
                fi
                for service in api web; do
                  if printf '%s' "$PLAN" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>process.exit(JSON.parse(s).some(x=>x.service===process.argv[1])?0:1))' "$service"; then
                    node scripts/ops/production-deployment-state.mjs rollback-pin "$service" || exit "$rc"
                    docker compose up -d --no-deps --wait "$service" || exit "$rc"
                  fi
                done
                node scripts/ops/production-deployment-state.mjs rolled-back || exit "$rc"
              fi
              # Never automatically restore pre-floor Git, .env, DB, volumes or proxy config.
              exit "$rc"
            }
            docker() {
              if [ "${1:-}" = compose ]; then
                shift
                node scripts/ops/phoenix-production-compose.mjs "$@"
              else
                command env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin DOCKER_CONFIG=/home/phoenix-codex-deploy/.docker DOCKER_HOST=unix:///var/run/docker.sock docker "$@"
              fi
            }

            # ── 干净工作树硬门禁:禁止静默 stash/覆盖服务器改动 ───────
            if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
              echo "::error::生产服务器工作树不干净,拒绝部署"
              git status --short
              exit 20
            fi

            # Fetch exact merged target; capture actual runtime before code sync.
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$TARGET_SHA"
            git merge-base --is-ancestor "$PREV_GIT_SHA" "$TARGET_SHA"
            assert_target_main() {
              if [ "$BUILD_API" = true ]; then
                node "$BACKGROUND_STAGE/background-deployment-session.mjs" check-main
              fi
            }
            perform_deployment() {
            PRE_EVIDENCE_FILE="$STATE_DIR/deploy-${DEPLOY_RUN_ID}-pre-evidence.json"
            POST_EVIDENCE_FILE="$STATE_DIR/deploy-${DEPLOY_RUN_ID}-post-evidence.json"
            LOG_EVIDENCE_FILE="$STATE_DIR/deploy-${DEPLOY_RUN_ID}-startup-evidence.json"
            export DEPLOYMENT_EVIDENCE_PRE="$PRE_EVIDENCE_FILE" DEPLOYMENT_EVIDENCE_POST="$POST_EVIDENCE_FILE" DEPLOYMENT_EVIDENCE_LOG="$LOG_EVIDENCE_FILE"
            # Validate target tree BEFORE replacing the current safe config.
            # C3 must first install the approved floor; legacy checkout is not auto-reconciled.
            if [ -n "${APPROVED_CONFIG_FLOOR_SHA:-}" ]; then
              test "$APPROVED_CONFIG_FLOOR_SHA" = "$TARGET_SHA"
              test "$DEPLOY_MODE" = api
              test "$BUILD_API" = true
              test "$BUILD_WEB" = false
              test "${ROTATE_CHANJET_CREDENTIALS:-false}" != true
              test "${ONE_TIME_CONFIG_FLOOR_TRANSITION:-false}" != true
              FLOOR_STAGE="$STATE_DIR/floor-stage-${DEPLOY_RUN_ID}"
              test ! -e "$FLOOR_STAGE"
              mkdir -m 700 "$FLOOR_STAGE"
              for helper in production-config-contract.json production-config-guard.mjs production-deployment-state.mjs production-atomic-state.mjs production-trusted-paths.mjs capture-production-runtime.mjs update-managed-chanjet-env.mjs chanjet-readonly-policy.mjs api-bootstrap-schema-preflight.mjs promote-production-config-floor.mjs chanjet-admission-schema-receipt.mjs production-maintenance-admission.mjs production-maintenance-receipts.mjs production-maintenance-transition.mjs background-control-legacy-transition.mjs background-control-manifest.mjs; do
                git show "$TARGET_SHA:scripts/ops/$helper" > "$FLOOR_STAGE/$helper"
                chmod 600 "$FLOOR_STAGE/$helper"
              done
              git show "$TARGET_SHA:scripts/ops/production-deployment-evidence.mjs" > "$FLOOR_STAGE/production-deployment-evidence.mjs"
              chmod 600 "$FLOOR_STAGE/production-deployment-evidence.mjs"
              git show "$TARGET_SHA:apps/api/src/common/database/api-bootstrap-schema-contract.json" > "$FLOOR_STAGE/api-bootstrap-schema-contract.json"
              chmod 600 "$FLOOR_STAGE/api-bootstrap-schema-contract.json"
              EVIDENCE_PHASE=PRE_SNAPSHOT node "$FLOOR_STAGE/production-deployment-evidence.mjs" capture "$PRE_EVIDENCE_FILE"
              assert_target_main
              node "$FLOOR_STAGE/promote-production-config-floor.mjs"
            else
              node scripts/ops/production-config-guard.mjs --target "$TARGET_SHA"
              # Stage the target evidence module with its entire import closure.
              # A lone .mjs in STATE_DIR cannot resolve relative shared helpers.
              EVIDENCE_STAGE="$STATE_DIR/evidence-stage-${DEPLOY_RUN_ID}"
              test ! -e "$EVIDENCE_STAGE"
              mkdir -m 700 "$EVIDENCE_STAGE"
              for helper in production-deployment-evidence.mjs production-atomic-state.mjs production-config-contract.json production-config-guard.mjs production-trusted-paths.mjs capture-production-runtime.mjs update-managed-chanjet-env.mjs chanjet-readonly-policy.mjs chanjet-admission-schema-receipt.mjs production-maintenance-admission.mjs production-maintenance-receipts.mjs production-maintenance-transition.mjs background-control-legacy-transition.mjs background-control-manifest.mjs; do
                git show "$TARGET_SHA:scripts/ops/$helper" > "$EVIDENCE_STAGE/$helper"
                chmod 600 "$EVIDENCE_STAGE/$helper"
              done
              EVIDENCE_HELPER="$EVIDENCE_STAGE/production-deployment-evidence.mjs"
              EVIDENCE_PHASE=PRE_SNAPSHOT node "$EVIDENCE_HELPER" capture "$PRE_EVIDENCE_FILE"
            fi
            test ! -e "$STATE_DIR/run-${DEPLOY_RUN_ID}"
            mkdir -m 700 "$STATE_DIR/run-${DEPLOY_RUN_ID}"
            CAPTURE_FILE="$STATE_DIR/run-${DEPLOY_RUN_ID}/runtime-before.json"
            git show "$TARGET_SHA:scripts/ops/capture-production-runtime.mjs" > "$STATE_DIR/run-${DEPLOY_RUN_ID}/capture.mjs"
            node "$STATE_DIR/run-${DEPLOY_RUN_ID}/capture.mjs" > "$CAPTURE_FILE"
            chmod 600 "$CAPTURE_FILE"
            trap rollback_deploy ERR

            # ── 同步代码(必须先 pull,否则下面 cp 仓库新文件会找不到)──
            assert_target_main
            git merge --ff-only origin/main
            if [ "$(git rev-parse HEAD)" != "$TARGET_SHA" ]; then
              echo "::error::服务器代码版本与目标 SHA 不一致"
              exit 21
            fi
            CODE_SYNCED=true
            echo "✅ Code synced"

            # In bind-mount mode, stop before any Compose operation if /data
            # is absent, the sentinel is missing, or the configured paths are
            # not on the mounted filesystem. Named-volume mode remains a no-op.
            bash scripts/ops/require-phoenix-data-mount.sh

            # First-class running API revision baseline; begin rejects missing/nonancestor
            # identity and any migration paths. Schema releases use the separate controlled track.
            node scripts/ops/production-deployment-state.mjs begin "$CAPTURE_FILE"
            RUN_MIG=false
            echo "MIGRATION_BASELINE_SOURCE=RUNNING_API_REVISION; RUN_MIG=false"

            # 首次部署兜底:确保 runtime-design-system.css alias 目录 + 种子文件存在
            # API-only must not create or replace shared Web override content.
            if [ "$BUILD_WEB" = true ]; then
            mkdir -p /opt/phoenix/static-overrides
            if [ ! -f /opt/phoenix/static-overrides/runtime-design-system.css ]; then
              # 用仓库内默认占位版作种子(后续 fast-css 才能 scp 覆盖)
              if [ -f apps/web/public/runtime-design-system.css ]; then
                cp apps/web/public/runtime-design-system.css /opt/phoenix/static-overrides/ \
                  && chmod 644 /opt/phoenix/static-overrides/runtime-design-system.css \
                  && echo "✅ runtime-design-system.css 占位文件已创建"
              else
                # 仓库还没这文件(罕见,旧分支):写一个空占位防 nginx 404
                : > /opt/phoenix/static-overrides/runtime-design-system.css
                chmod 644 /opt/phoenix/static-overrides/runtime-design-system.css
                echo "⚠ 仓库无 runtime-design-system.css 源文件,写空占位"
              fi
            fi
            fi

            # Ordinary code deployment does not rewrite production .env.
            if [ "${ROTATE_CHANJET_CREDENTIALS:-false}" = true ]; then
              export PHOENIX_ENV_STAGING_DIRECTORY=/data/.phoenix-env-staging
              node scripts/ops/update-managed-chanjet-env.mjs
            fi
            # Protected active/rollback image IDs are retained; no broad image prune.

            printf '%s' "$GHCR_LOGIN_TOKEN" | \
              docker login ghcr.io -u "$GHCR_LOGIN_USER" --password-stdin
            unset GHCR_LOGIN_TOKEN

            # ── 按 mode 决定拉哪些镜像 ────────────────────────────────
            if [ "$BUILD_API" = "true" ]; then
              export API_IMAGE="ghcr.io/${{ github.repository_owner }}/phoenix-erp-v3/api:sha-${TARGET_SHA}"
              docker compose pull api
              node scripts/ops/production-deployment-state.mjs candidate api "$API_IMAGE"
              # Inventory must come from the candidate image that will execute
              # TypeORM, never from the currently running API container.
              CANDIDATE_LEDGER_INVENTORY="$(mktemp)"
              trap 'rm -f "$CANDIDATE_LEDGER_INVENTORY"' EXIT
              CANDIDATE_TYPEORM_JSON="$(bash scripts/ci/candidate-typeorm-inventory.sh "$API_IMAGE")"
              node -e 'const fs=require("fs"); const canonicalLegacy=fs.readdirSync("apps/api/migrations").filter(n=>/^2026.*\\.sql$/.test(n)).sort(); const retiredTypeorm=JSON.parse(fs.readFileSync("scripts/ci/retired-typeorm-migrations.json","utf8")); fs.writeFileSync(process.argv[1], JSON.stringify({canonicalTypeorm:JSON.parse(process.argv[2]),canonicalLegacy,retiredTypeorm}));' "$CANDIDATE_LEDGER_INVENTORY" "$CANDIDATE_TYPEORM_JSON"
            fi
            if [ "$BUILD_WEB" = "true" ]; then
              export WEB_IMAGE="ghcr.io/${{ github.repository_owner }}/phoenix-erp-v3/web:sha-${TARGET_SHA}"
              docker compose pull web
              node scripts/ops/production-deployment-state.mjs candidate web "$WEB_IMAGE"
            fi

            # ── DB(所有 mode 都需要):幂等启动 ─────────────────────────
            # Code-only releases never restart/recreate DB (could indirectly restart a legacy API).
            test "$(docker inspect phoenix-v3-db --format '{{.State.Health.Status}}')" = healthy
            echo "✅ DB healthy"

            # ── DB 迁移(仅 api/full)─────────────────────────────────
            if [ "$RUN_MIG" = "true" ]; then
              # PostgreSQL must have room for both the custom dump and migration
              # index/WAL writes. Fail before creating another backup when the
              # root filesystem has less than 2 GiB available.
              AVAILABLE_KB="$(df -Pk / | awk 'NR == 2 { print $4 }')"
              if [ "${AVAILABLE_KB:-0}" -lt 2097152 ]; then
                echo "::error::Insufficient production disk space before migration: ${AVAILABLE_KB:-0} KiB available (minimum 2097152 KiB)"
                df -h /
                exit 28
              fi
              BACKUP_DIR="/opt/phoenix-erp-backups/deploy-pre-migration-${DEPLOY_RUN_ID}"
              BACKUP_FILE="${BACKUP_DIR}/phoenix_erp_pre_${TARGET_SHA:0:12}.dump"
              mkdir -p "$BACKUP_DIR"
              chmod 700 "$BACKUP_DIR"
              echo "── 迁移前强制备份: $BACKUP_FILE ──"
              docker compose exec -T db sh -c \
                'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --format=custom --compress=6 --no-owner --no-privileges' \
                > "$BACKUP_FILE"
              chmod 600 "$BACKUP_FILE"
              test -s "$BACKUP_FILE"
              TOC_ENTRIES="$(docker compose exec -T db pg_restore --list < "$BACKUP_FILE" | grep -cvE '^;|^$')"
              test "${TOC_ENTRIES:-0}" -gt 0
              sha256sum "$BACKUP_FILE" | tee "${BACKUP_FILE}.sha256"
              chmod 600 "${BACKUP_FILE}.sha256"
              echo "✅ 迁移前备份可读: ${TOC_ENTRIES} objects"

              # Read-only ledger reconciliation. This must block before any
              # migration SQL if legacy and TypeORM history are inconsistent.
              echo "── 迁移前只读 ledger preflight ──"
              test -s "${CANDIDATE_LEDGER_INVENTORY:-}"
              MIG_MODE=prod MIG_DIR=apps/api node scripts/ledger-preflight.mjs --mode pre-migration --inventory "$CANDIDATE_LEDGER_INVENTORY" | tee "${BACKUP_DIR}/ledger-preflight.json"
              node scripts/ci/phase1-generic-deploy-guard.mjs "${BACKUP_DIR}/ledger-preflight.json" scripts/ci/phase1-production-migration-manifest.json
              echo "✅ migration ledger preflight passed"

              # Keep exactly the newest three verified deploy backups. The
              # individual retained dumps remain untouched and recoverable.
              mapfile -t OBSOLETE_BACKUPS < <(
                find /opt/phoenix-erp-backups -mindepth 1 -maxdepth 1 -type d \
                  -name 'deploy-pre-migration-*' -printf '%T@ %p\n' \
                  | sort -nr | awk 'NR > 3 { sub(/^[^ ]+ /, ""); print }'
              )
              if [ "$PRESERVE_ARTIFACTS" != "true" ]; then
              for OLD_BACKUP_DIR in "${OBSOLETE_BACKUPS[@]}"; do
                case "$OLD_BACKUP_DIR" in
                  /opt/phoenix-erp-backups/deploy-pre-migration-*) ;;
                  *) echo "::error::Refusing unexpected backup path: $OLD_BACKUP_DIR"; exit 29 ;;
                esac
                rm -rf --one-file-system -- "$OLD_BACKUP_DIR"
                echo "♻ removed old deploy backup: $OLD_BACKUP_DIR"
              done

              fi

              MIG_MODE=prod MIG_DIR=apps/api bash scripts/db-migrate.sh

              if [ -f scripts/check-role-runtime-phase-c.sql ]; then
                echo "── 执行 Role Runtime Phase C 生产验证 ──"
                CHECK_OUT=$(docker compose exec -T db sh -c \
                  'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
                  < scripts/check-role-runtime-phase-c.sql 2>&1)
                echo "$CHECK_OUT"
                if echo "$CHECK_OUT" | grep -q "❌ FAIL —"; then
                  echo "::error::❌ Phase C 生产验证存在 FAIL"
                  exit 1
                fi
                echo "✅ Phase C 生产验证:无 FAIL"
              fi
            else
              echo "── 跳过 DB 迁移(mode=$DEPLOY_MODE)──"
            fi

            # ── Nginx(仅 full mode)──────────────────────────────────
            if [ "$DEPLOY_MODE" = "full" ] && [ -n "$NGINX_CONF" ]; then
              NGINX_ROLLBACK_FILE="$STATE_DIR/run-${DEPLOY_RUN_ID}/nginx-before.conf"
              cp /etc/nginx/conf.d/erp.eggslao.com.conf "$NGINX_ROLLBACK_FILE"
              chmod 600 "$NGINX_ROLLBACK_FILE"
              echo "$NGINX_CONF" | base64 -d \
                > /etc/nginx/conf.d/erp.eggslao.com.conf
              nginx -t
              if systemctl is-active --quiet nginx; then
                systemctl reload nginx
              else
                systemctl start nginx
              fi
              echo "✅ Nginx reloaded"
            fi

            # ── 滚动重启容器(按 mode 选)──────────────────────────────
            if [ "$BUILD_API" = "true" ]; then
              # Resolve the pulled candidate. Run schema-first only when this
              # change set actually contains migration-affecting paths; a
              # code-only API deploy must keep PRODUCTION_MIGRATION_REQUIRED=NO.
              if [ "$RUN_MIG" = "true" ]; then
                CANDIDATE_API_IMAGE=$(trap - ERR; bash scripts/deploy-schema-first.sh /opt/phoenix/backups/migration-evidence "$API_IMAGE")
              else
                CANDIDATE_API_IMAGE="$API_IMAGE"
                echo "PRODUCTION_MIGRATION_REQUIRED=NO; skipping schema-first migration"
              fi
              assert_target_main
              node scripts/ops/production-deployment-state.mjs switch api
              API_SWITCH_STARTED=true
              API_IMAGE="$CANDIDATE_API_IMAGE" docker compose up -d --no-deps --wait api
            fi

            if [ "$BUILD_WEB" = "true" ]; then
              node scripts/ops/production-deployment-state.mjs switch web
              WEB_SWITCH_STARTED=true
              docker compose up -d --no-deps --wait web
            fi

            # ── 部署后温和清理(不动 builder cache) ─────────────────────
            # Retention-aware image cleanup is a separately approved operation.

            # ── Smoke test(所有 mode)───────────────────────────────
            sleep 3
            curl -fsSL --max-time 20 http://127.0.0.1:3100/api/readiness -o /dev/null
            curl -fsSL --max-time 20 http://127.0.0.1:3000/ -o /dev/null
            echo "✅ API/Web smoke test passed"
            export PRODUCTION_READINESS_VERIFIED=true
            EVIDENCE_HELPER="${EVIDENCE_HELPER:-scripts/ops/production-deployment-evidence.mjs}"
            EVIDENCE_PHASE=POST_SNAPSHOT node "$EVIDENCE_HELPER" capture "$POST_EVIDENCE_FILE"
            node "$EVIDENCE_HELPER" logs "$POST_EVIDENCE_FILE" "$LOG_EVIDENCE_FILE"
            node "$EVIDENCE_HELPER" verify "$PRE_EVIDENCE_FILE" "$POST_EVIDENCE_FILE" "$LOG_EVIDENCE_FILE"

            # ── 磁盘用量报告 ─────────────────────────────────────────
            echo "📦 Docker 镜像占用:"
            # Capture the producer before printing a bounded in-memory preview.
            # This keeps formatting separate from real Docker command failures.
            # Historical status 13 was reproduced in the complete CLI import
            # cycle, rather than proven to originate from report pipelines.
            IMAGE_REPORT="$(docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}")"
            IMAGE_PREVIEW_COUNT=0
            while IFS= read -r IMAGE_LINE && [ "$IMAGE_PREVIEW_COUNT" -lt 20 ]; do
              printf '%s\n' "$IMAGE_LINE"
              IMAGE_PREVIEW_COUNT=$((IMAGE_PREVIEW_COUNT + 1))
            done <<< "$IMAGE_REPORT"
            echo "💾 磁盘总览:"
            # Keep the report free of producer/consumer pipelines: with pipefail,
            # even a harmless formatting consumer can SIGPIPE the deploy shell
            # after verification and leave the transaction in SWITCHING.
            df -h /
            echo "🐳 Docker 总占用(builder cache 保留 5GB/24h 加速冷构建):"
            DOCKER_DISK_REPORT="$(docker system df 2>/dev/null || true)"
            printf '%s\n' "$DOCKER_DISK_REPORT"

            assert_target_main
            node scripts/ops/production-deployment-state.mjs complete
            trap - ERR
            echo "✅ Application evidence complete; background release still requires owner verification"
            }

            if [ "$BUILD_API" = true ]; then
              # Stage the exact reviewed target before any floor/code/container
              # change. The supervisor retains a real PostgreSQL lock session
              # and FD9 across the whole body; a legacy API cannot claim drain.
              BACKGROUND_STAGE="$STATE_DIR/background-stage-${DEPLOY_RUN_ID}"
              test ! -e "$BACKGROUND_STAGE"
              mkdir -m 700 "$BACKGROUND_STAGE"
              for helper in background-deployment-session.mjs background-control-coordinator.mjs background-control-manifest.mjs production-config-contract.json production-config-guard.mjs production-atomic-state.mjs production-trusted-paths.mjs capture-production-runtime.mjs production-deployment-evidence.mjs update-managed-chanjet-env.mjs chanjet-readonly-policy.mjs chanjet-admission-schema-receipt.mjs production-maintenance-admission.mjs production-maintenance-receipts.mjs production-maintenance-transition.mjs background-control-legacy-transition.mjs; do
                git show "$TARGET_SHA:scripts/ops/$helper" > "$BACKGROUND_STAGE/$helper"
                chmod 600 "$BACKGROUND_STAGE/$helper"
              done
              export -f git docker rollback_deploy assert_target_main perform_deployment
              export DEPLOY_REPO_ROOT PREV_GIT_SHA STATE_DIR CODE_SYNCED API_SWITCH_STARTED WEB_SWITCH_STARTED BACKGROUND_STAGE
              { declare -f perform_deployment; printf '%s\n' 'perform_deployment'; } | node "$BACKGROUND_STAGE/background-deployment-session.mjs" run
            else
              perform_deployment
            fi
            echo "✅ Deploy ($DEPLOY_MODE) complete — $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Send deploy notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          WEBHOOK_TYPE: ${{ secrets.ALERT_WEBHOOK_TYPE || 'slack' }}
          STATUS: ${{ job.status }}
          MODE:   ${{ needs.detect-changes.outputs.mode }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          EMOJI=$( [ "$STATUS" = "success" ] && echo "✅" || echo "🚨" )
          MSG="$EMOJI Phoenix ERP Deploy[$MODE] ${STATUS^^}\nbranch=\`main\` sha=\`${SHA:0:8}\` by \`$ACTOR\`\n$RUN_URL"
          case "$WEBHOOK_TYPE" in
            feishu)   curl -sS -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"$MSG\"}}" || true ;;
            dingtalk) curl -sS -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$MSG\"}}" || true ;;
            slack|*)  curl -sS -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' -d "{\"text\":\"$MSG\"}" || true ;;
          esac
