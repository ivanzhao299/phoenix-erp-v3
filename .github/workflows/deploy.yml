name: CI/CD — Build & Deploy

# 触发条件：
#   - push 到 main（完整流水线：测试 → 构建 → 推送 → 部署）
#   - pull_request 到 main（仅测试，不部署）
#   - workflow_dispatch（手动触发，可选跳过部署）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "跳过部署步骤（仅构建镜像）"
        type: boolean
        default: false

# 成本控制（Role Audit Recheck）：同一 ref 的新流水线启动时，自动取消仍在跑的旧流水线，
# 避免连续推送时多条全流水线（含最耗分钟数的镜像构建）并行烧 Actions 额度。
# 注：deploy job 已是幂等部署，被取消的旧 run 不会留下半成品状态。
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/phoenix-erp-v3

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: 类型检查 + 回归测试
  # ────────────────────────────────────────────────────────────
  test:
    name: Type-check & Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phoenix_v3
          POSTGRES_PASSWORD: phoenix_v3_pass
          POSTGRES_DB: phoenix_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: phoenix_v3
      DB_PASSWORD: phoenix_v3_pass
      DB_NAME: phoenix_erp
      JWT_SECRET: ci_test_secret_minlen_32_characters_xx
      JWT_SECRET_PREV: ""
      NODE_ENV: test
      ENABLE_DEV_LOGIN: "true"
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: phoenix_v3
      PGPASSWORD: phoenix_v3_pass
      PGDATABASE: phoenix_erp

    steps:
      - uses: actions/checkout@v5

      # G36 · F5-1 治理：顶级 /migrations/ 自 G34 起冻结，新 SQL 必须 apps/api/migrations/
      #   背景：G34 前 4 个 mig 误放顶级 → 生产 Deploy 跑 apps/api/migrations/ 不跑顶级 →
      #         手动 SSH 修；同时老 mig 重置王玮华，G34 时间戳覆盖才解。
      #   本 step：用 allowlist 锁住顶级目录文件清单，禁增删。
      - name: Lock top-level migrations/ allowlist (F5-1)
        run: |
          if [ ! -f migrations/.allowlist ]; then
            echo "::error::missing migrations/.allowlist (G36 治理基线缺失)"
            exit 1
          fi
          actual=$(ls migrations/ 2>/dev/null | grep -v '^\.allowlist$' | sort)
          expected=$(sort migrations/.allowlist)
          if ! diff <(echo "$actual") <(echo "$expected") > /tmp/_diff.log 2>&1; then
            echo "::error::❌ 顶级 migrations/ 文件清单与 allowlist 不符。新 SQL 必须放 apps/api/migrations/"
            cat /tmp/_diff.log
            exit 1
          fi
          echo "✅ 顶级 migrations/ 已锁定（46 个历史 SQL）"

      # g195-P5 门禁 #1: apps/api/migrations/ 也冻结(只允许 g195-P2 baseline 的 169 条)
      # 自此新 schema/数据迁移一律走 apps/api/src/database/migrations/(TS 迁移)。
      # 历史裸 SQL 已被 P2 桥接进 TypeORM migrations 表,认作"已执行"不会重跑。
      - name: Lock apps/api/migrations/ allowlist (g195-P5)
        run: |
          if [ ! -f apps/api/migrations/.allowlist ]; then
            echo "::error::missing apps/api/migrations/.allowlist (g195-P5 治理基线缺失)"
            exit 1
          fi
          actual=$(ls apps/api/migrations/ 2>/dev/null | grep -E '^2026.*\.sql$' | LC_ALL=C sort)
          expected=$(LC_ALL=C sort apps/api/migrations/.allowlist)
          if ! diff <(echo "$actual") <(echo "$expected") > /tmp/_p5_diff.log 2>&1; then
            echo "::error::❌ apps/api/migrations/ 文件清单与 .allowlist 不符。新 schema/数据迁移必须放 apps/api/src/database/migrations/(TS 迁移)"
            echo "见 apps/api/src/database/migrations/README.md 与 docs/migration-tooling-roadmap.md"
            cat /tmp/_p5_diff.log
            exit 1
          fi
          echo "✅ apps/api/migrations/ 已锁定(169 个 baseline 裸 SQL)"

      # g195-P5 门禁 #2: TS 迁移必须实现 down()
      # 防止"懒得写 down" → migration:revert 全线无效。
      # 启发判定见 scripts/check-ts-migration-down.sh 顶部注释。
      - name: Verify TS migrations implement down() (g195-P5)
        run: bash scripts/check-ts-migration-down.sh apps/api/src/database/migrations

      - name: Install system tools (psql + jq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client jq
          echo "psql $(psql --version)" && echo "jq $(jq --version)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check API
        run: pnpm --filter phoenix-erp-v3-nest exec tsc --noEmit

      - name: Type-check Web
        run: pnpm --filter web run typecheck

      - name: Build API
        working-directory: apps/api
        run: pnpm build

      - name: Run DDL migrations
        working-directory: apps/api
        run: |
          # 调用共享迁移脚本（scripts/db-migrate.sh，与生产部署【同一份】，杜绝两份重复脚本）。
          # CI 用临时空库：脚本检测 schema_migrations 空 + 无业务数据 → 不 baseline、全跑做回归验证。
          export PGHOST="$DB_HOST" PGPORT="$DB_PORT" PGUSER="$DB_USER" PGPASSWORD="$DB_PASSWORD" PGDATABASE="$DB_NAME"
          MIG_MODE=ci MIG_DIR=. bash ../../scripts/db-migrate.sh

      # g195-P5 门禁 #3: entity ↔ DB schema 同步检查(warn-only)
      # 跑 migration:generate,有 diff 说明 entity 改了但没配套迁移。
      # 当前 warn-only(::warning 不红灯) — 历史漂移大量存在,等 P6+ 团队补齐
      # 漂移迁移后切真红灯(本 step 改为 exit 1)。
      - name: Check entity ↔ DB schema sync (g195-P5, warn-only)
        working-directory: apps/api
        run: |
          export PGHOST="$DB_HOST" PGPORT="$DB_PORT" PGUSER="$DB_USER" PGPASSWORD="$DB_PASSWORD" PGDATABASE="$DB_NAME"
          rm -f /tmp/_p5_entity_diff*.ts 2>/dev/null
          out=$(./node_modules/.bin/typeorm migration:generate -d dist/database/data-source.js /tmp/_p5_entity_diff 2>&1) || true
          if echo "$out" | grep -q "No changes in database schema"; then
            echo "✅ entity ↔ DB schema 已同步"
          else
            echo "::warning::⚠️ entity 改动可能未配套迁移(g195-P5 warn-only;P6+ 切真红灯)"
            echo "──── 关键错误行 (grep) ────"
            echo "$out" | grep -E 'QueryFailedError|does not exist|MigrationGenerateCommand|column .* does not exist|relation .* does not exist|Cannot find|table .* does not exist' | head -20 || true
            echo "──── 引用堆栈(头 20 行) ────"
            echo "$out" | head -20
            echo "──── 输出尾部(失败上下文,后 15 行)────"
            echo "$out" | tail -15
            echo "──── 生成的 diff 文件(若有)────"
            for diff_file in /tmp/_p5_entity_diff*.ts; do
              [ -f "$diff_file" ] || continue
              echo ">>> $diff_file"
              head -80 "$diff_file"
            done
            rm -f /tmp/_p5_entity_diff*.ts 2>/dev/null
          fi

      - name: Start API
        working-directory: apps/api
        env:
          PORT: 3100
        run: |
          nohup node dist/main > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3100/api/health >/dev/null; then
              echo "✅ API ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "❌ API failed to start" >&2
          tail -100 /tmp/api.log >&2
          exit 1

      - name: Regression — system
        working-directory: apps/api
        run: pnpm test:regr:system

      - name: Regression — breeding
        working-directory: apps/api
        run: pnpm test:regr:breeding

      - name: Regression — packaging
        working-directory: apps/api
        run: pnpm test:regr:packaging

      - name: Regression — wms
        working-directory: apps/api
        run: pnpm test:regr:wms

      - name: Regression — finance
        working-directory: apps/api
        run: pnpm test:regr:finance

      - name: Dump API log on failure
        if: failure()
        run: tail -200 /tmp/api.log || true

      - name: Stop API
        if: always()
        run: kill $(cat /tmp/api.pid 2>/dev/null) 2>/dev/null || true

  # ────────────────────────────────────────────────────────────
  # Job 2: 构建并推送 Docker 镜像到 ghcr.io
  # 仅在 push to main 时运行
  # ────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Images
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    outputs:
      api_image: ${{ steps.meta-api.outputs.tags }}
      web_image: ${{ steps.meta-web.outputs.tags }}
      sha_tag: sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata — API
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/api
          tags: |
            type=raw,value=latest

      - name: Extract metadata — Web
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/web
          tags: |
            type=raw,value=latest

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            API_TARGET=http://api:3100
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────
  # Job 3: SSH 部署到生产服务器
  # 需要 GitHub Secrets（见下方说明）
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: build-push
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.skip_deploy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - name: Prepare nginx config
        id: nginx
        run: echo "conf=$(base64 -w0 nginx/erp.eggslao.com.conf)" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || 'root' }}
          proxy_key: ${{ secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}

            # ── 同步代码（DDL 迁移文件等）────────────────────────────────
            git stash
            git pull --ff-only origin main
            echo "✅ Code synced"

            # ── 畅捷通环境变量注入（从 GitHub Secrets，更新或追加）────
            inject_env() {
              local key="$1" val="$2"
              if [ -z "$val" ]; then
                # 空值：删除已有行（如 CHANJET_CERT 清空）
                sed -i "/^${key}=/d" .env 2>/dev/null || true
                return
              fi
              if grep -q "^${key}=" .env 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${val}|" .env
                echo "  ~ ${key} updated"
              else
                echo "${key}=${val}" >> .env
                echo "  + ${key} injected"
              fi
            }
            inject_env CHANJET_APP_KEY    '${{ secrets.CHANJET_APP_KEY }}'
            inject_env CHANJET_APP_SECRET '${{ secrets.CHANJET_APP_SECRET }}'
            inject_env CHANJET_ORG_ID     '${{ secrets.CHANJET_ORG_ID }}'
            inject_env CHANJET_CERT       '${{ secrets.CHANJET_CERT }}'
            inject_env CHANJET_MSG_SECRET '${{ secrets.CHANJET_MSG_SECRET }}'

            # ── 拉取新镜像前先清理旧镜像（只保留当前运行容器用到的）────────
            # 这一步在拉新镜像之前执行，确保拉取时磁盘有足够空间
            docker image prune -a -f 2>/dev/null || true
            docker builder prune -f 2>/dev/null || true

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            # 顺序拉取，避免并发 lease 冲突
            docker compose pull api
            docker compose pull web

            # ── DB：幂等启动 ─────────────────────────────────────────────
            docker compose up -d --wait db
            echo "✅ DB healthy"

            # ── DB 迁移：调用共享脚本（与 CI 同一份 scripts/db-migrate.sh，杜绝两份重复）──
            # 生产已初始化库：脚本检测 schema_migrations 已 baseline → 历史迁移全跳过、只跑新增。
            MIG_MODE=prod MIG_DIR=apps/api bash scripts/db-migrate.sh

            # ── 生产验证：Role Runtime Phase C 6 项检查（真实落库确认）──────
            # 修复（Role Audit Recheck）：在生产库执行 check 脚本，任一 ❌ FAIL 红灯。
            # 这把"Phase C 是否在生产端真实生效"变成可验证的部署门禁。
            if [ -f scripts/check-role-runtime-phase-c.sql ]; then
              echo "── 执行 Role Runtime Phase C 生产验证 ──"
              CHECK_OUT=$(docker compose exec -T db sh -c \
                'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
                < scripts/check-role-runtime-phase-c.sql 2>&1)
              echo "$CHECK_OUT"
              # 修复（误报）：只匹配真正的检查失败结果行 "❌ FAIL — ..."（带破折号），
              # 不匹配脚本结尾的说明文字"任一 ❌ FAIL 需排查对应迁移"（含 FAIL 字样但非失败）。
              if echo "$CHECK_OUT" | grep -q "❌ FAIL —"; then
                echo "::error::❌ Phase C 生产验证存在 FAIL — Phase C 未在生产端真实生效"
                exit 1
              fi
              echo "✅ Phase C 生产验证：无 FAIL"
            fi

            # ── 滚动重启容器 ─────────────────────────────────────────────
            docker compose up -d --no-deps --wait api

            # ── g195-P3+: TypeORM TS 迁移真接管(api 容器内执行)─────────────
            # db-migrate.sh 阶段 api 还没起所以跳过 TS 迁移,这里 api up 后才真跑。
            # 兼容期:migrations-ts/(apps/api/src/database/migrations/)目前为空,
            # 跑过即 0 pending;P4 起新需求走 TS 迁移即可自动跑。
            # 失败 → set -e 红灯(prod schema 已部分改动需人工排查)。
            echo "── 执行 TypeORM TS 迁移(api 容器内) ──"
            docker compose exec -T api ./node_modules/.bin/typeorm \
              -d dist/database/data-source.js migration:run
            echo "✅ TS 迁移完成"

            docker compose up -d --no-deps --wait web \
              || { docker compose logs web --tail 80; exit 1; }

            # ── 清理旧镜像（释放磁盘）──────────────────────────────────────
            # docker image prune -f 只删悬空镜像（无标签），sha-* 老版本不会被删
            # 改为删除所有「未被任何容器引用」的镜像（当前运行容器的镜像会被保留）
            docker image prune -a -f 2>/dev/null || true
            # 同时清理无用 build cache（buildx 在本机留下的层）
            docker builder prune -f 2>/dev/null || true
            echo "✅ Docker 磁盘清理完成"

            # ── Nginx：备份 → 写入 → reload（不 restart）────────────────
            cp /etc/nginx/conf.d/cnjinhu-default.conf \
              /root/nginx-cnjinhu.conf.bak-$(date +%Y%m%d-%H%M%S) 2>/dev/null || true
            echo "${{ steps.nginx.outputs.conf }}" | base64 -d \
              > /etc/nginx/conf.d/erp.eggslao.com.conf
            nginx -t
            if systemctl is-active --quiet nginx; then
              systemctl reload nginx
            else
              systemctl start nginx
            fi
            echo "✅ Nginx reloaded"

            # ── Smoke test ───────────────────────────────────────────────
            sleep 3
            curl -fsSL --max-time 20 http://127.0.0.1:3000/ -o /dev/null \
              && echo "✅ Web smoke test passed" \
              || { docker compose logs web --tail 20; exit 1; }

            # ── 磁盘用量报告 ─────────────────────────────────────────────
            echo "📦 Docker 镜像占用："
            docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | head -20
            echo "💾 磁盘总览："
            df -h / | tail -1
            echo "🐳 Docker 总占用："
            docker system df 2>/dev/null || true

            echo "✅ Deploy complete — $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Send deploy notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          WEBHOOK_TYPE: ${{ secrets.ALERT_WEBHOOK_TYPE || 'slack' }}
          STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          EMOJI=$( [ "$STATUS" = "success" ] && echo "✅" || echo "🚨" )
          MSG="$EMOJI Phoenix ERP V3 Deploy ${STATUS^^}\nbranch=\`main\` sha=\`${SHA:0:8}\` by \`$ACTOR\`\n$RUN_URL"
          case "$WEBHOOK_TYPE" in
            feishu)
              curl -sS -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
                -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"$MSG\"}}" || true ;;
            dingtalk)
              curl -sS -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
                -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$MSG\"}}" || true ;;
            slack|*)
              curl -sS -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
                -d "{\"text\":\"$MSG\"}" || true ;;
          esac
