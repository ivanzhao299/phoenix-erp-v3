name: CI/CD — Build & Deploy

# 触发条件：
#   - push 到 main（完整流水线：测试 → 构建 → 推送 → 部署）
#   - pull_request 到 main（仅测试，不部署）
#   - workflow_dispatch（手动触发，可选跳过部署）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "跳过部署步骤（仅构建镜像）"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/phoenix-erp-v3

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: 类型检查 + 回归测试
  # ────────────────────────────────────────────────────────────
  test:
    name: Type-check & Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phoenix_v3
          POSTGRES_PASSWORD: phoenix_v3_pass
          POSTGRES_DB: phoenix_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: phoenix_v3
      DB_PASSWORD: phoenix_v3_pass
      DB_NAME: phoenix_erp
      JWT_SECRET: ci_test_secret_minlen_32_characters_xx
      JWT_SECRET_PREV: ""
      NODE_ENV: test
      ENABLE_DEV_LOGIN: "true"
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: phoenix_v3
      PGPASSWORD: phoenix_v3_pass
      PGDATABASE: phoenix_erp

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check API
        run: pnpm --filter phoenix-erp-v3-nest exec tsc --noEmit

      - name: Type-check Web
        run: pnpm --filter web run typecheck

      - name: Build API
        working-directory: apps/api
        run: pnpm build

      - name: Run DDL migrations
        working-directory: apps/api
        run: |
          for f in $(ls ddl/*.sql | sort); do
            echo "Applying $f..."
            PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -d $DB_NAME -f "$f" 2>&1 \
              | grep -v "^NOTICE\|already exists\|will create" || true
          done
          echo "✅ DDL migrations applied"

      - name: Start API
        working-directory: apps/api
        env:
          PORT: 3100
        run: |
          nohup node dist/main > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3100/api/health >/dev/null; then
              echo "✅ API ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "❌ API failed to start" >&2
          tail -100 /tmp/api.log >&2
          exit 1

      - name: Regression — system
        working-directory: apps/api
        run: pnpm test:regr:system

      - name: Regression — breeding
        working-directory: apps/api
        run: pnpm test:regr:breeding

      - name: Regression — packaging
        working-directory: apps/api
        run: pnpm test:regr:packaging

      - name: Regression — wms
        working-directory: apps/api
        run: pnpm test:regr:wms

      - name: Regression — order + finance
        working-directory: apps/api
        run: |
          pnpm test:regr:order
          pnpm test:regr:finance

      - name: E2E order flow
        working-directory: apps/api
        run: pnpm test:e2e

      - name: Dump API log on failure
        if: failure()
        run: tail -200 /tmp/api.log || true

      - name: Stop API
        if: always()
        run: kill $(cat /tmp/api.pid 2>/dev/null) 2>/dev/null || true

  # ────────────────────────────────────────────────────────────
  # Job 2: 构建并推送 Docker 镜像到 ghcr.io
  # 仅在 push to main 时运行
  # ────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Images
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    outputs:
      api_image: ${{ steps.meta-api.outputs.tags }}
      web_image: ${{ steps.meta-web.outputs.tags }}
      sha_tag: sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata — API
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Extract metadata — Web
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/web
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            API_TARGET=http://api:3100
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────
  # Job 3: Webhook 触发服务器部署（无需 SSH）
  # 需要 GitHub Secret: DEPLOY_WEBHOOK_TOKEN
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: build-push
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.skip_deploy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Trigger deploy via webhook
        run: |
          resp=$(curl -fsSL --max-time 15 \
            -X POST https://erp.eggslao.com/deploy/webhook \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
            -d "{\"sha\":\"${{ github.sha }}\",\"actor\":\"${{ github.actor }}\"}") \
            || { echo "::error::Cannot reach webhook endpoint"; exit 1; }
          echo "Webhook response: $resp"
          ok=$(echo "$resp" | python3 -c \
            "import sys,json; print(json.load(sys.stdin).get('ok',False))" 2>/dev/null || echo "False")
          if [ "$ok" != "True" ]; then
            echo "::error::Deploy trigger rejected: $resp"
            exit 1
          fi
          echo "✅ Deploy triggered (sha=${{ github.sha }})"

      - name: Wait for deploy to complete
        run: |
          echo "Polling https://erp.eggslao.com/deploy/status every 10s (max 6min)..."
          for i in $(seq 1 36); do
            sleep 10
            resp=$(curl -fsSL --max-time 10 https://erp.eggslao.com/deploy/status \
              2>/dev/null || echo '{"running":true,"log":""}')
            running=$(echo "$resp" | python3 -c \
              "import sys,json; print(json.load(sys.stdin).get('running',True))" 2>/dev/null || echo "True")
            echo "[$((i * 10))s] running=$running"
            if [ "$running" = "False" ]; then
              log=$(echo "$resp" | python3 -c \
                "import sys,json; print(json.load(sys.stdin).get('log','')[-800:])" 2>/dev/null || echo "")
              echo "--- Deploy log (tail) ---"
              echo "$log"
              echo "-------------------------"
              if echo "$log" | grep -qE "ERROR:|smoke test failed|exit 1|Deploy complete"; then
                if echo "$log" | grep -q "Deploy complete"; then
                  echo "✅ Deploy complete"
                  exit 0
                else
                  echo "::error::Deploy script reported failure"
                  exit 1
                fi
              fi
              echo "✅ Deploy done"
              exit 0
            fi
          done
          echo "::error::Deploy timed out after 360s — check https://erp.eggslao.com/deploy/status"
          exit 1

      - name: Send deploy notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          WEBHOOK_TYPE: ${{ secrets.ALERT_WEBHOOK_TYPE || 'slack' }}
          STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          EMOJI=$( [ "$STATUS" = "success" ] && echo "✅" || echo "🚨" )
          MSG="$EMOJI Phoenix ERP V3 Deploy ${STATUS^^}\nbranch=\`main\` sha=\`${SHA:0:8}\` by \`$ACTOR\`\n$RUN_URL"
          case "$WEBHOOK_TYPE" in
            feishu)
              curl -sS -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
                -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"$MSG\"}}" || true ;;
            dingtalk)
              curl -sS -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
                -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$MSG\"}}" || true ;;
            slack|*)
              curl -sS -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
                -d "{\"text\":\"$MSG\"}" || true ;;
          esac
