name: Flock Refresh Production Readonly Audit

on:
  workflow_dispatch:
    inputs:
      audit_target:
        description: 'Readonly audit target'
        required: true
        default: 'flock'
        type: choice
        options:
          - flock
          - store-pos-v1
      window_start:
        description: 'UTC audit start timestamp, e.g. 2026-08-22 00:00:00'
        required: true
      window_end:
        description: 'UTC audit end timestamp, e.g. 2026-08-23 00:00:00'
        required: true

permissions:
  contents: read

concurrency:
  group: flock-refresh-production-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    if: inputs.audit_target == 'flock'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Validate audit window
        shell: bash
        env:
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_END: ${{ inputs.window_end }}
        run: |
          set -euo pipefail
          timestamp_pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$'
          for value in "$WINDOW_START" "$WINDOW_END"; do
            [[ "$value" =~ $timestamp_pattern ]] || { echo "Invalid UTC timestamp format" >&2; exit 1; }
            date -u -d "$value" '+%Y-%m-%d %H:%M:%S' >/dev/null
          done
          [[ $(date -u -d "$WINDOW_START" +%s) -lt $(date -u -d "$WINDOW_END" +%s) ]] \
            || { echo "window_start must be before window_end" >&2; exit 1; }
      - name: Read production database and topology without mutation
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_END: ${{ inputs.window_end }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH,WINDOW_START,WINDOW_END
          script: |
            set -euo pipefail
            timestamp_pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$'
            for value in "$WINDOW_START" "$WINDOW_END"; do
              [[ "$value" =~ $timestamp_pattern ]] || { echo "Invalid UTC timestamp format" >&2; exit 1; }
              date -u -d "$value" '+%Y-%m-%d %H:%M:%S' >/dev/null
            done
            [[ $(date -u -d "$WINDOW_START" +%s) -lt $(date -u -d "$WINDOW_END" +%s) ]] \
              || { echo "window_start must be before window_end" >&2; exit 1; }

            cd "$DEPLOY_PATH"
            echo "AUDIT_WINDOW=$WINDOW_START .. $WINDOW_END"
            echo "DEPLOY_CHECKOUT_SHA=$(git rev-parse HEAD)"
            docker compose ps -a

            for service in api web; do
              container="$(docker compose ps -q "$service")"
              [[ -n "$container" ]] || { echo "$service container is not running" >&2; exit 1; }
              docker inspect "$container" --format "SERVICE=$service IMAGE={{.Image}} STARTED={{.State.StartedAt}} LABELS={{json .Config.Labels}}"
            done

            api_container="$(docker compose ps -q api)"
            docker exec "$api_container" node -e '
              const raw = process.env.DATABASE_URL;
              if (!raw) { console.log("API_DATABASE_URL=unset (individual PG variables may be in use)"); process.exit(0); }
              const u = new URL(raw);
              console.log(`API_DATABASE_TARGET=${u.hostname}:${u.port || "5432"}/${u.pathname.replace(/^\//, "")}`);
            '

            docker compose exec -T \
              -e AUDIT_WINDOW_START="$WINDOW_START" \
              -e AUDIT_WINDOW_END="$WINDOW_END" \
              -e PGOPTIONS='-c default_transaction_read_only=on' \
              db sh -c 'psql -X -v ON_ERROR_STOP=1 -v window_start="$AUDIT_WINDOW_START" -v window_end="$AUDIT_WINDOW_END" -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
            \pset pager off
            BEGIN TRANSACTION READ ONLY;
            SELECT 'AUDIT_WINDOW' AS section, :'window_start' AS window_start, :'window_end' AS window_end;
            SELECT status, count(*) AS flock_count
              FROM brd_flocks
             GROUP BY status
             ORDER BY status;
            SELECT format(
                     'SELECT row_to_json(flock_row) AS flock_inventory FROM (SELECT flock_no, farm_code, house_code, status, current_qty, %s AS created_at, %s AS updated_at FROM brd_flocks ORDER BY farm_code, house_code, flock_no) AS flock_row;',
                     CASE WHEN EXISTS (
                       SELECT 1 FROM information_schema.columns
                        WHERE table_schema = current_schema() AND table_name = 'brd_flocks' AND column_name = 'created_at'
                     ) THEN 'created_at' ELSE 'NULL' END,
                     CASE WHEN EXISTS (
                       SELECT 1 FROM information_schema.columns
                        WHERE table_schema = current_schema() AND table_name = 'brd_flocks' AND column_name = 'updated_at'
                     ) THEN 'updated_at' ELSE 'NULL' END
                   )
            \gexec
            SELECT column_name, data_type
              FROM information_schema.columns
             WHERE table_schema = current_schema()
               AND table_name = 'brd_flocks'
               AND (column_name IN ('flock_no', 'current_qty') OR column_name ~ '(updated|modified|created|version)')
             ORDER BY ordinal_position;
            SELECT format(
                     'SELECT row_to_json(flock_row) AS latest_flock FROM (SELECT flock_no, current_qty, %1$I AS activity_marker FROM brd_flocks ORDER BY %1$I DESC NULLS LAST LIMIT 5) AS flock_row;',
                     COALESCE(
                       (SELECT column_name
                          FROM information_schema.columns
                         WHERE table_schema = current_schema()
                           AND table_name = 'brd_flocks'
                           AND column_name IN ('updated_at', 'modified_at', 'created_at', 'version')
                         ORDER BY CASE column_name
                           WHEN 'updated_at' THEN 1 WHEN 'modified_at' THEN 2
                           WHEN 'created_at' THEN 3 ELSE 4 END
                         LIMIT 1),
                       'flock_no'
                     )
                   )
            \gexec
            COMMIT;
            SQL

            echo 'NGINX_PROXY_TOPOLOGY'
            sudo nginx -T 2>&1 | sed -n '/upstream\|proxy_pass\|proxy_cache/p'
            echo 'CRUD_RESPONSE_HEADERS'
            curl --fail --silent --show-error --head \
              -H 'Host: erp.eggslao.com' \
              'http://127.0.0.1/api/crud/brd_flocks?limit=1' \
              | sed -n '/^[Cc]ache-[Cc]ontrol:/p;/^[Aa]ge:/p;/^[Vv]ia:/p;/^[Xx]-[Cc]ache:/p;/^HTTP\//p'

            echo 'API_BRD_FLOCKS_UPDATE_LOGS_LAST_60'
            docker logs --timestamps "$api_container" 2>&1 \
              | grep -E 'SVC Update START.*brd_flocks|CRUD Update.*(success|failed)' \
              | tail -60 || true

            echo 'API_BRD_FLOCKS_UPDATE_LOGS_IN_WINDOW'
            window_start_rfc3339="$(date -u -d "$WINDOW_START" '+%Y-%m-%dT%H:%M:%S')"
            window_end_rfc3339="$(date -u -d "$WINDOW_END" '+%Y-%m-%dT%H:%M:%S')"
            docker logs --timestamps \
              --since "${window_start_rfc3339}Z" \
              --until "${window_end_rfc3339}Z" \
              "$api_container" 2>&1 \
              | grep -E 'SVC Update START.*brd_flocks|CRUD Update.*(success|failed)' || true

            echo 'API_BRD_FLOCKS_GET_LOGS_IN_WINDOW'
            docker logs --timestamps \
              --since "${window_start_rfc3339}Z" \
              --until "${window_end_rfc3339}Z" \
              "$api_container" 2>&1 \
              | grep -E 'GET /api/crud/brd_flocks' || true

            echo 'NGINX_BRD_FLOCKS_ACCESS_LOGS_IN_WINDOW'
            while IFS= read -r access_log; do
              [[ -n "$access_log" && "$access_log" != "off" ]] || continue
              [[ "$access_log" = /* ]] || access_log="/var/log/nginx/$access_log"
              [[ -r "$access_log" ]] || { echo "UNREADABLE_ACCESS_LOG=$access_log"; continue; }
              echo "ACCESS_LOG=$access_log"
              sudo tail -n 20000 "$access_log" \
              | grep -E '(GET|POST|PUT|PATCH) /api/crud/brd_flocks' || true
            done < <(sudo nginx -T 2>&1 \
              | sed -n 's/^[[:space:]]*access_log[[:space:]]\+\([^ ;]*\).*/\1/p' \
              | sort -u)

            echo 'API_AUTH_LOGS_IN_WINDOW'
            docker logs --timestamps \
              --since "${window_start_rfc3339}Z" \
              --until "${window_end_rfc3339}Z" \
              "$api_container" 2>&1 \
              | grep -E '/api/auth/(login|refresh)|AuthController|refreshToken|Login' || true

            echo 'NGINX_TERMINAL_SESSION_ACCESS_LOGS_RECENT'
            while IFS= read -r access_log; do
              [[ -n "$access_log" && "$access_log" != "off" ]] || continue
              [[ "$access_log" = /* ]] || access_log="/var/log/nginx/$access_log"
              [[ -r "$access_log" ]] || { echo "UNREADABLE_ACCESS_LOG=$access_log"; continue; }
              echo "ACCESS_LOG=$access_log"
              sudo tail -n 50000 "$access_log" \
                | grep -E '(GET /login\?[^ ]*return=[^ ]*terminal|GET /terminal/|/api/auth/(login|refresh))' || true
            done < <(sudo nginx -T 2>&1 \
              | sed -n 's/^[[:space:]]*access_log[[:space:]]\+\([^ ;]*\).*/\1/p' \
              | sort -u)

  store-pos-v1-audit:
    if: inputs.audit_target == 'store-pos-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Validate audit window
        shell: bash
        env:
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_END: ${{ inputs.window_end }}
        run: |
          set -euo pipefail
          timestamp_pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$'
          for value in "$WINDOW_START" "$WINDOW_END"; do
            [[ "$value" =~ $timestamp_pattern ]] || { echo "Invalid UTC timestamp format" >&2; exit 1; }
            date -u -d "$value" '+%Y-%m-%d %H:%M:%S' >/dev/null
          done
          [[ $(date -u -d "$WINDOW_START" +%s) -lt $(date -u -d "$WINDOW_END" +%s) ]] \
            || { echo "window_start must be before window_end" >&2; exit 1; }
      - name: Aggregate Store POS V1 evidence without mutation
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_END: ${{ inputs.window_end }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH,WINDOW_START,WINDOW_END
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "AUDIT_WINDOW=$WINDOW_START .. $WINDOW_END"
            echo "PRODUCTION_CHECKOUT=$(git rev-parse HEAD)"
            docker compose exec -T \
              -e AUDIT_WINDOW_START="$WINDOW_START" \
              -e AUDIT_WINDOW_END="$WINDOW_END" \
              -e PGOPTIONS='-c default_transaction_read_only=on' \
              db sh -c 'psql -X -v ON_ERROR_STOP=1 -v window_start="$AUDIT_WINDOW_START" -v window_end="$AUDIT_WINDOW_END" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off' <<'SQL'
            \pset format aligned
            BEGIN TRANSACTION READ ONLY;
            SELECT 'READONLY_GUARD' AS section, current_setting('transaction_read_only') AS read_only,
                   :'window_start' AS window_start_utc, :'window_end' AS window_end_utc;

            SELECT 'STORE_DOCUMENT_VOLUME' AS section, 'sal_store_sales' AS source, store_code,
                   count(*)::int AS document_count,
                   count(*) FILTER (WHERE status='COMPLETED')::int AS completed_count,
                   count(*) FILTER (WHERE status='RETURNED')::int AS returned_count,
                   COALESCE(sum(total_amount) FILTER (WHERE status='COMPLETED'),0) AS completed_amount
              FROM sal_store_sales
             WHERE created_at::timestamp >= :'window_start'::timestamp AND created_at::timestamp < :'window_end'::timestamp
             GROUP BY store_code
            UNION ALL
            SELECT 'STORE_DOCUMENT_VOLUME', 'pos_sales', store_code, count(*)::int,
                   count(*) FILTER (WHERE status='COMPLETED')::int, 0,
                   COALESCE(sum(COALESCE(net_amount,total_amount)) FILTER (WHERE status='COMPLETED'),0)
              FROM pos_sales
             WHERE created_at::timestamp >= :'window_start'::timestamp AND created_at::timestamp < :'window_end'::timestamp
             GROUP BY store_code
             ORDER BY source, store_code;

            SELECT 'ACTIVE_CASHIER' AS section, store_code,
                   count(DISTINCT COALESCE(NULLIF(created_by::text,''),NULLIF(created_by_name,'')))::int AS transacting_cashiers,
                   count(*)::int AS completed_sales
              FROM sal_store_sales
             WHERE status='COMPLETED'
               AND created_at::timestamp >= :'window_start'::timestamp AND created_at::timestamp < :'window_end'::timestamp
             GROUP BY store_code ORDER BY store_code;

            SELECT 'ACTIVE_CASHIER_ROSTER' AS section, u.store_code,
                   count(DISTINCT u.user_id)::int AS active_cashier_roster
              FROM sys_user u
              JOIN sys_user_role ur ON ur.user_id=u.user_id
              JOIN sys_role r ON r.role_id=ur.role_id AND r.role_code='ROLE_CASHIER'
             WHERE to_jsonb(u)->>'status' IN ('1','ACTIVE')
             GROUP BY u.store_code ORDER BY u.store_code;

            SELECT 'SHIFT_FREQUENCY' AS section, store_code,
                   count(*) FILTER (WHERE status='CLOSED')::int AS closed_shifts,
                   count(*) FILTER (WHERE status='OPEN')::int AS open_shifts,
                   round(count(*)::numeric / NULLIF(EXTRACT(epoch FROM (:'window_end'::timestamp-:'window_start'::timestamp))/86400,0),2) AS shifts_per_day,
                   round((avg(EXTRACT(epoch FROM (closed_at::timestamp-opened_at::timestamp))/3600) FILTER (WHERE closed_at IS NOT NULL))::numeric,2) AS avg_shift_hours
              FROM sal_store_shift_closings
             WHERE opened_at::timestamp < :'window_end'::timestamp
               AND COALESCE(closed_at::timestamp,opened_at::timestamp) >= :'window_start'::timestamp
             GROUP BY store_code ORDER BY store_code;

            SELECT 'RETURN_RATE' AS section, store_code,
                   count(*) FILTER (WHERE status IN ('COMPLETED','RETURNED'))::int AS settled_sales,
                   count(*) FILTER (WHERE status='RETURNED')::int AS returned_sales,
                   round(100.0*count(*) FILTER (WHERE status='RETURNED')/
                         NULLIF(count(*) FILTER (WHERE status IN ('COMPLETED','RETURNED')),0),2) AS return_rate_pct
              FROM sal_store_sales
             WHERE created_at::timestamp >= :'window_start'::timestamp AND created_at::timestamp < :'window_end'::timestamp
             GROUP BY store_code ORDER BY store_code;

            SELECT 'PAYMENT_METHOD_DISTRIBUTION' AS section, 'sal_store_sales' AS source, store_code,
                   COALESCE(NULLIF(payment_method,''),'UNKNOWN') AS payment_method,
                   count(*)::int AS document_count, COALESCE(sum(paid_amount),0) AS amount
              FROM sal_store_sales
             WHERE status='COMPLETED'
               AND created_at::timestamp >= :'window_start'::timestamp AND created_at::timestamp < :'window_end'::timestamp
             GROUP BY store_code, COALESCE(NULLIF(payment_method,''),'UNKNOWN')
            UNION ALL
            SELECT 'PAYMENT_METHOD_DISTRIBUTION', 'store_payment_records', store_code,
                   COALESCE(NULLIF(payment_method,''),'UNKNOWN'), count(*)::int, COALESCE(sum(amount),0)
              FROM store_payment_records
             WHERE status='CONFIRMED'
               AND created_at::timestamp >= :'window_start'::timestamp AND created_at::timestamp < :'window_end'::timestamp
             GROUP BY store_code, COALESCE(NULLIF(payment_method,''),'UNKNOWN')
             ORDER BY source, store_code, payment_method;

            SELECT 'LEGACY_STORE_SITE_CANDIDATE' AS section, s.store_code,s.store_name,s.company_code,s.mapped_site_code,
                   CASE WHEN o.org_code IS NULL THEN 'SITE_REVIEW_REQUIRED' ELSE 'SITE_MATCHED' END AS mapping_status
              FROM mst_stores s
              LEFT JOIN sys_organizations o ON o.org_code=s.mapped_site_code AND o.org_type='SITE' AND o.status='ACTIVE'
             ORDER BY s.company_code,s.store_code;

            SELECT 'STORE_MEMBERSHIP_CANDIDATE' AS section,u.user_id,u.username,r.role_code,trim(x.store_code) AS legacy_store_code,
                   s.store_name,s.company_code,
                   CASE WHEN s.store_code IS NULL THEN 'STORE_REVIEW_REQUIRED' ELSE 'MEMBERSHIP_CANDIDATE' END AS review_status
              FROM sys_user u
              JOIN sys_user_role ur ON ur.user_id=u.user_id
              JOIN sys_role r ON r.role_id=ur.role_id AND r.role_code IN ('ROLE_CASHIER','ROLE_STORE_MGR')
              CROSS JOIN LATERAL unnest(string_to_array(COALESCE(u.store_code,''),',')) x(store_code)
              LEFT JOIN mst_stores s ON s.store_code=trim(x.store_code)
             WHERE u.status=1 AND trim(x.store_code) NOT IN ('','ALL')
             ORDER BY u.user_id,trim(x.store_code);

            SELECT 'STORE_WAREHOUSE_BINDING_CANDIDATE' AS section,s.store_code,s.company_code,w.warehouse_code,w.warehouse_name,w.domain,w.status,
                   CASE WHEN to_jsonb(w)->>'store_code'=s.store_code THEN 'LEGACY_DIRECT_MATCH'
                        WHEN to_jsonb(w)->>'site_code'=s.mapped_site_code AND s.mapped_site_code IS NOT NULL THEN 'SITE_MATCH_REVIEW'
                        ELSE 'COMPANY_POOL_REVIEW' END AS candidate_reason
              FROM mst_stores s
              JOIN wms_warehouses w ON w.company_code=s.company_code AND w.status='ACTIVE' AND w.domain='OPERATIONAL'
             ORDER BY s.store_code,candidate_reason,w.warehouse_code;

            SELECT 'STORE_V1_ERROR_WINDOW' AS section,id,request_path,request_method,http_status,error_message,created_at
              FROM sys_error_logs
             WHERE created_at::timestamp >= :'window_start'::timestamp AND created_at::timestamp < :'window_end'::timestamp
               AND (request_path ILIKE '%store-sales%' OR error_message ILIKE '%store_master%'
                    OR error_message ILIKE '%store_membership%' OR error_message ILIKE '%store_warehouse_bindings%'
                    OR error_message ILIKE '%门店%membership%')
             ORDER BY created_at::timestamp DESC LIMIT 200;
            ROLLBACK;
            SQL
