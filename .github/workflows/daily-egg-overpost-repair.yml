name: Daily Egg Overpost Repair

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Reviewed phase
        required: true
        type: choice
        options: [preflight, apply, verify]
      approve_production:
        description: Type DAILY-EGG-OVERPOST-REPAIR-20261109 to authorize
        required: true
        type: string
      expected_main_sha:
        description: Exact reviewed main SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: daily-egg-overpost-repair
  cancel-in-progress: false

jobs:
  execute:
    if: inputs.approve_production == 'DAILY-EGG-OVERPOST-REPAIR-20261109'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Validate reviewed binding
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"
      - name: Run reviewed repair phase over controlled SSH
        uses: appleboy/ssh-action@v1
        env:
          TARGET_SHA: ${{ github.sha }}
          PHASE: ${{ inputs.phase }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: TARGET_SHA,PHASE
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            umask 077
            REPO=/data/phoenix-erp
            STAGE="$(mktemp -d /tmp/daily-egg-overpost-XXXXXX)"
            trap 'rm -rf "$STAGE"' EXIT
            cd "$REPO"
            git_safe() { command git -c safe.directory=$REPO -c core.hooksPath=/dev/null "$@"; }
            git_safe fetch --no-tags origin main
            test "$(git_safe rev-parse FETCH_HEAD)" = "$TARGET_SHA"
            git_safe show "$TARGET_SHA:scripts/ops/repair-daily-egg-inbound-overpost.sql" > "$STAGE/repair.sql"
            if [ "$PHASE" = preflight ] || [ "$PHASE" = verify ]; then
              git_safe show "$TARGET_SHA:scripts/ops/verify-daily-egg-inbound-overpost.sql" \
                | docker exec -i -e PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000' phoenix-v3-db sh -c 'exec psql -X -v ON_ERROR_STOP=1 -tA -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
              exit 0
            fi
            docker exec -i phoenix-v3-db sh -c 'exec psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < "$STAGE/repair.sql"
            echo APPLY=COMMITTED
