name: Audit remaining issues (read-only)

# 一次性只读审计:核对 WMS PDA 终端业务闭环前提(待办数据)+ 仓储操作员 RBAC。
# SSH 进生产只跑 SELECT,零写入。取数完即删。
on:
  workflow_dispatch:

jobs:
  audit:
    name: Audit remaining backlog in prod (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Read-only SELECT via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
            echo "===AUDIT_START==="
            docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off' <<'SQL'
            \echo '==== 1) 哪些角色持 MENU_WMS_INOUT + 权限位(终端操作前提) ===='
            SELECT r.role_code, r.role_name_zh, p.perm_codes
            FROM sys_role_menu_permission p
            JOIN sys_role r ON r.role_id=p.role_id
            JOIN sys_menu m ON m.menu_id=p.menu_id
            WHERE m.menu_code='MENU_WMS_INOUT'
            ORDER BY r.role_code;
            \echo ''
            \echo '==== 2) 仓储操作员角色是否存在 + 其 WMS 菜单授权 ===='
            SELECT r.role_code, r.role_name_zh, m.menu_code, p.perm_codes
            FROM sys_role r
            LEFT JOIN sys_role_menu_permission p ON p.role_id=r.role_id
            LEFT JOIN sys_menu m ON m.menu_id=p.menu_id AND m.menu_code IN ('MENU_WMS_INOUT','MENU_WMS_VIEW','MENU_INV_BATCH','MENU_PDA')
            WHERE r.role_code IN ('ROLE_WH_CLERK','ROLE_WMS_OP','ROLE_WMS_MGR')
            ORDER BY r.role_code, m.menu_code NULLS FIRST;
            \echo ''
            \echo '==== 3) 持仓储角色的在职用户(谁会用终端) ===='
            SELECT u.username, u.real_name, r.role_code
            FROM sys_user u
            JOIN sys_user_role ur ON ur.user_id=u.user_id
            JOIN sys_role r ON r.role_id=ur.role_id
            WHERE r.role_code IN ('ROLE_WH_CLERK','ROLE_WMS_OP','ROLE_WMS_MGR')
            ORDER BY r.role_code, u.username;
            \echo ''
            \echo '==== 4) 入库待办(PDA入库可操作的真实单据) ===='
            SELECT status, count(*) FROM wms_inbound GROUP BY status ORDER BY status;
            \echo ''
            \echo '==== 5) 出库待办(approved/locked/allocated) ===='
            SELECT status, count(*) FROM ord_orders WHERE status IN ('approved','locked','allocated','APPROVED','LOCKED','ALLOCATED') GROUP BY status ORDER BY status;
            \echo ''
            \echo '==== 6) 在库批次数(PDA盘点对象) ===='
            SELECT count(*) AS batches_with_qty FROM inv_batches WHERE qty > 0;
            \echo ''
            \echo '==== 7) 仓库可写范围样本(确认操作员有仓库归属) ===='
            SELECT count(DISTINCT warehouse_code) AS warehouses FROM inv_batches WHERE qty > 0;
            SQL
            echo "===AUDIT_END==="
