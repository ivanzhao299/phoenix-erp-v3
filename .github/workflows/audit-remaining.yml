name: Audit remaining issues (read-only)

# 一次性只读审计:核对生产 sys_notifications / sys_dict 实际列(定位 42703 漂移)。
# SSH 进生产只跑 SELECT,零写入。取数完即删。
on:
  workflow_dispatch:

jobs:
  audit:
    name: Audit remaining backlog in prod (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Read-only SELECT via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
            echo "===AUDIT_START==="
            docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off' <<'SQL'
            \echo '==== sys_notifications 实际列 ===='
            SELECT column_name, data_type FROM information_schema.columns
            WHERE table_name='sys_notifications' ORDER BY ordinal_position;
            \echo ''
            \echo '==== sys_dict 实际列 ===='
            SELECT column_name, data_type FROM information_schema.columns
            WHERE table_name='sys_dict' ORDER BY ordinal_position;
            SQL
            echo "===AUDIT_END==="
