name: Audit remaining issues (read-only)

# 一次性只读审计:核对生产 wms_stocktake 实际列(P3 盘点录入端点前置,防 schema drift)。
# SSH 进生产只跑 SELECT,零写入。取数完即删。
on:
  workflow_dispatch:

jobs:
  audit:
    name: Audit remaining backlog in prod (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Read-only SELECT via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
            echo "===AUDIT_START==="
            docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off' <<'SQL'
            \echo '==== wms_stocktake 实际列 ===='
            SELECT column_name, data_type FROM information_schema.columns
            WHERE table_name='wms_stocktake' ORDER BY ordinal_position;
            \echo ''
            \echo '==== inv_batches 关键列(盘点用:batch_no/qty/warehouse_code/product_code) ===='
            SELECT column_name, data_type FROM information_schema.columns
            WHERE table_name='inv_batches' AND column_name IN
              ('batch_no','qty','qty_available','warehouse_code','location_code','product_code','store_code','status')
            ORDER BY ordinal_position;
            \echo ''
            \echo '==== seq_stocktake_no 是否存在(生成单号用) ===='
            SELECT c.relname FROM pg_class c WHERE c.relkind='S' AND c.relname LIKE '%stocktake%';
            SQL
            echo "===AUDIT_END==="
