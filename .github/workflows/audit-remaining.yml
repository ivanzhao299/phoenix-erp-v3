name: Audit remaining issues (read-only)

# 一次性只读审计:核对 宋雷(ROLE_FACTORY_MGR) 实际持有的质检/看板菜单授权(定位 403 真因)。
# SSH 进生产只跑 SELECT,零写入。取数完即删。
on:
  workflow_dispatch:

jobs:
  audit:
    name: Audit remaining backlog in prod (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Read-only SELECT via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
            echo "===AUDIT_START==="
            docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off' <<'SQL'
            \echo '==== 宋雷 角色现持 质检/看板 相关菜单授权 ===='
            SELECT r.role_code, m.menu_code, p.perm_codes
            FROM sys_user u
            JOIN sys_user_role ur ON ur.user_id=u.user_id
            JOIN sys_role r ON r.role_id=ur.role_id
            JOIN sys_role_menu_permission p ON p.role_id=r.role_id
            JOIN sys_menu m ON m.menu_id=p.menu_id
            WHERE u.real_name LIKE '%宋雷%'
              AND m.menu_code IN ('MENU_QA_OP','MENU_QA_MGR','MENU_QA_MASTER','MENU_MD_QUALITY',
                                  'MENU_DASHBOARD','MENU_WMS_VIEW')
            ORDER BY m.menu_code;
            \echo ''
            \echo '==== 宋雷 近 3 天已记 403(403 日志上线后) ===='
            SELECT request_method, request_path, count(*) n, max(created_at) last_at
            FROM sys_error_logs
            WHERE http_status=403
              AND (username LIKE '%宋雷%' OR user_id IN (SELECT user_id FROM sys_user WHERE real_name LIKE '%宋雷%'))
              AND created_at >= NOW() - INTERVAL '3 days'
            GROUP BY request_method, request_path ORDER BY n DESC LIMIT 30;
            \echo ''
            \echo '==== 质检接口实际守卫菜单(确认 /api/quality/* 需要哪个码) ===='
            SELECT DISTINCT m.menu_code, m.menu_name_zh
            FROM sys_menu m WHERE m.menu_code LIKE 'MENU_QA%' OR m.menu_code='MENU_MD_QUALITY'
            ORDER BY m.menu_code;
            SQL
            echo "===AUDIT_END==="
