name: Packaging Repro Readonly Audit

on:
  workflow_dispatch:
    inputs:
      window_start:
        description: 'UTC start timestamp, e.g. 2026-08-21 05:45:00'
        required: true
      window_end:
        description: 'UTC end timestamp, e.g. 2026-08-21 06:10:00'
        required: true

jobs:
  audit:
    if: ${{ inputs.window_start != 'SWITCH_LPH_MENGSAI_AND_REPLAY_PKG_20260909_206420' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Validate audit window
        shell: bash
        env:
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_END: ${{ inputs.window_end }}
        run: |
          set -euo pipefail
          timestamp_pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$'
          for value in "$WINDOW_START" "$WINDOW_END"; do
            [[ "$value" =~ $timestamp_pattern ]] || { echo "Invalid UTC timestamp format" >&2; exit 1; }
            date -u -d "$value" '+%Y-%m-%d %H:%M:%S' >/dev/null
          done
          [[ $(date -u -d "$WINDOW_START" +%s) -lt $(date -u -d "$WINDOW_END" +%s) ]] \
            || { echo "window_start must be before window_end" >&2; exit 1; }
      - name: Readonly production packaging audit
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_END: ${{ inputs.window_end }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH,WINDOW_START,WINDOW_END
          script: |
            set -euo pipefail
            timestamp_pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$'
            for value in "$WINDOW_START" "$WINDOW_END"; do
              [[ "$value" =~ $timestamp_pattern ]] || { echo "Invalid UTC timestamp format" >&2; exit 1; }
              date -u -d "$value" '+%Y-%m-%d %H:%M:%S' >/dev/null
            done
            [[ $(date -u -d "$WINDOW_START" +%s) -lt $(date -u -d "$WINDOW_END" +%s) ]] \
              || { echo "window_start must be before window_end" >&2; exit 1; }
            cd "$DEPLOY_PATH"
            docker compose exec -T \
              -e AUDIT_WINDOW_START="$WINDOW_START" \
              -e AUDIT_WINDOW_END="$WINDOW_END" \
              -e PGOPTIONS='-c default_transaction_read_only=on' \
              db sh -c 'psql -X -v ON_ERROR_STOP=1 -v window_start="$AUDIT_WINDOW_START" -v window_end="$AUDIT_WINDOW_END" -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
            \pset pager off
            \x on
            BEGIN TRANSACTION READ ONLY;
            SELECT 'WINDOW' AS section, :'window_start' AS window_start, :'window_end' AS window_end;
            SELECT 'SCHEMA_DRIFT' AS section,
                   EXISTS (
                     SELECT 1 FROM information_schema.columns
                      WHERE table_schema = current_schema()
                        AND table_name = 'pkg_packing_records'
                        AND column_name = 'shift_id'
                   ) AS shift_id_exists,
                   EXISTS (
                     SELECT 1 FROM information_schema.columns
                      WHERE table_schema = current_schema()
                        AND table_name = 'pkg_packing_records'
                        AND column_name = 'grading_codes_json'
                   ) AS grading_codes_json_exists;
            SELECT 'PACKING_V3' AS section, p.*
              FROM pkg_packing_records p
             WHERE p.created_at >= :'window_start'::timestamp
               AND p.created_at <  :'window_end'::timestamp
             ORDER BY p.created_at DESC;
            SELECT 'HANDOVER_V3' AS section,
                   to_jsonb(h) AS handover_record,
                   to_jsonb(p) AS packing_record,
                   to_jsonb(ws) AS shift_record
              FROM pkg_handover_records h
              LEFT JOIN pkg_packing_records p ON p.code = h.packing_code
              LEFT JOIN pkg_work_shifts ws ON ws.id = h.shift_id
             WHERE h.created_at >= :'window_start'::timestamp
               AND h.created_at <  :'window_end'::timestamp
             ORDER BY h.created_at DESC;
            SELECT 'BATCHES' AS section, b.batch_no, b.product_code, b.qty, b.qty_available, b.status,
                   b.company_code, b.quality_grade, b.grade_code_std, b.source_type,
                   b.packaging_batch_ref, b.created_at
              FROM inv_batches b
             WHERE (b.created_at >= :'window_start'::timestamp
               AND b.created_at <  :'window_end'::timestamp)
                OR b.packaging_batch_ref IN (
                  SELECT p.code FROM pkg_packing_records p
                   WHERE p.created_at >= :'window_start'::timestamp
                     AND p.created_at <  :'window_end'::timestamp
                )
             ORDER BY b.created_at DESC;
            SELECT 'LEDGER' AS section, l.id, l.batch_no, l.change_type, l.qty_change,
                   l.company_code, l.quality_grade, l.log_date, l.created_at, l.ref_no
              FROM inv_ledger l
             WHERE (l.created_at >= :'window_start'::timestamp
               AND l.created_at <  :'window_end'::timestamp)
                OR l.ref_no IN (
                  SELECT p.code FROM pkg_packing_records p
                   WHERE p.created_at >= :'window_start'::timestamp
                     AND p.created_at <  :'window_end'::timestamp
                )
             ORDER BY l.created_at DESC;
            SELECT 'INVENTORY_SOURCE_MODE_V3' AS section,
                   scope_level, scope_code, mode
              FROM inv_source_mode
             ORDER BY scope_level, scope_code;
            SELECT 'WMS_INBOUND_STATUS_V3' AS section,
                   status, COUNT(*)::int AS row_count
              FROM wms_inbound
             WHERE created_at >= :'window_start'::timestamp
               AND created_at <  :'window_end'::timestamp
             GROUP BY status
             ORDER BY status;
            SELECT 'WMS_INBOUND_ROWS_V3' AS section, wi.*
              FROM wms_inbound wi
             WHERE wi.created_at >= :'window_start'::timestamp
               AND wi.created_at <  :'window_end'::timestamp
             ORDER BY wi.created_at DESC;
            SELECT 'WORK_SHIFT_SITE_DISTRIBUTION_V3' AS section,
                   site_id, COUNT(*)::int AS shift_count
              FROM pkg_work_shifts
             WHERE created_at >= :'window_start'::timestamp
               AND created_at <  :'window_end'::timestamp
             GROUP BY site_id
             ORDER BY site_id NULLS FIRST;
            SELECT 'WORK_SHIFT_ROWS_V3' AS section, ws.*
              FROM pkg_work_shifts ws
             WHERE ws.created_at >= :'window_start'::timestamp
               AND ws.created_at <  :'window_end'::timestamp
             ORDER BY ws.created_at DESC;
            COMMIT;
            SQL

  approved_closeout:
    if: ${{ inputs.window_start == 'SWITCH_LPH_MENGSAI_AND_REPLAY_PKG_20260909_206420' && inputs.window_end == 'APPROVE_EXACT_ONE_PACKING_REPLAY' }}
    uses: ./.github/workflows/packaging-inventory-approved-closeout.yml
    with:
      confirmation: SWITCH_LPH_MENGSAI_AND_REPLAY_PKG_20260909_206420
      approve_production: true
    secrets: inherit
