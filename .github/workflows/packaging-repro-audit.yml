name: Packaging Repro Readonly Audit

on:
  workflow_dispatch:
    inputs:
      window_start:
        description: 'UTC start timestamp, e.g. 2026-08-21 05:45:00'
        required: true
      window_end:
        description: 'UTC end timestamp, e.g. 2026-08-21 06:10:00'
        required: true

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Readonly production packaging audit
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_END: ${{ inputs.window_end }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH,WINDOW_START,WINDOW_END
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<SQL
            \pset pager off
            \x on
            SELECT 'WINDOW' AS section, '$WINDOW_START' AS window_start, '$WINDOW_END' AS window_end;
            SELECT 'PACKING' AS section, p.*
              FROM pkg_packing_records p
             WHERE p.created_at BETWEEN '$WINDOW_START'::timestamp AND '$WINDOW_END'::timestamp
             ORDER BY p.created_at DESC;
            SELECT 'HANDOVER' AS section, h.*
              FROM pkg_handover_records h
             WHERE h.created_at BETWEEN '$WINDOW_START'::timestamp AND '$WINDOW_END'::timestamp
             ORDER BY h.created_at DESC;
            SELECT 'BATCHES' AS section, b.batch_no, b.product_code, b.qty, b.qty_available, b.status,
                   b.company_code, b.quality_grade, b.grade_code_std, b.source_type,
                   b.packaging_batch_ref, b.created_at
              FROM inv_batches b
             WHERE b.created_at BETWEEN '$WINDOW_START'::timestamp AND '$WINDOW_END'::timestamp
                OR b.packaging_batch_ref IN (
                  SELECT p.code FROM pkg_packing_records p
                   WHERE p.created_at BETWEEN '$WINDOW_START'::timestamp AND '$WINDOW_END'::timestamp
                )
             ORDER BY b.created_at DESC;
            SELECT 'LEDGER' AS section, l.id, l.batch_no, l.change_type, l.qty_change,
                   l.company_code, l.quality_grade, l.log_date, l.created_at, l.ref_no
              FROM inv_ledger l
             WHERE l.created_at BETWEEN '$WINDOW_START'::timestamp AND '$WINDOW_END'::timestamp
                OR l.ref_no IN (
                  SELECT p.code FROM pkg_packing_records p
                   WHERE p.created_at BETWEEN '$WINDOW_START'::timestamp AND '$WINDOW_END'::timestamp
                )
             ORDER BY l.created_at DESC;
            SELECT 'MODE' AS section, setting_key, setting_value, updated_at
              FROM sys_settings
             WHERE setting_key ILIKE '%INVENTORY%' OR setting_key ILIKE '%SOURCE%'
             ORDER BY updated_at DESC;
            SQL
