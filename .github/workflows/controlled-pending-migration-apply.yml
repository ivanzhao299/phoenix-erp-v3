name: Controlled Pending Migration Apply

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'inspect = read-only pending/ledger dump; apply = run pending migrations from the reviewed candidate image and record receipts'
        required: true
        type: choice
        options: [inspect, apply]
      approve_production:
        description: 'Use the exact approval token for the selected migration scope'
        required: true
        type: string
      expected_main_sha:
        description: 'Exact merged main SHA carrying this reviewed workflow and the candidate image'
        required: true
        type: string
      expected_before_ledger_sha256:
        description: 'apply only: ledger digest observed by the inspect phase (compare-and-swap)'
        required: false
        type: string

      audit_scope:
        description: 'Choose the ordinary gate or the exact approved candidate scope'
        type: choice
        options: [ordinary, vet-1124, egg-source-1125, production-ui-1125, egg-source-permissions-1126, egg-source-house-1126, egg-source-legacy-creation-1126, inventory-1127]
        default: ordinary
      inspection_run:
        description: 'Receipt-bound egg-source scopes: reviewed inspection run id-attempt'
        type: string
        required: false
      recovery_apply_run:
        description: 'Receipt-bound recovery: original apply run id-attempt with verified backup'
        type: string
        required: false
      expected_vet_inspection_sha256:
        description: 'Scoped apply only: inspection SHA-256 from that exact candidate inspect'
        type: string
        required: false

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: controlled-pending-migration-apply
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      inputs.phase == 'inspect' ||
      (inputs.phase == 'apply' && inputs.audit_scope == 'egg-source-1125' && inputs.approve_production == 'APPLY-EGG-SOURCE-20261125') ||
      (inputs.phase == 'apply' && inputs.audit_scope == 'production-ui-1125' && inputs.approve_production == 'APPLY-PRODUCTION-UI-20261125') ||
      (inputs.phase == 'apply' && inputs.audit_scope == 'egg-source-permissions-1126' && inputs.approve_production == 'APPLY-EGG-SOURCE-PERMISSIONS-20261126') ||
      (inputs.phase == 'apply' && inputs.audit_scope == 'egg-source-house-1126' && inputs.approve_production == 'APPLY-EGG-SOURCE-HOUSE-20261126') ||
      (inputs.phase == 'apply' && inputs.audit_scope == 'egg-source-legacy-creation-1126' && inputs.approve_production == 'APPLY-EGG-SOURCE-LEGACY-CREATION-20261126') ||
      (inputs.phase == 'apply' && inputs.audit_scope == 'inventory-1127' && inputs.approve_production == 'APPLY-INVENTORY-SCHEMA-20261127') ||
      (inputs.phase == 'apply' && (inputs.audit_scope == 'ordinary' || inputs.audit_scope == 'vet-1124') && inputs.approve_production == 'APPLY-PENDING-MIGRATIONS-20261103')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Validate reviewed binding
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}" = main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"
      - name: Verify exact scoped candidate and official main CI
        if: inputs.audit_scope == 'vet-1124' || inputs.audit_scope == 'egg-source-1125' || inputs.audit_scope == 'production-ui-1125' || inputs.audit_scope == 'egg-source-permissions-1126' || inputs.audit_scope == 'egg-source-house-1126' || inputs.audit_scope == 'egg-source-legacy-creation-1126' || inputs.audit_scope == 'inventory-1127'
        env:
          TARGET_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          AUDIT_SCOPE: ${{ inputs.audit_scope }}
          RECOVERY_APPLY_RUN: ${{ inputs.recovery_apply_run }}
        run: |
          set -euo pipefail
          if [ "$AUDIT_SCOPE" = egg-source-1125 ]; then
            node scripts/ops/egg-source-release.mjs source
          elif [ "$AUDIT_SCOPE" = production-ui-1125 ]; then
            node scripts/ops/production-ui-schema-release.mjs source
          elif [ "$AUDIT_SCOPE" = egg-source-permissions-1126 ]; then
            node scripts/ops/egg-source-permissions-release.mjs source
          elif [ "$AUDIT_SCOPE" = egg-source-house-1126 ]; then
            node scripts/ops/egg-source-house-release.mjs source
          elif [ "$AUDIT_SCOPE" = egg-source-legacy-creation-1126 ]; then
            node scripts/ops/egg-source-legacy-creation-release.mjs source
          elif [ "$AUDIT_SCOPE" = inventory-1127 ]; then
            proof="$(node scripts/ops/inventory-schema-1127-release.mjs source)"
            printf '%s\n' "$proof"
            if [ -n "$RECOVERY_APPLY_RUN" ]; then
              INVENTORY_RECOVERY_SOURCE="$(jq -er .target <<< "$proof")"
              [[ "$INVENTORY_RECOVERY_SOURCE" =~ ^[a-f0-9]{40}$ ]]
              echo "INVENTORY_RECOVERY_SOURCE=$INVENTORY_RECOVERY_SOURCE" >> "$GITHUB_ENV"
              export TARGET_SHA="$INVENTORY_RECOVERY_SOURCE"
            fi
          else
            node scripts/ops/vet-1124-migration.mjs source
          fi
          node --test --test-reporter=tap scripts/ops/inventory-schema-1127-release.test.mjs scripts/ops/egg-source-legacy-creation-release.test.mjs scripts/ops/egg-source-house-release.test.mjs scripts/ops/egg-source-permissions-release.test.mjs scripts/ops/production-ui-schema-release.test.mjs scripts/ops/egg-source-release.test.mjs scripts/ops/vet-1124-backup-volume.test.mjs scripts/ops/vet-1124-migration.test.mjs scripts/ops/production-maintenance-backup-paths.test.mjs scripts/ops/production-maintenance-pending-backup.test.mjs
          node scripts/ops/vet-1124-ci.mjs hosted-log-reader
      - name: Match the official API digest to every reviewed migration
        if: inputs.audit_scope == 'vet-1124' || inputs.audit_scope == 'egg-source-1125' || inputs.audit_scope == 'production-ui-1125' || inputs.audit_scope == 'egg-source-permissions-1126' || inputs.audit_scope == 'egg-source-house-1126' || inputs.audit_scope == 'egg-source-legacy-creation-1126' || inputs.audit_scope == 'inventory-1127'
        env:
          TARGET_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          docker pull -q "$VET_API_IMAGE" >/dev/null
          export TARGET_SHA="${INVENTORY_RECOVERY_SOURCE:-$TARGET_SHA}"
          VET_IMAGE_ID="$(docker image inspect "$VET_API_IMAGE" --format '{{.Id}}')" node scripts/ops/vet-1124-ci.mjs inventory
      - name: Validate the reviewed scoped inspection artifact
        if: inputs.phase == 'apply' && (inputs.audit_scope == 'egg-source-house-1126' || inputs.audit_scope == 'egg-source-legacy-creation-1126' || inputs.audit_scope == 'inventory-1127')
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_SCOPE: ${{ inputs.audit_scope }}
          INSPECTION_RUN: ${{ inputs.inspection_run }}
          EXPECTED_BEFORE_LEDGER_SHA256: ${{ inputs.expected_before_ledger_sha256 }}
          EXPECTED_VET_INSPECTION_SHA256: ${{ inputs.expected_vet_inspection_sha256 }}
        run: |
          set -euo pipefail
          [[ "$INSPECTION_RUN" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          run_id="${INSPECTION_RUN%-*}"
          attempt="${INSPECTION_RUN#*-}"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$attempt" |
            jq -e --arg sha "${INVENTORY_RECOVERY_SOURCE:-$GITHUB_SHA}" --arg attempt "$attempt" '
              .head_sha==$sha and .head_branch=="main" and .event=="workflow_dispatch" and
              .path==".github/workflows/controlled-pending-migration-apply.yml" and
              .run_attempt==($attempt|tonumber) and .status=="completed" and .conclusion=="success"' >/dev/null
          evidence="$(mktemp -d "$RUNNER_TEMP/egg-source-inspect.XXXXXXXX")"
          case "$AUDIT_SCOPE" in
            egg-source-house-1126) artifact=egg-source-house-inspection ;;
            egg-source-legacy-creation-1126) artifact=egg-source-legacy-creation-inspection ;;
            inventory-1127) artifact=inventory-schema-inspection ;;
            *) exit 22 ;;
          esac
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact-$INSPECTION_RUN" --dir "$evidence"
          [[ "$EXPECTED_BEFORE_LEDGER_SHA256" =~ ^[a-f0-9]{64}$ && "$EXPECTED_VET_INSPECTION_SHA256" =~ ^[a-f0-9]{64}$ ]]
          jq -e --arg sha "${INVENTORY_RECOVERY_SOURCE:-$GITHUB_SHA}" --arg run "$INSPECTION_RUN" \
            --arg ledger "$EXPECTED_BEFORE_LEDGER_SHA256" --arg inspection "$EXPECTED_VET_INSPECTION_SHA256" '
              .=={target:$sha,run:$run,ledgerSha256:$ledger,scopedInspectionSha256:$inspection}' \
            "$evidence/egg-source-permissions-inspection.json" >/dev/null
      - name: Prepare trusted helpers
        run: |
          set -euo pipefail
          echo "PRODUCTION_CONTRACT_B64=$(base64 -w0 scripts/ops/production-config-contract.json)" >> "$GITHUB_ENV"
          echo "PRODUCTION_PATH_HELPER_B64=$(base64 -w0 scripts/ops/production-trusted-paths.mjs)" >> "$GITHUB_ENV"
          echo "PRODUCTION_CONTROL_BOOTSTRAP_B64=$(base64 -w0 scripts/ops/production-control-bootstrap.sh)" >> "$GITHUB_ENV"
      - name: Run ${{ inputs.phase }} over controlled SSH
        id: controlled_remote
        uses: appleboy/ssh-action@v1
        env:
          TARGET_SHA: ${{ github.sha }}
          PHASE: ${{ inputs.phase }}
          AUDIT_SCOPE: ${{ inputs.audit_scope }}
          EXPECTED_VET_INSPECTION_SHA256: ${{ inputs.expected_vet_inspection_sha256 }}
          VET_API_IMAGE: ${{ env.VET_API_IMAGE }}
          VET_CI_SHA256: ${{ env.VET_CI_SHA256 }}
          EXPECTED_BEFORE_LEDGER_SHA256: ${{ inputs.expected_before_ledger_sha256 }}
          RECOVERY_APPLY_RUN: ${{ inputs.recovery_apply_run }}
          INVENTORY_RECOVERY_SOURCE: ${{ env.INVENTORY_RECOVERY_SOURCE }}
          MIGRATION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          GHCR_LOGIN_USER: ${{ github.repository_owner }}
          GHCR_LOGIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_CONTRACT_B64: ${{ env.PRODUCTION_CONTRACT_B64 }}
          PRODUCTION_PATH_HELPER_B64: ${{ env.PRODUCTION_PATH_HELPER_B64 }}
          PRODUCTION_CONTROL_BOOTSTRAP_B64: ${{ env.PRODUCTION_CONTROL_BOOTSTRAP_B64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: TARGET_SHA,PHASE,AUDIT_SCOPE,EXPECTED_VET_INSPECTION_SHA256,VET_API_IMAGE,VET_CI_SHA256,EXPECTED_BEFORE_LEDGER_SHA256,RECOVERY_APPLY_RUN,INVENTORY_RECOVERY_SOURCE,MIGRATION_RUN_ID,GHCR_LOGIN_USER,GHCR_LOGIN_TOKEN,PRODUCTION_CONTRACT_B64,PRODUCTION_PATH_HELPER_B64,PRODUCTION_CONTROL_BOOTSTRAP_B64
          capture_stdout: ${{ inputs.phase == 'inspect' && (inputs.audit_scope == 'egg-source-permissions-1126' || inputs.audit_scope == 'egg-source-house-1126' || inputs.audit_scope == 'egg-source-legacy-creation-1126' || inputs.audit_scope == 'inventory-1127') }}
          command_timeout: 20m
          script: |
            set -Eeuo pipefail
            umask 077
            case "$PHASE" in inspect|apply) ;; *) exit 22 ;; esac
            case "$AUDIT_SCOPE" in ordinary|vet-1124|egg-source-1125|production-ui-1125|egg-source-permissions-1126|egg-source-house-1126|egg-source-legacy-creation-1126|inventory-1127) ;; *) exit 22 ;; esac
            if [ -n "$RECOVERY_APPLY_RUN" ]; then
              test "$PHASE" = apply
              [[ "$AUDIT_SCOPE" = egg-source-house-1126 || "$AUDIT_SCOPE" = egg-source-legacy-creation-1126 || "$AUDIT_SCOPE" = inventory-1127 ]]
              [[ "$RECOVERY_APPLY_RUN" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
            fi
            cd /data/phoenix-erp
            export DEPLOY_REPO_ROOT=/data/phoenix-erp
            eval "$(printf '%s' "$PRODUCTION_CONTROL_BOOTSTRAP_B64" | base64 -d)"
            git_safe() { command git -c "safe.directory=$DEPLOY_REPO_ROOT" -c core.hooksPath=/dev/null "$@"; }
            test "$(git_safe branch --show-current)" = main
            test -z "$(git_safe status --porcelain --untracked-files=all)"
            git_safe fetch --no-tags origin main
            test "$(git_safe rev-parse FETCH_HEAD)" = "$TARGET_SHA"
            for marker in transaction.json policy-transition.json cutover-pending.json schema-release-pending.json; do
              test ! -e "$STATE_DIR/$marker" && test ! -L "$STATE_DIR/$marker" || { echo "MIGRATION_APPLY=HOLD_IN_FLIGHT_$marker"; exit 1; }
            done
            # OPEN is the normal post-release admission state, not an
            # in-flight deployment. Continue rejecting fenced/publishing or
            # malformed records before schema-first migration.
            if [ -e "$STATE_DIR/background-control.json" ] || [ -L "$STATE_DIR/background-control.json" ]; then
              node --input-type=module -e '
                import fs from "node:fs";
                try {
                const file=process.argv[1],expected=fs.lstatSync(file);
                const regular=s=>s.isFile()&&!s.isSymbolicLink()&&s.uid===0&&(s.mode&0o7777)===0o600&&s.nlink===1&&s.size<=65536;
                if(!regular(expected))process.exit(1);
                const fd=fs.openSync(file,fs.constants.O_RDONLY|fs.constants.O_NOFOLLOW);
                const opened=fs.fstatSync(fd);
                const identity=s=>JSON.stringify([s.dev,s.ino,s.size,s.mtimeMs,s.ctimeMs]);
                if(!regular(opened)||identity(expected)!==identity(opened))process.exit(1);
                const record=JSON.parse(fs.readFileSync(fd,"utf8"));
                const after=fs.fstatSync(fd),named=fs.lstatSync(file);fs.closeSync(fd);
                if(!regular(after)||!regular(named)||identity(opened)!==identity(after)||identity(after)!==identity(named))process.exit(1);
                if (record?.phase !== "OPEN" || Object.hasOwn(record,"purpose") || Object.hasOwn(record,"cutover") || Object.hasOwn(record,"schemaRelease")) process.exit(1);
                } catch { process.stderr.write("MIGRATION_APPLY=HOLD_CONTROL_METADATA\n");process.exitCode=1; }
              ' "$STATE_DIR/background-control.json" \
                || { echo 'MIGRATION_APPLY=HOLD_IN_FLIGHT_background-control.json'; exit 1; }
            fi
            STAGE="$STATE_DIR/migration-apply-$MIGRATION_RUN_ID"
            test ! -e "$STAGE"
            mkdir -m 700 "$STAGE"
            trap 'rm -rf "$STAGE"' EXIT
            for helper in chanjet-admission-schema-receipt.mjs record-migration-apply-receipt.mjs production-config-guard.mjs production-config-contract.json production-atomic-state.mjs production-trusted-paths.mjs capture-production-runtime.mjs chanjet-readonly-policy.mjs update-managed-chanjet-env.mjs audit-daily-egg-inbound.mjs pending-migration-backup-paths.mjs vet-1124-backup-volume.mjs; do
              git_safe show "$TARGET_SHA:scripts/ops/$helper" > "$STAGE/$helper"
              chmod 600 "$STAGE/$helper"
            done

            SCOPED_REVIEW_HELPER=
            if [ "$AUDIT_SCOPE" != ordinary ]; then
              case "$AUDIT_SCOPE" in
                vet-1124) SCOPED_REVIEW_HELPER=vet-1124-migration.mjs ;;
                egg-source-1125) SCOPED_REVIEW_HELPER=egg-source-release.mjs ;;
                production-ui-1125) SCOPED_REVIEW_HELPER=production-ui-schema-release.mjs ;;
                egg-source-permissions-1126) SCOPED_REVIEW_HELPER=egg-source-permissions-release.mjs ;;
                egg-source-house-1126) SCOPED_REVIEW_HELPER=egg-source-house-release.mjs ;;
                egg-source-legacy-creation-1126) SCOPED_REVIEW_HELPER=egg-source-legacy-creation-release.mjs ;;
                inventory-1127) SCOPED_REVIEW_HELPER=inventory-schema-1127-release.mjs ;;
              esac
              if [ "$AUDIT_SCOPE" = egg-source-legacy-creation-1126 ]; then
                git_safe show "$TARGET_SHA:scripts/ops/egg-source-house-release.mjs" > "$STAGE/egg-source-house-release.mjs"
              fi
              for helper in "$SCOPED_REVIEW_HELPER" production-modern-schema-confirmed-scope.mjs production-legacy-egg-audit-evidence.mjs production-lossless-json.mjs production-maintenance-receipts.mjs; do
                git_safe show "$TARGET_SHA:scripts/ops/$helper" > "$STAGE/$helper"
              done
            fi

            # Pending migrations are derived from the reviewed target tree
            # minus the production ledger; no candidate image is needed unless
            # migrations actually have to execute.
            LEDGER_JSON_LINE="$(node --input-type=module -e "import {readProductionLedger} from '$STAGE/chanjet-admission-schema-receipt.mjs'; console.log(JSON.stringify(readProductionLedger()))")"
            LEDGER_SHA256="$(node --input-type=module -e "import {createHash} from 'node:crypto'; const d=createHash('sha256').update(process.argv[1]).digest('hex'); console.log(d)" "$LEDGER_JSON_LINE")"
            echo "LEDGER_SHA256=$LEDGER_SHA256"
            RUNNING_API_REV="$(docker inspect phoenix-v3-api --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            echo "RUNNING_API_REV=$RUNNING_API_REV"
            MIGRATION_PATHS="$(git_safe diff --name-only "$RUNNING_API_REV" "$TARGET_SHA" -- apps/api/src/database/migrations | tr '\n' ' ')"
            echo "CHANGED_MIGRATION_PATHS=$MIGRATION_PATHS"
            APPLIED_JSON="$(node -e 'const l=JSON.parse(process.argv[1]);console.log(JSON.stringify(l.typeorm))' "$LEDGER_JSON_LINE")"
            PENDING_CLASSES=""
            for f in $(git_safe ls-tree --name-only "$TARGET_SHA" apps/api/src/database/migrations/ | grep -E '\.ts$' || true); do
              name="$(basename "$f" .ts)"
              ts="${name%%-*}"
              cls="${name#*-}"
              node -e '
                const applied = JSON.parse(process.argv[1]); const ts = process.argv[2]; const cls = process.argv[3];
                const done = applied.some(row => String(row.timestamp) === ts && (row.name === cls || row.name === cls + ts));
                process.exit(done ? 0 : 1);' "$APPLIED_JSON" "$ts" "$cls" || PENDING_CLASSES="$PENDING_CLASSES $name"
            done
            echo "PENDING_MIGRATION_FILES=$PENDING_CLASSES"
            if [[ "$PENDING_CLASSES" == *1795654800000-EggSourceHouseContract* || "$MIGRATION_PATHS" == *1795654800000-EggSourceHouseContract* ]]; then
              test "$AUDIT_SCOPE" = egg-source-house-1126 || { echo 'MIGRATION_APPLY=HOLD_EGG_SOURCE_HOUSE_SCOPE_REQUIRED'; exit 1; }
            fi
            if [[ "$PENDING_CLASSES" == *1795658400000-EggSourceLegacyCreationGate* || "$MIGRATION_PATHS" == *1795658400000-EggSourceLegacyCreationGate* ]]; then
              test "$AUDIT_SCOPE" = egg-source-legacy-creation-1126 || { echo 'MIGRATION_APPLY=HOLD_EGG_SOURCE_LEGACY_CREATION_SCOPE_REQUIRED'; exit 1; }
            fi
            if [ "$AUDIT_SCOPE" = egg-source-legacy-creation-1126 ]; then
              test "$MIGRATION_PATHS" = 'apps/api/src/database/migrations/1795658400000-EggSourceLegacyCreationGate.ts ' ||
                { echo 'MIGRATION_APPLY=HOLD_EGG_SOURCE_LEGACY_CREATION_MIGRATION_SET'; exit 1; }
            fi
            if [ "$PHASE" = apply ] && [[ "$PENDING_CLASSES $MIGRATION_PATHS" =~ 179565(8500000|8600000|8700000)- ]]; then
              test "$AUDIT_SCOPE" = inventory-1127 || { echo 'MIGRATION_APPLY=HOLD_INVENTORY_SCOPE_REQUIRED'; exit 1; }
            fi
            run_audit() {
              DAILY_EGG_PSQL_CMD="docker exec -i -e PGOPTIONS='-c default_transaction_read_only=on' phoenix-v3-db sh -c 'exec psql -X -v ON_ERROR_STOP=1 -tA -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\"'" \
                node "$STAGE/audit-daily-egg-inbound.mjs" --output-dir "$STAGE/out" --report "$STAGE/out/REPORT.md" >/dev/null 2>&1 || test $? -eq 2
              node -e 'const r=require(process.argv[1]);console.log(r.conclusion)' "$STAGE/out/daily-egg-inbound-audit-latest.json"
            }

            vet_inspection() {
              local checkout fresh_ledger
              for service in phoenix-v3-api phoenix-v3-web; do
                test "$(docker inspect "$service" --format '{{.State.Running}}')" = true || return 1
              done
              checkout="$(git_safe rev-parse HEAD)" || return 1
              fresh_ledger="$(node --input-type=module -e "import {readProductionLedger} from '$STAGE/chanjet-admission-schema-receipt.mjs'; console.log(JSON.stringify(readProductionLedger()))")" || return 1
              test "$fresh_ledger" = "$LEDGER_JSON_LINE" || { echo 'MIGRATION_APPLY=HOLD_LEDGER_MOVED' >&2; return 1; }
              RUNNING_CHECKOUT="$checkout" \
                LEDGER_SHA256="$LEDGER_SHA256" PENDING_CLASSES="$PENDING_CLASSES" node "$STAGE/$SCOPED_REVIEW_HELPER" inspect
            }
            verify_vet_backup_volume() {
              node --input-type=module -e "import {physicalParent,physicalPins} from '$STAGE/vet-1124-backup-volume.mjs'; physicalPins(physicalParent); console.log('VET_BACKUP_VOLUME=VERIFIED')"
            }
            if [[ "$AUDIT_SCOPE" = egg-source-house-1126 || "$AUDIT_SCOPE" = egg-source-legacy-creation-1126 || "$AUDIT_SCOPE" = inventory-1127 ]]; then
              if [ -n "$RECOVERY_APPLY_RUN" ]; then
                test -z "$PENDING_CLASSES" || { echo 'MIGRATION_APPLY=HOLD_RECOVERY_WITH_PENDING'; exit 1; }
                TARGET_SHA="${INVENTORY_RECOVERY_SOURCE:-$TARGET_SHA}" node "$STAGE/pending-migration-backup-paths.mjs" recover "$RECOVERY_APPLY_RUN"
                RUNNING_CHECKOUT="$(git_safe rev-parse HEAD)" AFTER_LEDGER="$LEDGER_JSON_LINE" \
                  node "$STAGE/$SCOPED_REVIEW_HELPER" recover
              else
                test -n "$PENDING_CLASSES" || { echo 'MIGRATION_APPLY=HOLD_RECOVERY_PROOF_REQUIRED'; exit 1; }
              fi
            fi
            if [ -n "$SCOPED_REVIEW_HELPER" ] && [ -z "$RECOVERY_APPLY_RUN" ]; then
              VET_INSPECTION_SHA256="$(vet_inspection)"
              echo "SCOPED_INSPECTION_SHA256=$VET_INSPECTION_SHA256"
              if [ "$AUDIT_SCOPE" = vet-1124 ]; then echo "VET_INSPECTION_SHA256=$VET_INSPECTION_SHA256"; fi
              if [ "$PHASE" = apply ]; then
                test "$VET_INSPECTION_SHA256" = "$EXPECTED_VET_INSPECTION_SHA256" || { echo 'MIGRATION_APPLY=HOLD_INSPECTION_MOVED'; exit 1; }
              fi
            fi
            if [ "$PHASE" = inspect ]; then
              if [ -n "$SCOPED_REVIEW_HELPER" ]; then
                verify_vet_backup_volume
              fi
              if [ -z "$SCOPED_REVIEW_HELPER" ]; then
                echo "AUDIT_CONCLUSION=$(run_audit)"
                cat "$STAGE/out/REPORT.md"
              fi
              echo "INSPECT=COMPLETE"
              exit 0
            fi

            test -n "$MIGRATION_PATHS" || { echo 'MIGRATION_APPLY=HOLD_NO_CHANGED_PATHS'; exit 1; }
            if [ -n "$PENDING_CLASSES" ]; then
              # Compare-and-swap: refuse to execute migrations if anything else
              # touched the ledger since the reviewed inspect phase.
              test "$EXPECTED_BEFORE_LEDGER_SHA256" = "$LEDGER_SHA256" || { echo 'MIGRATION_APPLY=HOLD_LEDGER_MOVED'; exit 1; }
              if [ -n "$SCOPED_REVIEW_HELPER" ]; then
                API_IMAGE="$VET_API_IMAGE"
              else
                AUDIT_CONCLUSION="$(run_audit)"
                test "$AUDIT_CONCLUSION" = GO || { echo "MIGRATION_APPLY=HOLD_AUDIT_$AUDIT_CONCLUSION"; exit 1; }
                API_IMAGE="ghcr.io/ivanzhao299/phoenix-erp-v3/api:sha-$TARGET_SHA"
              fi
              docker login ghcr.io -u "$GHCR_LOGIN_USER" --password-stdin <<< "$GHCR_LOGIN_TOKEN"
              docker pull -q "$API_IMAGE" >/dev/null
              test "$(docker image inspect "$API_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$TARGET_SHA"
              # BEGIN pending-migration backup: archive parsing does not restore a database.
              [[ "$MIGRATION_RUN_ID" =~ ^[0-9]+-[0-9]+$ && "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
              BACKUP_PARENT=/opt/phoenix-erp-backups
              if [ -n "$SCOPED_REVIEW_HELPER" ]; then
                BACKUP_PARENT=/data/backups/opt/phoenix-erp-backups
              fi
              BACKUP_DIR="$BACKUP_PARENT/pending-migration-${MIGRATION_RUN_ID}"
              node "$STAGE/pending-migration-backup-paths.mjs" prepare "$MIGRATION_RUN_ID"
              AVAILABLE_KB="$(df -Pk "$BACKUP_PARENT" | awk 'NR == 2 { print $4 }')"
              [[ "$AVAILABLE_KB" =~ ^[0-9]+$ && "$AVAILABLE_KB" -ge 2097152 ]] || { echo 'MIGRATION_BACKUP=HOLD_INSUFFICIENT_SPACE'; exit 28; }
              BACKUP_FILE="$BACKUP_DIR/phoenix_erp_pre_${TARGET_SHA:0:12}.dump"
              node "$STAGE/pending-migration-backup-paths.mjs" verify "$MIGRATION_RUN_ID"
              docker exec -i phoenix-v3-db sh -c \
                'exec pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --format=custom --compress=6 --no-owner --no-privileges' \
                > "$BACKUP_FILE"
              node "$STAGE/pending-migration-backup-paths.mjs" verify "$MIGRATION_RUN_ID"
              chmod 600 "$BACKUP_FILE"
              test -s "$BACKUP_FILE"
              docker exec -i phoenix-v3-db pg_restore --list < "$BACKUP_FILE" > "$BACKUP_DIR/archive-toc.txt"
              chmod 600 "$BACKUP_DIR/archive-toc.txt"
              TOC_ENTRIES="$(awk '!/^;/ && NF { n++ } END { print n+0 }' "$BACKUP_DIR/archive-toc.txt")"
              test "$TOC_ENTRIES" -gt 0
              # No -d/--dbname: parse/decompress the full archive into /dev/null, never execute its SQL.
              docker exec -i phoenix-v3-db pg_restore --exit-on-error --no-owner --no-privileges --file=/dev/null \
                < "$BACKUP_FILE" 2> "$BACKUP_DIR/archive-parse.log"
              chmod 600 "$BACKUP_DIR/archive-parse.log"
              (cd "$BACKUP_DIR" && sha256sum "$(basename "$BACKUP_FILE")" > "$(basename "$BACKUP_FILE").sha256" \
                && sha256sum --check --status "$(basename "$BACKUP_FILE").sha256")
              chmod 600 "${BACKUP_FILE}.sha256"
              read -r BACKUP_SHA256 _ < "${BACKUP_FILE}.sha256"
              [[ "$BACKUP_SHA256" =~ ^[a-f0-9]{64}$ ]]
              echo "MIGRATION_BACKUP_FILE=$BACKUP_FILE"
              echo "MIGRATION_BACKUP_SHA256=$BACKUP_SHA256"
              echo "MIGRATION_BACKUP_TOC_ENTRIES=$TOC_ENTRIES"
              echo 'MIGRATION_BACKUP=VERIFIED_CUSTOM_ARCHIVE_FULL_PARSE'
              # END pending-migration backup.
              if [ -n "$SCOPED_REVIEW_HELPER" ]; then
                BACKUP_SHA256="$BACKUP_SHA256" TOC_ENTRIES="$TOC_ENTRIES" node "$STAGE/pending-migration-backup-paths.mjs" receipt "$MIGRATION_RUN_ID"
                # Backup can take time. Re-observe main, runtime, ledger and both complete audit rows.
                git_safe fetch --no-tags origin main
                test "$(git_safe rev-parse FETCH_HEAD)" = "$TARGET_SHA"
                FINAL_VET_INSPECTION_SHA256="$(vet_inspection)"
                test "$FINAL_VET_INSPECTION_SHA256" = "$EXPECTED_VET_INSPECTION_SHA256" || { echo 'MIGRATION_APPLY=HOLD_INSPECTION_MOVED'; exit 1; }
              fi
              REQUIRE_BACKUP_RECEIPT=1 node "$STAGE/pending-migration-backup-paths.mjs" verify "$MIGRATION_RUN_ID"
              PRESERVE_ARTIFACTS=true bash scripts/deploy-schema-first.sh /opt/phoenix/backups/migration-evidence "$API_IMAGE"
              LEDGER_JSON_LINE_AFTER="$(node --input-type=module -e "import {readProductionLedger} from '$STAGE/chanjet-admission-schema-receipt.mjs'; console.log(JSON.stringify(readProductionLedger()))")"
              if [ -n "$SCOPED_REVIEW_HELPER" ]; then
                if [ "$AUDIT_SCOPE" = production-ui-1125 ] || [ "$AUDIT_SCOPE" = egg-source-permissions-1126 ] || [ "$AUDIT_SCOPE" = egg-source-house-1126 ] || [ "$AUDIT_SCOPE" = egg-source-legacy-creation-1126 ] || [ "$AUDIT_SCOPE" = inventory-1127 ]; then
                  for service in phoenix-v3-api phoenix-v3-web; do
                    test "$(docker inspect "$service" --format '{{.State.Running}}')" = true || {
                      echo 'PRODUCTION_UI_SCHEMA_HOLD=BASELINE_SERVICE_STOPPED'
                      exit 1
                    }
                  done
                fi
                RUNNING_CHECKOUT="$(git_safe rev-parse HEAD)" \
                  BEFORE_LEDGER="$LEDGER_JSON_LINE" AFTER_LEDGER="$LEDGER_JSON_LINE_AFTER" \
                  node "$STAGE/$SCOPED_REVIEW_HELPER" after
              fi
              # Re-derive pending from the fresh ledger.
              PENDING_AFTER=""
              for f in $(git_safe ls-tree --name-only "$TARGET_SHA" apps/api/src/database/migrations/ | grep -E '\.ts$' || true); do
                name="$(basename "$f" .ts)"; ts="${name%%-*}"; cls="${name#*-}"
                APPLIED_JSON="$LEDGER_JSON_LINE_AFTER" node -e '
                  const applied = JSON.parse(process.env.APPLIED_JSON).typeorm; const ts = process.argv[2]; const cls = process.argv[3];
                  const done = applied.some(row => String(row.timestamp) === ts && (row.name === cls || row.name === cls + ts));
                  process.exit(done ? 0 : 1);' x "$ts" "$cls" || PENDING_AFTER="$PENDING_AFTER $name"
              done
              test -z "$PENDING_AFTER" || { echo "MIGRATION_APPLY=HOLD_STILL_PENDING:$PENDING_AFTER"; exit 1; }
            else
              echo 'MIGRATION_APPLY=MIGRATIONS_ALREADY_APPLIED_RECORDING_RECEIPTS'
            fi
            if [[ "$AUDIT_SCOPE" = egg-source-house-1126 || "$AUDIT_SCOPE" = egg-source-legacy-creation-1126 || "$AUDIT_SCOPE" = inventory-1127 ]]; then
              proof_ledger="${LEDGER_JSON_LINE_AFTER:-$LEDGER_JSON_LINE}"
              current_ledger="$(node --input-type=module -e "import {readProductionLedger} from '$STAGE/chanjet-admission-schema-receipt.mjs'; console.log(JSON.stringify(readProductionLedger()))")"
              test "$current_ledger" = "$proof_ledger" || { echo 'MIGRATION_APPLY=HOLD_AFTER_LEDGER_MOVED'; exit 1; }
            fi
            # Receipt recording is idempotent: it requires every changed
            # migration to be present in the production ledger and refuses
            # to overwrite an existing receipt.
            receipt_run="$MIGRATION_RUN_ID"
            if [ "$AUDIT_SCOPE" = inventory-1127 ] && [ -n "$RECOVERY_APPLY_RUN" ]; then
              receipt_run="$RECOVERY_APPLY_RUN"
            fi
            TARGET_SHA="${INVENTORY_RECOVERY_SOURCE:-$TARGET_SHA}" MIGRATION_RUN_ID="$receipt_run" BEFORE_LEDGER_SHA256="$EXPECTED_BEFORE_LEDGER_SHA256" \
              node "$STAGE/record-migration-apply-receipt.mjs" $MIGRATION_PATHS
            echo "MIGRATION_APPLY=COMMITTED"

      - name: Write validated inspection receipt
        if: inputs.phase == 'inspect' && (inputs.audit_scope == 'egg-source-permissions-1126' || inputs.audit_scope == 'egg-source-house-1126' || inputs.audit_scope == 'egg-source-legacy-creation-1126' || inputs.audit_scope == 'inventory-1127')
        env:
          REMOTE_STDOUT: ${{ steps.controlled_remote.outputs.stdout }}
          INSPECTION_TARGET: ${{ github.sha }}
          INSPECTION_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          INSPECTION_SCOPE: ${{ inputs.audit_scope }}
        run: node scripts/ops/egg-source-permissions-inspection-receipt.mjs "$RUNNER_TEMP/egg-source-permissions-inspection.json"
      - name: Retain validated inspection receipt
        if: inputs.phase == 'inspect' && (inputs.audit_scope == 'egg-source-permissions-1126' || inputs.audit_scope == 'egg-source-house-1126' || inputs.audit_scope == 'egg-source-legacy-creation-1126' || inputs.audit_scope == 'inventory-1127')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.audit_scope == 'inventory-1127' && 'inventory-schema-inspection' || inputs.audit_scope == 'egg-source-legacy-creation-1126' && 'egg-source-legacy-creation-inspection' || inputs.audit_scope == 'egg-source-house-1126' && 'egg-source-house-inspection' || 'egg-source-permissions-inspection' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/egg-source-permissions-inspection.json
          if-no-files-found: error
          retention-days: 5
