name: Production Schema Drift Audit

on:
  workflow_dispatch:
    inputs:
      confirm_readonly:
        description: 'Type RUN_PRODUCTION_SCHEMA_DRIFT_AUDIT to authorize the read-only audit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-schema-drift-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Production schema drift evidence audit
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-readonly
    services:
      postgres16:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: phoenix
          POSTGRES_PASSWORD: phoenix
          POSTGRES_DB: phoenix_erp
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U phoenix -d phoenix_erp"
          --health-interval 10s --health-timeout 5s --health-retries 10
      postgres18:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: phoenix
          POSTGRES_PASSWORD: phoenix
          POSTGRES_DB: phoenix_erp
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U phoenix -d phoenix_erp"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      CONFIRM_READONLY: ${{ inputs.confirm_readonly }}

    steps:
      - name: Checkout approved main commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Validate manual read-only invocation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM_READONLY" = RUN_PRODUCTION_SCHEMA_DRIFT_AUDIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup pnpm and Node
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API
        run: pnpm --filter phoenix-erp-v3-nest build

      - name: Construct canonical PostgreSQL 16.14
        id: pg16
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: phoenix
          PGPASSWORD: phoenix
          PGDATABASE: phoenix_erp
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: phoenix
          DB_PASSWORD: phoenix
          DB_NAME: phoenix_erp
          FINGERPRINT_SQL_FILE: scripts/ci/production-schema-fingerprint.sql
          FINGERPRINT_PREFIX: PG16
        run: |
          set -Eeuo pipefail
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"
          MIG_MODE=ci MIG_DIR=apps/api bash scripts/db-migrate.sh
          bash scripts/ci/run-schema-fingerprint-runtime.sh
          echo "PG16_VERSION=$(psql -X -At -c 'SHOW server_version;')"
          echo "PG16_VERSION_NUM=$(psql -X -At -c "SELECT current_setting('server_version_num');")"

      - name: Construct canonical PostgreSQL 18
        id: pg18
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5433
          PGUSER: phoenix
          PGPASSWORD: phoenix
          PGDATABASE: phoenix_erp
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_USER: phoenix
          DB_PASSWORD: phoenix
          DB_NAME: phoenix_erp
          FINGERPRINT_SQL_FILE: scripts/ci/production-schema-fingerprint.sql
          FINGERPRINT_PREFIX: PG18
        run: |
          set -Eeuo pipefail
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"
          MIG_MODE=ci MIG_DIR=apps/api bash scripts/db-migrate.sh
          bash scripts/ci/run-schema-fingerprint-runtime.sh
          echo "PG18_VERSION=$(psql -X -At -c 'SHOW server_version;')"
          echo "PG18_VERSION_NUM=$(psql -X -At -c "SELECT current_setting('server_version_num');")"

      - name: Compare canonical PostgreSQL versions
        env:
          PG16_CONSTRAINT_COUNT: ${{ steps.pg16.outputs.PG16_CONSTRAINT_COUNT }}
          PG18_CONSTRAINT_COUNT: ${{ steps.pg18.outputs.PG18_CONSTRAINT_COUNT }}
          PG16_RELATION_NOT_NULL_CONSTRAINT_COUNT: ${{ steps.pg16.outputs.PG16_RELATION_NOT_NULL_CONSTRAINT_COUNT }}
          PG18_RELATION_NOT_NULL_CONSTRAINT_COUNT: ${{ steps.pg18.outputs.PG18_RELATION_NOT_NULL_CONSTRAINT_COUNT }}
          PG16_ATTNOTNULL_COUNT: ${{ steps.pg16.outputs.PG16_ATTNOTNULL_COUNT }}
          PG18_ATTNOTNULL_COUNT: ${{ steps.pg18.outputs.PG18_ATTNOTNULL_COUNT }}
        run: |
          set -euo pipefail
          echo "PG16_RAW_HASH=${{ steps.pg16.outputs.PG16_RAW_HASH }}"
          echo "PG16_RAW_LINES=${{ steps.pg16.outputs.PG16_RAW_LINES }}"
          echo "PG18_RAW_HASH=${{ steps.pg18.outputs.PG18_RAW_HASH }}"
          echo "PG18_RAW_LINES=${{ steps.pg18.outputs.PG18_RAW_LINES }}"
          echo "PG16_TABLE_COUNT=${{ steps.pg16.outputs.PG16_TABLE_COUNT }}"
          echo "PG16_COLUMN_COUNT=${{ steps.pg16.outputs.PG16_COLUMN_COUNT }}"
          echo "PG16_CONSTRAINT_COUNT=$PG16_CONSTRAINT_COUNT"
          echo "PG16_INDEX_COUNT=${{ steps.pg16.outputs.PG16_INDEX_COUNT }}"
          echo "PG16_TYPE_COUNT=${{ steps.pg16.outputs.PG16_TYPE_COUNT }}"
          echo "PG18_TABLE_COUNT=${{ steps.pg18.outputs.PG18_TABLE_COUNT }}"
          echo "PG18_COLUMN_COUNT=${{ steps.pg18.outputs.PG18_COLUMN_COUNT }}"
          echo "PG18_CONSTRAINT_COUNT=$PG18_CONSTRAINT_COUNT"
          echo "PG18_INDEX_COUNT=${{ steps.pg18.outputs.PG18_INDEX_COUNT }}"
          echo "PG18_TYPE_COUNT=${{ steps.pg18.outputs.PG18_TYPE_COUNT }}"
          echo "PG16_ATTNOTNULL_COUNT=$PG16_ATTNOTNULL_COUNT"
          echo "PG18_ATTNOTNULL_COUNT=$PG18_ATTNOTNULL_COUNT"
          echo "PG16_RELATION_NOT_NULL_CONSTRAINT_COUNT=$PG16_RELATION_NOT_NULL_CONSTRAINT_COUNT"
          echo "PG18_RELATION_NOT_NULL_CONSTRAINT_COUNT=$PG18_RELATION_NOT_NULL_CONSTRAINT_COUNT"
          if [ "$PG16_CONSTRAINT_COUNT" != "$PG18_CONSTRAINT_COUNT" ] && [ "$PG18_RELATION_NOT_NULL_CONSTRAINT_COUNT" -gt 0 ]; then
            echo "PG18_NOT_NULL_CATALOG_DELTA_EXPLAINS_CONSTRAINT_GAP=true"
          else
            echo "PG18_NOT_NULL_CATALOG_DELTA_EXPLAINS_CONSTRAINT_GAP=false"
          fi

      - name: Audit production schema over read-only SSH
        if: steps.pg16.outcome == 'success' && steps.pg18.outcome == 'success'
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          AUDIT_SHA: ${{ github.sha }}
          CANONICAL_PG16_HASH: ${{ steps.pg16.outputs.PG16_RAW_HASH }}
          CANONICAL_PG16_LINES: ${{ steps.pg16.outputs.PG16_RAW_LINES }}
          SCHEMA_SQL_B64: ${{ steps.pg16.outputs.PG16_SCHEMA_SQL_B64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH,AUDIT_SHA,CANONICAL_PG16_HASH,CANONICAL_PG16_LINES,SCHEMA_SQL_B64
          timeout: 30s
          proxy_timeout: 30s
          command_timeout: 8m
          script: |
            set -Eeuo pipefail
            set +x
            echo "AUDIT_STAGE=SSH_CONNECTED"
            test -d "$DEPLOY_PATH" || { echo "AUDIT_FAILURE=DEPLOY_PATH_MISSING"; exit 31; }
            cd "$DEPLOY_PATH" || { echo "AUDIT_FAILURE=DEPLOY_PATH_NOT_ACCESSIBLE"; exit 32; }
            echo "AUDIT_STAGE=DEPLOY_PATH_OK"
            test "$(git rev-parse --is-inside-work-tree 2>/dev/null || true)" = true || { echo "AUDIT_FAILURE=NOT_GIT_REPOSITORY"; exit 33; }
            echo "AUDIT_STAGE=GIT_REPOSITORY_OK"
            echo "AUDIT_SHA=$AUDIT_SHA"
            echo "PRODUCTION_SHA=$(git rev-parse HEAD)"
            echo "WORKTREE_CLEAN=$([ -z "$(git status --porcelain --untracked-files=all)" ] && echo true || echo false)"
            dbq_ro() {
              local query="$1"
              docker compose exec -T -e PGOPTIONS='-c default_transaction_read_only=on' db sh -c 'psql -X -v ON_ERROR_STOP=1 -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "$1"' sh "$query"
            }
            DB_READ_ONLY="$(dbq_ro 'SHOW transaction_read_only;' | tr -d '\r\n[:space:]')"
            echo "DB_READ_ONLY=$DB_READ_ONLY"
            test "$DB_READ_ONLY" = on || { echo "AUDIT_FAILURE=DB_SESSION_NOT_READ_ONLY"; exit 40; }
            VERSION_NUM="$(dbq_ro "SELECT current_setting('server_version_num');" | tr -d '\r\n[:space:]')"
            VERSION="$(dbq_ro 'SHOW server_version;' | tr -d '\r\n')"
            echo "PRODUCTION_SERVER_VERSION=$VERSION"
            echo "PRODUCTION_SERVER_VERSION_NUM=$VERSION_NUM"
            test "$VERSION_NUM" = 160014 || { echo "AUDIT_FAILURE=PRODUCTION_VERSION_CHANGED"; exit 41; }
            SQL="$(printf '%s' "$SCHEMA_SQL_B64" | base64 -d)"
            TSV="$(dbq_ro "$SQL")"
            HASH="$(printf '%s\n' "$TSV" | sha256sum | awk '{print $1}')"
            LINES="$(printf '%s\n' "$TSV" | sed '/^$/d' | wc -l | tr -d ' ')"
            echo "PRODUCTION_RAW_HASH=$HASH"
            echo "PRODUCTION_RAW_LINES=$LINES"
            for family in table column constraint index type; do
              upper="${family^^}"
              echo "PRODUCTION_${upper}_COUNT=$(printf '%s\n' "$TSV" | awk -F '\t' -v f="$family" '$1 == f { n++ } END { print n + 0 }')"
              echo "PRODUCTION_${upper}_HASH=$(printf '%s\n' "$TSV" | awk -F '\t' -v f="$family" '$1 == f { print }' | sha256sum | awk '{print $1}')"
            done
            echo "SAME_VERSION_SCHEMA_MATCH=$([ "$HASH" = "$CANONICAL_PG16_HASH" ] && [ "$LINES" = "$CANONICAL_PG16_LINES" ] && echo true || echo false)"
