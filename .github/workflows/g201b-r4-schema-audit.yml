name: G201B R4 Production Schema Readonly Audit

on:
  workflow_dispatch:
    inputs:
      window_start:
        description: 'UTC audit start timestamp, e.g. 2026-08-21 00:00:00'
        required: true
      window_end:
        description: 'UTC audit end timestamp, e.g. 2026-08-22 00:00:00'
        required: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Validate audit window
        shell: bash
        env:
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_END: ${{ inputs.window_end }}
        run: |
          set -euo pipefail
          timestamp_pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$'
          for value in "$WINDOW_START" "$WINDOW_END"; do
            [[ "$value" =~ $timestamp_pattern ]] || { echo "Invalid UTC timestamp format" >&2; exit 1; }
            date -u -d "$value" '+%Y-%m-%d %H:%M:%S' >/dev/null
          done
          [[ $(date -u -d "$WINDOW_START" +%s) -lt $(date -u -d "$WINDOW_END" +%s) ]] \
            || { echo "window_start must be before window_end" >&2; exit 1; }
      - name: Readonly production R4 schema audit
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_END: ${{ inputs.window_end }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH,WINDOW_START,WINDOW_END
          script: |
            set -euo pipefail
            timestamp_pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$'
            for value in "$WINDOW_START" "$WINDOW_END"; do
              [[ "$value" =~ $timestamp_pattern ]] || { echo "Invalid UTC timestamp format" >&2; exit 1; }
              date -u -d "$value" '+%Y-%m-%d %H:%M:%S' >/dev/null
            done
            [[ $(date -u -d "$WINDOW_START" +%s) -lt $(date -u -d "$WINDOW_END" +%s) ]] \
              || { echo "window_start must be before window_end" >&2; exit 1; }
            cd "$DEPLOY_PATH"
            docker compose exec -T \
              -e AUDIT_WINDOW_START="$WINDOW_START" \
              -e AUDIT_WINDOW_END="$WINDOW_END" \
              -e PGOPTIONS='-c default_transaction_read_only=on' \
              db sh -c 'psql -X -v ON_ERROR_STOP=1 -v window_start="$AUDIT_WINDOW_START" -v window_end="$AUDIT_WINDOW_END" -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
            \pset pager off
            BEGIN TRANSACTION READ ONLY;
            SELECT 'AUDIT_WINDOW' AS section, :'window_start' AS window_start, :'window_end' AS window_end;

            WITH targets(table_name, column_name) AS (VALUES
              ('wf_approval_instance_steps', 'approver_type'),
              ('chanjet_ar_snapshot', 'assistant_customer_code'),
              ('chanjet_ar_snapshot', 'subject_id'),
              ('fin_ar_ledger', 'base_currency'),
              ('sys_notifications', 'user_id'),
              ('prc_purchase_orders', 'total_amount'),
              ('prc_purchase_orders', 'currency_code'),
              ('prc_purchase_orders', 'status'),
              ('prc_purchase_orders', 'plan_qty'),
              ('prc_purchase_orders', 'received_qty'),
              ('sal_drivers', 'status'),
              ('sal_order_items', 'allocated_qty'),
              ('sal_return_items', 'returned_qty'),
              ('sal_return_items', 'accepted_qty'),
              ('sal_return_items', 'damaged_qty'),
              ('sal_return_items', 'unit_price'),
              ('sal_return_items', 'amount'),
              ('sal_return_items', 'inspection_result'),
              ('sal_return_items', 'restock_status'),
              ('sal_return_orders', 'currency_code'),
              ('sal_return_orders', 'subtotal'),
              ('sal_return_orders', 'status'),
              ('sal_return_orders', 'need_approval'),
              ('sal_vehicles', 'status')
            )
            SELECT t.table_name,
                   t.column_name,
                   c.is_nullable,
                   c.column_default
              FROM targets t
              LEFT JOIN information_schema.columns c
                ON c.table_schema = current_schema()
               AND c.table_name = t.table_name
               AND c.column_name = t.column_name
             ORDER BY t.table_name, t.column_name;
            COMMIT;
            SQL
