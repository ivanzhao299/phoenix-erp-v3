name: Production Background Control Reconciliation

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'inspect = read-only state dump; reconcile = clear the stranded hold'
        required: true
        type: choice
        options: [inspect, reconcile, revive-participant, abort-prepared-promotion]
      confirm_reconciliation:
        description: 'Type RECONCILE_PRODUCTION_BACKGROUND_CONTROL to authorize the targeted recovery'
        required: true
        type: string
      expected_main_sha:
        description: 'Exact merged main SHA containing this reviewed workflow'
        required: true
        type: string
      promotion_run_id:
        description: 'abort-prepared-promotion only: the <run>-<attempt> whose PREPARED promotion is being aborted'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-background-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && (inputs.phase == 'inspect' || inputs.confirm_reconciliation == 'RECONCILE_PRODUCTION_BACKGROUND_CONTROL')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Validate authorization and reviewed binding
        env:
          CONFIRM: ${{ inputs.confirm_reconciliation }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"
          if [ "${{ inputs.phase }}" != "inspect" ]; then
            test "$CONFIRM" = RECONCILE_PRODUCTION_BACKGROUND_CONTROL
          fi
      - name: Prepare trusted helpers
        run: |
          set -euo pipefail
          echo "PRODUCTION_CONTRACT_B64=$(base64 -w0 scripts/ops/production-config-contract.json)" >> "$GITHUB_ENV"
          echo "PRODUCTION_PATH_HELPER_B64=$(base64 -w0 scripts/ops/production-trusted-paths.mjs)" >> "$GITHUB_ENV"
          echo "PRODUCTION_CONTROL_BOOTSTRAP_B64=$(base64 -w0 scripts/ops/production-control-bootstrap.sh)" >> "$GITHUB_ENV"
      - name: ${{ inputs.phase }} stranded background control state
        uses: appleboy/ssh-action@v1
        env:
          TARGET_SHA: ${{ github.sha }}
          PHASE: ${{ inputs.phase }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          PRODUCTION_CONTRACT_B64: ${{ env.PRODUCTION_CONTRACT_B64 }}
          PRODUCTION_PATH_HELPER_B64: ${{ env.PRODUCTION_PATH_HELPER_B64 }}
          PRODUCTION_CONTROL_BOOTSTRAP_B64: ${{ env.PRODUCTION_CONTROL_BOOTSTRAP_B64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: TARGET_SHA,PHASE,PROMOTION_RUN_ID,PRODUCTION_CONTRACT_B64,PRODUCTION_PATH_HELPER_B64,PRODUCTION_CONTROL_BOOTSTRAP_B64
          command_timeout: 8m
          script: |
            set -Eeuo pipefail
            # The production contract pins the repository; never follow a stale
            # DEPLOY_PATH secret into a generated/read-only checkout.
            cd /data/phoenix-erp
            export DEPLOY_REPO_ROOT=/data/phoenix-erp
            eval "$(printf '%s' "$PRODUCTION_CONTROL_BOOTSTRAP_B64" | base64 -d)"
            git_safe() { command git -c "safe.directory=$DEPLOY_REPO_ROOT" -c core.hooksPath=/dev/null "$@"; }
            test "$(git_safe branch --show-current)" = main
            # Both phases stage helpers from the reviewed target, so both must
            # have its objects; a fetch never moves the checked-out worktree.
            git_safe fetch --no-tags origin main
            test "$(git_safe rev-parse FETCH_HEAD)" = "$TARGET_SHA"
            case "$PHASE" in inspect|revive-participant)
              # Read-only phases never move the production checkout.
              echo "READONLY_PHASE_CHECKOUT=$(git_safe rev-parse HEAD)"
            ;; *)
              # Guarded fast-forward only, exactly like the runtime-pin repair.
              if [ "$(git_safe rev-parse HEAD)" != "$TARGET_SHA" ]; then
                git_safe merge --ff-only "$TARGET_SHA"
              fi
              test "$(git_safe rev-parse HEAD)" = "$TARGET_SHA"
            ;; esac
            STAGE="/var/lib/phoenix-erp/production-deployment-state/background-reconcile-${{ github.run_id }}"
            test ! -e "$STAGE"
            mkdir -m 700 "$STAGE"
            trap 'rm -rf "$STAGE"' EXIT
            for helper in reconcile-background-control.mjs production-config-guard.mjs production-config-contract.json production-atomic-state.mjs production-trusted-paths.mjs capture-production-runtime.mjs update-managed-chanjet-env.mjs chanjet-readonly-policy.mjs background-control-manifest.mjs; do
              git_safe show "$TARGET_SHA:scripts/ops/$helper" > "$STAGE/$helper"
              chmod 600 "$STAGE/$helper"
            done
            TARGET_SHA="$TARGET_SHA" node "$STAGE/reconcile-background-control.mjs" "$PHASE"
