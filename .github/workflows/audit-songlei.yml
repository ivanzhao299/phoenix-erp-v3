name: Audit 宋雷 permissions (read-only)

# 一次性只读审计:查 宋雷 的用户/角色/菜单授权 + 近期 403 报错的实际端点。
# SSH 进生产只跑 SELECT,零写入。用完即删。
on:
  workflow_dispatch:

jobs:
  audit:
    name: Audit 宋雷 RBAC in prod (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Read-only SELECT via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
            echo "===AUDIT_START==="
            docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off' <<'SQL'
            \echo '-- 1) 宋雷 用户 --'
            SELECT user_id, username, real_name, store_code, status FROM sys_user WHERE real_name LIKE '%宋雷%';
            \echo '-- 2) 宋雷 角色 --'
            SELECT u.real_name, r.role_code, r.role_name_zh
            FROM sys_user u JOIN sys_user_role ur ON ur.user_id=u.user_id JOIN sys_role r ON r.role_id=ur.role_id
            WHERE u.real_name LIKE '%宋雷%';
            \echo '-- 3) 宋雷 角色持有的菜单授权(menu_code + perm_codes) --'
            SELECT r.role_code, m.menu_code, p.perm_codes
            FROM sys_user u
            JOIN sys_user_role ur ON ur.user_id=u.user_id
            JOIN sys_role r ON r.role_id=ur.role_id
            JOIN sys_role_menu_permission p ON p.role_id=r.role_id
            JOIN sys_menu m ON m.menu_id=p.menu_id
            WHERE u.real_name LIKE '%宋雷%'
            ORDER BY m.menu_code;
            \echo '-- 4) 宋雷 近 3 天 403 报错的实际端点(method/path/次数) --'
            SELECT request_method, request_path, count(*) AS n, max(created_at) AS last_at
            FROM sys_error_logs
            WHERE http_status = 403
              AND (username LIKE '%宋雷%' OR user_id IN (SELECT user_id FROM sys_user WHERE real_name LIKE '%宋雷%'))
              AND created_at >= NOW() - INTERVAL '3 days'
            GROUP BY request_method, request_path
            ORDER BY n DESC LIMIT 40;
            \echo '-- 5) 宋雷 数据范围绑定(组织/公司) --'
            SELECT o.org_code, o.org_name_cn, o.org_type, uo.data_scope_level, uo.is_primary
            FROM sys_user u
            JOIN sys_user_orgs uo ON uo.user_id=u.user_id
            JOIN sys_organizations o ON o.id=uo.org_id
            WHERE u.real_name LIKE '%宋雷%';
            SQL
            echo "===AUDIT_END==="
