name: Production Inbound Master Data Readonly Audit

on:
  workflow_dispatch:
    inputs:
      confirm_minimal_write:
        description: '留空=只读；执行最小实测须填 WRITE_GRADE1_X1'
        required: false
        default: ''

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        if: inputs.confirm_minimal_write == 'WRITE_GRADE1_X1'
        with:
          node-version: '20'
      - name: Authorized minimal GRADE_1 x1 production inbound
        if: inputs.confirm_minimal_write == 'WRITE_GRADE1_X1'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          DEPLOY_PROXY_HOST: ${{ secrets.DEPLOY_PROXY_HOST }}
          DEPLOY_PROXY_USER: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          DEPLOY_PROXY_SSH_KEY: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          token="$(node scripts/ops/mint-production-admin-token-over-ssh.mjs)"
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -X POST https://erp.eggslao.com/api/v2/inventory/production-inbound \
            --data '{"houseCode":"HOUSE_CS_01","warehouseCode":"LPH_MS_EGG_FARM","locationCode":"CS-KW-005","eggDate":"2026-08-25","items":[{"grade":"GRADE_1","qty":1}]}' )"
          RESPONSE="$response" node - <<'NODE'
          const body = JSON.parse(process.env.RESPONSE || '{}');
          if (body.totalInbound !== 1 || body.companyCode !== 'COMP-LAO-AGRI'
              || body.warehouseCode !== 'LPH_MS_EGG_FARM' || body.locationCode !== 'CS-KW-005'
              || !Array.isArray(body.batches) || body.batches.length !== 1) {
            throw new Error(`unexpected response: ${JSON.stringify(body)}`);
          }
          console.log(JSON.stringify(body));
          NODE
      - name: Readonly production master-data audit
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "PRODUCTION_CHECKOUT=$(git rev-parse HEAD)"
            docker inspect --format 'API_IMAGE_REVISION={{ index .Config.Labels "org.opencontainers.image.revision" }}' phoenix-v3-api
            docker inspect --format 'WEB_IMAGE_REVISION={{ index .Config.Labels "org.opencontainers.image.revision" }}' phoenix-v3-web
            docker compose exec -T -e PGOPTIONS='-c default_transaction_read_only=on' db \
              sh -c 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off' <<'SQL'
            BEGIN TRANSACTION READ ONLY;
            SELECT 'REVISION' AS section, current_setting('transaction_read_only') AS read_only;
            SELECT 'CUSTOMER_COMPANIES' AS section, company_code, count(*)::int AS customers
              FROM sal_customers WHERE company_code IS NOT NULL GROUP BY company_code ORDER BY company_code;
            SELECT 'FARM_COMPANY_SITE' AS section, to_jsonb(f) AS record
              FROM brd_farms f ORDER BY f.farm_code;
            SELECT 'HOUSES_OWNERSHIP' AS section, to_jsonb(h) AS record
              FROM brd_houses h ORDER BY h.house_code;
            SELECT 'BRD_HOUSES_COLUMNS' AS section, ordinal_position, column_name, data_type, is_nullable
              FROM information_schema.columns
             WHERE table_schema='public' AND table_name='brd_houses'
             ORDER BY ordinal_position;
            SELECT 'ACTIVE_HOUSE_OWNERSHIP_SUMMARY' AS section,
                   CASE WHEN h.house_code LIKE 'HOUSE_CS_%' OR h.house_code LIKE 'H-DEBUG-%'
                              OR h.house_code LIKE 'CS%' OR h.house_name LIKE '%测试%'
                        THEN 'TEST_DEBUG' ELSE 'FORMAL' END AS house_class,
                   count(*)::int AS active_houses,
                   count(*) FILTER (WHERE NULLIF(f.company_code, '') IS NULL)::int AS missing_farm_company,
                   count(*) FILTER (WHERE NULLIF(to_jsonb(f)->>'mapped_site_code', '') IS NULL)::int AS missing_farm_site,
                   count(*) FILTER (WHERE f.farm_code IS NULL)::int AS missing_active_farm
              FROM brd_houses h
              LEFT JOIN brd_farms f ON f.farm_code=h.farm_code AND f.status='ACTIVE'
             WHERE h.status='ACTIVE' GROUP BY house_class ORDER BY house_class;
            SELECT 'WAREHOUSES' AS section, to_jsonb(w) AS record
              FROM wms_warehouses w ORDER BY w.warehouse_code;
            SELECT 'WMS_STATUS_VOCABULARY' AS section, 'wms_warehouses' AS table_name,
                   COALESCE(status, '<NULL>') AS status, count(*)::int AS row_count
              FROM wms_warehouses GROUP BY status
            UNION ALL
            SELECT 'WMS_STATUS_VOCABULARY', 'wms_zones', COALESCE(status, '<NULL>'), count(*)::int
              FROM wms_zones GROUP BY status
            UNION ALL
            SELECT 'WMS_STATUS_VOCABULARY', 'wms_locations', COALESCE(status, '<NULL>'), count(*)::int
              FROM wms_locations GROUP BY status
             ORDER BY table_name, status;
            SELECT 'LOCATIONS' AS section, to_jsonb(l) AS record
              FROM wms_locations l ORDER BY l.warehouse_code, l.location_code;
            SELECT 'GRADES' AS section, grade_code, grade_name, is_saleable, is_storable, status
              FROM product_grades ORDER BY sort_order, grade_code;
            SELECT 'ACTIVE_SKUS' AS section, sku_code, product_code, grade_code, spec_code, sku_name, status
              FROM product_skus WHERE status='ACTIVE' ORDER BY grade_code, spec_code, sku_code;
            SELECT 'TEMP_BATCH_PROFILE' AS section, company_code, warehouse_code, location_code,
                   product_code, sku_code, grade_code_std, count(*)::int AS batch_count, sum(qty) AS total_qty
              FROM inv_batches WHERE source_type='TEMP_PRODUCTION'
             GROUP BY company_code, warehouse_code, location_code, product_code, sku_code, grade_code_std
             ORDER BY batch_count DESC, company_code, grade_code_std;
            SELECT 'GHOST_COUNTS' AS section,
                   count(*) FILTER (WHERE company_code='ALL')::int AS ghost_company,
                   count(*) FILTER (WHERE warehouse_code='WMS-VTE-MAIN')::int AS ghost_warehouse,
                   count(*) FILTER (WHERE location_code='INBOUND-DOCK')::int AS ghost_location,
                   count(*) FILTER (WHERE product_code LIKE 'PRD-EGG-%')::int AS ghost_product
              FROM inv_batches WHERE source_type='TEMP_PRODUCTION';
            SELECT 'REFERENCE_BATCH' AS section, batch_no, company_code, warehouse_code, location_code,
                   product_code, sku_code, grade_code_std, qty, source_type, created_at
              FROM inv_batches WHERE batch_no='EGG-20260825-00001';
            SELECT 'POST_GOVERNANCE_BATCH' AS section, batch_no, company_code, warehouse_code, location_code,
                   product_code, sku_code, grade_code_std, spec_code, qty, source_no, created_at
              FROM inv_batches
             WHERE source_type='TEMP_PRODUCTION' AND source_no='TEMP-2026-08-25-HOUSE_MS_02'
             ORDER BY created_at DESC LIMIT 1;
            SELECT 'GHOST_DETAIL' AS section, batch_no, egg_date, source_no, collection_batch_ref,
                   company_code, warehouse_code, location_code, product_code, sku_code, grade_code_std, spec_code, qty
              FROM inv_batches
             WHERE source_type='TEMP_PRODUCTION'
               AND (company_code='ALL' OR warehouse_code='WMS-VTE-MAIN'
                    OR location_code='INBOUND-DOCK' OR product_code LIKE 'PRD-EGG-%')
             ORDER BY created_at, batch_no;
            COMMIT;
            SQL
