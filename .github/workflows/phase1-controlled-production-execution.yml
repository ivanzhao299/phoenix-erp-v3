name: Phase 1 Controlled Production Execution

on:
  workflow_dispatch:
    inputs:
      confirm_execution:
        description: 'Exact confirmation required for the controlled Phase 1 execution'
        required: true
        type: string
      expected_target_sha:
        description: 'Exact reviewed target commit SHA'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: phase1-controlled-production-execution
  cancel-in-progress: false

jobs:
  execute:
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Validate explicit confirmation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "${{ inputs.confirm_execution }}" = "RUN_PHASE1_CONTROLLED_PRODUCTION_EXECUTION"
          test "${{ inputs.expected_target_sha }}" = "$GITHUB_SHA"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Bind target revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "TARGET_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable candidate images and inventory
        run: |
          set -euo pipefail
          API_IMAGE="ghcr.io/${{ github.repository_owner }}/phoenix-erp-v3/api:sha-${TARGET_SHA}"
          WEB_IMAGE="ghcr.io/${{ github.repository_owner }}/phoenix-erp-v3/web:sha-${TARGET_SHA}"
          docker pull "$API_IMAGE"
          docker pull "$WEB_IMAGE"
          resolve_repo_digest() {
            image="$1"
            repo="${image%:*}"
            digest_ref="$(docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk -v prefix="${repo}@" 'index($0,prefix)==1 { print; exit }')"
            test -n "$digest_ref"
            digest="${digest_ref#*@}"
            printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            printf '%s\n' "$digest"
          }
          API_IMAGE_DIGEST="$(resolve_repo_digest "$API_IMAGE")"
          WEB_IMAGE_DIGEST="$(resolve_repo_digest "$WEB_IMAGE")"
          API_IMAGE_REF="${API_IMAGE%@*}@${API_IMAGE_DIGEST}"
          WEB_IMAGE_REF="${WEB_IMAGE%@*}@${WEB_IMAGE_DIGEST}"
          printf '%s\n' "$API_IMAGE_DIGEST" > api-image-digest.txt
          printf '%s\n' "$WEB_IMAGE_DIGEST" > web-image-digest.txt
          printf '%s\n' "$API_IMAGE_REF" > api-image-ref.txt
          printf '%s\n' "$WEB_IMAGE_REF" > web-image-ref.txt
          echo "API_IMAGE_DIGEST=$API_IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "WEB_IMAGE_DIGEST=$WEB_IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "API_IMAGE_REF=$API_IMAGE_REF" >> "$GITHUB_ENV"
          echo "WEB_IMAGE_REF=$WEB_IMAGE_REF" >> "$GITHUB_ENV"
          echo "COMPOSE_B64=$(base64 -w0 docker-compose.yml)" >> "$GITHUB_ENV"
          echo "CANDIDATE_INVENTORY_IMAGE_REF=$API_IMAGE_REF"
          bash scripts/ci/candidate-typeorm-inventory.sh "$API_IMAGE_REF" > candidate-typeorm.json
          test -s candidate-typeorm.json
          node - <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync('candidate-typeorm.json', 'utf8');
          if (!raw.trim()) throw new Error('CANDIDATE_TYPEORM_INVENTORY_EMPTY');
          let inventory;
          try {
            inventory = JSON.parse(raw);
          } catch {
            throw new Error('CANDIDATE_TYPEORM_INVENTORY_INVALID');
          }
          if (!Array.isArray(inventory) || inventory.length === 0) {
            throw new Error('CANDIDATE_TYPEORM_INVENTORY_INVALID');
          }
          const legacy = fs.readdirSync('apps/api/migrations').filter((name) => /^2026.*\.sql$/.test(name)).sort();
          const retired = JSON.parse(fs.readFileSync('scripts/ci/retired-typeorm-migrations.json'));
          fs.writeFileSync('candidate-ledger-inventory.json', JSON.stringify({ canonicalTypeorm: inventory, canonicalLegacy: legacy, retiredTypeorm: retired }));
          console.error('CANDIDATE_TYPEORM_INVENTORY_VALID=YES');
          console.error(`CANDIDATE_TYPEORM_INVENTORY_COUNT=${inventory.length}`);
          NODE
          {
            echo "INVENTORY_B64=$(base64 -w0 candidate-ledger-inventory.json)"
            echo "MANIFEST_B64=$(base64 -w0 scripts/ci/phase1-production-migration-manifest.json)"
            echo "PREFLIGHT_B64=$(base64 -w0 scripts/ledger-preflight.mjs)"
            echo "GATE_B64=$(base64 -w0 scripts/ci/phase1-production-execution-gate.mjs)"
            echo "INVARIANTS_B64=$(base64 -w0 scripts/ci/phase1-production-invariants.mjs)"
            echo "WRAPPER_B64=$(base64 -w0 scripts/phase1-controlled-production-execution.sh)"
          } >> "$GITHUB_ENV"
      - name: Prepare reviewed production control payload
        run: |
          set -euo pipefail
          {
            echo "PRODUCTION_CONTRACT_B64=$(base64 -w0 scripts/ops/production-config-contract.json)"
            echo "PRODUCTION_PATH_HELPER_B64=$(base64 -w0 scripts/ops/production-trusted-paths.mjs)"
            echo "PRODUCTION_CONTROL_BOOTSTRAP_B64=$(base64 -w0 scripts/ops/production-control-bootstrap.sh)"
          } >> "$GITHUB_ENV"

      - name: Production execution over read-only preflight and controlled schema switch
        uses: appleboy/ssh-action@v1.2.2
        env:
          PRODUCTION_CONTRACT_B64: ${{ env.PRODUCTION_CONTRACT_B64 }}
          PRODUCTION_PATH_HELPER_B64: ${{ env.PRODUCTION_PATH_HELPER_B64 }}
          PRODUCTION_CONTROL_BOOTSTRAP_B64: ${{ env.PRODUCTION_CONTROL_BOOTSTRAP_B64 }}
          TARGET_SHA: ${{ github.sha }}
          EXPECTED_PRODUCTION_SHA: 129fdb85c81ab0c201044daf021caf778b37b40b
          EXECUTION_RUN_ID: ${{ github.run_id }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_IMAGE: ${{ env.API_IMAGE_REF }}
          WEB_IMAGE: ${{ env.WEB_IMAGE_REF }}
          API_IMAGE_DIGEST: ${{ env.API_IMAGE_DIGEST }}
          WEB_IMAGE_DIGEST: ${{ env.WEB_IMAGE_DIGEST }}
          API_IMAGE_REF: ${{ env.API_IMAGE_REF }}
          WEB_IMAGE_REF: ${{ env.WEB_IMAGE_REF }}
          INVENTORY_B64: ${{ env.INVENTORY_B64 }}
          MANIFEST_B64: ${{ env.MANIFEST_B64 }}
          PREFLIGHT_B64: ${{ env.PREFLIGHT_B64 }}
          GATE_B64: ${{ env.GATE_B64 }}
          INVARIANTS_B64: ${{ env.INVARIANTS_B64 }}
          WRAPPER_B64: ${{ env.WRAPPER_B64 }}
          COMPOSE_B64: ${{ env.COMPOSE_B64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          proxy_host: ${{ secrets.DEPLOY_PROXY_HOST }}
          proxy_username: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          proxy_key: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22
          command_timeout: 30m
          envs: TARGET_SHA,EXPECTED_PRODUCTION_SHA,EXECUTION_RUN_ID,GHCR_USER,GHCR_TOKEN,API_IMAGE,WEB_IMAGE,API_IMAGE_DIGEST,WEB_IMAGE_DIGEST,API_IMAGE_REF,WEB_IMAGE_REF,INVENTORY_B64,MANIFEST_B64,PREFLIGHT_B64,GATE_B64,INVARIANTS_B64,WRAPPER_B64,COMPOSE_B64,PRODUCTION_CONTRACT_B64,PRODUCTION_PATH_HELPER_B64,PRODUCTION_CONTROL_BOOTSTRAP_B64
          script: |
            set -Eeuo pipefail
            umask 077
            cd ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
            DEPLOY_REPO_ROOT="$(pwd -P)"
            git() {
              command git -c "safe.directory=$DEPLOY_REPO_ROOT" "$@"
            }
            # Validate all control ancestors before opening FD9; contract/helper come from this reviewed runner revision.
            eval "$(printf '%s' "$PRODUCTION_CONTROL_BOOTSTRAP_B64" | base64 -d)"
            docker() {
              if [ "${1:-}" = compose ]; then
                shift
                node "$DEPLOY_REPO_ROOT/scripts/ops/phoenix-production-compose.mjs" "$@"
              else
                command env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin DOCKER_CONFIG=/home/phoenix-codex-deploy/.docker DOCKER_HOST=unix:///var/run/docker.sock docker "$@"
              fi
            }
            bash scripts/ops/require-phoenix-data-mount.sh
            node scripts/ops/production-config-guard.mjs --target "$TARGET_SHA"
            # Historical schema target below the floor is HOLD, not a config exception.
            PRODUCTION_SHA="$(git rev-parse HEAD)"
            test "$PRODUCTION_SHA" = "$EXPECTED_PRODUCTION_SHA" || { echo 'PHASE1_EXECUTION_BLOCKED=PRODUCTION_SHA_CHANGED'; exit 20; }
            PRODUCTION_BRANCH="$(git branch --show-current)"
            test "$PRODUCTION_BRANCH" = main || { echo 'PHASE1_EXECUTION_BLOCKED=PRODUCTION_BRANCH_NOT_MAIN'; exit 22; }
            # Normalize origin identity using the same fingerprint semantics as the production Git audit.
            fingerprint_remote() {
              raw="$1"
              url_type=unknown
              host_class=unknown
              alias_github=false
              repository=UNKNOWN_REMOTE_FORMAT
              remote_host=
              remote_path=
              case "$raw" in
                ssh://*)
                  url_type=ssh_url
                  authority_path="${raw#ssh://}"
                  authority="${authority_path%%/*}"
                  remote_path="${authority_path#*/}"
                  remote_host="${authority##*@}"
                  remote_host="${remote_host%%:*}"
                  ;;
                https://*)
                  url_type=https_url
                  authority_path="${raw#https://}"
                  authority="${authority_path%%/*}"
                  remote_path="${authority_path#*/}"
                  remote_host="${authority##*@}"
                  remote_host="${remote_host%%:*}"
                  ;;
                http://*)
                  url_type=http_url
                  authority_path="${raw#http://}"
                  authority="${authority_path%%/*}"
                  remote_path="${authority_path#*/}"
                  remote_host="${authority##*@}"
                  remote_host="${remote_host%%:*}"
                  ;;
                git://*)
                  url_type=git_url
                  authority_path="${raw#git://}"
                  authority="${authority_path%%/*}"
                  remote_path="${authority_path#*/}"
                  remote_host="${authority##*@}"
                  remote_host="${remote_host%%:*}"
                  ;;
                git@*:*|*@*:*|[A-Za-z0-9._-]*:*)
                  url_type=scp_ssh
                  remote_host="${raw%%:*}"
                  remote_host="${remote_host##*@}"
                  remote_path="${raw#*:}"
                  ;;
                file://*) url_type=file_url ;;
                /*|./*|../*|~/*) url_type=local_path ;;
              esac
              case "$raw" in
                file://*|/*|./*|../*|~/*)
                  ORIGIN_URL_TYPE="$url_type"
                  ORIGIN_HOST_CLASS=none
                  ORIGIN_ALIAS_GITHUB=false
                  ORIGIN_REPOSITORY=NON_GITHUB_REMOTE
                  return
                  ;;
              esac
              if [ "$remote_host" = github.com ]; then
                host_class=github.com
              elif [ "$url_type" = scp_ssh ] || [ "$url_type" = ssh_url ]; then
                if command -v ssh >/dev/null 2>&1; then
                  resolved_host="$(ssh -G "$remote_host" 2>/dev/null | awk 'tolower($1)=="hostname" {print $2; exit}')"
                else
                  resolved_host=
                fi
                if [ "$resolved_host" = github.com ]; then
                  host_class=github_alias
                  alias_github=true
                else
                  host_class=other_host
                fi
              elif [ -n "$remote_host" ]; then
                host_class=other_host
              else
                host_class=none
              fi
              case "$remote_path" in
                ""|/*|*/|*//*|*\?*|*\#*|*/*/*|*..*|*[!A-Za-z0-9._/-]*) repository=UNKNOWN_REMOTE_FORMAT ;;
                *)
                  repository="${remote_path%.git}"
                  case "$repository" in */*) ;; *) repository=UNKNOWN_REMOTE_FORMAT ;; esac
                  ;;
              esac
              ORIGIN_URL_TYPE="$url_type"
              ORIGIN_HOST_CLASS="$host_class"
              ORIGIN_ALIAS_GITHUB="$alias_github"
              if [ "$host_class" = github.com ] || [ "$host_class" = github_alias ]; then
                ORIGIN_REPOSITORY="$repository"
              elif [ "$host_class" = other_host ]; then
                ORIGIN_REPOSITORY=NON_GITHUB_REMOTE
              else
                ORIGIN_REPOSITORY=UNKNOWN_REMOTE_FORMAT
              fi
            }
            ORIGIN_URL="$(git config --get remote.origin.url || true)"
            if [ -n "$ORIGIN_URL" ]; then
              ORIGIN_PRESENT=true
              fingerprint_remote "$ORIGIN_URL"
            else
              ORIGIN_PRESENT=false
              ORIGIN_URL_TYPE=unknown
              ORIGIN_HOST_CLASS=none
              ORIGIN_ALIAS_GITHUB=false
              ORIGIN_REPOSITORY=UNKNOWN_REMOTE_FORMAT
            fi
            [ "$ORIGIN_REPOSITORY" = "ivanzhao299/phoenix-erp-v3" ] && ORIGIN_MATCH=true || ORIGIN_MATCH=false
            ORIGIN_MATCHES_RELEASE_REPOSITORY="$ORIGIN_MATCH"
            echo "ORIGIN_PRESENT=$ORIGIN_PRESENT"
            echo "ORIGIN_URL_TYPE=$ORIGIN_URL_TYPE"
            echo "ORIGIN_HOST_CLASS=$ORIGIN_HOST_CLASS"
            echo "ORIGIN_REPOSITORY=$ORIGIN_REPOSITORY"
            echo "ORIGIN_MATCH=$ORIGIN_MATCH"
            echo "ORIGIN_MATCHES_RELEASE_REPOSITORY=$ORIGIN_MATCHES_RELEASE_REPOSITORY"
            if [ "$ORIGIN_MATCH" != true ] || { [ "$ORIGIN_HOST_CLASS" != github.com ] && [ "$ORIGIN_HOST_CLASS" != github_alias ]; }; then
              echo 'PHASE1_EXECUTION_BLOCKED=PRODUCTION_REMOTE_MISMATCH'
              exit 23
            fi
            test -z "$(git status --porcelain --untracked-files=all)" || { echo 'PHASE1_EXECUTION_BLOCKED=PRODUCTION_WORKTREE_DIRTY'; exit 21; }
            set +x
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
            unset GHCR_TOKEN
            set -x
            verify_repo_digest() {
              image_ref="$1"
              expected_digest="$2"
              repo_digests="$(docker image inspect "$image_ref" --format '{{range .RepoDigests}}{{println .}}{{end}}')"
              printf '%s\n' "$repo_digests" | grep -Fqx "$image_ref"
              printf '%s\n' "$expected_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            }
            docker pull "$API_IMAGE_REF" >/dev/null
            docker pull "$WEB_IMAGE_REF" >/dev/null
            verify_repo_digest "$API_IMAGE_REF" "$API_IMAGE_DIGEST" || { echo 'PHASE1_EXECUTION_BLOCKED=API_IMAGE_DIGEST_MISMATCH'; exit 24; }
            verify_repo_digest "$WEB_IMAGE_REF" "$WEB_IMAGE_DIGEST" || { echo 'PHASE1_EXECUTION_BLOCKED=WEB_IMAGE_DIGEST_MISMATCH'; exit 25; }
            RUN_ID="${EXECUTION_RUN_ID:?EXECUTION_RUN_ID is required}"
            ROOT_DIR="$(mktemp -d "$STATE_DIR/phase1-controlled.XXXXXX")"
            EVIDENCE_DIR="/opt/phoenix-erp-backups/phase1-controlled-${RUN_ID}"
            mkdir -p "$EVIDENCE_DIR"; chmod 700 "$EVIDENCE_DIR"
            COMPOSE_TARGET_FILE="$ROOT_DIR/docker-compose.target.yml"
            printf '%s' "$COMPOSE_B64" | base64 -d > "$COMPOSE_TARGET_FILE"
            test -s "$COMPOSE_TARGET_FILE"
            DB_MEMORY_DECLARED="$(awk '
              /^  db:/ { in_db=1; next }
              in_db && /^  [A-Za-z0-9_-]+:/ { exit }
              in_db && /^[[:space:]]+memory:[[:space:]]*/ {
                value=$0
                sub(/^[[:space:]]+memory:[[:space:]]*/, "", value)
                gsub(/"/, "", value)
                print value
                exit
              }
            ' "$COMPOSE_TARGET_FILE")"
            test "$DB_MEMORY_DECLARED" = 512m || { echo 'PHASE1_EXECUTION_BLOCKED=TARGET_DB_MEMORY_CONTRACT_MISMATCH'; exit 26; }
            printf '%s\n' "$DB_MEMORY_DECLARED" > "$EVIDENCE_DIR/target-db-memory.txt"
            DB_CONTAINER=phoenix-v3-db
            DB_MEMORY_BEFORE="$(docker inspect "$DB_CONTAINER" --format '{{.HostConfig.Memory}}')"
            DB_MEMORY_SWAP_BEFORE="$(docker inspect "$DB_CONTAINER" --format '{{.HostConfig.MemorySwap}}')"
            DB_STARTED_AT_BEFORE="$(docker inspect "$DB_CONTAINER" --format '{{.State.StartedAt}}')"
            DB_RESTART_COUNT_BEFORE="$(docker inspect "$DB_CONTAINER" --format '{{.RestartCount}}')"
            DB_STATUS_BEFORE="$(docker inspect "$DB_CONTAINER" --format '{{.State.Status}}')"
            {
              printf 'Status=%s StartedAt=%s RestartCount=%s OOMKilled=%s Memory=%s MemorySwap=%s\n' \
                "$DB_STATUS_BEFORE" "$DB_STARTED_AT_BEFORE" "$DB_RESTART_COUNT_BEFORE" \
                "$(docker inspect "$DB_CONTAINER" --format '{{.State.OOMKilled}}')" "$DB_MEMORY_BEFORE" "$DB_MEMORY_SWAP_BEFORE"
              grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo
              docker stats --no-stream "$DB_CONTAINER"
            } > "$EVIDENCE_DIR/db-memory-before.txt"
            test "$DB_STATUS_BEFORE" = running || { echo 'PHASE1_EXECUTION_BLOCKED=DB_CONTAINER_NOT_RUNNING'; exit 27; }
            DB_MEM_AVAILABLE="$(awk '$1 == "MemAvailable:" { print $2 * 1024; exit }' /proc/meminfo)"
            test "$DB_MEM_AVAILABLE" -ge 268435456 || { echo 'PHASE1_EXECUTION_BLOCKED=HOST_MEMORY_HEADROOM_INSUFFICIENT'; exit 28; }
            case "$DB_MEMORY_BEFORE/$DB_MEMORY_SWAP_BEFORE" in
              268435456/536870912)
                docker update --memory 512m --memory-swap 1g "$DB_CONTAINER" >/dev/null || { echo 'PHASE1_EXECUTION_BLOCKED=DB_MEMORY_UPDATE_FAILED'; exit 29; }
                ;;
              536870912/1073741824)
                ;;
              *)
                echo 'PHASE1_EXECUTION_BLOCKED=UNEXPECTED_DB_MEMORY_LIMIT'
                exit 30
                ;;
            esac
            DB_MEMORY_AFTER="$(docker inspect "$DB_CONTAINER" --format '{{.HostConfig.Memory}}')"
            DB_MEMORY_SWAP_AFTER="$(docker inspect "$DB_CONTAINER" --format '{{.HostConfig.MemorySwap}}')"
            DB_STARTED_AT_AFTER="$(docker inspect "$DB_CONTAINER" --format '{{.State.StartedAt}}')"
            DB_RESTART_COUNT_AFTER="$(docker inspect "$DB_CONTAINER" --format '{{.RestartCount}}')"
            DB_STATUS_AFTER="$(docker inspect "$DB_CONTAINER" --format '{{.State.Status}}')"
            {
              printf 'Status=%s StartedAt=%s RestartCount=%s OOMKilled=%s Memory=%s MemorySwap=%s\n' \
                "$DB_STATUS_AFTER" "$DB_STARTED_AT_AFTER" "$DB_RESTART_COUNT_AFTER" \
                "$(docker inspect "$DB_CONTAINER" --format '{{.State.OOMKilled}}')" "$DB_MEMORY_AFTER" "$DB_MEMORY_SWAP_AFTER"
              docker stats --no-stream "$DB_CONTAINER"
            } > "$EVIDENCE_DIR/db-memory-after.txt"
            test "$DB_STATUS_AFTER" = running || { echo 'PHASE1_EXECUTION_BLOCKED=DB_MEMORY_UPDATE_VERIFICATION_FAILED'; exit 31; }
            test "$DB_MEMORY_AFTER/$DB_MEMORY_SWAP_AFTER" = 536870912/1073741824 || { echo 'PHASE1_EXECUTION_BLOCKED=DB_MEMORY_UPDATE_VERIFICATION_FAILED'; exit 31; }
            test "$DB_STARTED_AT_AFTER" = "$DB_STARTED_AT_BEFORE" || { echo 'PHASE1_EXECUTION_BLOCKED=DB_RESTARTED_DURING_MEMORY_UPDATE'; exit 32; }
            test "$DB_RESTART_COUNT_AFTER" = "$DB_RESTART_COUNT_BEFORE" || { echo 'PHASE1_EXECUTION_BLOCKED=DB_RESTARTED_DURING_MEMORY_UPDATE'; exit 32; }
            printf '%s\n' \
              'DB_MEMORY_RUNTIME_CONVERGENCE=PASS' \
              "DB_MEMORY_BYTES=$DB_MEMORY_AFTER" \
              "DB_MEMORY_SWAP_BYTES=$DB_MEMORY_SWAP_AFTER" \
              'DB_RESTARTED=false' > "$EVIDENCE_DIR/db-memory-runtime-result.txt"
            echo 'DB_MEMORY_RUNTIME_CONVERGENCE=PASS'
            printf '%s\n' "$PRODUCTION_BRANCH" > "$EVIDENCE_DIR/production-branch.txt"
            cat > "$EVIDENCE_DIR/production-origin-fingerprint.txt" <<EOF
            ORIGIN_URL_TYPE=$ORIGIN_URL_TYPE
            ORIGIN_HOST_CLASS=$ORIGIN_HOST_CLASS
            ORIGIN_REPOSITORY=$ORIGIN_REPOSITORY
            ORIGIN_MATCH=$ORIGIN_MATCH
            EOF
            printf '%s' "$INVENTORY_B64" | base64 -d > "$ROOT_DIR/inventory.json"
            printf '%s' "$MANIFEST_B64" | base64 -d > "$ROOT_DIR/manifest.json"
            mkdir -p "$ROOT_DIR/scripts/ci"
            PREFLIGHT_FILE="$ROOT_DIR/scripts/ledger-preflight.mjs"
            GATE_FILE="$ROOT_DIR/scripts/ci/phase1-production-execution-gate.mjs"
            INVARIANTS_FILE="$ROOT_DIR/scripts/ci/phase1-production-invariants.mjs"
            WRAPPER_FILE="$ROOT_DIR/scripts/phase1-controlled-production-execution.sh"
            printf '%s' "$PREFLIGHT_B64" | base64 -d > "$PREFLIGHT_FILE"
            printf '%s' "$GATE_B64" | base64 -d > "$GATE_FILE"
            printf '%s' "$INVARIANTS_B64" | base64 -d > "$INVARIANTS_FILE"
            printf '%s' "$WRAPPER_B64" | base64 -d > "$WRAPPER_FILE"
            chmod 700 "$WRAPPER_FILE"
            test -s "$PREFLIGHT_FILE"; test -s "$GATE_FILE"; test -s "$INVARIANTS_FILE"; test -s "$WRAPPER_FILE"
            node --check "$PREFLIGHT_FILE"
            MIG_MODE=prod node "$PREFLIGHT_FILE" --mode pre-migration --inventory "$ROOT_DIR/inventory.json" > "$EVIDENCE_DIR/preflight.json"
            BACKUP_FILE="$EVIDENCE_DIR/phase1-pre-${TARGET_SHA:0:12}.dump"
            PRESERVE_ARTIFACTS=true RUN_ID="$RUN_ID" TARGET_SHA="$TARGET_SHA" EXPECTED_PRODUCTION_SHA="$EXPECTED_PRODUCTION_SHA" PRODUCTION_SHA="$PRODUCTION_SHA" API_IMAGE="$API_IMAGE_REF" WEB_IMAGE="$WEB_IMAGE_REF" API_IMAGE_DIGEST="$API_IMAGE_DIGEST" WEB_IMAGE_DIGEST="$WEB_IMAGE_DIGEST" API_IMAGE_REF="$API_IMAGE_REF" WEB_IMAGE_REF="$WEB_IMAGE_REF" INVENTORY_FILE="$ROOT_DIR/inventory.json" PREFLIGHT_FILE="$EVIDENCE_DIR/preflight.json" MANIFEST_FILE="$ROOT_DIR/manifest.json" EVIDENCE_DIR="$EVIDENCE_DIR" BACKUP_FILE="$BACKUP_FILE" ROOT_DIR="$ROOT_DIR" COMPOSE_DIR="$PWD" bash "$WRAPPER_FILE"
            git fetch origin main
            git cat-file -e "$TARGET_SHA^{commit}"
            git merge-base --is-ancestor "$PRODUCTION_SHA" "$TARGET_SHA"
            git merge --ff-only "$TARGET_SHA"
            test "$(git rev-parse HEAD)" = "$TARGET_SHA"
            test "$(git rev-parse refs/heads/main)" = "$TARGET_SHA"
            printf '%s\n' "$TARGET_SHA" > "$EVIDENCE_DIR/production-final-sha.txt"
