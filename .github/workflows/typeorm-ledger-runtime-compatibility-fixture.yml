name: TypeORM Ledger Runtime Compatibility Fixture

on:
  pull_request:
    paths:
      - 'apps/api/src/database/migrations/**'
      - 'apps/api/src/database/data-source.ts'
      - 'scripts/ci/run-typeorm-ledger-runtime-compatibility-fixture.mjs'
      - 'scripts/ci/typeorm-ledger-runtime-compatibility.test.mjs'
      - 'scripts/ci/typeorm-ledger-rehearsal-*'
      - 'apps/api/src/modules/chanjet/chanjet-execution-*'
      - 'scripts/ops/chanjet-execution-*'
      - 'scripts/ci/chanjet-execution-admission-cli.test.mjs'
      - 'apps/api/test/fixtures/chanjet-admission-worker.cjs'
      - '.github/workflows/typeorm-ledger-runtime-compatibility-fixture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phoenix_ledger_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phoenix_ledger_rehearsal"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter phoenix-erp-v3-nest build
      - run: node --test scripts/ci/typeorm-ledger-runtime-compatibility.test.mjs
      - name: Ledger readonly collection verification (dedicated disposable database, real psql)
        env:
          LEDGER_COLLECT_VERIFY_URL: postgresql://postgres:postgres@127.0.0.1:5432/ledger_collect_verify
          LEDGER_COLLECT_VERIFY_REQUIRED: 'true'
        env:
          LEDGER_COLLECT_DB_CONTAINER_DISCOVER: postgres:16.14-alpine
        # the test bootstraps its dedicated ledger_collect_verify database
        # INSIDE the service container (same-instance guard) and verifies the
        # URL/container identity before anything destructive runs; the
        # service container is discovered by its exact image
        run: |
          set -euo pipefail
          CONTAINER="$(docker ps --filter ancestor="$LEDGER_COLLECT_DB_CONTAINER_DISCOVER" --format '{{.Names}}' | head -1)"
          test -n "$CONTAINER"
          echo "COLLECTION_FIXTURE_CONTAINER=$CONTAINER"
          LEDGER_COLLECT_DB_CONTAINER="$CONTAINER" node --test scripts/ci/ledger-readonly-collect.test.mjs
      - name: Run real TypeORM ledger rehearsal
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: phoenix_ledger_rehearsal
        run: node scripts/ci/run-typeorm-ledger-runtime-compatibility-fixture.mjs

  admission-postgres:
    name: Real PostgreSQL18 Admission Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chanjet_admission_fixture
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d chanjet_admission_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build compiled API (registration CLI consumes the real dist store)
        run: pnpm --filter phoenix-erp-v3-nest build
      - name: Require real isolated PostgreSQL tests (no skip fallback)
        env:
          CHANJET_ADMISSION_FIXTURE_URL: postgresql://postgres:postgres@127.0.0.1:5432/chanjet_admission_fixture
          CHANJET_ADMISSION_FIXTURE_REQUIRED: 'true'
        run: >-
          pnpm --filter phoenix-erp-v3-nest exec jest --runInBand --runTestsByPath
          src/modules/chanjet/chanjet-execution-admission.spec.ts
          src/modules/chanjet/chanjet-readonly-policy.spec.ts
          --json --outputFile=${{ runner.temp }}/chanjet-admission-results.json
      - name: Assert real fixture tests ran and passed
        run: |
          node -e 'const r=require(process.argv[1]); if(!r.success || r.numPendingTests!==0 || !r.testResults.some(s=>s.assertionResults.some(t=>t.fullName.includes("rejects the actual cap=1") && t.status==="passed"))) throw Error("REAL_ADMISSION_MATRIX_REQUIRED"); console.log("REAL_PG18_ADMISSION_MATRIX=PASS;SKIPPED=0");' '${{ runner.temp }}/chanjet-admission-results.json'
      - name: Execution transport wiring against the same isolated PostgreSQL18
        env:
          CHANJET_ADMISSION_FIXTURE_URL: postgresql://postgres:postgres@127.0.0.1:5432/chanjet_admission_fixture
          CHANJET_EXECUTION_TRANSPORT_REQUIRED: 'true'
        run: >-
          pnpm --filter phoenix-erp-v3-nest exec jest --runInBand --runTestsByPath
          src/modules/chanjet/chanjet-execution-transport.spec.ts
          --json --outputFile=${{ runner.temp }}/chanjet-transport-results.json
      - name: Assert transport wiring matrix ran and passed
        run: |
          node -e 'const r=require(process.argv[1]); if(!r.success || r.numPendingTests!==0 || !r.testResults.some(s=>s.assertionResults.some(t=>t.fullName.includes("gateway-deadline cancellation") && t.status==="passed"))) throw Error("REAL_EXECUTION_TRANSPORT_MATRIX_REQUIRED"); console.log("REAL_PG18_TRANSPORT_MATRIX=PASS;SKIPPED=0");' '${{ runner.temp }}/chanjet-transport-results.json'
      - name: Registration CLI subprocess tests (real child process, real PostgreSQL18)
        env:
          CHANJET_ADMISSION_FIXTURE_URL: postgresql://postgres:postgres@127.0.0.1:5432/chanjet_admission_fixture
          CHANJET_EXECUTION_CLI_REQUIRED: 'true'
        run: node --test scripts/ci/chanjet-execution-admission-cli.test.mjs
      - name: Orchestration full-chain subprocess tests (real child process, real PostgreSQL18, local HTTP fixture)
        env:
          CHANJET_ADMISSION_FIXTURE_URL: postgresql://postgres:postgres@127.0.0.1:5432/chanjet_admission_fixture
          CHANJET_EXECUTION_ORCHESTRATION_REQUIRED: 'true'
        run: node --test scripts/ci/chanjet-execution-orchestrate.test.mjs
      - name: Execution-bound worker integration (real scheduler, real PostgreSQL18, local provider)
        env:
          CHANJET_ADMISSION_FIXTURE_URL: postgresql://postgres:postgres@127.0.0.1:5432/chanjet_admission_fixture
          CHANJET_EXECUTION_WORKER_REQUIRED: 'true'
        # no --forceExit: the scheduler's guard executor is disposed in
        # onModuleDestroy and the fixture connections are closed — a natural
        # process exit IS the resource-release assertion.
        run: >-
          pnpm --filter phoenix-erp-v3-nest exec jest --runInBand --runTestsByPath
          src/modules/chanjet/chanjet-execution-worker.integration.spec.ts
      - name: Mirror-write gate integration (real integration methods, real PostgreSQL18)
        env:
          CHANJET_ADMISSION_FIXTURE_URL: postgresql://postgres:postgres@127.0.0.1:5432/chanjet_admission_fixture
          CHANJET_EXECUTION_WORKER_REQUIRED: 'true'
        run: >-
          pnpm --filter phoenix-erp-v3-nest exec jest --runInBand --runTestsByPath
          src/modules/chanjet/chanjet-mirror-write-gate.integration.spec.ts
      - name: First-sync protected-entry acceptance (real entry, real scheduler host, real PostgreSQL18)
        env:
          CHANJET_ADMISSION_FIXTURE_URL: postgresql://postgres:postgres@127.0.0.1:5432/chanjet_admission_fixture
          CHANJET_FIRST_SYNC_REQUIRED: 'true'
        run: node --test scripts/ci/chanjet-first-sync-contract.test.mjs
