name: Egg GRADE5 SKU manifest production rollout
on:
  workflow_dispatch:
    inputs:
      phase: {required: true, type: choice, options: [preflight, apply, verify]}
      manifest_path: {required: true, type: string}
      manifest_sha256: {required: true, type: string}
      confirmation: {required: true, type: string}
      revision: {required: true, type: string}
defaults:
  run:
    shell: bash
jobs:
  preflight:
    if: inputs.phase == 'preflight'
    environment: production-readonly
    runs-on: ubuntu-latest
    env:
      PRODUCTION_BUSINESS_WRITES: '0'
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/ops/egg-grade5-manifest.mjs "${{ inputs.manifest_path }}" | tee manifest-hash.json
      - run: test "$(node -e "console.log(require('./manifest-hash.json').sha256)")" = "${{ inputs.manifest_sha256 }}"
      - run: test "${{ inputs.confirmation }}" = 'READONLY'
      - name: Run isolated audit over native SSH and fetch strict artifacts
        id: execute
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PROXY_HOST: ${{ secrets.DEPLOY_PROXY_HOST }}
          DEPLOY_PROXY_USER: ${{ secrets.DEPLOY_PROXY_USER || secrets.DEPLOY_USER }}
          DEPLOY_PROXY_KEY: ${{ secrets.DEPLOY_PROXY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/phoenix-erp' }}
          AUDIT_RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail; umask 077
          # Transport is diagnostic plumbing: always create outputs and capture rc.
          w="$RUNNER_TEMP/grade5-$AUDIT_RUN_ID"; mkdir -p "$w"; mkdir_rc=$?
          trap 'rm -rf "$w"' EXIT
          ssh_rc=125; result_rc=125; log_rc=125; transport_rc=125; keyscan_rc=125; key_rc=125; proxy_key_rc=125; known_hosts_rc=125; mkdir_rc=${mkdir_rc:-125}
          printf '{"schema":"phoenix.readonly-audit/v1","run_id":%s,"status":"FAIL","rc":125,"business_writes":0,"audit_result":{"exit_code":125},"transport_rc":125,"mkdir_rc":125,"keyscan_rc":125,"key_rc":125,"proxy_key_rc":125,"known_hosts_rc":125,"ssh_rc":125,"result_rc":125,"log_rc":125}\n' "$AUDIT_RUN_ID" > grade5-preflight-payload.json
          printf 'transport not started\n' > grade5-preflight.log
          : > grade5-transport.log
          : "${DEPLOY_SSH_KEY:=}"; : "${DEPLOY_PROXY_KEY:=}"; : "${DEPLOY_PROXY_HOST:=}"; : "${DEPLOY_PROXY_USER:=}"; : "${GITHUB_OUTPUT:=/dev/null}"
          normalize_key() { tr -d '\r' <&0 >"$1"; printf '\n' >>"$1"; chmod 600 "$1"; }
          printf '%s' "$DEPLOY_SSH_KEY" | normalize_key "$w/key" || key_rc=$?
          printf '%s' "$DEPLOY_PROXY_KEY" | normalize_key "$w/proxy" || proxy_key_rc=$?
          known_hosts="$w/known_hosts"; : >"$known_hosts"; chmod 600 "$known_hosts" || known_hosts_rc=$?
           case "$DEPLOY_PORT" in ''|*[!0-9]*) keyscan_rc=3;; *) ssh-keyscan -T 10 -p "$DEPLOY_PORT" "$DEPLOY_HOST" >>"$known_hosts" 2>/dev/null || keyscan_rc=$?;; esac
           if [ -n "$DEPLOY_PROXY_HOST" ]; then ssh-keyscan -T 10 -p 22 "$DEPLOY_PROXY_HOST" >>"$known_hosts" 2>/dev/null || keyscan_rc=$?; fi
           # DEPLOY_HOST is reachable only through the proxy channel (run 34598876547: direct keyscan timed out, strict checking then failed). Fetch its host key via the proxy without weakening StrictHostKeyChecking.
           if [ "${keyscan_rc:-0}" -ne 3 ] && [ -n "$DEPLOY_PROXY_HOST" ] && ! grep -q "$DEPLOY_HOST" "$known_hosts" 2>/dev/null; then
             case "$DEPLOY_HOST" in ''|*[!A-Za-z0-9.-]*) keyscan_rc=4;; *)
               ssh -i "$w/proxy" -p 22 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o User="$DEPLOY_PROXY_USER" "$DEPLOY_PROXY_HOST" "ssh-keyscan -T 10 -p '$DEPLOY_PORT' '$DEPLOY_HOST'" >>"$known_hosts" 2>/dev/null || keyscan_rc=$?;; esac
           fi
           if [ "$keyscan_rc" -eq 125 ] && [ -s "$known_hosts" ]; then keyscan_rc=0; fi
           test -s "$known_hosts" || keyscan_rc=$?
           grep -q "$DEPLOY_HOST" "$known_hosts" || keyscan_rc=$?
           opts=(-i "$w/key" -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts")
          if [ -n "$DEPLOY_PROXY_HOST" ]; then opts+=(-o "ProxyCommand=ssh -i $w/proxy -p 22 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts -o User=$DEPLOY_PROXY_USER -W %h:%p $DEPLOY_PROXY_HOST"); fi
          remote="/tmp/phoenix-production-readonly-audit-$AUDIT_RUN_ID"
           # Fail closed before transport: this preflight must execute the reviewed SQL bundle.
           test -n "${ASSERTION_SQL_PATH:-scripts/ops/readonly-audits/egg-grade5-production-snapshot.sql}"
           ASSERTION_SQL_PATH='scripts/ops/readonly-audits/egg-grade5-production-snapshot.sql'
           EXPECTED_REVISION='${{ inputs.revision }}'
           ssh_rc=0
           ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "AUDIT_RUN_ID=$AUDIT_RUN_ID DEPLOY_PATH='$DEPLOY_PATH' ASSERTION_SQL_PATH='$ASSERTION_SQL_PATH' AUDIT_BUNDLE_REVISION='$EXPECTED_REVISION' HTTP_ASSERTIONS_PATH='' bash -s" <<'REMOTE' || ssh_rc=$?
          set -euo pipefail; case "$DEPLOY_PATH" in '~/'*) DEPLOY_PATH="$HOME/${DEPLOY_PATH#\~/}";; /*) ;; *) exit 2;; esac
          d="/tmp/phoenix-production-readonly-audit-$AUDIT_RUN_ID"; install -d -m700 "$d"; : >"$d/audit.log"
          set +e; (cd "$DEPLOY_PATH" && bash scripts/ops/run-production-readonly-audit.sh) >>"$d/audit.log" 2>&1; rc=$?; set -e
          python3 - "$d/result.json" "$AUDIT_RUN_ID" "$rc" "$d/audit.log" <<'PY'
          import json,sys
          o,r,c,l=sys.argv[1:]; json.dump({'schema':'phoenix.readonly-audit/v1','run_id':int(r),'status':'PASS' if c=='0' else 'FAIL','rc':int(c),'business_writes':0,'log':l,'audit_result':{'exit_code':int(c)}},open(o,'w')); open(o,'a').write('\n')
          PY
          exit "$rc"
          REMOTE
          scp_opts=("${opts[@]}"); scp_opts[2]=-P
          result_rc=0; log_rc=0
          scp "${scp_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST:$remote/result.json" "$w/result.json" || result_rc=$?
          scp "${scp_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST:$remote/audit.log" "$w/audit.log" || log_rc=$?
          if [ "$result_rc" -eq 0 ]; then cp "$w/result.json" grade5-preflight-payload.json || result_rc=$?; fi
          if [ "$log_rc" -eq 0 ]; then cp "$w/audit.log" grade5-preflight.log || log_rc=$?; fi
          transport_rc=$((mkdir_rc || key_rc || proxy_key_rc || known_hosts_rc || keyscan_rc || ssh_rc || result_rc || log_rc))
          printf 'transport_rc=%s mkdir_rc=%s key_rc=%s proxy_key_rc=%s known_hosts_rc=%s keyscan_rc=%s ssh_rc=%s result_rc=%s log_rc=%s\n' "$transport_rc" "$mkdir_rc" "$key_rc" "$proxy_key_rc" "$known_hosts_rc" "$keyscan_rc" "$ssh_rc" "$result_rc" "$log_rc" >grade5-transport.log
          printf 'transport_rc=%s\nmkdir_rc=%s\nkey_rc=%s\nproxy_key_rc=%s\nknown_hosts_rc=%s\nkeyscan_rc=%s\nssh_rc=%s\nresult_rc=%s\nlog_rc=%s\n' "$transport_rc" "$mkdir_rc" "$key_rc" "$proxy_key_rc" "$known_hosts_rc" "$keyscan_rc" "$ssh_rc" "$result_rc" "$log_rc" >>"$GITHUB_OUTPUT"
          if [ "$result_rc" -eq 0 ]; then
            python3 - "$transport_rc" "$mkdir_rc" "$key_rc" "$proxy_key_rc" "$known_hosts_rc" "$keyscan_rc" "$ssh_rc" "$result_rc" "$log_rc" <<'PY'
          import json,sys
          path='grade5-preflight-payload.json'
          p=json.load(open(path))
          p.update(zip(('transport_rc','mkdir_rc','key_rc','proxy_key_rc','known_hosts_rc','keyscan_rc','ssh_rc','result_rc','log_rc'),map(int,sys.argv[1:])))
          with open(path,'w') as f: json.dump(p,f); f.write('\n')
          PY
          fi
          exit "$transport_rc"
      - name: Validate strict audit artifact and rc
        if: always()
        env:
          EXPECTED_RUN_ID: "${{ github.run_id }}"
          EXECUTE_TRANSPORT_RC: "${{ steps.execute.outputs.transport_rc }}"
          EXECUTE_MKDIR_RC: "${{ steps.execute.outputs.mkdir_rc }}"
          EXECUTE_KEY_RC: "${{ steps.execute.outputs.key_rc }}"
          EXECUTE_PROXY_KEY_RC: "${{ steps.execute.outputs.proxy_key_rc }}"
          EXECUTE_KNOWN_HOSTS_RC: "${{ steps.execute.outputs.known_hosts_rc }}"
          EXECUTE_KEYSCAN_RC: "${{ steps.execute.outputs.keyscan_rc }}"
          EXECUTE_SSH_RC: "${{ steps.execute.outputs.ssh_rc }}"
          EXECUTE_RESULT_RC: "${{ steps.execute.outputs.result_rc }}"
          EXECUTE_LOG_RC: "${{ steps.execute.outputs.log_rc }}"
        run: |
          python3 - <<'PY'
          import json,os
          p=json.load(open('grade5-preflight-payload.json'))
          for key in ('transport_rc','mkdir_rc','key_rc','proxy_key_rc','known_hosts_rc','keyscan_rc','ssh_rc','result_rc','log_rc'):
              assert p[key] == int(os.environ['EXECUTE_'+key.upper()]), key
          assert p['transport_rc'] == next((p[k] for k in ('mkdir_rc','key_rc','proxy_key_rc','known_hosts_rc','keyscan_rc','ssh_rc','result_rc','log_rc') if p[k]), 0)
          assert p['run_id'] == int(os.environ['EXPECTED_RUN_ID'])
          assert p['business_writes'] == 0
          assert p['rc'] == p['ssh_rc'] == p['audit_result']['exit_code']
          assert p['status'] == ('PASS' if p['rc'] == 0 else 'FAIL')
          assert os.path.getsize('grade5-preflight.log') > 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade5-preflight-${{ github.run_id }}
          path: |
            grade5-preflight.log
            grade5-preflight-payload.json
            grade5-transport.log
          if-no-files-found: error
          retention-days: 30
      - name: Fail after preserving diagnostic artifact
        if: always()
        run: |
          test -s grade5-preflight-payload.json
          python3 - <<'PY'
          import json
          p=json.load(open('grade5-preflight-payload.json', encoding='utf-8'))
          assert p.get('status') == 'PASS', f"audit status={p.get('status')}"
          assert p.get('rc') == 0, f"audit rc={p.get('rc')}"
          assert all(p.get(k) == 0 for k in ('transport_rc','ssh_rc','result_rc','log_rc')), 'transport failed'
          PY
  apply:
    if: inputs.phase == 'apply'
    environment: production-business-write
    runs-on: ubuntu-latest
    env: {PRODUCTION_BUSINESS_WRITES: '1'}
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/ops/egg-grade5-manifest.mjs "${{ inputs.manifest_path }}"
      - run: test "${{ inputs.confirmation }}" = 'APPLY-EGG-GRADE5-MANIFEST-20260911'
      - run: test "${{ inputs.manifest_path }}" = 'scripts/ops/manifests/egg-grade5-candidate.json'
      - run: "echo 'FAIL-CLOSED: canonical EGG/GRADE_5/spec tuple is not production-registered; apply implementation is intentionally not invoked.' && exit 1"
  verify:
    if: inputs.phase == 'verify'
    environment: production-readonly
    runs-on: ubuntu-latest
    env:
      PRODUCTION_BUSINESS_WRITES: '0'
      READONLY_DB_REQUIRED: '1'
      READONLY_DB_HOST: ${{ secrets.READONLY_DB_HOST }}
      READONLY_DB_PORT: ${{ secrets.READONLY_DB_PORT }}
      READONLY_DB_USER: ${{ secrets.READONLY_DB_USER }}
      READONLY_DB_NAME: ${{ secrets.READONLY_DB_NAME }}
      READONLY_DB_PASSWORD: ${{ secrets.READONLY_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: ASSERTION_SQL_PATH=scripts/ops/readonly-audits/egg-grade5-production-snapshot.sql HTTP_ASSERTIONS_PATH= AUDIT_RUN_ID="${{ github.run_id }}" AUDIT_BUNDLE_DIR=. NODE_ENV=test bash scripts/ops/run-production-readonly-audit.sh
