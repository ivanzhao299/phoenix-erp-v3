<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- White background -->
  <circle cx="50" cy="50" r="50" fill="white"/>

  <!-- Navy blue ring (thick outer border) -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#1a3872" stroke-width="12"/>

  <!-- Red swoosh at bottom of circle -->
  <path d="M 15 72 Q 50 88 85 72" fill="none" stroke="#d42020" stroke-width="4" stroke-linecap="round"/>

  <!-- Golden eggs (3) -->
  <ellipse cx="34" cy="68" rx="7.5" ry="5.5" fill="#f5a81c"/>
  <ellipse cx="50" cy="71" rx="7.5" ry="5.5" fill="#f5a81c"/>
  <ellipse cx="66" cy="68" rx="7.5" ry="5.5" fill="#f5a81c"/>

  <!-- Hen body -->
  <ellipse cx="50" cy="50" rx="20" ry="16" fill="#d42020"/>

  <!-- Hen tail feathers (right side) -->
  <path d="M 68 44 Q 80 38 78 50 Q 80 54 70 54 Z" fill="#c01818"/>

  <!-- Hen head -->
  <circle cx="30" cy="38" r="10" fill="#d42020"/>

  <!-- Red comb on head -->
  <path d="M 28 28 Q 30 23 32 28 Q 34 22 36 27" fill="#d42020"/>
  <circle cx="30" cy="25" r="3" fill="#d42020"/>
  <circle cx="33" cy="23" r="2.5" fill="#d42020"/>
  <circle cx="36" cy="25" r="2" fill="#d42020"/>

  <!-- Wattle (chin) -->
  <ellipse cx="24" cy="43" rx="3" ry="4" fill="#d42020"/>

  <!-- Beak -->
  <polygon points="20,37 14,40 20,43" fill="#f5a81c"/>

  <!-- Eye -->
  <circle cx="27" cy="36" r="3" fill="white"/>
  <circle cx="27" cy="36" r="1.8" fill="#1a3872"/>
  <circle cx="26.5" cy="35.5" r="0.6" fill="white"/>

  <!-- Wing detail on body -->
  <path d="M 38 50 Q 50 58 62 52 Q 58 62 40 62 Z" fill="#c01818"/>
</svg>
