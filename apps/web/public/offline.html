<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>离线 — Phoenix ERP V3</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%;background:#0f172a;color:#e2e8f0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
    .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:100%;padding:24px;text-align:center}
    .logo{font-size:56px;line-height:1;margin-bottom:16px}
    h1{font-size:22px;font-weight:600;margin:0 0 8px;color:#fbbf24}
    p{font-size:14px;color:#94a3b8;max-width:420px;margin:4px 0;line-height:1.6}
    button{margin-top:24px;padding:10px 28px;font-size:14px;border:0;border-radius:8px;
      background:#f59e0b;color:#0f172a;font-weight:600;cursor:pointer}
    button:hover{background:#fbbf24}
    .tag{margin-top:32px;font-size:11px;color:#475569;letter-spacing:0.05em}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">🐔📡</div>
    <h1>当前网络不可达</h1>
    <p>金凤凰 ERP 暂时离线。请检查网络后重试。</p>
    <p>已缓存的页面仍可继续浏览。</p>
    <button onclick="location.reload()">重新连接</button>
    <div class="tag">Phoenix ERP V3 · Service Worker Active</div>
  </div>
</body>
</html>
