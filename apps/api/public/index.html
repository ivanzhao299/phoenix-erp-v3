<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phoenix V3 Data Migration Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
    body {
      margin: 0; padding: 0; font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #e2e8f0; min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
    h1 {
      font-size: 2.5rem; text-align: center; margin-bottom: 10px;
      background: -webkit-linear-gradient(#38bdf8, #818cf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 40px; }
    
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px;
      text-align: center; transition: transform 0.3s ease;
    }
    .stat-card:hover { transform: translateY(-5px); border-color: rgba(56, 189, 248, 0.5); }
    .stat-value { font-size: 3rem; font-weight: 800; color: #f8fafc; margin: 10px 0; }
    .stat-label { font-size: 1rem; color: #cbd5e1; text-transform: uppercase; letter-spacing: 1px; }

    .data-section {
      background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px; padding: 24px; margin-bottom: 30px;
    }
    .data-section h2 { font-size: 1.5rem; color: #38bdf8; margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
    th { color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .status-badge {
      padding: 4px 10px; border-radius: 99px; font-size: 0.8rem; font-weight: 600;
    }
    .status-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.5); }
    .status-approved { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.5); }
    
    #loading { text-align: center; font-size: 1.2rem; margin-top: 100px; color: #38bdf8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>V3 Migration Live Dashboard</h1>
    <p class="subtitle">Real-time view of injected Postgres data (P0-P2)</p>

    <div id="loading">Connecting to NestJS Engine...</div>
    <div id="content" style="display: none;">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Users</div>
          <div class="stat-value" id="val-users">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Financial Flows</div>
          <div class="stat-value" id="val-flows">0</div>
        </div>
        <div class="stat-card" style="border-color: rgba(245, 158, 11, 0.5);">
          <div class="stat-label" style="color: #fbbf24;">Downgraded Dirty Txns</div>
          <div class="stat-value" id="val-downgraded">0</div>
        </div>
      </div>

      <div class="data-section">
        <h2>P2: Downgraded Risk Cash Flows (Sample)</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Amount</th><th>Currency</th><th>Category</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="flows-body"></tbody>
        </table>
      </div>

      <div class="data-section">
        <h2>P0: Migrated Users (Sample)</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Username</th><th>Real Name</th><th>Store Code</th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        const res = await fetch('http://localhost:3000/api/v3/debug/migrated-data');
        if (!res.ok) {
           const errText = await res.text();
           throw new Error(`HTTP Error ${res.status}: ${errText}`);
        }
        const data = await res.json();
        if (data.statusCode >= 400) {
           throw new Error(JSON.stringify(data));
        }
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        // Stats
        document.getElementById('val-users').innerText = data.stats.totalUsers;
        document.getElementById('val-flows').innerText = data.stats.totalCashFlows;
        document.getElementById('val-downgraded').innerText = data.stats.downgradedCashFlows;

        // Cash Flows
        const fBody = document.getElementById('flows-body');
        data.samples.cashFlows.forEach(f => {
          const badge = f.status === 'PENDING_APPROVAL' ? 'status-pending' : 'status-approved';
          fBody.innerHTML += `<tr>
            <td>#${f.id}</td>
            <td style="font-family: monospace; font-size: 1.1rem;">${Number(f.amount).toLocaleString()}</td>
            <td><strong>${f.currency_code}</strong></td>
            <td>${f.category}</td>
            <td><span class="status-badge ${badge}">${f.status}</span></td>
          </tr>`;
        });

        // Users
        const uBody = document.getElementById('users-body');
        data.samples.users.forEach(u => {
          uBody.innerHTML += `<tr>
            <td>#${u.user_id}</td>
            <td><strong>${u.username}</strong></td>
            <td>${u.real_name}</td>
            <td>${u.store_code}</td>
          </tr>`;
        });
      } catch(e) {
        const loadEl = document.getElementById('loading');
        loadEl.style.display = 'block';
        loadEl.innerHTML = `<span style="color: #ef4444; font-weight: bold;">Error connecting to backend:</span><br><br><pre style="text-align:left; background: #1e1b4b; padding: 15px; overflow: auto; font-size: 0.8rem; color: #f87171;">${e.message || e}</pre>`;
        document.getElementById('content').style.display = 'none';
      }
    }
    loadData();
  </script>
</body>
</html>
